<script>
'use strict';
/* picoruno. ドパミン20本 共通エンジン：画面遷移・入力・BGM/効果音・演出・シェア画像。各ゲームは GAME オブジェクトだけ書く。 */
const W=420,H=720,OL='#5b4d45';
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const ease={out:t=>1-(1-t)*(1-t),outBack:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};

/* ---------- 描画ヘルパ：フラット・こげ茶の輪郭・黒丸ベタ目・ツヤなし ---------- */
const D={
  lw:3.5,
  // mode: 'n'=ふつう / 'sil'=ふち用のシルエット / 'fill'=ぬりだけ。D.group で2回描いて、ふちを外側だけにする（ころころおやつと同じ描き方）
  mode:'n',
  path(c,fn,fill,lw=D.lw,stroke=OL){c.beginPath();fn(c);
    if(D.mode==='sil'){c.fillStyle=OL;c.fill();if(lw){c.lineWidth=lw*2.3;c.strokeStyle=OL;c.lineJoin='round';c.lineCap='round';c.stroke()}return}
    if(fill){c.fillStyle=fill;c.fill()}if(lw&&D.mode!=='fill'){c.lineWidth=lw;c.strokeStyle=stroke;c.lineJoin='round';c.lineCap='round';c.stroke()}},
  group(c,fn){if(D.mode!=='n'){fn();return}D.mode='sil';c.save();try{fn()}finally{c.restore()}D.mode='fill';try{fn()}finally{D.mode='n'}},
  circle(c,x,y,r,fill,lw=D.lw){D.path(c,c=>c.arc(x,y,Math.max(r,.1),0,Math.PI*2),fill,lw)},
  ellipse(c,x,y,rx,ry,fill,lw=D.lw,rot=0){D.path(c,c=>c.ellipse(x,y,Math.max(rx,.1),Math.max(ry,.1),rot,0,Math.PI*2),fill,lw)},
  rrect(c,x,y,w,h,r,fill,lw=D.lw){D.path(c,c=>{r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()},fill,lw)},
  poly(c,pts,fill,lw=D.lw){D.path(c,c=>{c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath()},fill,lw)},
  star(c,x,y,r,fill,lw=D.lw,rot=0,n=5,inner=.48){D.path(c,c=>{for(let i=0;i<n*2;i++){const a=rot-Math.PI/2+i*Math.PI/n,rr=i%2?r*inner:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath()},fill,lw)},
  // s = 顔の横幅の目安
  // 顔：ころころおやつの比率（点の目・小さな口・ほっぺ）。s = 顔まわりの幅
  face(c,x,y,s,mood='smile'){if(!(s>1)||D.mode==='sil')return;
    const ex=s*.27,er=Math.max(s*.09,1.2);
    c.fillStyle='rgba(241,156,156,.75)';c.beginPath();c.ellipse(x-s*.44,y+s*.16,s*.12,s*.078,0,0,Math.PI*2);c.ellipse(x+s*.44,y+s*.16,s*.12,s*.078,0,0,Math.PI*2);c.fill();
    c.fillStyle=OL;c.beginPath();c.arc(x-ex,y,er,0,Math.PI*2);c.arc(x+ex,y,er,0,Math.PI*2);c.fill();
    c.lineWidth=Math.max(s*.062,1);c.strokeStyle=OL;c.lineCap='round';c.lineJoin='round';c.beginPath();
    if(mood==='angry'||mood==='hurt'){c.moveTo(x-ex-er*1.5,y-er*2.4);c.lineTo(x-ex+er*1.1,y-er*1.4);c.moveTo(x+ex+er*1.5,y-er*2.4);c.lineTo(x+ex-er*1.1,y-er*1.4);c.stroke();c.beginPath()}
    if(mood==='o'){c.arc(x,y+s*.13,s*.055,0,Math.PI*2);c.stroke()}
    else if(mood==='flat'){c.moveTo(x-s*.07,y+s*.11);c.lineTo(x+s*.07,y+s*.11);c.stroke()}
    else if(mood==='angry'||mood==='hurt'||mood==='sad'){c.moveTo(x-s*.075,y+s*.16);c.quadraticCurveTo(x,y+s*.08,x+s*.075,y+s*.16);c.stroke()}
    else if(mood!=='none'){c.moveTo(x-s*.075,y+s*.09);c.quadraticCurveTo(x,y+s*.165,x+s*.075,y+s*.09);c.stroke()}
  },
  text(c,s,x,y,size,fill='#5b4d45',align='center',stroke=null,sw=6){
    c.font=`${size}px "Mochiy Pop One","Zen Maru Gothic",sans-serif`;c.textAlign=align;c.textBaseline='middle';
    if(stroke){c.lineWidth=sw;c.strokeStyle=stroke;c.lineJoin='round';c.strokeText(s,x,y)}
    c.fillStyle=fill;c.fillText(s,x,y);
  },
};

/* ---------- 音：Web Audio のシンセだけで作る ---------- */
const AU=(()=>{
  let ac=null,master,sfx,bgm,nbuf,muted=false,timer=null,song=null,step=0,nextT=0;
  try{muted=localStorage.getItem('dopa-mute')==='1'}catch(e){}
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(!ac){try{
      ac=new(window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=muted?0:1;
      const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;
      master.connect(comp);comp.connect(ac.destination);
      sfx=ac.createGain();sfx.gain.value=.55;sfx.connect(master);
      bgm=ac.createGain();bgm.gain.value=.2;bgm.connect(master);
      nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){ac=null}}
    if(ac&&ac.state==='suspended')ac.resume();
  }
  function tone(f,d,o={}){
    if(!ac)return;const{type='square',v=.25,to=null,at=0,a=.004,dest=sfx,t0=null}=o;
    const t=t0!==null?t0:ac.currentTime+at,os=ac.createOscillator(),g=ac.createGain();
    os.type=type;os.frequency.setValueAtTime(f,t);if(to)os.frequency.exponentialRampToValueAtTime(Math.max(to,1),t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g);g.connect(dest||sfx);os.start(t);os.stop(t+d+.03);
  }
  function noise(d,o={}){
    if(!ac)return;const{v=.3,f=2000,q=1,type='bandpass',at=0,to=null,dest=sfx,t0=null,a=.002}=o;
    const t=t0!==null?t0:ac.currentTime+at,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=nbuf;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);fl.Q.value=q;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(dest||sfx);s.start(t,Math.random()*.5);s.stop(t+d+.03);
  }
  const S={
    tap(p=1){tone(660*p,.06,{v:.14})},
    pop(p=1){noise(.05,{v:.35,f:3000*p,q:2});tone(700*p,.09,{type:'sine',v:.35,to:250*p})},
    // ぷちっ：空気がはじける短いクリック＋膜が裂けるパリッ＋小さなポコッ
    puchi(p=1){const v=rnd(.75,1);noise(.012,{v:.9*v,f:rnd(1600,2600)*p,type:'highpass',a:.0004});noise(.025,{v:.35*v,f:rnd(3000,5200),q:.8,at:rnd(.004,.009),a:.0005});
      tone(rnd(140,220)*p,.045,{type:'sine',v:.3*v,to:70,a:.0008});noise(.06,{v:.06,f:900,type:'lowpass',at:.01})},
    good(p=1){tone(880*p,.08,{v:.16});tone(1320*p,.12,{v:.16,at:.06})},
    perfect(p=1){[1047,1319,1568,2093].forEach((f,i)=>tone(f*p,.14,{v:.15,at:i*.045,type:'square'}))},
    bad(){tone(220,.28,{type:'sawtooth',v:.2,to:80})},
    boom(){noise(.6,{v:.6,f:900,type:'lowpass',to:80});tone(140,.4,{type:'sine',v:.5,to:35})},
    coin(p=1){tone(988*p,.06,{v:.15});tone(1319*p,.25,{v:.15,at:.06})},
    whoosh(){noise(.22,{v:.25,f:500,to:3500,q:1.4})},
    swish(){noise(.12,{v:.3,f:3000,to:7000,q:.8,type:'highpass'})},
    combo(n){const p=Math.pow(2,Math.min(n,24)/12);tone(440*p,.09,{v:.15,type:'square'});tone(660*p,.09,{v:.08,at:.03,type:'triangle'})},
    count(){tone(523,.14,{v:.2})},go(){tone(1047,.35,{v:.2});tone(1568,.35,{v:.12,at:.02})},
    fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?.5:.13,{v:.17,at:i*.1}))},
    over(){[659,523,392,262].forEach((f,i)=>tone(f,.22,{v:.16,at:i*.13,type:'triangle'}))},
    tick(){tone(1800,.03,{v:.08,type:'sine'})},
    shutter(){noise(.03,{v:.5,f:3500,type:'highpass'});noise(.05,{v:.35,f:1800,q:1.5,at:.07})},
    // メダルのチャリン：金属っぽい高い倍音
    clink(p=1){const f=rnd(2600,3600)*p,v=rnd(.05,.09);tone(f,.09,{type:'sine',v,a:.001});tone(f*1.52,.06,{type:'sine',v:v*.6,a:.001});noise(.015,{v:v*1.5,f:6000,type:'highpass'})},
    thud(){tone(110,.15,{type:'sine',v:.45,to:50});noise(.08,{v:.25,f:400,type:'lowpass'})},
    boing(p=1){tone(220*p,.25,{type:'sine',v:.3,to:520*p})},
    zap(p=1){tone(1500*p,.15,{type:'sawtooth',v:.12,to:200*p})},
    tone,noise,mtof,
  };
  /* BGM：4小節のコード進行から、seed で決まるメロディ・ベース・ドラムを鳴らす */
  const SC={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};
  function makeSong(o){
    let s=o.seed||1;const r=()=>(s=(s*16807)%2147483647)/2147483647;
    const sc=SC[o.scale||'major'],prog=o.prog||[1,5,6,4],root=o.root||60;
    const deg=(d,oct=0)=>{d-=1;const o2=Math.floor(d/7);d=((d%7)+7)%7;return root+sc[d]+12*(o2+oct)};
    const pent=o.scale==='minor'?[0,3,5,7,10]:[0,2,4,7,9];
    const mel=[];let cur=root+12;
    for(let bar=0;bar<8;bar++){
      const ch=prog[bar%4],tones=[deg(ch,1),deg(ch+2,1),deg(ch+4,1)];
      for(let st=0;st<16;st+=2){
        const play=st===0||r()<(o.density||.62);
        if(bar>=4&&bar<7&&st<8){mel.push(mel[(bar-4)*8+st/2]);continue}
        if(!play){mel.push(null);continue}
        let n;if(st%4===0||r()<.4){n=tones[Math.floor(r()*3)];}else{const pc=pent[Math.floor(r()*5)];n=root+12+pc+(r()<.3?12:0)}
        while(n-cur>7)n-=12;while(cur-n>7)n+=12;if(n<root+5)n+=12;if(n>root+26)n-=12;
        cur=n;mel.push(n);
      }
    }
    return{o,deg,prog,mel,bpm:o.bpm||132};
  }
  function schedule(){
    if(!song||!ac)return;
    const rate=P.api.bgmRate||1,sd=60/(song.bpm*rate)/4;
    while(nextT<ac.currentTime+.15){
      const st=step%16,bar=Math.floor(step/16)%8,ch=song.prog[bar%4],o=song.o,t=nextT;
      // drums
      const dr=o.drums||'pop';
      if(dr!=='none'){
        if(st===0||st===8||(dr==='four'&&st%4===0)||(dr==='pop'&&st===10)){tone(150,.12,{type:'sine',v:.7,to:45,t0:t,dest:bgm})}
        if(st===4||st===12){noise(.1,{v:.35,f:1800,q:.8,t0:t,dest:bgm})}
        if(st%2===0){noise(.03,{v:st%4===2?.18:.1,f:8000,type:'highpass',t0:t,dest:bgm})}
      }
      // bass
      if(st%2===0){const bn=song.deg(ch,-1)+(st%4===2&&o.bassOct!==false?12:0);tone(mtof(bn),sd*1.6,{type:'triangle',v:.5,t0:t,dest:bgm})}
      // chord stab
      if(o.stab!==false&&(st===2||st===6||st===10||st===14)){[0,2,4].forEach(k=>tone(mtof(song.deg(ch+k,0)),sd*.9,{type:'square',v:.045,t0:t,dest:bgm}))}
      // lead
      if(st%2===0){const n=song.mel[bar*8+st/2];if(n){tone(mtof(n),sd*1.7,{type:o.lead||'square',v:.13,t0:t,dest:bgm,a:.01})}}

  return{S,init,
    get muted(){return muted},
    setMute(m){muted=m;try{localStorage.setItem('dopa-mute',m?'1':'0')}catch(e){}if(master&&ac)master.gain.setTargetAtTime(m?0:1,ac.currentTime,.02)},
    bgmStart(o){init();if(!ac)return;this.bgmStop(true);song=makeSong(o);step=0;nextT=ac.currentTime+.08;this.t0=nextT;bgm.gain.cancelScheduledValues(ac.currentTime);bgm.gain.setValueAtTime(.2,ac.currentTime);timer=setInterval(schedule,25)},
    bgmStop(now){if(timer){clearInterval(timer);timer=null}song=null;if(ac&&!now){bgm.gain.setTargetAtTime(0,ac.currentTime,.15)}},

})();
const S=AU.S;

/* ---------- 本体 ---------- */
const P=(()=>{
  const $=id=>document.getElementById(id);
  let G=null,cv,ctx,dpr=1,HF=H,OFF=0,state='title',last=0,cdT=0,overT=0,stopT=0,shakeA=0,flashA=0,flashC='#fff',hudPop=0,lastScore=0;
  const parts=[],floats=[],rings=[];
  const api={W,H,score:0,combo:0,t:0,timeLeft:0,fever:false,bgmRate:1,data:{},
    get state(){return state},get overT(){return overT},
    burst(x,y,o={}){const{n=12,c='#fff',sp=220,r=5,g=600,life=.6,shape='c',up=0}=o;
      for(let i=0;i<n;i++){const a=rnd(Math.PI*2),v=rnd(.35,1)*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-up,r:r*rnd(.6,1.3),c:Array.isArray(c)?pick(c):c,life,max:life,g,shape,rot:rnd(6),vr:rnd(-8,8)})}},
    float(x,y,text,o={}){const{c='#fff',size=26,life=.8,vy=-70}=o;floats.push({x,y,text,c,size,life,max:life,vy})},
    ring(x,y,o={}){const{c='#fff',r=60,life=.4,lw=6}=o;rings.push({x,y,c,r,life,max:life,lw})},
    shake(a=8){shakeA=Math.max(shakeA,a)},
    flash(c='#fff',a=.6){flashC=c;flashA=a},

  function resize(){

  }

  function fmt(v){return G.fmt?G.fmt(v):Math.round(v).toLocaleString('ja-JP')}

  function bestKey(){return'dopa-'+G.slug+'-best'+modeSuffix()}

  function setBest(v){try{localStorage.setItem(bestKey(),v)}catch(e){}}
  function better(a,b){return b===null||(G.lowerIsBetter?a<b:a>b)}
  function rankOf(v){const rs=(G.ranksFor?G.ranksFor(api.mode):G.ranks)||[];let out=rs.length?rs[0][1]:'';for(const[th,t]of rs){if(G.lowerIsBetter?v<=th:v>=th)out=t}return out}
  function showBest(){
    if(G.modes){const cur=api.mode,out=[];for(const m of G.modes){api.mode=m.id;const b=getBest();if(b!==null)out.push((m.short||m.label)+' '+fmt(b)+(G.unit||''))}api.mode=cur;$('bestTxt').textContent=out.length?'じこベスト：'+out.join(' ／ '):'';return}
    const b=getBest();$('bestTxt').textContent=b===null?'':'じこベスト：'+fmt(b)+(G.unit||'')}
  function muteIcon(){$('muteBtn').innerHTML=AU.muted?'<svg viewBox="0 0 24 24" fill="none" stroke="#5b4d45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#5b4d45"/><path d="M17 9l5 6M22 9l-5 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#5b4d45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#5b4d45"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'}

    G.reset(api);

  function toTitle(){state='title';AU.bgmStop();$('resultScr').hidden=true;$('titleScr').hidden=false;$('quitBtn').hidden=true;showBest();G.reset(api)}
  function showResult(){

    $('resultScr').hidden=false;
    // スコアのカウントアップ
    const t0=performance.now(),dur=Math.min(900,200+String(Math.round(v)).length*150);
    (function up(){const k=Math.min(1,(performance.now()-t0)/dur);$('rScore').textContent=fmt(G.fmtRaw?v:(G.lowerIsBetter?v:Math.round(v*ease.out(k))));if(k<1){requestAnimationFrame(up);if(Math.random()<.5)S.tick()}else if(nb)S.fanfare();else S.coin()})();
    const text=(G.shareText?G.shareText(v,fmt(v),api.mode):`「${G.title}」で ${fmt(v)}${G.unit||''}！`)+'\n'+rankOf(v)+'\n#picoruno';
    $('xBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent('https://runococco.github.io/picoruno./'+G.slug+'.html');
  }
  function shareImage(){

  async function save(){

      if(navigator.canShare&&navigator.canShare({files:[f]})&&/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)){try{await navigator.share({files:[f],title:G.title});return}catch(e){}}

    },'image/png');
  }
  function drawFx(c,dt){
    for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;if(r.life<=0){rings.splice(i,1);continue}const k=1-r.life/r.max;
      c.globalAlpha=1-k;c.lineWidth=r.lw*(1-k)+1;c.strokeStyle=r.c;c.beginPath();c.arc(r.x,r.y,r.r*ease.out(k),0,7);c.stroke()}
    c.globalAlpha=1;

      p.vy+=p.g*dt;p.vx*=1-1.5*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;const k=p.life/p.max,r=p.r*(.4+.6*k);
      c.globalAlpha=Math.min(1,k*2);

      else if(p.shape==='s'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.c;c.fillRect(-r,-r*.5,r*2,r);c.restore()}
      else if(p.shape==='o')D.circle(c,p.x,p.y,r,p.c,2);
      else{c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill()}}
    c.globalAlpha=1;
    for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;if(f.life<=0){floats.splice(i,1);continue}
      const k=1-f.life/f.max;f.y+=f.vy*dt;const sc=k<.15?ease.outBack(k/.15):1;c.globalAlpha=Math.min(1,f.life/f.max*3);
      c.save();c.translate(f.x,f.y);c.scale(sc,sc);D.text(c,f.text,0,0,f.size,f.c,'center',OL,Math.max(4,f.size*.22));c.restore()}
    c.globalAlpha=1;
  }
  function drawHud(c){
    if(G.hud===false)return;
    if(G.drawHud){G.drawHud(c,api);return}
    if(api.score!==lastScore){hudPop=1;lastScore=api.score}
    const sc=1+hudPop*.25;
    c.save();c.translate(W/2,G.time?62:46);c.scale(sc,sc);D.text(c,fmt(api.score)+(G.hudUnit?G.unit||'':''),0,0,34,'#fff','center',OL,8);c.restore();
    if(G.time){const k=clamp(api.timeLeft/G.time,0,1);D.rrect(c,70,18,W-140,16,8,'#fffdf8',3);
      if(k>0)D.rrect(c,72,20,(W-144)*k,12,6,k<.2?'#e2645a':G.accent,0);
      if(api.timeLeft<5&&api.timeLeft>0&&state==='play')D.text(c,Math.ceil(api.timeLeft),W/2,104,28,'#e2645a','center',OL,6)}
    if(api.combo>=2&&G.comboHud!==false){const s=Math.min(1.5,1+api.combo*.02);c.save();c.translate(W-56,G.time?128:112);c.rotate(-.12);c.scale(s,s);D.text(c,api.combo,0,-4,26,api.fever?'#f3c84b':'#fff','center',OL,6);D.text(c,'COMBO',0,16,12,'#fff','center',OL,4);c.restore()}

    if(state==='count'){const n=3-Math.floor(cdT),k=cdT%1;c.save();c.translate(W/2,H/2);const sc=1.6-ease.outBack(Math.min(1,k*3))*.6;c.scale(sc,sc);c.globalAlpha=1-Math.max(0,k-.7)/.3;D.text(c,n,0,0,110,'#fff','center',OL,14);c.restore();c.globalAlpha=1}
    if(state==='over'&&G.overText!==false){const k=Math.min(1,overT*3);c.save();c.translate(W/2,H/2);c.scale(ease.outBack(k),ease.outBack(k));D.text(c,G.overText||(G.time&&api.timeLeft<=0?'タイムアップ！':'おしまい！'),0,0,48,'#fff','center',OL,12);c.restore()}
  }
  function boot(g){
    G=g;for(const k of G.sprites||[]){const f=G[k];G[k]=function(c,...a){D.group(c,()=>f.call(this,c,...a))}}
    G=g;cv=$('cv');ctx=cv.getContext('2d');window.__P=api;window.__G=G;
    G.icon($('iconCv').getContext('2d'),180,180,300);
    resize();addEventListener('resize',resize);
    cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();if(state!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=toLogical(e);G.down&&G.down(x,y,api,e)});
    cv.addEventListener('pointermove',e=>{if(state!=='play')return;const[x,y]=toLogical(e);G.move&&G.move(x,y,api,e)});
    const up=e=>{if(state!=='play')return;const[x,y]=toLogical(e);G.up&&G.up(x,y,api,e)};

    if(G.modes){api.mode=G.modes[0].id;$('startBtn').textContent=G.modes[0].label;
      $('startBtn').onclick=()=>{api.mode=G.modes[0].id;start()};
      let prev=$('startBtn');for(const m of G.modes.slice(1)){const b=document.createElement('button');b.className='btn big alt';b.textContent=m.label;b.onclick=()=>{api.mode=m.id;start()};prev.after(b);prev=b}}
    else $('startBtn').onclick=start;
    $('againBtn').onclick=start;$('saveBtn').onclick=save;
    $('quitBtn').onclick=()=>{if(state==='play'||state==='count')toTitle()};
    $('muteBtn').onclick=()=>{AU.init();AU.setMute(!AU.muted);muteIcon()};muteIcon();
    document.addEventListener('visibilitychange',()=>{const ac=AU.ctx;if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});
    showBest();G.reset(api);requestAnimationFrame(frame);
  }
  return{boot,api,start,shareImage};
})();

<script>
const META={"title": "金庫あけマスター", "desc": "くるくる回る針が、光る点に重なった瞬間にタップ。決められた回数つづけると金庫がパカッと開いてジャックポット！コインと宝石がジャラジャラあふれ出す。1回でも外したら最初からやりなおし。", "ogdesc": "針が重なった瞬間にタップ。いくつ金庫を開けられる？", "catch": "カチッ、カチッ、カチッ……ガチャン！", "howto": ["針が光る点に重なったらタップ", "タップするたびに回る向きが反対になる", "点を通りすぎたり、早すぎたらアウト", "数字が0になると金庫が開いて、コインがジャラジャラ"], "bg": "#e6e2ea", "accent": "#4f8f88", "slug": "kinko"};
/* 金庫あけマスター：Pop the Lock 系。針が点に重なる間にタップ、通過したら失敗。
   開けるとジャックポット：コインと宝石がジャラジャラあふれて、下に山になってたまっていく。 */
const CX=W/2,CY=340,RR=118,WIN=.2,FLOOR=H-70,CW=6,NC=Math.ceil(W/CW)+1,PILEMAX=150;
const GEMS=['#7fc6d8','#e2645a','#9fd27c','#c49be0'];
const GAME={...META,sprites:['icon','safe'],unit:'枚',hud:false,
  bgm:{bpm:132,root:57,scale:'minor',prog:[1,4,7,3],seed:66,lead:'square',drums:'four',density:.6},
  ranks:[[0,'鍵をなくした人'],[20,'見習い錠前師'],[60,'金庫の常連'],[120,'金庫あけ職人'],[200,'伝説の大泥棒（ねこ）'],[300,'金庫の方から開く']],
  shareText:(v,f)=>`金庫あけマスターで コイン${f}枚 ジャラジャラ！`,
  icon(c,x,y,s){this.safe(c,x,y,s*.8,0,-.6,true)},
  safe(c,x,y,s,lv,ang,small){const k=s/300;D.rrect(c,x-s*.5,y-s*.5,s,s,s*.08,'#7c8a96',Math.max(2,4*k));D.rrect(c,x-s*.44,y-s*.44,s*.88,s*.88,s*.05,'#93a1ac',Math.max(1.5,3*k));
    D.circle(c,x,y,s*.33,'#4b5560',Math.max(2,4*k));D.circle(c,x,y,s*.26,'#e9e3d3',Math.max(2,3*k));
    if(small){c.save();c.translate(x,y);c.rotate(ang);D.rrect(c,-s*.02,-s*.26,s*.04,s*.18,s*.02,'#e2645a',2);c.restore();D.face(c,x,y+s*.06,s*.2,'smile')}},
  reset(api){this.st={lv:1,left:0,a:-Math.PI/2,dir:1,w:1.8,dot:0,inside:false,open:0,coins:[],fail:0,pour:0,emit:0,toEmit:0,clinkT:0,jaraT:0,hp:new Float32Array(NC)};
    if(!this.pile){this.pile=document.createElement('canvas');this.pile.width=W*2;this.pile.height=H*2}
    const pc=this.pile.getContext('2d');pc.setTransform(1,0,0,1,0,0);pc.clearRect(0,0,W*2,H*2);pc.setTransform(2,0,0,2,0,0);
    this.newLv();api.score=0},
  // 1枚（1粒）を山にのせる：低いとなりへ転がってから止まる
  land(co,api){const st=this.st,hp=st.hp;let i=clamp(Math.round(co.x/CW),1,NC-2);
    for(let k=0;k<6;k++){const l=hp[i-1],r=hp[i+1],m=Math.min(l,r);if(hp[i]-m>11)i+=(l<r||(l===r&&Math.random()<.5))?-1:1;else break;if(i<1||i>NC-2)break}
    i=clamp(i,1,NC-2);const x=i*CW+rnd(-2,2),y=FLOOR-hp[i];
    if(hp[i]<PILEMAX){hp[i]+=co.gem?6:4.5;hp[i-1]=Math.max(hp[i-1],hp[i]-7);hp[i+1]=Math.max(hp[i+1],hp[i]-7)}
    this.drawItem(this.pile.getContext('2d'),co,x,y-co.r*.4,rnd(-.4,.4),true);
    api.score+=co.v;if(co.gem){api.float(x,y-20,'+'+co.v,{c:co.c,size:20});S.coin(1.3)}
    if(st.clinkT<=0){S.clink(rnd(.85,1.15));st.clinkT=.035}},
  drawItem(c,co,x,y,rot,flat){c.save();c.translate(x,y);c.rotate(rot);
    if(co.gem){const r=co.r;D.poly(c,[[-r,-r*.2],[-r*.5,-r*.75],[r*.5,-r*.75],[r,-r*.2],[0,r*.9]],co.c,2.5)}
    else{const sy=flat?.55:Math.abs(Math.cos(co.spin))*.8+.2;D.ellipse(c,0,0,co.r,co.r*sy,'#f3c84b',2.5);if(sy>.4)D.ellipse(c,0,0,co.r*.55,co.r*.55*sy,'#f6d87a',1.5)}
    c.restore()},
  newLv(){const st=this.st;st.left=Math.min(5+st.lv*2,30);st.w=1.7+st.lv*.18;st.open=0;st.dir=st.lv%2?1:-1;this.newDot()},
  newDot(){const st=this.st;st.dot=st.a+st.dir*rnd(.9,2.7);st.inside=false},
  ad(a,b){let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d},
  tap(api){const st=this.st;if(st.open>0)return;const d=Math.abs(this.ad(st.a,st.dot));
    if(d<WIN){st.left--;api.score++;api.combo++;S.tick();S.good(1+(api.combo%10)*.05);api.hitstop(30);api.shake(3);
      const px=CX+Math.cos(st.dot)*RR,py=CY+Math.sin(st.dot)*RR;api.burst(px,py,{c:['#f3c84b','#fff'],n:10,sp:200,shape:'star',r:4});api.ring(px,py,{c:'#f3c84b',r:40});
      if(d<.06){api.score++;api.float(px,py-30,'ジャスト +2',{c:'#f3c84b',size:22})}
      if(st.left<=0){st.open=.01;st.pour=Math.min(3.2,1.3+st.lv*.3);st.emit=0;st.toEmit=10+st.lv*12+Math.max(0,st.lv-1)*2;
        S.fanfare();S.boom();api.flash('#f6d87a',.8);api.shake(16);api.bgmRate=1.3;api.fever=true;
        api.burst(CX,CY,{c:['#f3c84b','#fff','#f6d87a'],n:40,sp:520,shape:'star',r:7})}
      else{st.dir*=-1;this.newDot()}}
    else this.fail(api)},
  fail(api){const st=this.st;S.bad();api.shake(12);api.flash('#e2645a',.35);api.combo=0;api.end()},
  down(x,y,api){this.tap(api)},key(k,api){if(k===' '||k==='Enter')this.tap(api)},
  update(dt,api){const st=this.st;
    st.clinkT-=dt;
    for(const co of st.coins){co.vy+=1500*dt;co.x+=co.vx*dt;co.y+=co.vy*dt;co.spin+=dt*14;
      if(co.x<co.r){co.x=co.r;co.vx=Math.abs(co.vx)*.5}if(co.x>W-co.r){co.x=W-co.r;co.vx=-Math.abs(co.vx)*.5}
      const i=clamp(Math.round(co.x/CW),0,NC-1);if(co.vy>0&&co.y>FLOOR-st.hp[i]-co.r*.4){if(co.bounce&&co.vy>380){co.vy*=-.35;co.vx*=.6;co.bounce--;if(st.clinkT<=0){S.clink();st.clinkT=.035}}else{co.dead=true;this.land(co,api)}}}
    st.coins=st.coins.filter(co=>!co.dead);
    if(st.open>0){st.open+=dt;
      // ジャラジャラ：口から噴き出す
      if(st.open>.25&&st.emit<st.toEmit){const want=Math.min(st.toEmit,Math.ceil(st.toEmit*(st.open-.25)/st.pour));
        while(st.emit<want){st.emit++;const gem=st.lv>1&&st.emit%5===0;
          st.coins.push({x:CX+rnd(-90,90),y:CY+rnd(40,120),vx:rnd(-170,170),vy:rnd(-720,-260),r:gem?rnd(9,12):rnd(8,11),spin:rnd(6),gem,v:gem?5:1,c:gem?pick(GEMS):'#f3c84b',bounce:1})}
        st.jaraT-=dt;if(st.jaraT<=0){st.jaraT=.07;S.noise(.09,{v:.07,f:rnd(5000,7500),type:'highpass'})}}
      if(st.emit>=st.toEmit&&!st.coins.length&&st.open>st.pour+.9){api.bgmRate=1;api.fever=false;st.lv++;this.newLv()}
      return}
    st.a+=st.dir*st.w*dt;const d=this.ad(st.a,st.dot);
    if(Math.abs(d)<WIN)st.inside=true;else if(st.inside&&Math.sign(d)===st.dir)this.fail(api)},
  overText:'ハズレ！',
  draw(c,api){const st=this.st;c.fillStyle=this.bg;c.fillRect(0,0,W,H);
    c.fillStyle='#ddd8e2';for(let i=0;i<10;i++)c.fillRect(0,i*80,W,40);
    const op=st.open>0?ease.out(Math.min(1,st.open*3)):0,jp=st.open>0&&st.open<st.pour+.6;
    // ジャックポットの光
    if(jp){c.save();c.translate(CX,CY);c.rotate(api.t*.8);c.globalAlpha=.35*Math.min(1,st.open*3);c.fillStyle='#f6d87a';
      for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.beginPath();c.moveTo(0,0);c.lineTo(-60,-520);c.lineTo(60,-520);c.closePath();c.fill()}c.restore()}
    D.rrect(c,-20,FLOOR,W+40,120,0,'#b49b84',4);
    // 金庫本体
    D.rrect(c,CX-170,CY-170,340,340,26,'#7c8a96',4.5);D.rrect(c,CX-158,CY-158,316,316,20,'#4b5560',4);
    if(op>0){D.rrect(c,CX-150,CY-150,300,300,16,'#2e3438',3);{const g=c.createRadialGradient(CX,CY+60,10,CX,CY+60,170);g.addColorStop(0,'rgba(255,236,160,.95)');g.addColorStop(1,'rgba(255,236,160,0)');c.fillStyle=g;c.fillRect(CX-150,CY-150,300,300)}
      // 中のお宝：金ののべ棒・宝石・コインの山
      const left=1-Math.min(1,st.emit/Math.max(1,st.toEmit))*.6;
      D.path(c,c=>{c.moveTo(CX-140,CY+148);c.quadraticCurveTo(CX,CY+148-150*left,CX+140,CY+148);c.closePath()},'#f3c84b',3);
      for(let i=0;i<3;i++)D.poly(c,[[CX-70+i*46,CY+120-60*left],[CX-30+i*46,CY+120-60*left],[CX-22+i*46,CY+140-60*left],[CX-78+i*46,CY+140-60*left]],'#f6d87a',3);
      D.poly(c,[[CX-14,CY+40-70*left],[CX-7,CY+28-70*left],[CX+7,CY+28-70*left],[CX+14,CY+40-70*left],[CX,CY+58-70*left]],'#e2645a',3);
      D.poly(c,[[CX+60,CY+70-60*left],[CX+66,CY+60-60*left],[CX+78,CY+60-60*left],[CX+84,CY+70-60*left],[CX+72,CY+84-60*left]],'#7fc6d8',3)}
    c.save();c.translate(CX-158,CY);c.scale(1-op*.85,1);c.translate(-(CX-158),-CY);
    D.rrect(c,CX-152,CY-152,304,304,18,'#93a1ac',4);
    // ダイヤル
    c.lineWidth=26;c.strokeStyle='#4b5560';c.beginPath();c.arc(CX,CY,RR,0,7);c.stroke();c.lineWidth=4;c.strokeStyle=OL;c.beginPath();c.arc(CX,CY,RR+13,0,7);c.stroke();c.beginPath();c.arc(CX,CY,RR-13,0,7);c.stroke();
    if(api.state!=='title'&&st.open<=0){const px=CX+Math.cos(st.dot)*RR,py=CY+Math.sin(st.dot)*RR,gl=.5+.5*Math.sin(api.t*12);D.circle(c,px,py,11+gl*2,'#f3c84b',3)}
    D.circle(c,CX,CY,RR-20,'#e9e3d3',4);D.text(c,st.left,CX,CY+4,56,'#5b4d45');D.text(c,'のこり',CX,CY-44,14,'#8e8077');
    c.save();c.translate(CX,CY);c.rotate(st.a);D.rrect(c,RR-22,-6,44,12,6,'#e2645a',3);c.restore();
    c.restore();
    // たまったコインの山
    c.drawImage(this.pile,0,0,W,H);
    for(const co of st.coins)this.drawItem(c,co,co.x,co.y,co.spin*.2,false);
    if(jp){const k=Math.min(1,st.open*2.5),b=1+Math.sin(api.t*10)*.05;c.save();c.translate(CX,CY-205);c.scale(ease.outBack(k)*b,ease.outBack(k)*b);D.text(c,'JACKPOT!',0,0,52,Math.sin(api.t*14)>0?'#f3c84b':'#fff','center',OL,10);c.restore()}
    D.text(c,'金庫 '+st.lv+'こめ',CX,FLOOR+38,20,'#fff','center',OL,5);D.text(c,api.score+' 枚',CX,82,34,'#fff','center',OL,8);
  },
  __bot(api){const st=this.st;if(st.open>0)return;if(Math.abs(this.ad(st.a,st.dot))<.08)this.tap(api)},
};

</script>
