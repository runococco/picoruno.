<style>
:root{--bg:#f3ecdf;--ink:#5b4d45;--paper:#fbf8f2;--accent:#e98a6b;--sub:#8a7a6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;overflow:hidden;overscroll-behavior:none}
#wrap{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;background:rgba(243,236,223,.94);text-align:center;z-index:5}

h1{margin:0;font-size:clamp(34px,10vw,52px);font-weight:800;letter-spacing:.04em;line-height:1.1}

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="ov" id="title">

<script>
(()=>{
const GAME_URL='https://picoruno.com/shoji.html';
const INK='#5b4d45', PAPER='#fbf8f2', ROOM='#3d332d';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- audio ---------- */
let AC=null, master=null, noiseBuf=null, muted=false, bgmGain=null;
function initAudio(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=muted?0:0.9; master.connect(AC.destination);
  bgmGain=AC.createGain(); bgmGain.gain.value=0.22; bgmGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function noise(t,dur,{f1=2400,f2=1200,q=0.9,vol=0.5,rate=1,crackle=true,type='bandpass'}={}){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=rate;
  const bp=AC.createBiquadFilter(); bp.type=type; bp.Q.value=q;
  bp.frequency.setValueAtTime(f1,t); bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t);
  if(crackle){ // paper fibers snapping: jittery amplitude
    let k=0; for(let x=0;x<dur;x+=0.007){ const env=Math.pow(1-x/dur,1.4); g.gain.setValueAtTime(vol*env*(Math.random()<0.25?1:rnd(0.15,0.6)),t+x); k++; }
    g.gain.setValueAtTime(0,t+dur);
  } else { g.gain.linearRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.001,t+dur); }
  s.connect(bp); bp.connect(g); g.connect(master); s.start(t, Math.random()*0.5); s.stop(t+dur+0.05);
}
function tone(t,freq,dur,{type='sine',vol=0.3,f2=null,out=master,att=0.005}={}){
  const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.05);
}
const SFX={
  rip(power=1){ if(!AC) return; const t=AC.currentTime, d=rnd(0.16,0.24)*(0.8+power*0.3);
    noise(t,d,{f1:rnd(2600,3600),f2:rnd(900,1400),q:0.7,vol:0.55,rate:rnd(0.85,1.2)});
    noise(t+0.01,d*0.7,{f1:6000,f2:3500,q:0.5,vol:0.18,rate:1.3,type:'highpass'});
    tone(t,rnd(170,210),0.08,{vol:0.18,f2:90}); },
  poke(){ if(!AC) return; const t=AC.currentTime;
    noise(t,0.05,{f1:3200,f2:1800,q:1.2,vol:0.5,crackle:false}); tone(t,620,0.07,{vol:0.22,f2:200,type:'triangle'}); },
  slash(){ if(!AC) return; const t=AC.currentTime; noise(t,0.12,{f1:2000,f2:900,q:0.8,vol:0.4}); },
  step(v=0.5){ if(!AC) return; const t=AC.currentTime; tone(t,75,0.16,{vol:0.5*v,f2:45}); noise(t,0.07,{f1:500,f2:200,q:0.7,vol:0.25*v,crackle:false,type:'lowpass'}); },
  caught(){ if(!AC) return; const t=AC.currentTime;
    tone(t,330,0.18,{type:'square',vol:0.12}); tone(t+0.16,233,0.35,{type:'square',vol:0.12});
    meow(t+0.05,1.1); },
  combo(n){ if(!AC) return; const t=AC.currentTime; const sc=[0,2,4,7,9,12,14,16]; const f=523*Math.pow(2,sc[Math.min(n,sc.length-1)]/12);
    tone(t,f,0.12,{type:'triangle',vol:0.12}); },
  clear(){ if(!AC) return; const t=AC.currentTime; [523,659,784,1047,1319].forEach((f,i)=>tone(t+i*0.07,f,0.25,{type:'triangle',vol:0.16})); meow(t+0.38,1.4); },
  tick(){ if(!AC) return; tone(AC.currentTime,1200,0.04,{type:'square',vol:0.05}); },
  end(){ if(!AC) return; const t=AC.currentTime; [784,659,523,392].forEach((f,i)=>tone(t+i*0.11,f,0.22,{type:'triangle',vol:0.15})); }
};
function meow(t,p=1){
  const o=AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(520*p,t); o.frequency.linearRampToValueAtTime(780*p,t+0.09); o.frequency.exponentialRampToValueAtTime(430*p,t+0.32);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=4; f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(1600,t+0.1); f.frequency.linearRampToValueAtTime(800,t+0.32);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.22,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.36);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+0.4);
}
/* little pluck BGM, pentatonic */
let bgmNext=0, bgmStep=0, bgmOn=false;
const BGM=[0,null,4,7, 9,null,7,4, 2,null,4,null, 7,9,12,null, 0,null,4,7, 9,null,12,9, 7,null,4,2, 0,null,null,null];
const BASS=[0,null,null,null,-5,null,null,null,-3,null,null,null,-5,null,null,null];
function bgmTick(){
  if(!AC||!bgmOn) return;
  const spb=60/118/2;
  while(bgmNext<AC.currentTime+0.15){
    const n=BGM[bgmStep%BGM.length]; if(n!==null) tone(bgmNext,392*Math.pow(2,n/12),0.28,{type:'triangle',vol:0.5,out:bgmGain});
    const b=BASS[bgmStep%BASS.length]; if(b!==null) tone(bgmNext,98*Math.pow(2,b/12),0.4,{type:'sine',vol:0.7,out:bgmGain});
    bgmStep++; bgmNext+=spb;
  }
}
function bgmLevel(v,dur=0.3){ if(!AC) return; bgmGain.gain.cancelScheduledValues(AC.currentTime); bgmGain.gain.setTargetAtTime(v,AC.currentTime,dur/3); }
$('mute').onclick=()=>{ muted=!muted; $('mute').textContent='おと：'+(muted?'オフ':'オン'); if(master) master.gain.value=muted?0:0.9; };

/* ---------- cat drawing ---------- */
function drawCat(x,y,s,mood,t){
  // mood: 'ok' | 'innocent' | 'caught' | 'happy'
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if(mood==='caught') ctx.translate(Math.sin(t*60)*2,0);
  if(mood==='innocent') ctx.rotate(-0.12);
  ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.lineJoin='round';
  // ears
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.moveTo(-34,-18); ctx.lineTo(-30,-52); ctx.lineTo(-8,-34); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(34,-18); ctx.lineTo(30,-52); ctx.lineTo(8,-34); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#f2b8a8';
  ctx.beginPath(); ctx.moveTo(-28,-26); ctx.lineTo(-27,-42); ctx.lineTo(-16,-33); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(28,-26); ctx.lineTo(27,-42); ctx.lineTo(16,-33); ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,0,44,36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // patch
  ctx.save(); ctx.beginPath(); ctx.ellipse(0,0,42,34,0,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='#e9a86b'; ctx.beginPath(); ctx.ellipse(-30,-22,22,18,0.3,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.ellipse(0,0,44,36,0,0,Math.PI*2); ctx.stroke();
  // eyes
  ctx.fillStyle='#2b2421';
  if(mood==='innocent'){ // looking away
    ctx.beginPath(); ctx.arc(-22,-4,5,0,Math.PI*2); ctx.arc(4,-4,5,0,Math.PI*2); ctx.fill();
  } else if(mood==='happy'){
    ctx.lineWidth=4; ctx.strokeStyle='#2b2421'; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(-15,-2,6,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(15,-2,6,Math.PI*1.1,Math.PI*1.9); ctx.stroke();
  } else {
    const r=mood==='caught'?6.5:5.5;
    ctx.beginPath(); ctx.arc(-15,-3,r,0,Math.PI*2); ctx.arc(15,-3,r,0,Math.PI*2); ctx.fill();
  }
  // nose + mouth
  ctx.fillStyle='#e98a8a'; const nx=mood==='innocent'?-9:0;
  ctx.beginPath(); ctx.moveTo(nx-4,7); ctx.lineTo(nx+4,7); ctx.lineTo(nx,11); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineCap='round';
  if(mood==='caught'){ ctx.beginPath(); ctx.ellipse(nx,18,4,5,0,0,Math.PI*2); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(nx,11); ctx.quadraticCurveTo(nx-4,17,nx-9,14); ctx.moveTo(nx,11); ctx.quadraticCurveTo(nx+4,17,nx+9,14); ctx.stroke(); }
  // cheeks
  ctx.fillStyle='rgba(240,150,140,.45)';
  ctx.beginPath(); ctx.ellipse(-28,10,6,4,0,0,Math.PI*2); ctx.ellipse(28,10,6,4,0,0,Math.PI*2); ctx.fill();
  if(mood==='sleep'){ ctx.fillStyle=INK; ctx.font='800 18px sans-serif'; ctx.textAlign='left'; ctx.fillText('z',46,-36+Math.sin(t*3)*2); ctx.font='800 13px sans-serif'; ctx.fillText('z',60,-52+Math.sin(t*3+1)*2); }
  if(mood==='caught'){ // sweat drop
    ctx.fillStyle='#9fc6e0'; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(40,-30); ctx.quadraticCurveTo(48,-16,40,-14); ctx.quadraticCurveTo(32,-16,40,-30); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
// static title cat (svg)
$('titleCat').innerHTML=`<g stroke="${INK}" stroke-width="4" stroke-linejoin="round">
<path d="M26 58 30 22 52 40Z M94 58 90 22 68 40Z" fill="#fff"/>
<ellipse cx="60" cy="70" rx="44" ry="36" fill="#fff"/>
<clipPath id="hc"><ellipse cx="60" cy="70" rx="42" ry="34"/></clipPath>
<ellipse cx="30" cy="48" rx="22" ry="18" fill="#e9a86b" stroke="none" clip-path="url(#hc)"/>
<ellipse cx="60" cy="70" rx="44" ry="36" fill="none"/></g>
<circle cx="45" cy="67" r="5.5" fill="#2b2421"/><circle cx="75" cy="67" r="5.5" fill="#2b2421"/>
<path d="M56 77h8l-4 4z" fill="#e98a8a"/>
<path d="M60 81q-4 6-9 3M60 81q4 6 9 3" stroke="${INK}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<ellipse cx="32" cy="80" rx="6" ry="4" fill="rgba(240,150,140,.45)"/><ellipse cx="88" cy="80" rx="6" ry="4" fill="rgba(240,150,140,.45)"/>`;


SFX.keys=function(){ if(!AC) return; const t=AC.currentTime;
  for(let k=0;k<7;k++){ const tt=t+k*0.06+rnd(0,0.03); tone(tt,rnd(2600,4200),0.09,{type:'triangle',vol:0.07}); tone(tt,rnd(5200,6800),0.05,{type:'sine',vol:0.04}); } };
SFX.door=function(){ if(!AC) return; const t=AC.currentTime; tone(t,110,0.25,{vol:0.45,f2:55}); noise(t,0.12,{f1:800,f2:200,q:0.6,vol:0.35,crackle:false,type:'lowpass'}); };
SFX.jump=function(){ if(!AC) return; const t=AC.currentTime; tone(t,300,0.18,{type:'triangle',vol:0.15,f2:700}); };
SFX.fanfare=function(good){ if(!AC) return; const t=AC.currentTime;
  const seq=good?[523,659,784,1047]:[392,370,349]; seq.forEach((f,i)=>tone(t+i*0.1,f,0.3,{type:'triangle',vol:0.15})); };

/* ---------- お題 (shapes in a 100 x 130 box) ---------- */
function starPath(){ let s=''; for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, r=k%2?19:44; s+=(k?'L':'M')+(50+Math.cos(a)*r).toFixed(1)+' '+(68+Math.sin(a)*r).toFixed(1); } return s+'Z'; }
const SHAPES=[
  {name:'ハート', d:'M50 100 C14 76 10 46 30 38 C40 34 47 40 50 48 C53 40 60 34 70 38 C90 46 86 76 50 100Z'},
  {name:'さかな', d:'M10 65 Q40 32 72 65 Q40 98 10 65Z M66 65 L92 44 L92 86Z'},
  {name:'おつきさま', d:'M64 22 A44 44 0 1 0 64 108 A56 56 0 0 1 64 22Z'},
  {name:'おほしさま', d:starPath()},
  {name:'ねこ', d:'M50 44 C72 44 84 58 84 74 C84 94 68 104 50 104 C32 104 16 94 16 74 C16 58 28 44 50 44Z M20 62 L22 26 L44 46Z M80 62 L56 46 L78 26Z'}
];
const GW=50, GH=65, CELL=0.02; // mask grid, normalized by width (height 1.3)
function shapeMask(sh){
  const c=document.createElement('canvas'); c.width=GW; c.height=GH; const x=c.getContext('2d');
  x.scale(GW/100,GH/130); x.fill(new Path2D(sh.d));
  const d=x.getImageData(0,0,GW,GH).data, m=new Uint8Array(GW*GH); let n=0;
  for(let i=0;i<GW*GH;i++){ if(d[i*4+3]>127){ m[i]=1; n++; } }
  return {m,n};
}

/* ---------- game ---------- */
const DAYS=5;
let G=null, IR={x:0,y:0,w:1,h:1.3}, BED={x:0,y:0,w:0,h:0}, CATP={x:0,y:0};
const paper=document.createElement('canvas'), pctx=paper.getContext('2d');
function newGame(){
  G={day:0,total:0,history:[],t:0,over:false,parts:[],popups:[],shake:0,flash:0};
  startDay();
}
function startDay(){
  const sh=SHAPES[G.day%SHAPES.length];
  const mk=shapeMask(sh);
  Object.assign(G,{shape:sh,path:new Path2D(sh.d),mask:mk.m,maskN:mk.n,torn:new Uint8Array(GW*GH),stamps:[],
    phase:'intro',pt:0,inBed:false,jump:0,catMood:'ok',catT:0,
    owner:{p:'quiet',t:0,at:rnd(13,17)-G.day*0.9,fake:G.day>=2&&Math.random()<0.5,fakeDone:false},
    ripAcc:0,lastRip:0,res:null,hint:G.day<3,safeTight:false});
  redrawPaper();
}
function layout(){
  const top=92, bottom=130;
  const availW=W-32, availH=H-top-bottom;
  const fr=Math.min(availW,availH/1.3)*0.06;
  let iw=Math.min(availW-fr*2,(availH-fr*2)/1.3, 460);
  IR={x:(W-iw)/2,y:top+(availH-iw*1.3)/2,w:iw,h:iw*1.3,fr};
  const bw=Math.min(130,W*0.34);
  BED={x:W-bw-14,y:H-bottom+22,w:bw,h:bottom-34};
  CATP={x:Math.max(70,W*0.24),y:H-58};
  paper.width=Math.round(IR.w*DPR); paper.height=Math.round(IR.h*DPR);
  if(G) redrawPaper();
}
/* paper canvas: paper + holes. stamps are stored normalized so a resize can rebuild it */
function srand(seed){ let s=seed>>>0||1; return ()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s>>>0)/4294967296)); }
function redrawPaper(){
  pctx.setTransform(1,0,0,1,0,0); pctx.globalCompositeOperation='source-over';
  pctx.fillStyle=PAPER; pctx.fillRect(0,0,paper.width,paper.height);
  const r=srand(7); pctx.strokeStyle='rgba(180,160,130,.13)'; pctx.lineWidth=1*DPR;
  for(let k=0;k<70;k++){ const x=r()*paper.width,y=r()*paper.height; pctx.beginPath(); pctx.moveTo(x,y); pctx.quadraticCurveTo(x+r()*30*DPR,y+(r()-.5)*10*DPR,x+r()*50*DPR,y+(r()-.5)*14*DPR); pctx.stroke(); }
  if(G) for(const s of G.stamps) drawStamp(s);
}
function stampPoly(s,scale){
  const r=srand(s.seed), N=11, pts=[], S=IR.w*DPR;
  for(let k=0;k<N;k++){ const a=k/N*Math.PI*2+r()*0.3; const rr=s.r*(k%2?0.62+r()*0.25:0.95+r()*0.3)*scale; pts.push([(s.x+Math.cos(a)*rr)*S,(s.y+Math.sin(a)*rr)*S]); }
  return pts;
}
function drawStamp(s){
  const rim=stampPoly(s,1.18), hole=stampPoly(s,1);
  pctx.globalCompositeOperation='source-atop'; // rim only where paper remains
  pctx.fillStyle='#e7dbc4'; pctx.beginPath(); rim.forEach(([x,y],k)=>k?pctx.lineTo(x,y):pctx.moveTo(x,y)); pctx.closePath(); pctx.fill();
  pctx.strokeStyle='rgba(91,77,69,.55)'; pctx.lineWidth=1.3*DPR;
  pctx.beginPath(); hole.forEach(([x,y],k)=>k?pctx.lineTo(x,y):pctx.moveTo(x,y)); pctx.closePath(); pctx.stroke();
  pctx.globalCompositeOperation='destination-out';
  pctx.beginPath(); hole.forEach(([x,y],k)=>k?pctx.lineTo(x,y):pctx.moveTo(x,y)); pctx.closePath(); pctx.fill();
  pctx.globalCompositeOperation='source-over';
}
function tearAt(nx,ny,r){
  if(nx<-r||ny<-r||nx>1+r||ny>1.3+r) return 0;
  const s={x:nx,y:ny,r,seed:(Math.random()*1e9)|0}; G.stamps.push(s); drawStamp(s);
  let fresh=0; const rc=r*0.85;
  const i0=Math.max(0,Math.floor((nx-rc)/CELL)), i1=Math.min(GW-1,Math.floor((nx+rc)/CELL));
  const j0=Math.max(0,Math.floor((ny-rc)/CELL)), j1=Math.min(GH-1,Math.floor((ny+rc)/CELL));
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){ const cx=(i+.5)*CELL-nx, cy=(j+.5)*CELL-ny; if(cx*cx+cy*cy<=rc*rc && !G.torn[j*GW+i]){ G.torn[j*GW+i]=1; fresh++; } }
  return fresh;
}
function likeness(){
  let hit=0, miss=0;
  for(let i=0;i<GW*GH;i++){ if(G.torn[i]){ if(G.mask[i]) hit++; else miss++; } }
  const cover=hit/G.maskN, over=miss/G.maskN;
  return {cover,over,score:Math.round(clamp(cover-over*0.8,0,1)*100)};
}
function spawnBits(x,y,n){ for(let k=0;k<n;k++) G.parts.push({x,y,vx:rnd(-160,160),vy:rnd(-220,40),r:rnd(2.5,6),a:rnd(0,6),va:rnd(-10,10),t:0,life:rnd(0.5,0.9)}); }
function popup(text,col='#c4603f',size=26,x=W/2,y=null,life=1.3){ G.popups.push({x,y:y??IR.y+IR.h*0.45,text,col,size,t:0,life}); }

/* ---------- input ---------- */
let ptr=null;
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
const inBedBtn=(p)=>p.x>=BED.x-10&&p.x<=BED.x+BED.w+10&&p.y>=BED.y-20&&p.y<=BED.y+BED.h+10;
const playing=()=>G&&!G.over&&G.phase==='play'&&!G.inBed;
cv.addEventListener('pointerdown',e=>{
  initAudio(); if(!G||G.over) return; const p=pos(e);
  if(G.phase==='reveal' && G.pt>1.9){ nextDay(); return; }
  if(G.phase==='intro' && G.pt>0.6){ beginPlay(); return; }
  if(playing() && inBedBtn(p)){ goBed(); return; }
  if(!playing()) return;
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  ptr={id:e.pointerId,x:p.x,y:p.y,x0:p.x,y0:p.y,moved:0};
  G.trail=[{x:p.x,y:p.y}];
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id) return; const p=pos(e);
  const dx=p.x-ptr.x, dy=p.y-ptr.y, d=Math.hypot(dx,dy); if(d<1) return;
  ptr.moved+=d; G.trail.push({x:p.x,y:p.y}); if(G.trail.length>20) G.trail.shift();
  if(ptr.moved>10 && playing()){
    const step=IR.w*0.022, n=Math.max(1,Math.ceil(d/step));
    for(let k=1;k<=n;k++){ const x=ptr.x+dx*k/n, y=ptr.y+dy*k/n;
      const f=tearAt((x-IR.x)/IR.w,(y-IR.y)/IR.w,0.042);
      if(f>0){ G.ripAcc+=f; if(Math.random()<0.25) spawnBits(x,y,2); } }
    if(G.ripAcc>5 && G.t-G.lastRip>0.07){ SFX.rip(0.6); G.lastRip=G.t; G.ripAcc=0; G.shake=Math.max(G.shake,2); }
  }
  ptr.x=p.x; ptr.y=p.y;
});
function up(e){
  if(!ptr||e.pointerId!==ptr.id) return;
  if(ptr.moved<=10 && playing()){
    const f=tearAt((ptr.x0-IR.x)/IR.w,(ptr.y0-IR.y)/IR.w,0.055);
    if(f>0){ SFX.poke(); spawnBits(ptr.x0,ptr.y0,6); G.shake=Math.max(G.shake,2.5); }
  }
  ptr=null;
}
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

/* ---------- flow ---------- */
function beginPlay(){ G.phase='play'; G.pt=0; SFX.door(); bgmLevel(0.22); }
function goBed(){
  if(G.inBed) return; G.inBed=true; G.jump=0.0001; ptr=null; SFX.jump();
  const o=G.owner;
  if(o.p==='keys') { G.safeTight=true; }
  if(o.p==='quiet'){ o.p='steps'; o.t=0; o.dur=1.2; o.fake=false; }
}
function ownerUpdate(dt){
  const o=G.owner; o.t+=dt;
  if(o.p==='quiet'){
    if(o.t>=o.at){ o.p='steps'; o.t=0; o.dur=o.fake&&!o.fakeDone?2.4:rnd(1.7,2.3)-G.day*0.08; o.st=0; bgmLevel(0.06); }
  } else if(o.p==='steps'){
    o.st-=dt; const k=o.t/o.dur;
    const isFake=o.fake&&!o.fakeDone;
    if(o.st<=0){ SFX.step(isFake?(k<0.5?0.3+k:1.3-k):0.25+k*0.75); o.st=Math.max(0.24,0.45-k*0.2); }
    if(o.t>=o.dur){
      if(isFake){ o.fakeDone=true; o.p='quiet'; o.t=0; o.at=rnd(3,5); bgmLevel(0.22); popup('…おとなりさんだった','#8a7a6e',18); }
      else { o.p='keys'; o.t=0; o.dur=Math.max(0.75,1.15-G.day*0.08); SFX.keys(); setTimeout(()=>SFX.keys(),380); }
    }
  } else if(o.p==='keys'){
    if(o.t>=o.dur){ o.p='open'; o.t=0; reveal(); }
  }
}
const LINES={
  caught:['ぜんぶ見てたよ…','こらーっ！','いま、やってたよね？'],
  great:['……え、うまい。','おこるに、おこれない…','これは…芸術…？'],
  good:['これ、{s}…？','{s}っぽい…かも','…{s}、だよね？'],
  bad:['なにこれ…','こらーっ！','ただのいたずらだね']
};
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function reveal(){
  G.phase='reveal'; G.pt=0; SFX.door(); bgmLevel(0.0,0.1);
  const L=likeness(); const caught=!G.inBed;
  let pts=L.score*10;
  if(!caught && G.safeTight) pts+=100;
  if(caught) pts=Math.round(pts*0.3);
  const tier=caught?'caught':L.score>=80?'great':L.score>=50?'good':'bad';
  const line=pick(LINES[tier]).replace('{s}',G.shape.name);
  G.res={like:L.score,pts,caught,tight:!caught&&G.safeTight,line,tier};
  G.total+=pts; G.history.push(G.res);
  if(caught){ G.catMood='caught'; G.catT=2; G.flash=1; G.shake=8; SFX.caught(); if(navigator.vibrate) navigator.vibrate(120); }
  else setTimeout(()=>SFX.fanfare(L.score>=50),350);
}
function nextDay(){
  G.day++;
  if(G.day>=DAYS){ endGame(); return; }
  startDay();
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  if(G && !G.over){
    G.t+=dt; G.pt+=dt;
    if(G.phase==='intro' && G.pt>2.4) beginPlay();
    if(G.phase==='play') ownerUpdate(dt);
    if(G.jump>0) G.jump=Math.min(1,G.jump+dt*3.2);
    if(G.catT>0){ G.catT-=dt; if(G.catT<=0) G.catMood='ok'; }
  }
  if(G){
    G.flash=Math.max(0,G.flash-dt*2); G.shake=Math.max(0,G.shake-dt*25);
    for(const p of G.parts){ p.t+=dt; p.vy+=650*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=p.va*dt; }
    G.parts=G.parts.filter(p=>p.t<p.life);
    for(const p of G.popups) p.t+=dt; G.popups=G.popups.filter(p=>p.t<p.life);
  }
  bgmTick(); draw(); requestAnimationFrame(frame);
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
const FONT=(w,s)=>`${w} ${s}px "M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif`;
function outlined(text,x,y,size,col,align='center'){
  ctx.font=FONT(800,size); ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineWidth=5; ctx.lineJoin='round'; ctx.strokeStyle='#fbf8f2'; ctx.strokeText(text,x,y); ctx.fillStyle=col; ctx.fillText(text,x,y);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#f3ecdf'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e6dcc6'; ctx.fillRect(0,H-120,W,120);
  ctx.strokeStyle='rgba(91,77,69,.15)'; ctx.lineWidth=2; for(let x=-40;x<W;x+=46){ ctx.beginPath(); ctx.moveTo(x,H-120); ctx.lineTo(x+36,H); ctx.stroke(); }
  if(!G) return;
  ctx.save(); if(G.shake>0) ctx.translate(rnd(-1,1)*G.shake*0.5,rnd(-1,1)*G.shake*0.5);
  drawShoji();
  ctx.restore();
  for(const p of G.parts){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-p.r,-p.r*.6); ctx.lineTo(p.r,-p.r*.3); ctx.lineTo(p.r*.4,p.r*.7); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  if(ptr && ptr.moved>10 && G.trail && G.trail.length>1){
    const tr=G.trail;
    for(let c=-1;c<=1;c++){ ctx.beginPath(); tr.forEach((q,k)=>{ const a=k?Math.atan2(q.y-tr[k-1].y,q.x-tr[k-1].x):Math.atan2(tr[1].y-q.y,tr[1].x-q.x); const ox=-Math.sin(a)*c*8, oy=Math.cos(a)*c*8; k?ctx.lineTo(q.x+ox,q.y+oy):ctx.moveTo(q.x+ox,q.y+oy); });
      ctx.strokeStyle='rgba(91,77,69,.5)'; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.stroke(); }
  }
  if(ptr) drawPaw(ptr.x,ptr.y);
  drawBottom();
  drawHUD();
  if(G.flash>0){ ctx.fillStyle=`rgba(208,86,58,${G.flash*0.25})`; ctx.fillRect(0,0,W,H); }
  for(const p of G.popups){ const k=p.t/p.life; ctx.save(); ctx.globalAlpha=k>0.75?(1-k)/0.25:1; outlined(p.text,p.x,p.y-k*16,p.size,p.col); ctx.restore(); }
  if(G.phase==='intro') drawIntro();
  if(G.phase==='reveal') drawReveal();
}
function drawShoji(){
  const {x,y,w,h,fr}=IR;
  const lit=G.phase==='reveal'?Math.min(1,G.pt*3):0;
  // room behind: dark, lights up when the owner comes home
  ctx.fillStyle=ROOM; ctx.fillRect(x,y,w,h);
  if(lit>0){ ctx.fillStyle=`rgba(246,206,128,${lit})`; ctx.fillRect(x,y,w,h); }
  ctx.drawImage(paper,x,y,w,h);
  // hint outline
  if(G.hint && G.phase!=='reveal'){ ctx.save(); ctx.translate(x,y); ctx.scale(w/100,w/100); ctx.setLineDash([3,3]); ctx.lineWidth=1.1; ctx.strokeStyle='rgba(91,77,69,.3)'; ctx.stroke(G.path); ctx.restore(); }
  // kumiko (3 x 3 panes)
  ctx.fillStyle=INK; const bar=Math.max(3,w*0.014);
  for(let i=1;i<3;i++) ctx.fillRect(x+w*i/3-bar/2,y,bar,h);
  for(let j=1;j<3;j++) ctx.fillRect(x,y+h*j/3-bar/2,w,bar);
  // reveal: show the target outline
  if(G.phase==='reveal' && G.pt>0.5){ ctx.save(); ctx.translate(x,y); ctx.scale(w/100,w/100); ctx.lineWidth=2.2; ctx.setLineDash([5,4]); ctx.strokeStyle='#d0563a'; ctx.globalAlpha=Math.min(1,(G.pt-0.5)*3); ctx.stroke(G.path); ctx.restore(); }
  // frame
  ctx.fillStyle='#8a6a52'; ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.rect(x-fr,y-fr,w+fr*2,h+fr*2); ctx.rect(x,y,w,h); ctx.fill('evenodd');
  ctx.strokeRect(x-fr,y-fr,w+fr*2,h+fr*2); ctx.strokeRect(x,y,w,h);
  // owner's light from the hallway while coming home
  const o=G.owner;
  if(G.phase==='play' && (o.p==='steps'||o.p==='keys') && !(o.fake&&!o.fakeDone)){
    const k=o.p==='keys'?1:o.t/o.dur;
    ctx.fillStyle=`rgba(240,180,90,${0.08+k*0.14})`; ctx.fillRect(x,y,w,h);
  }
}
function drawPaw(x,y){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle='#fff'; ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,6,14,12,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  [[-11,-9],[-4,-14],[4,-14],[11,-9]].forEach(([a,b])=>{ ctx.beginPath(); ctx.arc(a,b,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle='#f2b8a8'; ctx.beginPath(); ctx.ellipse(0,8,6.5,5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function drawBed(){
  const {x,y,w,h}=BED;
  ctx.fillStyle='#c9a3c4'; ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.62,w/2,h*0.36,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#e8d3e4'; ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.56,w*0.38,h*0.22,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
}
function drawBottom(){
  drawBed();
  const s=Math.min(1,W/420)*0.85;
  const o=G.owner, urgent=G.phase==='play'&&(o.p==='keys'||(o.p==='steps'&&!(o.fake&&!o.fakeDone)));
  if(!G.inBed){
    if(G.phase==='play'){ outlined('ベッドにもどる',BED.x+BED.w/2,BED.y-6,urgent?17:14,urgent?'#d0563a':'#8a7a6e'); }
    const bob=urgent?Math.sin(G.t*30)*2:0;
    drawCat(CATP.x+bob,CATP.y,s,G.catMood!=='ok'?G.catMood:'ok',G.t);
  } else {
    const k=Math.min(1,G.jump); const bx=BED.x+BED.w/2, by=BED.y+BED.h*0.42;
    const cx=CATP.x+(bx-CATP.x)*k, cy=CATP.y+(by-CATP.y)*k-Math.sin(k*Math.PI)*80;
    drawCat(cx,cy,s*(1-0.12*k),k>=1?'sleep':'ok',G.t);
    if(k>=1 && G.phase==='play'){ outlined('ねたふり中…',bx,BED.y-6,14,'#8a7a6e'); }
  }
}
function drawHUD(){
  const pad=16;
  ctx.textBaseline='middle';
  outlined((Math.min(G.day,DAYS-1)+1)+'日め',pad,24,20,INK,'left');
  ctx.font=FONT(500,13); ctx.fillStyle='#8a7a6e'; ctx.textAlign='left'; ctx.fillText('ごうけい '+G.total+' てん',pad,48);
  // お題 card
  const cw=58, ch=70, cx=W-pad-cw, cy=8;
  rr(cx,cy,cw,ch,10); ctx.fillStyle=PAPER; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.stroke();
  ctx.save(); ctx.translate(cx+cw/2-18,cy+8); ctx.scale(0.36,0.36); ctx.fillStyle=ROOM; ctx.fill(G.path); ctx.restore();
  ctx.font=FONT(800,11); ctx.fillStyle=INK; ctx.textAlign='center'; ctx.fillText(G.shape.name,cx+cw/2,cy+ch-8);
  ctx.font=FONT(800,12); ctx.textAlign='right'; ctx.fillStyle='#8a7a6e'; ctx.fillText('おだい',cx-6,cy+14);
  // status line
  const o=G.owner; let label='', col='#8a7a6e';
  if(G.phase==='play'){
    if(G.inBed){ label='…'; }
    else if(o.p==='quiet'){ label='おるすばん中。おだいの形にやぶろう'; }
    else if(o.p==='steps'){ label=(o.fake&&!o.fakeDone)?'あしおと…？':'あしおと…！'; col='#c4603f'; }
    else if(o.p==='keys'){ label='ガチャガチャ…カギの音！'; col='#d0563a'; }
  }
  if(label) outlined(label,pad,72,14,col,'left');
}
function drawIntro(){
  const k=Math.min(1,G.pt*4);
  ctx.fillStyle=`rgba(243,236,223,${0.88*k})`; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=k;
  outlined((G.day+1)+'日め',W/2,H*0.24,30,INK);
  outlined('「いってきまーす」',W/2,H*0.24+40,16,'#8a7a6e');
  const s=Math.min(W*0.5,200)/100;
  ctx.save(); ctx.translate(W/2-50*s,H*0.36); ctx.scale(s,s);
  ctx.fillStyle=ROOM; ctx.fill(G.path); ctx.restore();
  outlined('おだい：'+G.shape.name,W/2,H*0.36+138*s,22,'#c4603f');
  outlined(G.day<3?'うすい線をなぞってやぶろう':'ヒントなし！',W/2,H*0.36+138*s+30,14,'#8a7a6e');
  ctx.restore();
}
function drawReveal(){
  if(G.pt<1.5) return;
  const k=Math.min(1,(G.pt-1.5)*4), r=G.res;
  ctx.save(); ctx.globalAlpha=k;
  const bw=Math.min(W-32,340), bh=180, bx=(W-bw)/2, by=H-bh-24;
  rr(bx,by,bw,bh,18); ctx.fillStyle='rgba(251,248,242,.96)'; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
  outlined('「'+r.line+'」',W/2,by+32,18,INK);
  outlined('そっくり度 '+r.like+'%',W/2,by+76,28,r.like>=80?'#c99a2e':'#c4603f');
  let sub=r.caught?'ねたふり まにあわず… ×0.3':r.tight?'ギリギリセーフ！ +100':'ねたふり セーフ';
  outlined(sub,W/2,by+112,15,r.caught?'#d0563a':'#6f9a5e');
  outlined('+'+r.pts+' てん',W/2,by+142,18,INK);
  if(G.pt>1.9){ ctx.globalAlpha=0.5+0.5*Math.sin(G.t*5); outlined(G.day+1>=DAYS?'タップでけっかへ':'タップで次の日へ',W/2,by+bh+20,13,'#8a7a6e'); }
  ctx.restore();
}

/* ---------- screens ---------- */
function rankOf(s){
  if(s>=4300) return 'でんせつの障子アーティスト';
  if(s>=3400) return '天才画家ねこ';
  if(s>=2400) return 'げいじゅつ家ねこ';
  if(s>=1400) return 'らくがきねこ';
  return 'ただのいたずらねこ';
}
function endGame(){
  G.over=true; bgmOn=false; bgmLevel(0,0.1); SFX.end();
  const best=G.history.reduce((a,b)=>Math.max(a,b.like),0), caught=G.history.filter(h=>h.caught).length;
  $('rTitle').textContent='5日間のおるすばん、おしまい';
  $('rScore').textContent=G.total+' てん';
  $('rRank').textContent=rankOf(G.total);
  $('rStats').innerHTML=G.history.map((h,i)=>`${SHAPES[i].name} ${h.like}%${h.caught?'（バレた）':''}`).join(' ／ ')+`<br>ベスト そっくり度 ${best}%　バレた回数 ${caught}回`;
  const text=`ねこになって、障子に穴をあけて絵をかいた。${G.total}てん「${rankOf(G.total)}」 #ビリビリしょうじ #picoruno`;
  $('xBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(GAME_URL);
  $('result').hidden=false;
}
function start(){
  initAudio(); newGame(); layout();
  $('title').hidden=true; $('result').hidden=true;
  if(AC){ bgmOn=true; bgmNext=AC.currentTime+0.1; bgmStep=0; bgmLevel(0.22); }
}
$('startBtn').onclick=start; $('againBtn').onclick=start;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; layout(); }
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ if(!AC) return; if(document.hidden) AC.suspend(); else AC.resume(); });
document.addEventListener('touchmove',e=>{ if(e.target===cv) e.preventDefault(); },{passive:false});
resize();
newGame(); G.over=true; G.phase='idle'; layout();
requestAnimationFrame(frame);
})();
</script>
