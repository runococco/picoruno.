<script>
/*ART*/const ART={},LAYER={},SCENE={plate:[240,392,186],bowl:[544,920,110]};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,DUR=45,[PX,PY,PR]=SCENE.plate,[BX,BY,BR]=SCENE.bowl;
const KIND={soy:{p:10,lim:870,n:'だいず',s:44},azuki:{p:20,lim:690,n:'あずき',s:36},black:{p:30,lim:510,n:'くろまめ',s:46},gold:{p:80,lim:620,n:'きんまめ',s:46}};

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('mame-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('mame-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],beans:[],lost:[],inBowl:[],held:null,paw:null};
function fresh(){return {phase:'play',t:0,left:DUR,score:0,beans:[],lost:[],inBowl:[],held:null,slip:0,spd:0,lx:0,ly:0,combo:0,paw:null,pawT:8,
  texts:[],say:'',sayT:0,endT:0,inN:0,blackN:0,slipN:0,goldT:6}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){const s=Math.ceil(Math.max(0,G.left));$('timeP').textContent=s;$('timeP').classList.toggle('low',G.phase==='play'&&s<=10);$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.3}
function addBean(k){for(let tr=0;tr<30;tr++){const a=rnd(0,Math.PI*2),r=Math.sqrt(Math.random())*(PR-30),x=PX+Math.cos(a)*r,y=PY+Math.sin(a)*r;
  if(G.beans.every(b=>Math.hypot(b.x-x,b.y-y)>40)){G.beans.push({k,x,y,r:rnd(0,6.3),t:0});return}}}
function pickKind(){const u=Math.random(),e=Math.min(1,G.t/30);return u<.42-.12*e?'soy':u<.72-.1*e?'azuki':'black'}
function fill(){while(G.beans.length<12)addBean(pickKind())}

/* ---------- input ---------- */
function grab(x,y){if(G.phase!=='play'||G.held)return false;let best=null,bd=48;for(const b of G.beans){const d=Math.hypot(b.x-x,b.y-y);if(d<bd){bd=d;best=b}}
  if(!best)return false;G.beans.splice(G.beans.indexOf(best),1);G.held=best;G.slip=0;G.spd=0;G.lx=x;G.ly=y;best.x=x;best.y=y;sfx('grab',.5);return true}
function move(x,y,dt){const b=G.held;if(!b)return;const d=Math.hypot(x-G.lx,y-G.ly);if(dt>0){const v=d/dt;G.spd=G.spd*.7+v*.3}G.lx=x;G.ly=y;b.x=x;b.y=y}
function release(){const b=G.held;if(!b)return;G.held=null;
  if(Math.hypot(b.x-BX,b.y-BY)<BR)score(b);else if(Math.hypot(b.x-PX,b.y-PY)<PR-12){G.beans.push(b);sfx('drop',.4)}else lose(b,'おとしちゃった')}
function score(b){const K=KIND[b.k];G.combo++;const pts=K.p+Math.min(20,(G.combo-1)*2);G.score+=pts;G.inN++;if(b.k==='black')G.blackN++;
  G.inBowl.push({k:b.k,x:BX+rnd(-BR*.5,BR*.5),y:BY+rnd(-BR*.4,BR*.4),r:rnd(0,6.3)});if(G.inBowl.length>40)G.inBowl.shift();
  if(b.k==='gold'){G.left+=3;sfx('gold',.6);text('+3びょう',BX,BY-150,'#ffe27a',true)}sfx('in',.6,1+Math.min(.5,G.combo*.05));
  text(`${K.n} +${pts}`,BX,BY-100,b.k==='gold'?'#ffe27a':'#fff',true);if(G.combo>=5&&G.combo%5===0){say(['じょうず','そのちょうし','おはし めいじん'][G.combo/5%3]);sfx('levelup',.4)}fill();hud()}
function lose(b,msg){G.combo=0;G.slipN++;G.lost.push({...b,vx:rnd(-160,160),vy:rnd(-160,160),t:0});sfx('slip',.6);sfx('roll',.4);text(msg,b.x,b.y-60,'#ffd0c0',true);say('あらら');fill();hud()}

/* ---------- flow ---------- */
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);
  for(let i=G.lost.length-1;i>=0;i--){const l=G.lost[i];l.t+=dt;l.x+=l.vx*dt;l.y+=l.vy*dt;l.vx*=.96;l.vy*=.96;l.r+=dt*4;if(l.t>1.4)G.lost.splice(i,1)}
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  G.left-=dt;if(G.left<=0){G.left=0;if(G.held)release();finish();hud();return}
  const b=G.held;if(b){const lim=KIND[b.k].lim;if(G.spd>lim)G.slip+=(G.spd-lim)/lim*dt*14;else G.slip=Math.max(0,G.slip-dt*1.2);G.spd*=Math.pow(.02,dt);
    if(G.slip>=1){G.held=null;if(Math.hypot(b.x-BX,b.y-BY)<BR)score(b);else lose(b,'つるっ')}}
  // gold bean now and then
  G.goldT-=dt;if(G.goldT<=0){G.goldT=rnd(7,10);if(!G.beans.some(x=>x.k==='gold')){if(G.beans.length>=12)G.beans.shift();addBean('gold')}}
  // the cat's paw sweeps across the path from 12 s on
  G.pawT-=dt;if(!G.paw&&G.pawT<=0&&G.t>12){G.paw={y:rnd(560,760),t:0,dir:Math.random()<.5?1:-1};}
  if(G.paw){const p=G.paw;p.t+=dt;if(p.t>.9&&p.t<1.6){const px=p.dir>0?-60+(p.t-.9)/.7*840:780-(p.t-.9)/.7*840;p.x=px;if(G.held&&Math.hypot(G.held.x-px,G.held.y-p.y)<80){const hb=G.held;G.held=null;lose(hb,'ねこパンチ！')}}
    if(p.t>1.8){G.paw=null;G.pawT=rnd(3.5,6)}}
  hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=2600?'おはし めいじん':n>=2000?'まめつまみ マイスター':n>=1400?'そーっと じょうず':n>=700?'おてつだい ねこ':'はじめての おはし'}
function showResult(){const n=G.score,best=LS.get('mame-best',0),nb=n>best;if(nb){LS.set('mame-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rIn').textContent=G.inN;$('rBlack').textContent=G.blackN;$('rSlip').textContent=G.slipN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.slipN<=2?'すべらず ていねい。おみごと！':'くろまめは とくに すべりやすいよ。わっかが あかく なったら ゆっくり。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの おまめはこび🥢 ${n}てん（${G.inN}こ はこんだ）「${rank(n)}」\n#ねこのおまめはこび #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/mame.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function beanAt(c,k,x,y,r,a,sc){const im=IMG[k],s=124*(sc||1);c.save();c.translate(x,y);c.rotate(r);if(a!=null)c.globalAlpha=a;
  if(im)c.drawImage(im,-s/2,-s/2,s,s);else{c.fillStyle=k==='black'?'#222':k==='azuki'?'#8a2a2e':k==='gold'?'#f2c14e':'#e8d098';c.beginPath();c.ellipse(0,0,KIND[k].s/2,KIND[k].s/2.6,0,0,7);c.fill()}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#c89a6a';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  for(const b of G.inBowl)beanAt(c,b.k,b.x,b.y,b.r);
