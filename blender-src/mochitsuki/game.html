  <div class="ov" id="titleOv">

<script>
/*ART*/const ART={},LAYER={},SCENE={pivot:[189,791],mochi:[360,852],mochiTop:[360,824],pxu:134.7};/*/ART*/
/*AUDIO*/const AUD={},CHART={notes:[],start:0,end:1,length:1,beat:.5};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280;   // scene frame

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>IMG[k]=i)));if(ART.plate)$('resImg').src=ART.plate}
function layer(c,k,alpha=1){const im=IMG[k],L=LAYER[k];if(!im||!L)return;c.globalAlpha=alpha;c.drawImage(im,L[0],L[1],L[2],L[3]);c.globalAlpha=1}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,musicGain=null,songSrc=null;const BUF={};
let muted=LS.get('mochi-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
let decoding=null;
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);musicGain=ac.createGain();musicGain.gain.value=.8;musicGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=rate;const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function setMute(m){muted=m;LS.set('mochi-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}
let calib=LS.get('mochi-calib',0);
function showCalib(){$('calV').textContent=(calib>0?'+':'')+calib+'ms'}

/* ---------- state ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.max(CW/W0,CH/H0);OX=(CW-W0*S)/2;OY=(CH-H0*S)*.7}
const G={phase:'title',notes:[],t:-9,songStart:0,score:0,combo:0,maxCombo:0,perfect:0,good:0,miss:0,ouch:0,prog:0,kine:-1.15,kineV:0,slam:0,squash:0,turnerPose:'idle',ouchT:0,fx:[],texts:[],shake:0,clockBase:0,usePerf:false};
const PER=.065,GOOD=.13;
function now(){ // song time in seconds (audio clock), minus output latency and the player's calibration
  if(G.usePerf)return (performance.now()/1000-G.clockBase);
  const lat=(ac.outputLatency||ac.baseLatency||0);return ac.currentTime-G.songStart-lat-calib/1000;
}
async function start(){
  unlock();guardHistory();
  for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;
  G.notes=CHART.notes.map(n=>({...n,j:0}));Object.assign(G,{score:0,combo:0,maxCombo:0,perfect:0,good:0,miss:0,ouch:0,prog:0,fx:[],texts:[],turnerPose:'idle',ouchT:0,phase:'play',ended:false});
  updScore();
  if(ac){await decoding;if(ac.state==='suspended')await ac.resume()}
  if(ac&&BUF.song){songSrc=ac.createBufferSource();songSrc.buffer=BUF.song;songSrc.connect(musicGain);G.songStart=ac.currentTime+.35;songSrc.start(G.songStart);G.usePerf=false}
  else{G.usePerf=true;G.clockBase=performance.now()/1000+.35}
  pingPlay();
}
function tap(){
  if(G.phase!=='play')return;
  const t=now();
  // nearest unjudged pound
  let best=null,bd=1;
  for(const n of G.notes){if(n.j||n.k!=='P')continue;const d=Math.abs(n.t-t);if(d<bd){bd=d;best=n}if(n.t>t+.4)break}
  slam();
  if(best&&bd<=GOOD){
    best.j=bd<=PER?2:1;
    if(best.j===2){G.perfect++;G.score+=100+Math.min(50,G.combo*2);pop('ぺったん！','#fbf8f1');sfx('perfect',.35,1.1)}else{G.good++;G.score+=60+Math.min(30,G.combo);pop('いいね','#f2c14e')}
    G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.prog+=best.j===2?1:.6;sfx('pound',1,.96+Math.random()*.08);flour(best.j===2?16:9);
  }else{
    // a paw in the mortar?
    const paw=G.notes.find(n=>n.k==='H'&&!n.j&&Math.abs(n.t-t)<=.16);
    if(paw){paw.j=-1;G.ouch++;G.combo=0;G.ouchT=.7;sfx('ouch',.8);sfx('pound',.5,1.2);pop('いたっ！','#f4b7c0');G.shake=.5}
    else{sfx('pound',.55,1.1);flour(4)}
  }
  updScore();
}
function slam(){G.slam=.07;G.kineV=0}
function flour(n){const m=SCENE.mochiTop;for(let i=0;i<n;i++){const a=-Math.PI*(.1+Math.random()*.8);const v=120+Math.random()*180;G.fx.push({x:m[0]+(Math.random()-.5)*60,y:m[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.5+Math.random()*.3,r:3+Math.random()*4})}G.squash=1;G.shake=Math.max(G.shake,.25)}
function pop(s,c){G.texts.push({s,c,t:0})}
function updScore(){$('score').textContent=G.score}
function judgeMisses(t){
  for(const n of G.notes){if(n.j)continue;if(n.t>t)break;
    if(n.k==='P'&&t-n.t>GOOD){n.j=-2;G.miss++;G.combo=0;pop('あっ','#b9c0e0')}
    if(n.k==='H'&&t-n.t>.16){n.j=3}}
}
function finish(){
  G.phase='result';sfx('finish',.9);
  const total=G.notes.filter(n=>n.k==='P').length;
  const acc=Math.max(0,Math.round((G.perfect+G.good*.6-G.ouch*.5)/total*100));
  const best=LS.get('mochi-best',0);const nb=G.score>best;if(nb)LS.set('mochi-best',G.score);
  $('resPct').textContent=acc+'%';$('resRank').textContent=rank(acc);
  $('resNote').innerHTML=`ぺったん！ ${G.perfect}　いいね ${G.good}　あっ ${G.miss}　いたっ ${G.ouch}<br>さいだいコンボ ${G.maxCombo}　スコア ${G.score}${nb?'　<span style="color:#d9534a">じこベスト！</span>':''}`;
  G.acc=acc;
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`うさぎと もちつき🐰🌕 ぺったん率 ${acc}%「${rank(acc)}」\n#ぺったんもちつき #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/mochitsuki.html');
  setTimeout(()=>$('resultOv').hidden=false,1400);
}
function rank(a){if(a>=97)return'月のもちつき名人';if(a>=85)return'つきたて職人';if(a>=65)return'ぺったん上手';if(a>=40)return'もちつき見習い';return'まだまだ おこめ'}

/* ---------- draw ---------- */
const sx=x=>OX+x*S, sy=y=>OY+y*S;
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#1b2346';c.fillRect(0,0,CW,CH);
  let t=G.phase==='play'||G.phase==='result'?now():-9;
  if(G.phase==='play'){
    judgeMisses(t);
    if(t>CHART.length-.2&&!G.ended){G.ended=true;finish()}
  }
  // turner pose from upcoming paws
  let pose='idle';
  if(G.ouchT>0){G.ouchT-=dt;pose='ouch'}
  else if(G.phase==='play'||G.phase==='pause'){for(const n of G.notes){if(n.k!=='H')continue;if(t>n.t-.2&&t<n.t+.17){pose='reach';break}if(n.t>t+.3)break}}
  // mallet: winds up before each pound, slams on tap, then rises
  let target=-1.15;
  if(G.phase==='play'){const nx=G.notes.find(n=>n.k==='P'&&!n.j&&n.t>t-.05);if(nx&&nx.t-t<.38)target=-1.15-.5*(1-(nx.t-t)/.38)}
  if(G.slam>0){G.slam-=dt;G.kine+=(0-G.kine)*Math.min(1,dt*60)}else{G.kine+=(target-G.kine)*Math.min(1,dt*12)}
  let shx=0,shy=0;if(G.shake>0){G.shake-=dt;shx=(Math.random()-.5)*8*G.shake;shy=(Math.random()-.5)*8*G.shake}
  c.save();c.translate(shx,shy);c.translate(OX,OY);c.scale(S,S);
  layer(c,'bg');layer(c,'usu');
  // mochi: crossfade rough -> smooth with progress, squash on hits
  const total=CHART.notes.filter(n=>n.k==='P').length||1;const p=Math.min(1,G.prog/total*1.15);
  if(G.squash>0)G.squash=Math.max(0,G.squash-dt*4);
  const sq=1-Math.sin(G.squash*Math.PI)*.18*G.squash;
  const m=SCENE.mochi;c.save();c.translate(m[0],m[1]+12);c.scale(1+(1-sq)*.6,sq);c.translate(-m[0],-m[1]-12);
  if(p<.5){layer(c,'mochi0',1);layer(c,'mochi1',p*2)}else{layer(c,'mochi1',1);layer(c,'mochi2',(p-.5)*2)}
  c.restore();
  layer(c,'usagi');
  layer(c,'turner_'+pose);
  // kine
  const im=IMG.kine,L=LAYER.kine,pv=SCENE.pivot;
  if(im&&L){c.save();c.translate(pv[0],pv[1]);c.rotate(G.kine);c.drawImage(im,L[0]-pv[0],L[1]-pv[1],L[2],L[3]);c.restore()}
  // flour
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t+=dt;if(f.t>f.life){G.fx.splice(i,1);continue}f.vy+=500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;c.globalAlpha=1-f.t/f.life;c.fillStyle='#fffdf6';c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.fill()}
  c.globalAlpha=1;
  c.restore();
  drawLane(c,t);
  // judgement text
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>.7){G.texts.splice(i,1);continue}
    c.save();c.font=`${Math.round(30*Math.min(1.2,S*1.6))}px "Dela Gothic One",sans-serif`;c.textAlign='center';const s=x.t<.1?.6+x.t*4:1;c.translate(sx(360),sy(SCENE.mochiTop[1])-60*S-x.t*40);c.scale(s,s);c.globalAlpha=x.t>.5?(.7-x.t)/.2:1;
    c.lineJoin='round';c.lineWidth=8;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  if(G.combo>=5&&G.phase==='play'){c.save();c.font=`${Math.round(20*Math.min(1.2,S*1.6))}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.lineWidth=6;c.lineJoin='round';c.strokeStyle='#4a2c1d';c.fillStyle='#f2c14e';const y=laneY()+56;c.strokeText(G.combo+' コンボ',CW/2,y);c.fillText(G.combo+' コンボ',CW/2,y);c.restore()}
}
function laneY(){return Math.max(110,CH*.3)}
function drawLane(c,t){
  if(G.phase==='title')return;
  const y=laneY(),hx=Math.max(56,CW*.18),span=1.7,len=CW-hx-10;
  // rail
  c.save();c.fillStyle='rgba(16,20,44,.55)';c.strokeStyle='#4a2c1d';c.lineWidth=3;
  rr(c,8,y-30,CW-16,60,30);c.fill();c.stroke();
  // beat ticks
  c.strokeStyle='rgba(251,248,241,.18)';c.lineWidth=2;
  const b=CHART.beat;for(let k=Math.ceil((t-.3)/b);k*b<t+span;k++){const x=hx+(k*b-t)/span*len;if(x<16)continue;c.beginPath();c.moveTo(x,y-18);c.lineTo(x,y+18);c.stroke()}
  // hit circle
  const pul=G.slam>0?1.12:1;c.fillStyle='rgba(251,248,241,.12)';c.strokeStyle='#fbf8f1';c.lineWidth=3.5;c.beginPath();c.arc(hx,y,23*pul,0,7);c.fill();c.stroke();
  // notes
  for(let i=G.notes.length-1;i>=0;i--){const n=G.notes[i];const dtn=n.t-t;if(dtn>span||dtn<-.3)continue;if(n.j===1||n.j===2)continue;
    const x=hx+dtn/span*len;const fade=n.j===-2?.35:n.j===-1||n.j===3?.3:1;c.globalAlpha=fade;
    if(n.k==='P'){c.fillStyle='#fbf8f1';c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.arc(x,y,17,0,7);c.fill();c.stroke();
      c.fillStyle='#4a2c1d';c.font='15px "Dela Gothic One",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('ぺ',x,y+1)}
    else{c.fillStyle='#f4b7c0';c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.ellipse(x,y+3,13,11,0,0,7);c.fill();c.stroke();
      for(const [dx,dy] of [[-9,-10],[0,-14],[9,-10]]){c.beginPath();c.arc(x+dx,y+dy+3,4.5,0,7);c.fill();c.stroke()}}
    c.globalAlpha=1}
  c.restore();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
