<script>
/*ART*/const ART={},LAYER={},SCENE={};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/

<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,DUR=60,CS=170,SW=380,SH=300,SK=70;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('hinata-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('hinata-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],sun:null,star:null,cat:{x:360,y:900}};
function fresh(){return {phase:'play',t:0,left:DUR,score:0,cat:{x:360,y:960},drag:false,sun:{x:360,y:560,tx:360,ty:560},star:null,starT:14,cloud:null,cloudT:10,
  rest:0,inSun:false,warm:0,texts:[],say:'',sayT:0,endT:0,sunT:0,longest:0,starN:0,zz:0,shiver:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){const s=Math.ceil(Math.max(0,G.left));$('timeP').textContent=s;$('timeP').classList.toggle('low',G.phase==='play'&&s<=10);$('scoreP').textContent=Math.floor(G.score)+' ぽか'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}
// the sun patch is a slanted window shape: inside test in its own frame
function inPatch(p,x,y,w,h){const dy=y-p.y,dx=x-p.x-dy*SK/h;return Math.abs(dx)<w/2&&Math.abs(dy)<h/2}
function mult(){return G.rest>=6?3:G.rest>=3?2:1}

/* ---------- flow ---------- */
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);G.zz+=dt;
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  G.left-=dt;if(G.left<=0){G.left=0;finish();hud();return}
  // the sun drifts toward a new spot every few seconds, a bit faster as the afternoon goes on
  const s=G.sun,sp=46+G.t*2.6;const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy);if(d<8){s.tx=rnd(200,520);s.ty=rnd(330,1080)}else{s.x+=dx/d*sp*dt;s.y+=dy/d*sp*dt}
  // clouds
  G.cloudT-=dt;if(!G.cloud&&G.cloudT<=0){G.cloud={t:0,dur:rnd(2,3)};sfx('cloud',.5);say('くもった…')}
  if(G.cloud){G.cloud.t+=dt;if(G.cloud.t>G.cloud.dur+1){G.cloud=null;G.cloudT=rnd(7,11)}}
  const dark=G.cloud&&G.cloud.t>1&&G.cloud.t<G.cloud.dur+1;
  // a sparkly little spot
  G.starT-=dt;if(!G.star&&G.starT<=0){G.star={x:rnd(180,540),y:rnd(380,1060),t:0,life:5};sfx('star',.4,1.5)}
  if(G.star){G.star.t+=dt;if(G.star.t>G.star.life){G.star=null;G.starT=rnd(6,9)}}
  const c=G.cat,inS=!dark&&inPatch(s,c.x,c.y,SW-40,SH-40),inStar=!dark&&G.star&&Math.hypot(c.x-G.star.x,c.y-G.star.y)<70;
  if((inS||inStar)&&!G.drag){if(!G.inSun){sfx('warm',.4)}G.rest+=dt;G.sunT+=dt;G.longest=Math.max(G.longest,G.rest);const m=mult()*(inStar?2:1);G.score+=dt*10*m;G.warm=Math.min(1,G.warm+dt*.8);
    if(inStar&&!G.star.got){G.star.got=1;G.starN++;text('きらきら ×2',c.x,c.y-120,'#ffe27a',true)}
    const k=Math.floor(G.rest),k0=Math.floor(G.rest-dt);if(k!==k0&&(k===3||k===6)){sfx('levelup',.4);text('ぐっすり ×'+(k===3?2:3),c.x,c.y-150,'#ffe27a');sfx('purr',.5)}}
  else{if(G.inSun&&!G.drag&&!dark){sfx('cold',.4);say(['さむい…','ひなた どこ？','くしゅん'][Math.floor(G.t)%3])}if(!G.drag)G.rest=Math.max(0,G.rest-dt*3);G.warm=Math.max(0,G.warm-dt*.5)}
  G.inSun=(inS||inStar)&&!G.drag;hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=1000?'ひなたぼっこ めいじん':n>=780?'ぽかぽか マイスター':n>=560?'おひるね じょうず':n>=340?'うとうと ねこ':'はじめての ひなたぼっこ'}
function showResult(){const n=Math.floor(G.score),best=LS.get('hinata-best',0),nb=n>best;if(nb){LS.set('hinata-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' ぽか';$('rSun').textContent=Math.round(G.sunT)+'びょう';$('rLong').textContent=Math.round(G.longest)+'びょう';$('rStar').textContent=G.starN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.longest>=15?'ぐっすり ながく ねられたね。':'ひだまりの すすむ さきに おいておくと、ながく ねられるよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの ひなたぼっこ☀️ ${n}ぽか（ひなたで ${Math.round(G.sunT)}びょう）「${rank(n)}」\n#ねこのひなたぼっこ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/hinata.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function patch(c,p,w,h,a){c.save();c.translate(p.x,p.y);c.globalAlpha=a;c.fillStyle='#ffeaa0';c.filter='blur(5px)';
  c.beginPath();c.moveTo(-w/2-SK/2,-h/2);c.lineTo(w/2-SK/2,-h/2);c.lineTo(w/2+SK/2,h/2);c.lineTo(-w/2+SK/2,h/2);c.closePath();c.fill();c.filter='none';
  // window frame shadows
  c.strokeStyle='rgba(120,110,50,.35)';c.lineWidth=12;c.beginPath();c.moveTo(-SK/2*0,-h/2);c.lineTo(SK/2,h/2);c.moveTo(-w/2,0);c.lineTo(w/2,0);c.stroke();c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#c8c47a';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  const dark=G.cloud&&G.cloud.t>1&&G.cloud.t<G.cloud.dur+1,ca=G.cloud?(G.cloud.t<1?1-G.cloud.t*.7:G.cloud.t>G.cloud.dur+1?.3:(G.cloud.t>G.cloud.dur?.3+(G.cloud.t-G.cloud.dur)*.7:.3)):1;
  if(G.phase!=='title'){
    c.save();c.globalCompositeOperation='screen';patch(c,G.sun,SW,SH,.9*ca);c.restore();
    if(G.star){const st=G.star,a=Math.min(1,st.t*3,(st.life-st.t)*2)*ca;c.save();c.globalAlpha=a;c.fillStyle='rgba(255,240,160,.55)';c.beginPath();c.arc(st.x,st.y,74,0,7);c.fill();
      c.fillStyle='#ffe27a';c.strokeStyle='#4a2c1d';c.lineWidth=3;for(let i=0;i<3;i++){const an=G.t*1.5+i*2.1,x=st.x+Math.cos(an)*58,y=st.y+Math.sin(an)*58;c.beginPath();for(let k=0;k<8;k++){const r=k%2?5:14,aa=k*Math.PI/4;c.lineTo(x+Math.cos(aa)*r,y+Math.sin(aa)*r)}c.closePath();c.fill();c.stroke()}c.restore()}
    // cat on the cushion
    const ct=G.cat,br=1+Math.sin(G.t*2.4)*.015*(G.inSun?1:0),sh=G.inSun||G.drag?0:Math.sin(G.t*40)*2;c.save();c.translate(ct.x+sh,ct.y);c.scale(br*(G.drag?1.06:1),br*(G.drag?1.06:1));
    if(G.drag){c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(10,18,CS*.48,CS*.4,0,0,7);c.fill()}
    if(IMG.cat)c.drawImage(IMG.cat,-CS/2*1.28,-CS/2*1.28,CS*1.28,CS*1.28);else{c.fillStyle='#5a7ac8';c.fillRect(-CS/2,-CS/2,CS,CS)}c.restore();
