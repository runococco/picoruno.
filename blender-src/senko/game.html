<script>
/*ART*/const ART={},LAYER={},SCENE={shoulder:[236,831],eave:157,ground:1154,boards:989,spr:{paw:{res:96,pxu:160},furin:{res:128,pxu:128,top:25.6,mouth:70.4}}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,SH=SCENE.shoulder,HY=715,L=175,GR=1500,STICKS=3,XMIN=320,XMAX=650,FX=560;
const PH=[{n:'つぼみ',d:3,m:5,lim:.72,r:[5,12]},{n:'ぼたん',d:7,m:10,lim:.6,r:[12,13]},{n:'まつば',d:8,m:15,lim:.6,r:[12,11]},{n:'やなぎ',d:7,m:20,lim:.66,r:[11,9]},{n:'ちりぎく',d:5,m:25,lim:.72,r:[9,6]}];
const DONE_BONUS=200;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('senko-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('senko-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const STARS=[];for(let i=0;i<46;i++)STARS.push({x:rnd(0,W0),y:rnd(170,640),r:rnd(1,2.6),p:rnd(0,6)});
const G={phase:'title',t:0,sticks:[],sparks:[],texts:[]};
function fresh(){return {phase:'play',t:0,score:0,n:0,sticks:[],sparks:[],texts:[],sayT:0,say:'',endT:0,
  hx:430,hv:0,ha:0,tx:430,th:0,om:0,bt:0,ph:0,state:'light',stT:0,gust:null,gustT:2.5,fa:0,fv:0,fb:0,fbv:0,wind:0,drop:null,pachiT:0,stickPts:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('stickP').textContent=Math.min(G.n+1,STICKS)+'/'+STICKS+' ほん';$('scoreP').textContent=Math.floor(G.score)+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}
function bead(){return [G.hx+L*Math.sin(G.th),HY+L*Math.cos(G.th)]}
function beadR(){if(G.state==='light')return 3+G.stT*3;const p=PH[Math.min(G.ph,4)],k=Math.min(1,(G.bt-phStart(G.ph))/p.d);return p.r[0]+(p.r[1]-p.r[0])*k}
function phStart(i){let t=0;for(let k=0;k<i;k++)t+=PH[k].d;return t}
function lim(){return PH[Math.min(G.ph,4)].lim}

/* ---------- sticks ---------- */
function light(){G.state='light';G.stT=0;G.bt=0;G.ph=0;G.th=rnd(-.05,.05);G.om=0;G.gust=null;G.gustT=rnd(2.2,3.2);G.stickPts=0;G.drop=null;sfx('light',.5);text((G.n+1)+'ほんめ',360,420,'#ffe27a');hud()}
function endStick(done){const p=Math.min(G.ph,4);G.sticks.push({ph:done?5:p,t:G.bt,pts:Math.round(G.stickPts)+(done?DONE_BONUS:0)});
  if(done){G.score+=DONE_BONUS;sfx('levelup',.6);text('さいごまで もった！ +'+DONE_BONUS,360,420,'#ffe27a');say('きれい…')}
  else{const [x,y]=bead();G.drop={x,y,vx:G.om*L*Math.cos(G.th)*.6+G.hv*.5,vy:-G.om*L*Math.sin(G.th)*.3,r:beadR(),t:0};sfx('drop',.6);text('ぽとっ',x,y-60,'#ffd0c0',true);say(['あっ…','にゃ…','おちた〜'][G.n%3])}
  G.state='out';G.stT=0;hud()}

/* ---------- step ---------- */
function gustAmp(){return 340+90*G.n+50*Math.min(G.ph,4)}
function windNow(){let w=Math.sin(G.t*.9)*50*(1+G.n*.4)+Math.sin(G.t*2.3)*25;const g=G.gust;
  if(g&&g.t>=0){const t=g.t,env=t<.35?t/.35:t<.35+g.hold?1:Math.max(0,1-(t-.35-g.hold)/.45);w+=g.dir*g.amp*env}return w}
function physics(dt){const k=260,c=2*Math.sqrt(k);G.ha=k*(G.tx-G.hx)-c*G.hv;G.hv+=G.ha*dt;G.hv=Math.max(-1100,Math.min(1100,G.hv));G.hx+=G.hv*dt;
    const w=G.state==='burn'?G.wind:G.wind*.3;const a=-(GR/L)*Math.sin(G.th)-(G.ha/L)*Math.cos(G.th)-.7*G.om+(w/L)*Math.cos(G.th);G.om+=a*dt;G.th+=G.om*dt}
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);G.stT+=dt;
  // gusts: the wind bell rings first, then the gust arrives
  if(G.phase==='play'&&G.state==='burn'){G.gustT-=dt;if(!G.gust&&G.gustT<=0){G.gust={t:-rnd(.8,1.05),dir:Math.random()<.5?-1:1,amp:gustAmp()*rnd(.85,1.15),hold:rnd(.5,1.1)+G.n*.15,rung:0};}
    if(G.gust){const g=G.gust;g.t+=dt;if(!g.rung){g.rung=1;sfx('furin',.55,g.dir>0?1:1.12)}if(g.t>.35+g.hold+.5){G.gust=null;G.gustT=rnd(1.8,3.3)-G.n*.2}}}
  G.wind=windNow();
  // wind bell + paper strip swing (they hint the gust before it arrives)
  const pre=G.gust&&G.gust.t<0?G.gust.dir*(1+G.gust.t)*.6:0;
  G.fv+=(-28*G.fa-2.2*G.fv+G.wind*.0035+pre*3+Math.sin(G.t*13)*(G.gust&&G.gust.t<0?6:0)*.3)*dt;G.fa+=G.fv*dt;
  G.fbv+=(-14*(G.fb-G.fa*1.5)-1.6*G.fbv+G.wind*.006+pre*4)*dt;G.fb+=G.fbv*dt;
  const n=4;for(let i=0;i<n;i++)physics(dt/n);
  if(G.phase==='play'){
    if(G.state==='light'){if(G.stT>1.1){G.state='burn';G.stT=0}}
    else if(G.state==='burn'){G.bt+=dt;let p=0;while(p<5&&G.bt>=phStart(p+1))p++;
      if(p!==G.ph){G.ph=p;if(p<5){sfx('phase',.45);text(PH[p].n,360,470,'#ffe27a')}}
      if(G.ph>=5){endStick(true)}
      else{const pts=PH[G.ph].m*dt;G.score+=pts;G.stickPts+=pts;hud();
        if(Math.abs(G.th)>lim())endStick(false)}}
    else if(G.state==='out'){if(G.stT>2){G.n++;if(G.n>=STICKS)finish();else light()}}}
  if(G.drop){const d=G.drop;d.t+=dt;d.vy+=1400*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>SCENE.boards-4){d.y=SCENE.boards-4;d.vy*=-.2;d.vx*=.5}if(d.t>1.6)G.drop=null}
  emit(dt);
  for(let i=G.sparks.length-1;i>=0;i--){const p=G.sparks[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=1-p.drag*dt;p.vy*=1-p.drag*dt;if(p.t>p.life)G.sparks.splice(i,1)}
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.6&&$('resultOv').hidden)showResult()}}
function spark(x,y,a,v,life,g,c,w,kids,drag){G.sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life,g,c,w,drag:drag||0});
  if(kids)for(let k=0;k<kids;k++){const t=life*rnd(.5,.8),ex=x+Math.cos(a)*v*t,ey=y+Math.sin(a)*v*t;G.sparks.push({x:ex,y:ey,vx:Math.cos(a+rnd(-1,1))*v*.5,vy:Math.sin(a+rnd(-1,1))*v*.5,t:-t,life:t+life*.4,g,c,w:w*.8,drag:0,late:1})}}
function emit(dt){if(G.state!=='burn'&&!(G.state==='light'&&G.stT>.5))return;const [x,y]=bead(),r=beadR(),p=G.state==='light'?-1:G.ph;
  const rate=p<0?6:[12,44,52,34,12][p],n=Math.floor(rate*dt+Math.random());
  for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2);
    if(p<=0)spark(x,y,a,rnd(60,140),.15,0,'#ffcf70',2);
    else if(p===1){spark(x+Math.cos(a)*r,y+Math.sin(a)*r,a,rnd(120,260),.12,0,'#ffe0a0',2.5)}
    else if(p===2)spark(x,y,a,rnd(380,600),.16,200,'#fff0b0',2.2,2+Math.floor(Math.random()*2));
    else if(p===3)spark(x,y,rnd(-Math.PI*.9,-Math.PI*.1),rnd(200,320),.85,900,'#ffb050',1.8,0,.6);
    else spark(x,y,a,rnd(50,120),.25,120,'#ffd890',1.6)}
  G.pachiT-=dt;if(p>=1&&p<=2&&G.pachiT<=0){sfx('pachi',.18+Math.random()*.1,[1,1.5,.75][Math.floor(Math.random()*3)]);G.pachiT=rnd(.05,.16)}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7);hud()}
function rank(n){return n>=1800?'はなびの めいじん':n>=1300?'えんがわの はなび師':n>=800?'なつの よるの スター':n>=400?'せんこうはなび じょうず':'はじめての せんこうはなび'}
function showResult(){const n=Math.round(G.score),best=LS.get('senko-best',0),nb=n>best;if(nb){LS.set('senko-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';
  $('rSticks').innerHTML=G.sticks.map((s,i)=>`<div>${i+1}ほんめ<b>${s.ph>=5?'さいごまで':PH[s.ph].n}</b>${s.ph>=5?'もった！':'で ぽとっ'}<br>${s.pts}てん</div>`).join('');
  const full=G.sticks.filter(s=>s.ph>=5).length;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(full===3?'3ぼんとも さいごまで！ おみごと。':full?'さいごまで もったのが '+full+'ほん。':'ふうりんが なったら かぜの あいず。<br>たまが ゆれる ほうへ てを そっと うごかそう。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの せんこうはなび🎇 ${n}てん（さいごまで ${full}/3ぼん）「${rank(n)}」\n#ねこのせんこうはなび #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/senko.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#1a2a22';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  const top=-OY/S,L0=-OX/S,WW=CW/S,g=c.createLinearGradient(0,top,0,700);g.addColorStop(0,'#141a44');g.addColorStop(1,'#3a3c7a');c.fillStyle=g;c.fillRect(L0,top,WW,720-top);
  c.fillStyle='#22382a';c.fillRect(L0,1150,WW,CH/S);
  for(const s of STARS){c.globalAlpha=.5+.5*Math.sin(G.t*1.5+s.p);c.fillStyle='#fff6d0';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()}c.globalAlpha=1;
  c.fillStyle='#fff3c4';c.beginPath();c.arc(150,300,34,0,7);c.fill();c.fillStyle='#3a3c7a';c.globalAlpha=.0;c.globalAlpha=1;
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  // wind bell under the eave
  const fy=SCENE.eave,fs=SCENE.spr.furin,fk=.95;c.save();c.translate(FX,fy);c.rotate(-G.fa*.5);c.strokeStyle='#e8e0d0';c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(0,26);c.stroke();
  c.translate(0,26);c.rotate(-G.fa*.5);if(IMG.furin)c.drawImage(IMG.furin,-64*fk,-fs.top*fk,128*fk,128*fk);
  c.translate(0,(fs.mouth-fs.top)*fk);c.strokeStyle='#e8e0d0';c.beginPath();c.moveTo(0,0);c.lineTo(0,30);c.stroke();c.translate(0,30);c.rotate(-G.fb);
  c.fillStyle='#a8d0f0';c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.roundRect(-15,0,30,96,4);c.fill();c.stroke();c.strokeStyle='#5a8ad8';c.lineWidth=3;c.beginPath();c.moveTo(-10,60);c.quadraticCurveTo(-3,52,3,60);c.quadraticCurveTo(8,66,12,58);c.stroke();c.restore();
  // wind streaks while a gust blows
  if(G.gust&&G.gust.t>0){const g2=G.gust,a=Math.min(1,g2.t*3)*Math.max(0,Math.min(1,(.35+g2.hold+.5-g2.t)*2));c.save();c.globalAlpha=a*.75;c.strokeStyle='#dfe8ff';c.lineWidth=6;c.lineCap='round';
    for(let i=0;i<5;i++){const y=380+i*90+Math.sin(i*7)*20,x=((G.t*600*g2.dir+i*170)%900+900)%900-90;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+60*g2.dir,y-10,x+120*g2.dir,y);c.stroke()}c.restore()}
  // night tint + sparkler glow
  c.fillStyle='rgba(14,18,52,.28)';c.fillRect(L0,top,WW,H0-top+CH/S);
  const lit=G.state==='burn'||(G.state==='light'&&G.stT>.3),[bx,by]=bead();
  if(lit){c.save();c.globalCompositeOperation='lighter';const gi=G.state==='light'?.12:[.16,.3,.34,.26,.12][Math.min(G.ph,4)]*(1+.15*Math.sin(G.t*30));glow(c,bx,by,340,'rgba(255,170,80,A)',gi);c.restore()}
  // arm, paw, sparkler
  const hx=G.hx,hy=HY;c.lineCap='round';
  for(const [w,col] of [[54,'#4a2c1d'],[46,'#fbf6ec']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(SH[0],SH[1]);c.quadraticCurveTo((SH[0]+hx)/2,hy+40,hx,hy);c.stroke()}
  const cx=hx+L*.45*Math.sin(G.th*.4),cy=hy+L*.5;
  c.strokeStyle='#4a2c1d';c.lineWidth=7;c.beginPath();c.moveTo(hx,hy-10);c.quadraticCurveTo(cx,cy,bx,by);c.stroke();
  const sg=c.createLinearGradient(hx,hy,bx,by);sg.addColorStop(0,'#e07aa8');sg.addColorStop(.45,'#a07ad8');sg.addColorStop(.55,'#5a4a50');sg.addColorStop(1,'#3a3034');c.strokeStyle=sg;c.lineWidth=4;c.beginPath();c.moveTo(hx,hy-10);c.quadraticCurveTo(cx,cy,bx,by);c.stroke();
  if(IMG.paw)c.drawImage(IMG.paw,hx-50,hy-50,100,100);else{c.fillStyle='#fbf6ec';c.beginPath();c.arc(hx,hy,24,0,7);c.fill()}
  // swing limit hint
  if(G.state==='burn'){const k=Math.abs(G.th)/lim();if(k>.45){c.save();c.globalAlpha=Math.min(1,(k-.45)*2.5);c.strokeStyle=k>.8?'#ff7a6a':'#ffe0a0';c.lineWidth=5;c.setLineDash([8,10]);c.beginPath();c.arc(hx,hy,L+28,Math.PI/2-lim(),Math.PI/2+lim());c.stroke();c.setLineDash([]);
    for(const s of [-1,1]){const a=Math.PI/2+s*lim();c.beginPath();c.moveTo(hx+Math.cos(a)*(L+10),hy+Math.sin(a)*(L+10));c.lineTo(hx+Math.cos(a)*(L+46),hy+Math.sin(a)*(L+46));c.stroke()}c.restore()}}
  // bead + sparks
  c.save();c.globalCompositeOperation='lighter';
  for(const p of G.sparks){if(p.t<0)continue;const a=1-p.t/p.life;c.strokeStyle=p.c;c.globalAlpha=Math.max(0,a);c.lineWidth=p.w*1.7;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);c.stroke()}
  c.globalAlpha=1;if(lit||G.state==='light'){const r=beadR();glow(c,bx,by,r*2.6,'rgba(255,140,40,A)',.8);c.fillStyle='#ffcf6a';c.beginPath();c.arc(bx,by,r*.8,0,7);c.fill();c.fillStyle='#fff4d0';c.beginPath();c.arc(bx,by,r*.45,0,7);c.fill()}
  c.restore();
  if(G.drop){const d=G.drop,a=Math.max(0,1-d.t/1.6);c.globalAlpha=a;c.fillStyle='#ff9a40';c.beginPath();c.arc(d.x,d.y,d.r*.8,0,7);c.fill();c.globalAlpha=1}
  // phase track
  if(G.phase!=='title'){c.save();c.textAlign='center';c.textBaseline='middle';for(let i=0;i<5;i++){const x=88+i*136,y=1218,on=G.state==='burn'&&G.ph===i,past=G.state==='burn'&&G.ph>i;
    c.fillStyle=on?'#f2c14e':past?'#c8b890':'rgba(255,250,242,.7)';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(x-60,y-24,120,48,24);c.fill();c.stroke();
    c.fillStyle='#4a2c1d';c.font='22px "Dela Gothic One",sans-serif';c.fillText(PH[i].n,x,y+1);
    if(on){const k=(G.bt-phStart(i))/PH[i].d;c.fillStyle='rgba(74,44,29,.35)';c.fillRect(x-48,y+15,96*k,5)}}c.restore()}
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(170,640);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-90,-28,180,52,20);c.fill();c.stroke();c.beginPath();c.moveTo(-10,22);c.lineTo(0,50);c.lineTo(20,20);c.closePath();c.fill();c.stroke();c.fillRect(-14,16,38,8);
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='24px "Dela Gothic One",sans-serif';c.fillText(G.say,0,-2);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.2){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?28:38;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(150,Math.min(W0-150,x.x)),x.y-x.t*30);c.globalAlpha=x.t>.9?(1.2-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'&&G.n===0&&G.t<7&&G.t%1.6<1.15){c.save();c.textAlign='center';outlineText(c,'ゆびを よこに うごかして ゆれを おさえる',360,1110,26,'#fff',7);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input: relative horizontal drag moves the paw ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{cv.setPointerCapture(e.pointerId)}catch(_){}drag={x:e.clientX,tx:G.tx}},{passive:false});
cv.addEventListener('pointermove',e=>{if(!drag||G.phase!=='play')return;G.tx=Math.max(XMIN,Math.min(XMAX,drag.tx+(e.clientX-drag.x)/S*1.1))});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,()=>{drag=null});
const keys={};window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();keys[e.code]=1}});window.addEventListener('keyup',e=>{keys[e.code]=0});
setInterval(()=>{if(G.phase!=='play')return;if(keys.ArrowLeft)G.tx=Math.max(XMIN,G.tx-9);if(keys.ArrowRight)G.tx=Math.min(XMAX,G.tx+9)},16);
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;Object.assign(G,fresh());light();hud();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';drag=null;$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);reset();for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('senko-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({senko:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});

setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,bead,lim};
