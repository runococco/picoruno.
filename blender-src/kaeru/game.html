<script>
/*ART*/const ART={},LAYER={},SCENE={res:256,units:1.6,pxu:160,pads:{pad_l:.5,pad_m:.4,pad_s:.32,lotus:.44,leaf_old:.4}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,DS=.9,PX=SCENE.pxu*DS,RES=SCENE.res;   // sprite px -> frame px
const FROGY=H0-360,MAXPULL=230,MAXJUMP=340,JT=.5,BANK=44;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function outlined(im,px,thr){
  const c=document.createElement('canvas');c.width=im.width+px*2;c.height=im.height+px*2;const x=c.getContext('2d');
  const m=document.createElement('canvas');m.width=im.width;m.height=im.height;const mx=m.getContext('2d');mx.drawImage(im,0,0);
  const d=mx.getImageData(0,0,m.width,m.height),a=d.data;for(let i=0;i<a.length;i+=4){const on=a[i+3]>thr;a[i]=74;a[i+1]=44;a[i+2]=29;a[i+3]=on?255:0}mx.putImageData(d,0,0);
  for(let k=0;k<16;k++){const t=k/16*Math.PI*2;x.drawImage(m,px+Math.cos(t)*px,px+Math.sin(t)*px)}
  x.drawImage(im,px,px);c.pad=px;return c}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(!i)return;IMG[k]=['koi','reeds'].includes(k)?i:outlined(i,k==='fly'?2:4,120)})))}
function spr(c,k,x,y,s=1,rot=0,a=1){const im=IMG[k];if(!im)return;const p=im.pad||0;c.save();c.globalAlpha*=a;c.translate(x,y);if(rot)c.rotate(rot);c.scale(s*DS,s*DS);c.drawImage(im,-RES/2-p,-RES/2-p);c.restore()}
// water caustics tile, drawn once
const CAU=document.createElement('canvas');CAU.width=CAU.height=256;(()=>{const x=CAU.getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let k=0;k<70;k++){const px=r()*256,py=r()*256,rr=10+r()*28;for(const [ox,oy] of [[0,0],[256,0],[-256,0],[0,256],[0,-256]]){const g=x.createRadialGradient(px+ox,py+oy,rr*.4,px+ox,py+oy,rr);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.8,'rgba(220,255,250,.16)');g.addColorStop(1,'rgba(220,255,250,0)');x.fillStyle=g;x.beginPath();x.arc(px+ox,py+oy,rr,0,7);x.fill()}}})();

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('kaeru-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.36;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('kaeru-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- world ---------- */
const G={phase:'title',t:0,rows:[],pads:[],flies:[],koi:[],ripples:[],fx:[],texts:[],frog:null,cam:0,best:0,lives:3,fly:0,lotus:0,jumps:0,aim:null,idle:0,nextRow:0,endT:0};
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function addRow(){
  const k=G.rows.length,y=k===0?0:G.rows[k-1].y+Math.min(300,215+k*2.2)+rnd()*25;
  const n=k===0?1:k<8?3:k<22?(rnd()<.6?2:3):(rnd()<.55?1:2);const sp=k<3?0:(45+Math.min(115,k*3.2))*(rnd()<.5?-1:1);
  const row={y,k,pads:[]};const slot=(W0-2*BANK)/n;
  for(let q=0;q<n;q++){
    let type=k===0?'pad_l':rnd()<.12?'lotus':(k>6&&rnd()<Math.min(.35,(k-6)*.02))?'leaf_old':k<10?(rnd()<.6?'pad_l':'pad_m'):(['pad_l','pad_m','pad_m','pad_s'][Math.floor(rnd()*4)]);
    const r=SCENE.pads[type]*PX*.92;const x=k===0?W0/2:BANK+slot*(q+.5)+(rnd()-.5)*slot*.4;
    const p={type,x,y:y+(rnd()-.5)*40,r,vx:sp*(.85+rnd()*.3),rot:rnd()*6.28,sink:0,sinkT:0,row,bob:0,used:false};row.pads.push(p);G.pads.push(p)}
  if(k>1&&rnd()<.55){G.flies.push({x:BANK+rnd()*(W0-2*BANK),y:y-100-rnd()*60,t:rnd()*6,eaten:0})}
  G.rows.push(row)}
function reset(){seed=(Date.now()%100000)+7;G.t=0;G.rows=[];G.pads=[];G.flies=[];G.ripples=[];G.fx=[];G.texts=[];G.cam=0;G.best=0;G.lives=3;G.bonus=0;G.fly=0;G.lotus=0;G.jumps=0;G.aim=null;G.idle=0;G.endT=0;
  for(let k=0;k<8;k++)addRow();const p0=G.pads[0];G.frog={pad:p0,ox:0,oy:-6,x:p0.x,y:p0.y,j:null,rot:0,splash:0,lastPad:p0,tongue:0};
  G.koi=[];for(let k=0;k<3;k++)G.koi.push({x:rnd()*W0,y:rnd()*900,vx:(rnd()<.5?-1:1)*(30+rnd()*30),ph:rnd()*6});hud()}
function hud(){$('scoreP').textContent=total()+' m';const ls=$('lives').children;for(let k=0;k<3;k++)ls[k].classList.toggle('off',k>=G.lives)}
const sy=wy=>FROGY-(wy-G.cam);
function padAt(x,y){let best=null;for(const p of G.pads){if(p.sink>=1)continue;const d=Math.hypot((x-p.x),(y-p.y)/.95);if(d<p.r*(p.sinkT>0?.8:.98)&&(!best||d<best.d))best={p,d}}return best&&best.p}
function jump(vx,vy){const f=G.frog;if(f.j||f.splash)return;const sx=f.x,sy0=f.y;f.j={sx,sy:sy0,tx:sx+vx,ty:sy0+vy,t:0};f.rot=Math.atan2(vx,vy);
  if(f.pad&&f.pad.type==='leaf_old'&&f.pad.sinkT>0){}f.pad=null;G.jumps++;sfx('jump',.6);G.idle=0}
function land(){const f=G.frog,j=f.j;f.j=null;f.x=j.tx;f.y=j.ty;
  // flies along the way were already eaten in flight; now: pad or water?
  const p=(f.x<BANK-6||f.x>W0-BANK+6)?null:padAt(f.x,f.y);
  if(!p){splash();return}
  f.pad=p;f.ox=f.x-p.x;f.oy=f.y-p.y;f.lastPad=p;p.bob=1;G.ripples.push({x:f.x,y:f.y,t:0,big:0});sfx(Math.random()<.5?'land':'land2',.6);
  if(p.type==='leaf_old'&&!p.sinkT){p.sinkT=1.5;sfx('sink',.5);G.texts.push({s:'しずむ！',x:p.x,wy:p.y+70,t:0,c:'#ffe27a',small:1})}
  if(p.type==='lotus'&&!p.used){p.used=true;G.lotus++;sfx('lotus',.7);G.texts.push({s:'はすの花 +20m',x:p.x,wy:p.y+80,t:0,c:'#ffd0e4'});G.bonus=(G.bonus||0)+2000;
    for(let k=0;k<14;k++){const a=Math.random()*6.28,v=80+Math.random()*160;G.fx.push({x:p.x,wy:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.8,c:k%2?'#ffd0e4':'#fff'})}}
  if(f.y>G.best)G.best=Math.max(G.best,f.y);hud()}
function splash(){const f=G.frog;f.splash=1.1;f.pad=null;G.lives--;G.ripples.push({x:f.x,y:f.y,t:0,big:1});sfx('splash',.8);
  for(let k=0;k<16;k++){const a=Math.random()*6.28,v=60+Math.random()*180;G.fx.push({x:f.x,wy:f.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.6,c:'#e8fbff'})}
  G.texts.push({s:G.lives>0?'ぽちゃん！':'ぽちゃん…',x:f.x,wy:f.y+60,t:0,c:'#fff'});hud();if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}
function respawn(){const f=G.frog;let p=f.lastPad;if(!p||p.sink>=.5||p.sinkT>0||!G.pads.includes(p)){let best=null;for(const q of G.pads){if(q.type==='leaf_old'||q.sinkT>0)continue;const s=sy(q.y);if(s<200||s>H0-60)continue;if(!best||q.y<best.y)best=q}p=best||G.pads[0]}
  f.pad=p;f.ox=0;f.oy=-6;f.x=p.x;f.y=p.y;f.splash=0;f.rot=0;G.texts.push({s:'けろっ',x:p.x,wy:p.y+60,t:0,c:'#fff',small:1});sfx('croak',.6)}
function step(dt){
  G.t+=dt;const f=G.frog;
  for(const p of G.pads){if(p.vx){p.x+=p.vx*dt;if(p.x<BANK+p.r*.5){p.x=BANK+p.r*.5;p.vx=Math.abs(p.vx)}if(p.x>W0-BANK-p.r*.5){p.x=W0-BANK-p.r*.5;p.vx=-Math.abs(p.vx)}}
    p.bob=Math.max(0,p.bob-dt*3);if(p.sinkT>0){p.sinkT-=dt;if(p.sinkT<=0){p.sinkT=-1}}if(p.sinkT<0)p.sink=Math.min(1,p.sink+dt*1.5)}
  if(G.phase==='play'){
    if(f.pad){f.x=f.pad.x+f.ox;f.y=f.pad.y+f.oy;if(f.pad.sink>.35){splash()}}
    if(f.j){const j=f.j;j.t+=dt/JT;const t=Math.min(1,j.t);f.x=j.sx+(j.tx-j.sx)*t;f.y=j.sy+(j.ty-j.sy)*t;
      for(const fl of G.flies){if(fl.eaten)continue;const fx=fl.x+Math.sin(fl.t*2)*30;if(Math.hypot(fx-f.x,fl.y-f.y)<58){fl.eaten=1;G.fly++;f.tongue=.25;sfx('gulp',.7);G.texts.push({s:'ぱくっ',x:fx,wy:fl.y+50,t:0,c:'#fff',small:1})}}
      if(j.t>=1)land()}
    if(f.splash){f.splash-=dt;if(f.splash<=0){f.splash=0;if(G.lives<=0)finish();else respawn()}}
    if(!f.j&&!f.splash){G.idle+=dt;if(G.idle>4){G.idle=-3;sfx('croak',.4)}}
    f.tongue=Math.max(0,f.tongue-dt);
    // keep the world going
    while(G.rows[G.rows.length-1].y<G.cam+H0+200)addRow();
    const lo=G.cam-500;G.pads=G.pads.filter(p=>p.y>lo||p===f.pad||p===f.lastPad);G.flies=G.flies.filter(q=>q.y>lo&&!(q.eaten&&q.eaten>1));
  }
  const want=Math.max(G.cam,(f.j?Math.max(f.j.sy,f.y):f.y)-40);G.cam+=(want-G.cam)*Math.min(1,dt*3);
  for(const fl of G.flies){fl.t+=dt;if(fl.eaten)fl.eaten+=dt}
  for(const k of G.koi){k.x+=k.vx*dt;k.ph+=dt*4;if(k.x<-120)k.x=W0+120;if(k.x>W0+120)k.x=-120;if(sy(k.y)>H0+150)k.y=G.cam+H0-200+Math.random()*300}
  for(let i=G.ripples.length-1;i>=0;i--){const r=G.ripples[i];r.t+=dt;if(r.t>1.2)G.ripples.splice(i,1)}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;if(p.t>p.life){G.fx.splice(i,1);continue}p.x+=p.vx*dt;p.wy-=p.vy*dt;p.vx*=1-dt*2;p.vy*=1-dt*2}
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.3&&$('resultOv').hidden)showResult()}
}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;G.aim=null;duck(.08,.2);sfx('over',.8)}
function total(){return Math.floor((G.best+(G.bonus||0))/100)}
function rank(m){return m>=200?'池の ぬし':m>=120?'はすわたり名人':m>=60?'げんきな カエル':m>=25?'おたまじゃくし卒業':'まだまだ おたまじゃくし'}
function showResult(){const m=total();const best=LS.get('kaeru-best',0),nb=m>best;if(nb)LS.set('kaeru-best',m);
  $('resScore').textContent=m+' m';$('rFly').textContent=G.fly;$('rLotus').textContent=G.lotus;$('rJumps').textContent=G.jumps;$('resRank').textContent=rank(m);
  $('resNote').innerHTML=(nb&&m>0?'ベスト更新！<br>':'')+(G.fly>=10?'おなか いっぱい。けろっぷ。':m>=60?'池の まんなか まで来たよ。':'ひっぱる 長さで とぶ きょりが きまるよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`けろけろ はすわたり🐸 ${m}m（ハエ${G.fly}ぴき）「${rank(m)}」\n#はすわたり #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/kaeru.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function toFrame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function banks(c){
  for(const side of [0,1]){const x0=side?W0-BANK:0;const g=c.createLinearGradient(side?W0-BANK-30:BANK+30,0,side?W0:0,0);g.addColorStop(0,'rgba(90,140,60,0)');g.addColorStop(.35,'#6a9a48');g.addColorStop(1,'#5a8a3a');c.fillStyle=g;c.fillRect(side?W0-BANK-30:0,0,BANK+30,H0)}
  const k0=Math.floor((G.cam-300)/140),k1=Math.floor((G.cam+H0+200)/140);
  for(let k=k0;k<=k1;k++)for(const side of [0,1]){const h=hash(k*2+side);const wy=k*140+h*80;const x=side?W0-BANK+10+h*20:BANK-10-h*20;const key=h<.6?'reeds':'rock';spr(c,key,x,sy(wy),key==='reeds'?1.7:.55+h*.3,0,1)}}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#3a8a9a';c.fillRect(0,0,CW,CH);c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  const g=c.createLinearGradient(0,0,0,H0);g.addColorStop(0,'#2e7a8e');g.addColorStop(1,'#4aa0a8');c.fillStyle=g;c.fillRect(0,0,W0,H0);
  // caustics drifting with the water
  const off=(G.cam%256+256)%256;c.globalAlpha=.9;for(let y=-256;y<H0+256;y+=256)for(let x=-256;x<W0+256;x+=256)c.drawImage(CAU,x+((G.t*8)%256),y+off);c.globalAlpha=1;
  for(const k of G.koi){c.save();c.globalAlpha=.45;spr(c,'koi',k.x,sy(k.y),1.1,(k.vx>0?-Math.PI/2:Math.PI/2)+Math.sin(k.ph)*.15,1);c.restore()}
  for(const r of G.ripples){const s=sy(r.y),k=r.t/1.2;c.strokeStyle=`rgba(230,255,255,${(1-k)*.7})`;c.lineWidth=3;c.beginPath();c.ellipse(r.x,s,(r.big?60:40)+k*90,((r.big?60:40)+k*90)*.6,0,0,7);c.stroke()}
  for(const p of G.pads){const s=sy(p.y);if(s<-150||s>H0+150)continue;const sc=(1-p.sink*.4)*(1+Math.sin(p.bob*Math.PI)*.04),a=1-p.sink;
    if(p.sinkT>0){c.save();c.translate(Math.sin(G.t*40)*2*(1-p.sinkT/1.5),0)}
    spr(c,p.type,p.x,s,sc*.92,p.rot,a);if(p.sinkT>0)c.restore()}
  banks(c);
  for(const fl of G.flies){if(fl.eaten)continue;const s=sy(fl.y);spr(c,'fly',fl.x+Math.sin(fl.t*2)*30,s+Math.sin(fl.t*7)*6,1.3,Math.sin(fl.t*9)*.2)}
  // aim guide
  const f=G.frog;
  if(G.aim&&!f.j&&!f.splash&&G.phase==='play'){const a=aimVec();if(a){const tx=f.x+a.x,ty=f.y+a.y;c.save();c.setLineDash([2,14]);c.lineCap='round';c.lineWidth=7;c.strokeStyle='rgba(255,255,255,.9)';c.beginPath();
    for(let k=0;k<=20;k++){const t=k/20;const x=f.x+a.x*t,yy=sy(f.y+a.y*t)-Math.sin(t*Math.PI)*Math.hypot(a.x,a.y)*.35;k?c.lineTo(x,yy):c.moveTo(x,yy)}c.stroke();c.setLineDash([]);
    const ok=!!padAt(tx,ty)&&tx>BANK&&tx<W0-BANK;c.strokeStyle=ok?'#ffe27a':'rgba(255,255,255,.7)';c.lineWidth=4;c.beginPath();c.ellipse(tx,sy(ty),26,16,0,0,7);c.stroke();c.restore()}}
  // frog
  if(f){let x=f.x,s=sy(f.y),sc=1,lift=0,key='frog_sit';
    if(f.j){const t=Math.min(1,f.j.t);lift=Math.sin(t*Math.PI)*Math.hypot(f.j.tx-f.j.sx,f.j.ty-f.j.sy)*.35;sc=1+Math.sin(t*Math.PI)*.3;key='frog_jump';
      c.fillStyle='rgba(20,60,70,.25)';c.beginPath();c.ellipse(x,s,30,18,0,0,7);c.fill()}
    if(f.splash){const k=1-f.splash/1.1;c.save();c.globalAlpha=Math.max(0,1-k*2.5);spr(c,'frog_jump',x,s+k*20,.9-k*.5,f.rot);c.restore()}
    else{const squash=G.aim&&!f.j?1-Math.min(1,(aimVec()?Math.hypot(aimVec().x,aimVec().y)/MAXJUMP:0))*.12:1;
      c.save();c.translate(x,s-lift);c.scale(1,squash);spr(c,key,0,0,sc*.95,f.rot);c.restore();
      if(f.tongue>0){c.strokeStyle='#ff7a8a';c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(x,s-lift-20);c.lineTo(x+Math.sin(f.rot)*50*f.tongue*4,s-lift-20-Math.cos(f.rot)*50*f.tongue*4);c.stroke()}}}
  for(const p of G.fx){c.globalAlpha=1-p.t/p.life;c.fillStyle=p.c;c.beginPath();c.arc(p.x,sy(p.wy),4.5,0,7);c.fill()}c.globalAlpha=1;
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.1){G.texts.splice(i,1);continue}if(x.t<0)continue;
    c.save();const sz=x.small?26:34;c.font=`${sz}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(90,Math.min(W0-90,x.x)),sy(x.wy)-x.t*34);c.globalAlpha=x.t>.8?(1.1-x.t)/.3:1;
    c.lineJoin='round';c.lineWidth=sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  c.restore();
}
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(G.phase!=='pause')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input: pull back and let go ---------- */
let pid=null;
function aimVec(){const a=G.aim;if(!a)return null;const dx=a.x0-a.x,dy=a.y0-a.y;const L=Math.hypot(dx,dy);if(L<18)return null;const p=Math.min(1,L/MAXPULL)*MAXJUMP;return {x:dx/L*p,y:-dy/L*p}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;pid=e.pointerId;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);const p=toFrame(e);G.aim={x0:p.x,y0:p.y,x:p.x,y:p.y,pl:0}},{passive:false});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid||!G.aim)return;const p=toFrame(e);G.aim.x=p.x;G.aim.y=p.y;const L=Math.min(MAXPULL,Math.hypot(p.x-G.aim.x0,p.y-G.aim.y0));if(L-G.aim.pl>60){G.aim.pl=L;sfx('pull',.25)}});
function up(e){if(e.pointerId!==pid)return;pid=null;const a=aimVec();G.aim=null;if(a&&G.phase==='play')jump(a.x,a.y)}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(e.pointerId!==pid)return;pid=null;G.aim=null});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;reset();G.phase='play';
  if(ac)Promise.resolve(decoding).then(()=>{duck(.36,.01);bgm(true);sfx('start',.6)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';G.aim=null;pid=null;$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';if(ac)ac.resume()}}
function toTitle(){bgm(false);G.phase='title';for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;reset();refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('kaeru-best',0);$('bestLine').textContent=b?`ベスト ${b}m`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({kaeru:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,start,jump,padAt,sy,toFrame:()=>({S,OX,OY})};
</script>
