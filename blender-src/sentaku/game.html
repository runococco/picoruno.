<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="pill n" id="lnP">1 / 5</div><div class="pill" id="scoreP">0 てん</div><button class="ib" id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" fill="#4a2c1d"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button></div>

  <div class="ov" id="titleOv">

      <button class="big" id="startBtn">せんたくものを ほす</button>

    <div class="card">
      <div class="logo" id="resHead">きょうの せんたく</div>
      <div class="res-big" id="resScore">0 てん</div>
      <div class="res-row"><div>ほした かず<b id="rItems">0</b></div><div>ぴったり<b id="rFit">0</b></div><div>うまり ぐあい<b id="rFill">0%</b></div></div>
      <div class="res-rank" id="resRank"></div>

      <p class="back"><a href="https://picoruno.com/">← picoruno. のゲーム一覧へ</a></p>
    </div>
  </div>
</div>
<script>
/*ART*/const ART={},LAYER={},SCENE={line:[[32,285],[688,285]],ground:1102,items:{towel:1.5,hand:.95,sock:.62,shirt:1.3,hanky:.68,shorts:1.1,pillow:1.2}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,PXI=124,L0=64,L1=656,LINES=5,HY=168,TOL=14,FIT=12;
const [[LXA,LY],[LXB]]=SCENE.line,KINDS=Object.keys(SCENE.items),WID={};for(const k of KINDS)WID[k]=SCENE.items[k]*PXI;
const MINW=Math.min(...Object.values(WID));

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('sentaku-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('sentaku-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],hung:[],falling:[],cur:null};
function fresh(){return {phase:'play',t:0,score:0,ln:0,lives:3,hung:[],falling:[],cur:null,state:'move',stT:0,v:220,texts:[],say:'',sayT:0,endT:0,itemN:0,fitN:0,fills:[],last:''}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('lnP').textContent=Math.min(G.ln+1,LINES)+' / '+LINES;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}
function lineY(x){return LY+20*Math.sin(Math.PI*Math.max(0,Math.min(1,(x-LXA)/(LXB-LXA))))}
function gaps(){const xs=G.hung.slice().sort((a,b)=>a.x0-b.x0);const g=[];let p=L0;for(const h of xs){if(h.x0-p>0)g.push([p,h.x0]);p=Math.max(p,h.x1)}if(L1-p>0)g.push([p,L1]);return g}
function maxGap(){let m=0;for(const [a,b] of gaps())m=Math.max(m,b-a);return m}
function filled(){let f=0;for(const h of G.hung)f+=h.x1-h.x0;return Math.min(1,f/(L1-L0))}
function nextItem(){const mg=maxGap();const ok=KINDS.filter(k=>WID[k]<=mg-2);if(!ok.length)return false;
  let pick=ok.filter(k=>k!==G.last);if(!pick.length)pick=ok;const k=pick[Math.floor(Math.random()*pick.length)];G.last=k;const w=WID[k];
  G.cur={k,w,x:L0+w/2+Math.random()*(L1-L0-w),dir:Math.random()<.5?1:-1,y:HY,sway:0};G.state='move';G.stT=0;sfx('next',.4);return true}
function newLine(){G.hung=[];G.v=230+G.ln*45;G.state='move';nextItem();hud()}

/* ---------- drop ---------- */
function drop(){if(G.phase!=='play'||G.state!=='move'||!G.cur)return false;const c=G.cur,x0=c.x-c.w/2,x1=c.x+c.w/2;
  let bad=false;for(const h of G.hung){const ov=Math.min(x1,h.x1)-Math.max(x0,h.x0);if(ov>TOL)bad=true}
  if(bad){G.falling.push({k:c.k,w:c.w,x:c.x,y:c.y,vy:0,r:0,vr:rnd(-1.5,1.5),t:0});G.cur=null;G.lives--;sfx('miss',.5);sfx('drop',.6);text('かさなって おちちゃった',360,HY+150,'#ffd0c0',true);say('あっ');G.state='wait';G.stT=0;hud();return true}
  // snap a tiny overlap flush against the neighbour
  let nx0=x0,nx1=x1;for(const h of G.hung){if(nx1>h.x0&&nx0<h.x0)nx1=h.x0,nx0=nx1-c.w;else if(nx0<h.x1&&nx1>h.x1)nx0=h.x1,nx1=nx0+c.w}
  nx0=Math.max(L0,nx0);nx1=nx0+c.w;if(nx1>L1){nx1=L1;nx0=nx1-c.w}
  let gl=nx0-L0,gr=L1-nx1;for(const h of G.hung){if(h.x1<=nx0+.5)gl=Math.min(gl,nx0-h.x1);if(h.x0>=nx1-.5)gr=Math.min(gr,h.x0-nx1)}
  const fitL=gl<=FIT,fitR=gr<=FIT;let pts=10,msg='';if(fitL&&fitR){pts+=120;msg='すっぽり！';G.fitN+=2}else if(fitL||fitR){pts+=50;msg='ぴったり';G.fitN++}
  G.hung.push({k:c.k,w:c.w,x0:nx0,x1:nx1,t:0,from:c.y});G.cur=null;G.itemN++;G.score+=pts;sfx('flap',.6);sfx('pin',.6);if(msg){sfx('fit',.45,fitL&&fitR?1.5:1);text(msg+' +'+pts,(nx0+nx1)/2,LY+150,fitL&&fitR?'#ffe27a':'#fff',true)}
  G.state='wait';G.stT=0;hud();return true}
function lineDone(){const f=filled(),pts=Math.round(f*500);G.fills.push(f);G.score+=pts;G.state='full';G.stT=0;sfx('levelup',.6);
  say(f>=.95?'まっしろ いっぱい':f>=.85?'いい かんじ':'ほせた');text(`${G.ln+1}ほんめ ${Math.round(f*100)}% +${pts}`,360,560,'#ffe27a');hud()}

/* ---------- flow ---------- */
function step(dt){
  G.t+=dt;G.stT+=dt;G.sayT=Math.max(0,G.sayT-dt);for(const h of G.hung)h.t+=dt;
  for(let i=G.falling.length-1;i>=0;i--){const f=G.falling[i];f.t+=dt;f.vy+=1400*dt;f.y=Math.min(SCENE.ground-150,f.y+f.vy*dt);f.r+=f.vr*dt*(f.y<SCENE.ground-150?1:0);if(f.t>2.2)G.falling.splice(i,1)}
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  const c=G.cur;
  if(G.state==='move'&&c){const lo=L0+c.w/2,hi=L1-c.w/2;c.x+=c.dir*G.v*dt;if(c.x>hi){c.x=hi;c.dir=-1}if(c.x<lo){c.x=lo;c.dir=1}c.sway+=dt}
  else if(G.state==='wait'){if(G.stT>.32){if(G.lives<=0){finish();return}if(!nextItem())lineDone()}}
  else if(G.state==='full'){if(G.stT>2.2){G.ln++;if(G.ln>=LINES)finish();else{newLine();text((G.ln+1)+'ほんめの ものほし',360,620,'#fff')}}}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function avgFill(){return G.fills.length?G.fills.reduce((a,b)=>a+b,0)/G.fills.length:0}
function rank(n){return n>=3600?'せんたく めいじん':n>=3200?'ぴったり マイスター':n>=2500?'ものほし じょうず':n>=1500?'おてつだい ねこ':'はじめての せんたく'}
function showResult(){const n=G.score,best=LS.get('sentaku-best',0),nb=n>best;if(nb){LS.set('sentaku-best',n);if(n>0)sfx('best',.6)}
  $('resHead').textContent=G.lives>0?'5ほん ぜんぶ ほせた！':'きょうの せんたく';
  $('resScore').textContent=n+' てん';$('rItems').textContent=G.itemN;$('rFit').textContent=G.fitN;$('rFill').textContent=Math.round(avgFill()*100)+'%';$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(avgFill()>=.93?'すきまなし。おひさまも にっこり！':'はしから じゅんばんに つめていくと すきまが できにくいよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの せんたくびより👕 ${n}てん（うまり ぐあい ${Math.round(avgFill()*100)}%）「${rank(n)}」\n#ねこのせんたくびより #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/sentaku.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function item(c,k,x,top,rot,a){const im=IMG[k],s=256*PXI/128;c.save();c.translate(x,top);if(rot)c.rotate(rot);if(a!=null)c.globalAlpha=a;if(im)c.drawImage(im,-s/2,-13*s/256,s,s);else{c.fillStyle='#f2a0a8';c.fillRect(-WID[k]/2,0,WID[k],WID[k]*.9)}c.restore()}
function pin(c,x,y){c.fillStyle='#e8c890';c.strokeStyle='#4a2c1d';c.lineWidth=2.5;c.beginPath();c.roundRect(x-5,y-12,10,26,3);c.fill();c.stroke()}
