/* Kotatsu evening: quilt red, mikan orange, paper cream, dark-brown outlined flat UI. */

  background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;letter-spacing:.04em;text-decoration:none;box-sizing:border-box;text-shadow:0 1.5px 0 var(--ink)}

  <div class="hud"><div class="sc" id="score">0てん</div><div class="sc" id="count">1 / 6</div><button class="ib" id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" fill="#4a2c1d"><rect x="6" y="5" width="4.2" height="14" rx="1.5"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.5"/></svg></button></div>

<script>
/*ART*/const ART={},SPR={};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280;
const M={x:360,y:610};                 // where the fruit sits
const PLATE={x:555,y:975},DISH={x:150,y:985},BASKET={x:565,y:210},CAT={x:120,y:1150};
const LEVELS=[
  {kind:'mikan',r:185,turns:3,tol:40},
  {kind:'mikan',r:195,turns:3.5,tol:37},
  {kind:'mikan',r:180,turns:4,tol:34},
  {kind:'mikan',r:205,turns:4.5,tol:32},
  {kind:'mikan',r:195,turns:5,tol:30},
  {kind:'yuzu',r:215,turns:4.5,tol:31,wob:9},
];
const VMAX=560;        // peel speed (scene px/s) the skin can take

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>IMG[k]=i)))}
// draw a sprite whose world origin sits at (x,y), u = scene px per Blender unit
function spr(c,k,x,y,u,alpha=1,rot=0){const im=IMG[k],m=SPR[k];if(!im||!m)return;c.save();c.globalAlpha=alpha;c.translate(x,y);if(rot)c.rotate(rot);c.drawImage(im,-m.ax*m.w*u,-m.ay*m.h*u,m.w*u,m.h*u);c.restore()}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,musicGain=null,bgmSrc=null;const BUF={};
let muted=LS.get('mikan-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
let decoding=null;
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);musicGain=ac.createGain();musicGain.gain.value=.5;musicGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=rate;const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}if(!on||!ac)return;const go=()=>{if(!BUF.bgm||bgmSrc)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(musicGain);bgmSrc.start()};if(BUF.bgm)go();else if(decoding)decoding.then(()=>{if(G.phase!=='title')go()})}
function setMute(m){muted=m;LS.set('mikan-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- canvas ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.max(CW/W0,CH/H0);OX=(CW-W0*S)/2;OY=(CH-H0*S)/2;if(G.lv)buildSkin(true)}

/* ---------- state ---------- */
const G={phase:'title',idx:0,lv:null,score:0,results:[],plate:[],dish:[],texts:[],crumbs:[],t:0,catT:0,catSay:0};
const F={};   // the fruit being peeled
function spiral(L){
  // sample the peel path: from the calyx outwards, clockwise on screen
  const N=1600,pts=[],len=[0];const r0=16,r1=L.r*.97,th0=-Math.PI/2;
  for(let i=0;i<=N;i++){const s=i/N;const th=th0+s*L.turns*Math.PI*2;let r=r0+(r1-r0)*Math.pow(s,.92);if(L.wob)r+=Math.sin(th*5)*L.wob*Math.min(1,s*4);
    pts.push([Math.cos(th)*r,Math.sin(th)*r]);if(i)len.push(len[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}
  return {pts,len,N,pitch:(r1-r0)/L.turns}}
function startFruit(i){
  const L=LEVELS[i];G.idx=i;G.lv=L;const sp=spiral(L);
  Object.assign(F,{L,sp,i:0,lastTick:0,strain:0,speed:0,down:false,state:'enter',t:0,torn:false,rope:[],ropeLen:0,maxI:0,peelT:0,began:false,hint:i===0});
  buildSkin(false);$('count').textContent=(i+1)+' / '+LEVELS.length;sfx('next',.5);
}
let skinC=null,skinQ=1;
function buildSkin(keep){
  // the skin lives in its own canvas so the peeled band can be cut out of it
  const L=G.lv;if(!L)return;const q=Math.min(2.2,Math.max(1,S*DPR));const sz=Math.ceil((L.r*2+30)*q);
  const old=skinC;skinC=document.createElement('canvas');skinC.width=skinC.height=sz;skinQ=q;const c=skinC.getContext('2d');
  c.setTransform(q,0,0,q,sz/2,sz/2);spr(c,L.kind+'_skin',0,0,L.r);
  if(keep&&F.i>0)cutSkin(0,F.i)}
function cutSkin(a,b){
  const c=skinC.getContext('2d'),P=F.sp.pts,w=F.sp.pitch*1.12;c.setTransform(skinQ,0,0,skinQ,skinC.width/2,skinC.height/2);
  c.lineCap='round';c.lineJoin='round';
  const path=()=>{c.beginPath();c.moveTo(P[a][0],P[a][1]);for(let k=a+1;k<=b;k++)c.lineTo(P[k][0],P[k][1])};
  c.globalCompositeOperation='source-atop';c.strokeStyle='#fbeed6';c.lineWidth=w+9;path();c.stroke();   // white pith at the cut edge
  c.globalCompositeOperation='destination-out';c.lineWidth=w;path();c.stroke();if(a===0){c.beginPath();c.arc(0,0,w*.7,0,7);c.fill()}
  c.globalCompositeOperation='source-over'}
function start(){
  unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;
  Object.assign(G,{phase:'play',score:0,results:[],plate:[],dish:[],texts:[],crumbs:[]});updHud();
  startFruit(0);bgm(true);sfx('start',.6);pingPlay();
}
function updHud(){$('score').textContent=G.score+'てん'}

/* ---------- peeling ---------- */
function toScene(e){const r=cv.getBoundingClientRect();return {x:((e.clientX-r.left)-OX)/S-M.x,y:((e.clientY-r.top)-OY)/S-M.y}}
function endPt(){return F.sp.pts[F.i]}
function grab(p){
  if(G.phase!=='play'||F.state!=='peel')return false;const e=endPt();
  if(Math.hypot(p.x-e[0],p.y-e[1])>F.L.tol*1.7+(F.i===0?20:0))return false;
  F.down=true;F.began=true;F.hint=false;F.last=p;F.lastT=performance.now();return true}
function drag(p,dt){
  if(!F.down)return;const P=F.sp.pts,L=F.L;
  // look a short way ahead along the path for the furthest point the finger is still on
  let best=-1,bd=1e9;const hi=Math.min(F.sp.N,F.i+70);
  for(let k=Math.max(0,F.i-8);k<=hi;k++){const d=Math.hypot(p.x-P[k][0],p.y-P[k][1]);if(d<bd)bd=d;if(d<=L.tol&&k>best)best=k}
  F.off=bd;
  if(best>F.i){const a=F.i;F.i=best;cutSkin(a,F.i);const adv=F.sp.len[F.i]-F.sp.len[a];F.adv=(F.adv||0)+adv;
    if(F.sp.len[F.i]-F.lastTick>38){F.lastTick=F.sp.len[F.i];sfx('tick',.25,.85+Math.random()*.3+F.i/F.sp.N*.25)}
    if(F.i>=F.sp.N){finishFruit(true);return}}
  if(bd>L.tol*3.2){tearFruit('はずれた！');return}
}
function release(){if(!F.down)return;F.down=false}
function tearFruit(why){
  if(F.state!=='peel')return;F.down=false;F.torn=true;sfx('tear',.9);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  text(why||'ちぎれた！','#fffaf2');finishFruit(false)}
function finishFruit(full){
  F.state='done';F.t=0;F.down=false;
  const pct=F.sp.len[F.i]/F.sp.len[F.sp.N];const peelCm=F.sp.len[F.i]/(F.L.r*2/6.2);   // a mikan is ~6 cm across
  let pts=Math.round(pct*100),bonus=0;
  if(full){const ideal=F.sp.len[F.sp.N]/430;bonus=Math.max(0,Math.round(40*(1-(F.peelT-ideal)/9)));pts+=50+bonus;text('ひとかわ！','#f2c14e',1);sfx('hitokawa',.9);sfx('perfect',.45);G.catSay=2.2;confetti()}
  else text(Math.round(pct*100)+'%','#fffaf2');
  G.score+=pts;updHud();
  G.results.push({kind:F.L.kind,full,pct,cm:peelCm,rope:F.rope.map(n=>[n.x,n.y]),pitch:F.sp.pitch,bonus});
}
function text(s,c,big){G.texts.push({s,c,t:0,big:!!big})}
function confetti(){for(let i=0;i<26;i++){const a=Math.random()*6.28,v=200+Math.random()*260;G.crumbs.push({x:M.x,y:M.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,t:0,c:['#f39a22','#f2c14e','#fffaf2','#8bbf5a'][i%4],r:4+Math.random()*4})}}

/* ---------- the hanging peel (a rope that grows from the cut end) ---------- */
const SEG=11;
function ropeUpdate(dt){
  if(F.state==='peel'||F.state==='done'){
    const e=endPt();
    // grow: add nodes while the peeled length exceeds the rope length
    const want=F.sp.len[F.i];while(F.ropeLen+SEG<=want){F.ropeLen+=SEG;const k=lenIndex(F.ropeLen);const q=F.sp.pts[k];F.rope.push({x:q[0],y:q[1],px:q[0],py:q[1],age:0})}
    const R=F.rope,n=R.length;if(!n)return;
    for(let i=0;i<n;i++){const p=R[i];p.age+=dt;if(i===n-1&&F.state==='peel')continue;
      let vx=(p.x-p.px)*.8,vy=(p.y-p.py)*.8;p.px=p.x;p.py=p.y;
      // older parts slide off the fruit and droop towards the table edge
      const d=Math.hypot(p.x,p.y);const R0=F.L.r+F.sp.pitch*.4;
      if(p.age>.12&&d<R0){vx+=p.x/(d||1)*dt*230;vy+=p.y/(d||1)*dt*230}
      else if(d>=R0){vx=vx*.7+dt*dt*(-120+((i*37)%7-3)*40);vy=vy*.7+dt*dt*260}   // on the table it slumps a little towards you, then rests
      p.x+=vx;p.y+=vy}
    if(F.state==='peel'){R[n-1].x=e[0];R[n-1].y=e[1]}
    for(let it=0;it<4;it++)for(let i=n-1;i>0;i--){const a=R[i],b=R[i-1];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,k=(d-SEG)/d;
      if(i===n-1&&F.state==='peel'){b.x-=dx*k;b.y-=dy*k}else{a.x+=dx*k*.5;a.y+=dy*k*.5;b.x-=dx*k*.5;b.y-=dy*k*.5}}
    // keep the peel on the table
    for(const p of R){p.x=Math.max(-340,Math.min(340,p.x));p.y=Math.max(-560,Math.min(440,p.y))}
  }
}
function lenIndex(l){const A=F.sp.len;let lo=0,hi=A.length-1;while(lo<hi){const m=(lo+hi)>>1;if(A[m]<l)lo=m+1;else hi=m}return lo}
function drawRope(c,pts,w,ox,oy,sc,alpha=1,kind='mikan'){
  // the peel is the Blender-rendered strip, sliced and laid along the peel path
  if(pts.length<2)return;const X=p=>p[0]??p.x,Y=p=>p[1]??p.y;
  const P=[];for(let i=0;i<pts.length;i++){if(i>0&&i<pts.length-1){P.push([(X(pts[i-1])+2*X(pts[i])+X(pts[i+1]))/4,(Y(pts[i-1])+2*Y(pts[i])+Y(pts[i+1]))/4])}else P.push([X(pts[i]),Y(pts[i])])}
  c.save();c.globalAlpha=alpha;c.translate(ox,oy);c.scale(sc,sc);c.lineCap='round';c.lineJoin='round';
  const path=(dx=0,dy=0)=>{c.beginPath();c.moveTo(P[0][0]+dx,P[0][1]+dy);for(let i=1;i<P.length;i++)c.lineTo(P[i][0]+dx,P[i][1]+dy)};
  c.strokeStyle='rgba(70,35,10,.13)';c.lineWidth=w*1.15;path(2,4);c.stroke();
  c.strokeStyle='rgba(70,35,10,.18)';c.lineWidth=w*.95;path(1,2);c.stroke();
  c.strokeStyle=kind==='yuzu'?'#fbf3d6':'#fbecd2';c.lineWidth=w*.98;path();c.stroke();            // white pith where the strip twists
  c.strokeStyle=kind==='yuzu'?'#e3b62a':'#ee9425';c.lineWidth=w*.62;path();c.stroke();             // fills the joints between slices
  const im=IMG[kind+'_strip'];
  if(im){const th=w*1.44,k=im.height/th;let u=(pts.length*37)%im.width;
    for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<.5)continue;
      let sw=L*k;if(u+sw>im.width)u=0;
      c.save();c.translate(a[0],a[1]);c.rotate(Math.atan2(dy,dx));c.drawImage(im,u,0,Math.min(sw+2,im.width-u),im.height,-.6,-th/2,L+1.2,th);c.restore();u+=sw}}
  c.restore()}

/* ---------- update / draw ---------- */
function update(dt){
  if(G.phase==='pause')return;G.t+=dt;G.catT+=dt;if(G.catSay>0)G.catSay-=dt;
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.3)G.texts.splice(i,1)}
  for(let i=G.crumbs.length-1;i>=0;i--){const p=G.crumbs[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.vx*=.98;if(p.t>1.2)G.crumbs.splice(i,1)}
  if(G.phase!=='play'||!G.lv)return;
  F.t+=dt;
  if(F.state==='enter'&&F.t>.6){F.state='peel';F.t=0}
  if(F.state==='peel'){
    if(F.down&&F.began)F.peelT+=dt;
    // strain: how far off the line and how fast the peel is pulled
    const sp=F.adv?F.adv/Math.max(dt,1e-3):0;F.adv=0;F.speed+=(sp-F.speed)*Math.min(1,dt*8);
    const off=F.down?Math.max(0,(F.off||0)-F.L.tol*.6)/(F.L.tol*1.4):0;const fast=Math.max(0,(F.speed-VMAX)/VMAX);
    const tgt=F.down?off*1.6+fast*2.2:0;F.strain=Math.max(0,F.strain+(tgt-.55)*dt*1.7);
    if(F.strain>=1)tearFruit(fast>off?'いそぎすぎ！':'ちぎれた！');
  }
  ropeUpdate(dt);
  if(F.state==='done'&&F.t>1.5){
    const r=G.results[G.results.length-1];G.plate.push({kind:F.L.kind});G.dish.push(r);sfx('plate',.5);
    if(G.idx+1<LEVELS.length)startFruit(G.idx+1);else finishGame()}
}
function draw(){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#a83c36';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  // dish of peels and plate of fruit
  G.dish.forEach((r,i)=>{if(r.rope.length>1)drawRope(c,r.rope,r.pitch*.8,DISH.x+((i%3)-1)*14,DISH.y+(Math.floor(i/3)-.5)*14,.22,1,r.kind)});
  G.plate.forEach((p,i)=>{const a=i*2.1,rr=i?38:0;spr(c,p.kind+'_fruit',PLATE.x+Math.cos(a)*rr,PLATE.y+Math.sin(a)*rr*.8,40)});
  // cat
  const br=1+Math.sin(G.catT*1.6)*.015;c.save();c.translate(CAT.x,CAT.y);c.scale(br,br);spr(c,'cat',0,0,80);c.restore();
  if(G.catSay>0){bubble(c,CAT.x+70,CAT.y-95,'にゃ')}
  else{c.save();c.globalAlpha=.7;c.fillStyle='#fffaf2';c.font='26px "Dela Gothic One",sans-serif';const k=(G.catT%3)/3;c.fillText('z',CAT.x+60+k*16,CAT.y-60-k*30);c.font='18px "Dela Gothic One",sans-serif';c.fillText('z',CAT.x+82+k*12,CAT.y-84-k*24);c.restore()}
  if(G.lv&&(G.phase==='play'||G.phase==='pause'||G.phase==='result'))drawFruit(c);
  else if(G.phase==='title'&&IMG.mikan_skin){spr(c,'mikan_skin',M.x,M.y,190)}
  for(const p of G.crumbs){c.globalAlpha=Math.max(0,1-p.t/1.2);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}c.globalAlpha=1;
  for(const x of G.texts){const a=x.t>1?(1.3-x.t)/.3:1;const s=x.t<.12?.5+x.t*4.2:1;c.save();c.globalAlpha=a;c.translate(M.x,M.y-260-x.t*30);c.scale(s,s);c.textAlign='center';c.lineJoin='round';
    c.font=(x.big?62:40)+'px "Dela Gothic One",sans-serif';c.lineWidth=12;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  c.restore();
}
function bubble(c,x,y,s){c.save();c.font='24px "Dela Gothic One",sans-serif';const w=c.measureText(s).width+26;c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=3;
  c.beginPath();c.roundRect?c.roundRect(x-w/2,y-22,w,40,14):c.rect(x-w/2,y-22,w,40);c.fill();c.stroke();c.fillStyle='#4a2c1d';c.textAlign='center';c.fillText(s,x,y+8);c.restore()}
function drawFruit(c){
  const L=F.L;let cx=M.x,cy=M.y,sc=1,al=1;
  if(F.state==='enter'){const k=Math.min(1,F.t/.6),e=1-Math.pow(1-k,3);cx=BASKET.x+(M.x-BASKET.x)*e;cy=BASKET.y+(M.y-BASKET.y)*e-Math.sin(k*Math.PI)*60;sc=.25+.75*e}
  if(F.state==='done'&&F.t>.9){const k=Math.min(1,(F.t-.9)/.6),e=k*k;cx=M.x+(PLATE.x-M.x)*e;cy=M.y+(PLATE.y-M.y)*e;sc=1-.8*e}
  // shadow
  c.save();c.fillStyle='rgba(70,30,10,.22)';c.beginPath();c.ellipse(cx+14*sc,cy+22*sc,L.r*sc*.98,L.r*sc*.92,0,0,7);c.fill();c.restore();
  spr(c,L.kind+'_fruit',cx,cy,L.r*sc);
  if(skinC&&!(F.state==='done'&&F.torn&&F.t>.3)){const z=skinC.width/skinQ*sc;c.drawImage(skinC,cx-z/2,cy-z/2,z,z)}
  if(F.state==='done'&&F.torn&&F.t<=.3){}
  // the rest of a torn skin pops off in one go
  if(F.state==='done'&&F.torn&&F.t>.3&&F.t<.9){const k=(F.t-.3)/.6;c.save();c.globalAlpha=1-k;const z=skinC.width/skinQ*(1+k*.15);c.drawImage(skinC,cx-z/2,cy-z/2-k*40,z,z);c.restore()}
  // peel rope
  if(F.rope.length>1){const fade=F.state==='done'&&F.t>.9?Math.max(0,1-(F.t-.9)/.5):1;
    const pts=F.rope.map(n=>[n.x,n.y]);if(F.state==='peel'&&F.i>0)pts.push(endPt());drawRope(c,pts,F.sp.pitch*.8,cx,cy,sc,fade,F.L.kind)}
  if(F.state!=='peel')return;
  // guide: the path still to peel, brighter just ahead of the cut
  const P=F.sp.pts;c.save();c.translate(cx,cy);c.lineCap='round';
  c.setLineDash([2,14]);c.lineWidth=5;c.strokeStyle='rgba(255,250,240,.55)';c.beginPath();c.moveTo(P[F.i][0],P[F.i][1]);for(let k=F.i;k<=F.sp.N;k+=4)c.lineTo(P[k][0],P[k][1]);c.stroke();
  c.setLineDash([]);c.lineWidth=7;c.strokeStyle='rgba(255,255,255,.9)';c.beginPath();c.moveTo(P[F.i][0],P[F.i][1]);const ahead=Math.min(F.sp.N,F.i+110);for(let k=F.i;k<=ahead;k+=3)c.lineTo(P[k][0],P[k][1]);c.stroke();
  // grip point: colour shows the strain on the peel
  const e=endPt();const st=Math.min(1,F.strain);const col=st<.35?'#8bd07a':st<.7?'#f2c14e':'#e2553a';
  const pul=F.down?1:1+Math.sin(G.t*6)*.12;const jit=st>.6?(Math.random()-.5)*6*st:0;
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(e[0]+jit,e[1],L.tol*.9*pul,0,7);c.fill();
  c.lineWidth=5;c.strokeStyle=col;c.beginPath();c.arc(e[0]+jit,e[1],L.tol*.9*pul,-Math.PI/2,-Math.PI/2+6.283*Math.max(.02,1-st));c.stroke();
  c.lineWidth=3;c.strokeStyle='#4a2c1d';c.beginPath();c.arc(e[0]+jit,e[1],L.tol*.9*pul+4,0,7);c.stroke();
  if(F.hint){const k=(G.t%1.8)/1.8;const j=Math.min(F.sp.N,Math.floor(k*180));const h=P[j];c.globalAlpha=1-k;finger(c,h[0],h[1]);c.globalAlpha=1}
  c.restore();
}
function finger(c,x,y){c.save();c.translate(x+8,y+8);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.ellipse(10,22,15,19,-.3,0,7);c.fill();c.stroke();c.beginPath();c.ellipse(0,0,7,15,-.3,0,7);c.fill();c.stroke();c.restore()}

/* ---------- finish ---------- */
function finishGame(){
  G.phase='result';bgm(false);sfx('finish',.9);
  const full=G.results.filter(r=>r.full).length;const cm=G.results.reduce((s,r)=>s+r.cm,0);const longest=G.results.reduce((a,r)=>r.cm>a.cm?r:a,G.results[0]);
  const best=LS.get('mikan-best',0);const nb=G.score>best;if(nb)LS.set('mikan-best',G.score);
  G.full=full;G.cm=cm;
  $('resBig').innerHTML=G.score+'<small>てん</small>';$('resRank').textContent=rank(full);
  $('resNote').innerHTML=`ひとかわ ${full} / ${LEVELS.length}　むいた皮 ぜんぶで ${Math.round(cm)}cm<br>いちばん長い皮 ${Math.round(longest.cm)}cm${nb?'　<span style="color:#d9534a">じこベスト！</span>':''}`;
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`こたつで みかんむき🍊 ひとかわ ${full}/${LEVELS.length}、皮ぜんぶで ${Math.round(cm)}cm「${rank(full)}」\n#つるっとみかんむき #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/mikan.html');
  G.longest=longest;
  setTimeout(()=>{$('resImg').src=peelImage(longest,420).toDataURL('image/png');$('resultOv').hidden=false},700);
}
function rank(f){if(f>=6)return'こたつの みかん名人';if(f>=4)return'つるっと むき職人';if(f>=2)return'みかん だいすき';if(f>=1)return'ひとかわ デビュー';return'すじまで 食べる派'}
function peelImage(r,size){
  const k=document.createElement('canvas');k.width=k.height=size;const c=k.getContext('2d');
  c.fillStyle='#d39c66';c.fillRect(0,0,size,size);if(IMG.bg){c.drawImage(IMG.bg,-200,-300,size*2.2,size*2.2*H0/W0)}
  if(!r||r.rope.length<2)return k;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of r.rope){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])}
  const sc=Math.min(1.2,(size*.82)/Math.max(x1-x0+r.pitch,y1-y0+r.pitch));
  spr(c,r.kind+'_fruit',size*.78,size*.8,size*.13);
  drawRope(c,r.rope,r.pitch*.8,size/2-(x0+x1)/2*sc,size/2-(y0+y1)/2*sc,sc,1,r.kind);return k}
function shareImage(){
  const k=document.createElement('canvas');k.width=1200;k.height=630;const c=k.getContext('2d');
  if(IMG.bg)c.drawImage(IMG.bg,0,-560,1200,1200*H0/W0);c.fillStyle='rgba(60,24,16,.3)';c.fillRect(0,0,1200,630);
  c.drawImage(peelImage(G.longest,520),640,55,520,520);
  c.lineJoin='round';const T=(s,x,y,f,col,lw=10)=>{c.font=f;c.lineWidth=lw;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y)};
  T('つるっと！',60,120,'64px "Dela Gothic One",sans-serif','#fffaf2');T('みかんむき',60,200,'72px "Dela Gothic One",sans-serif','#f39a22');
  T(`ひとかわ ${G.full}/${LEVELS.length}`,60,340,'84px "Dela Gothic One",sans-serif','#fffaf2',12);
  T(rank(G.full),66,430,'700 40px "Zen Maru Gothic",sans-serif','#f2c14e',8);
  T(`皮ぜんぶで ${Math.round(G.cm)}cm　スコア ${G.score}`,66,500,'700 30px "Zen Maru Gothic",sans-serif','#fffaf2',7);
  T('picoruno.com',66,575,'700 26px "Zen Maru Gothic",sans-serif','#fffaf2',6);return k}

/* ---------- input & loop ---------- */
let ptr=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;if(grab(toScene(e))){ptr=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}}},{passive:false});
cv.addEventListener('pointermove',e=>{if(ptr!==e.pointerId)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const q of (evs.length?evs:[e])){drag(toScene(q));if(!F.down)break}});
function up(e){if(ptr!==e.pointerId)return;ptr=null;release()}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
function pause(on){if(on){if(G.phase!=='play')return;release();ptr=null;G.phase='pause';$('pauseOv').hidden=false;if(ac)ac.suspend()}
  else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';if(ac)ac.resume()}}
function toTitle(){bgm(false);G.phase='title';G.lv=null;for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('mikan-best',0);$('bestLine').textContent=b?`ベストスコア ${b}`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
$('saveBtn').onclick=async()=>{const k=shareImage();const blob=await new Promise(r=>k.toBlob(r,'image/png'));const file=new File([blob],'mikan.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mikan.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({mikan:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();loadArt();requestAnimationFrame(loop);
window.__T={G,F,grab,drag,release,start,M,LEVELS};
