<div id="app">

      <div class="res-row"><div>ぴったり ひだ<b id="rPerf">0</b></div><div>ちょうど あん<b id="rFill">0</b></div><div>かんぺき<b id="rFull">0</b></div></div>
      <div class="res-rank" id="resRank"></div>

    </div>

<script>
/*ART*/const ART={},LAYER={},SCENE={board:[360,608,576,480],bowl:[176,184],stack:[560,184],tray:[360,1080,656,224]};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,N=8,TICKS=6,[CX,CY]=SCENE.board,K=1.6,U=116*K,RX=.9*U,RY=.72*U,FLO=.68,FHI=.88;
const TICKA=[];for(let i=0;i<TICKS;i++)TICKA.push(150-i*120/(TICKS-1));

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('gyoza-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('gyoza-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],done:[],pleats:[]};
function fresh(){return {phase:'play',t:0,score:0,n:0,state:'ready',stT:0,f:0,ang:170,w:60,pleats:[],done:[],over:false,texts:[],say:'',sayT:0,endT:0,perfN:0,fillN:0,fullN:0,cur:0,ptsNow:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('nP').textContent=Math.min(G.n+1,N)+' / '+N;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.3}
function win(){return G.over?3:6}
function newOne(){G.state='ready';G.stT=0;G.f=0;G.pleats=[];G.over=false;G.ang=172;G.w=58+G.n*8;G.cur=0;hud()}

/* ---------- actions ---------- */
function scoopStart(){if(G.phase!=='play'||G.state!=='ready')return;G.state='scoop';G.stT=0;sfx('scoop',.5)}
function scoopEnd(){if(G.state!=='scoop')return;const f=G.f;let p,m;
  if(f>=FLO&&f<=FHI){p=30;m='ちょうど';G.fillN++;sfx('nice',.5)}else if(f>1){p=5;m='はみだし！';G.over=true;sfx('miss',.4)}else if(f>FHI){p=15;m='たっぷり'}else if(f>=.45){p=15;m='すこし すくなめ'}else{p=5;m='ぺったんこ'}
  G.cur=p;G.score+=p;text(m+' +'+p,CX,CY-RY-60,p>=30?'#ffe27a':'#fff',true);G.state='fold';G.stT=0;sfx('fold',.6);hud()}
function pleat(){if(G.phase!=='play'||G.state!=='pleat')return false;
  let best=-1,bd=1e9;for(let i=0;i<TICKS;i++){if(G.pleats.some(p=>p.i===i))continue;const d=Math.abs(TICKA[i]-G.ang);if(d<bd){bd=d;best=i}}
  const w=win();if(best>=0&&bd<=w){const perf=bd<=w*.4,p=perf?20:10;G.pleats.push({i:best,a:G.ang,perf});G.cur+=p;G.score+=p;if(perf)G.perfN++;
    sfx('pleat',.7,1+G.pleats.length*.08);if(perf)sfx('nice',.35,1.5);const [x,y]=edge(G.ang);text(perf?'ぴったり':'トン',x,y-50,perf?'#ffe27a':'#fff',true)}
  else{G.cur=Math.max(0,G.cur-5);G.score=Math.max(0,G.score-5);sfx('miss',.4);const [x,y]=edge(G.ang);text('ずれた',x,y-50,'#ffd0c0',true)}
  hud();return true}
function finishOne(){const all=G.pleats.length===TICKS,allP=all&&G.pleats.every(p=>p.perf);let bonus=0;
  if(allP&&!G.over&&G.cur>=30+TICKS*20){bonus=60;G.fullN++;say('かんぺき！');sfx('levelup',.5)}else if(all){bonus=20;say(['きれい','いいひだ','おいしそう'][G.n%3])}
  G.score+=bonus;if(bonus)text((allP?'かんぺき +':'ひだ ぜんぶ +')+bonus,CX,CY+RY+10,'#ffe27a');
  G.done.push({pleats:G.pleats.slice(),over:G.over,f:G.f});G.state='slide';G.stT=0;sfx('slide',.5);hud()}
function fry(){G.state='fry';G.stT=0;sfx('fry',.7);sfx('fry',.5,.75);say('ジュ〜')}

/* ---------- flow ---------- */
function edge(a){const r=a*Math.PI/180;return [CX+Math.cos(r)*RX,CY-Math.sin(r)*RY]}
function step(dt){
  G.t+=dt;G.stT+=dt;G.sayT=Math.max(0,G.sayT-dt);
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  if(G.state==='scoop'){G.f+=dt*.75;if(G.f>1.3)scoopEnd()}
  else if(G.state==='fold'){if(G.stT>.4){G.state='pleat';G.stT=0;G.ang=172}}
  else if(G.state==='pleat'){if(G.stT>.35){G.ang-=G.w*dt;if(G.ang<10)finishOne()}}
  else if(G.state==='slide'){if(G.stT>.55){G.n++;if(G.n>=N)fry();else newOne()}}
  else if(G.state==='fry'){if(G.stT>2.6)finish()}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=1250?'ぎょうざ めいじん':n>=1050?'ひだ マイスター':n>=850?'つつみ じょうず':n>=600?'まかない とうばん':'はじめての ぎょうざ'}
function showResult(){const n=G.score,best=LS.get('gyoza-best',0),nb=n>best;if(nb){LS.set('gyoza-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rPerf').textContent=G.perfN+'/'+N*TICKS;$('rFill').textContent=G.fillN+'/'+N;$('rFull').textContent=G.fullN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.fullN>=5?'おみせに だせる できばえ！':'▼が しるしに かさなる すこし まえに タップすると そろうよ。');
  const rc=$('resCv').getContext('2d');rc.clearRect(0,0,640,200);G.done.forEach((d,i)=>{const x=80+(i%4)*160,y=80+Math.floor(i/4)*90;mini(rc,x,y,.36,d,true)});
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ぱりっと ぎょうざ🥟 ${n}てん（かんぺき ${G.fullN}/${N}）「${rank(n)}」\n#ぱりっとぎょうざ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/gyoza.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function spr(c,k,x,y,sc){const im=IMG[k],s=256*K*sc;if(im)c.drawImage(im,x-s/2,y-s/2,s,s)}
function pleatMark(c,x,y,a,sc,col){const r=a*Math.PI/180;c.save();c.translate(x,y);c.rotate(Math.PI/2-r);c.strokeStyle=col||'#b8a070';c.lineWidth=6*sc;c.lineCap='round';c.beginPath();c.moveTo(0,-4*sc);c.quadraticCurveTo(6*sc,12*sc,0,26*sc);c.stroke();c.restore()}
function mini(c,x,y,sc,d,yaki){spr(c,yaki?'yaki':'half',x,y,sc);for(const p of d.pleats){const r=p.a*Math.PI/180;pleatMark(c,x+Math.cos(r)*RX*sc,y-Math.sin(r)*RY*sc,p.a,sc,yaki?'#a87030':'#b8a070')}}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#e8dcc4';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  if(G.phase!=='title'){
    // the tray of finished gyoza
    const [TX,TY,TW]=SCENE.tray;G.done.forEach((d,i)=>{const x=TX-TW/2+95+(i%4)*(TW-190)/3,y=TY-12+Math.floor(i/4)*86;mini(c,x,y,.3,d,G.state==='fry'&&G.stT>.6||G.phase==='end')});
    if(G.state==='fry'){for(let i=0;i<10;i++){const k=(G.stT*.7+i*.1)%1;c.fillStyle=`rgba(255,255,255,${.5*(1-k)})`;c.beginPath();c.arc(TX-280+i*62+Math.sin(G.t*3+i)*10,TY-20-k*160,22+k*20,0,7);c.fill()}}
    // the gyoza being made
