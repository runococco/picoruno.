  <div class="ov" id="titleOv">

  </div>

<script>
/*ART*/const ART={},LAYER={},SCENE={pxu:160,spr:{block:{res:448,pxu:320,r:.55,h:.28,step:86.94},head:{res:448,pxu:320,base:[224,329.6]},mallet:{res:512,pxu:320,face:[339.2,131.8],grip:[256,426.8]}}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,DS=.6;
const SB=SCENE.spr.block,SH=SCENE.spr.head,SM=SCENE.spr.mallet;
const R=SB.r*SB.pxu*DS,STEP=SB.step*DS;      // block radius and stack step in frame px
const CX=410,Y0=1092,PULL=170;               // stack x, bottom block centre y, mallet pull-back
const COLORS=['red','yellow','green','blue','purple'];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function outlined(im,px,thr){
  const c=document.createElement('canvas');c.width=im.width+px*2;c.height=im.height+px*2;const x=c.getContext('2d');
  const m=document.createElement('canvas');m.width=im.width;m.height=im.height;const mx=m.getContext('2d');mx.drawImage(im,0,0);
  const d=mx.getImageData(0,0,m.width,m.height),a=d.data;for(let i=0;i<a.length;i+=4){const on=a[i+3]>thr;a[i]=74;a[i+1]=44;a[i+2]=29;a[i+3]=on?255:0}mx.putImageData(d,0,0);
  for(let k=0;k<16;k++){const t=k/16*Math.PI*2;x.drawImage(m,px+Math.cos(t)*px,px+Math.sin(t)*px)}
  x.drawImage(im,px,px);c.pad=px;return c}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(!i)return;IMG[k]=k==='bg'?i:outlined(i,7,120)})))}
// draw sprite k so that sprite px (ax,ay) lands on frame (x,y)
function sprAt(c,k,res,ax,ay,x,y,rot=0,s=1){const im=IMG[k];if(!im)return;const p=im.pad||0;c.save();c.translate(x,y);if(rot)c.rotate(rot);c.scale(DS*s,DS*s);c.drawImage(im,-ax-p,-ay-p);c.restore()}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('daruma-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.34;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('daruma-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
// stack[0] is the bottom block; each block {c:color, hard, x (offset from CX), dy (drop animation)}
const G={phase:'title',t:0,lv:1,score:0,lives:3,combo:0,maxCombo:0,perf:0,stack:[],head:{x:0,dy:0,hop:0},flying:[],fx:[],texts:[],
  st:'ready',ph:0,strikeT:0,pull:0,waitT:0,stagePerfect:true,wob:0,leaves:[],endT:0};
function zones(b){const lv=G.lv,pw=Math.max(.07,.16-(lv-1)*.012);
  if(b&&b.hard)return {weak:.56,good:.82-pw/2,perf:.82+pw/2,strong:1.01};
  return {weak:.34,good:.74-pw/2,perf:.74+pw/2,strong:.92}}
function speed(){return 2.2+Math.min(2.6,(G.lv-1)*.28)}
function newStage(){const n=Math.min(8,2+G.lv);G.stack=[];let prev='';
  for(let i=0;i<n;i++){let c;do{c=COLORS[Math.floor(Math.random()*5)]}while(c===prev);prev=c;const hard=G.lv>=3&&i<n-1&&Math.random()<Math.min(.4,.12+G.lv*.03);G.stack.push({c:hard?'hard':c,hard,x:0,dy:-600-i*70,vy:0})}
  G.head={x:0,dy:-600-n*70,vy:0,hop:0};G.st='drop';G.waitT=0;G.ph=Math.PI*1.2;G.stagePerfect=true;G.flying=G.flying.filter(f=>f.x<W0+200)}
function reset(){G.t=0;G.lv=1;G.score=0;G.lives=3;G.combo=0;G.maxCombo=0;G.perf=0;G.fx=[];G.texts=[];G.flying=[];G.endT=0;newStage();hud()}
function hud(){$('scoreP').textContent=G.score+' てん';$('lvP').textContent=G.lv+'だん';const ls=$('lives').children;for(let k=0;k<3;k++)ls[k].classList.toggle('off',k>=G.lives)}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function puff(x,y,c='rgba(255,248,230,.9)',n=10){for(let i=0;i<n;i++){const a=Math.PI+Math.random()*Math.PI,v=80+Math.random()*160;G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.4,t:0,life:.4+Math.random()*.3,c,r:6+Math.random()*6})}}
function sparks(x,y,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*7,v=150+Math.random()*300;G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-150,t:0,life:.5+Math.random()*.4,c,r:4.5,g:1})}}
const blockY=i=>Y0-i*STEP;
// how far the load above block k sits off its support, as a share of the radius
function lean(){let worst=0,at=-1;const S=G.stack;for(let k=0;k<S.length;k++){let m=0,w=0;for(let j=k+1;j<S.length;j++){m+=S[j].x;w++}if(G.head){m+=G.head.x*1.3;w+=1.3}if(!w)continue;const off=Math.abs(m/w-S[k].x)/(R*.66);if(off>worst){worst=off;at=k}}return {worst,at}}

/* ---------- strike ---------- */
function tap(){if(G.phase!=='play'||G.st!=='ready')return;G.st='strike';G.strikeT=0;G.pull=(1-Math.cos(G.ph))/2}
function resolve(){
  const S=G.stack,b=S[0],z=zones(b),p=G.pull;sfx('hit',.9);
  let kind=p<z.weak?'weak':p<z.good?'good':p<z.perf?'perf':p<z.strong?'good2':'strong';
  if(kind==='weak'){sfx('tok',.6);b.x+=12;for(let j=1;j<S.length;j++)S[j].x+=5;G.head.x+=5;text(b.hard?'かたい！':'よわい…',CX,blockY(0)-90,'#fff',true);G.combo=0;G.stagePerfect=false;afterShift();return}
  // the block flies out
  S.shift();G.flying.push({c:b.c,x:CX+b.x,y:Y0,vx:1300+p*500,vy:-260-Math.random()*200,rot:0,w:8+Math.random()*6,b:0});
  let s=0;
  if(kind==='perf'){s=(Math.random()-.5)*2;G.combo++;G.perf++;G.maxCombo=Math.max(G.maxCombo,G.combo);const g=100+Math.min(10,G.combo-1)*20;G.score+=g;sfx('perfect',.6);sparks(CX-R,Y0,'#ffe27a');text('すこーん！ +'+g,CX,Y0-160,'#ffe27a');if(G.combo>=3)text(G.combo+' れんぞく',CX,Y0-210,'#fff',true)}
  else if(kind==='strong'){G.combo=0;G.stagePerfect=false;G.score+=20;sfx('knock',.8);text('つよすぎ！',CX,Y0-150,'#ffb0a0',true);for(let j=0;j<S.length;j++)S[j].x+=(Math.random()<.5?-1:1)*(8+Math.random()*12)*Math.pow(.8,j);G.head.x+=(Math.random()-.5)*16;G.head.hop=1}
  else{const d=kind==='good'?(z.good-p)/(z.good-z.weak):(p-z.perf)/(z.strong-z.perf);s=6+Math.max(0,Math.min(1,d))*18;G.combo=0;G.stagePerfect=false;G.score+=40;sfx('knock',.6);text('ずれた',CX,Y0-150,'#fff',true)}
  for(let j=0;j<S.length;j++)S[j].x+=s*Math.pow(.7,j);G.head.x+=s*Math.pow(.7,S.length);
  for(const q of S){q.dy=-STEP;q.vy=0}G.head.dy=-STEP;G.head.vy=0;G.st='drop';hud()}
function afterShift(){const l=lean();if(l.worst>1)topple(l.at);else G.st='ready'}
function topple(at){G.st='topple';G.waitT=0;G.combo=0;sfx('topple',.7);duck(.12,.1);const S=G.stack,dir=Math.sign(G.head.x-(S[at]?S[at].x:0))||1;
  for(let j=Math.max(0,at+1);j<S.length;j++){const q=S[j];G.flying.push({c:q.c,x:CX+q.x,y:blockY(j),vx:dir*(160+Math.random()*260),vy:-200-Math.random()*200,rot:0,w:dir*(3+Math.random()*4),b:0})}
  G.flying.push({c:'head',x:CX+G.head.x,y:blockY(S.length)-STEP/2,vx:dir*(220+Math.random()*120),vy:-380,rot:0,w:dir*5,b:0});
  G.stack=S.slice(0,Math.max(0,at+1));G.head=null;text('ごろーん…',CX,700,'#fff');G.lives--;hud()}
function clearStage(){G.st='clear';G.waitT=0;const bonus=300+(G.stagePerfect?G.lv*100:0);G.score+=bonus;sfx('clear',.75);sparks(CX,Y0-60,'#ffe27a',26);
  text(G.stagePerfect?'ノーミス！ +'+bonus:'おみごと！ +'+bonus,CX,760,'#ffe27a');hud()}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.2&&$('resultOv').hidden)showResult()}
  if(G.phase==='play'||G.phase==='end'){
    if(G.st==='ready'){G.ph+=dt*speed()}
    if(G.st==='strike'){G.strikeT+=dt;if(G.strikeT>=.07)resolve()}
    if(G.st==='drop'){let moving=false;const all=[...G.stack,G.head].filter(Boolean);
      for(const q of all){if(q.dy<0){q.vy+=5200*dt;q.dy+=q.vy*dt;moving=true;if(q.dy>=0){q.dy=0;q.vy=0}}}
      if(!moving){sfx('land',.7);puff(CX+(G.stack[0]?G.stack[0].x:G.head.x),Y0+STEP*.6);G.head.hop=Math.max(G.head.hop,.6);
        if(!G.stack.length&&G.phase==='play'){clearStage()}else{const l=lean();if(l.worst>1)topple(l.at);else{G.st='ready';if(l.worst>.6)sfx('wobble',.35)}}}}
    if(G.st==='topple'||G.st==='clear'){G.waitT+=dt;if(G.waitT>1.7&&G.phase==='play'){if(G.lives<=0)finish();else{if(G.st==='clear')G.lv++;newStage();hud()}}}
  }
  if(G.head)G.head.hop=Math.max(0,G.head.hop-dt*3);
  G.wob=G.stack.length?lean().worst:0;
  for(let i=G.flying.length-1;i>=0;i--){const f=G.flying[i];f.vy+=2600*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.w*dt;
    if(f.y>Y0+30&&f.vy>0&&f.b<2){f.y=Y0+30;f.vy*=-.35;f.vx*=.7;f.b++;sfx('land',.35,1.5)}
    if(f.x<-300||f.x>W0+300||f.y>H0+200)G.flying.splice(i,1)}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;if(p.g)p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)G.fx.splice(i,1)}
  // falling maple leaves
  if(Math.random()<dt*.8)G.leaves.push({x:Math.random()*W0,y:-30,ph:Math.random()*7,s:.7+Math.random()*.5,c:['#d8402a','#e8602a','#f0902a'][Math.floor(Math.random()*3)]});
  for(let i=G.leaves.length-1;i>=0;i--){const l=G.leaves[i];l.y+=60*dt*l.s;l.ph+=dt*2;l.x+=Math.sin(l.ph)*30*dt;if(l.y>H0+30)G.leaves.splice(i,1)}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.8)}
function rank(s){return s>=6000?'だるまおとし 名人':s>=3000?'すこーん 師範':s>=1500?'えんがわの 達人':s>=600?'こづち じょうず':'はじめの すこーん'}
function showResult(){const s=G.score;const best=LS.get('daruma-best',0),nb=s>best;if(nb)LS.set('daruma-best',s);
  $('resScore').textContent=s+' てん';$('rLv').textContent=G.lv;$('rPerf').textContent=G.perf;$('rCombo').textContent=G.maxCombo;$('resRank').textContent=rank(s);
  $('resNote').innerHTML=(nb&&s>0?'ベスト更新！<br>':'')+(G.maxCombo>=10?'すこーんが とまらない。ねこだるまも うっとり。':'ゲージが きいろに かさなった しゅんかんに タップ。<br>こげ茶の ブロックは きいろが 右に ずれるよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこだるま おとし🐱 ${s}てん（${G.lv}だん・すこーん${G.perf}回）「${rank(s)}」\n#ねこだるまおとし #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/darumaotoshi.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function toFrame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
function blockSpr(c,k,x,y,rot=0){sprAt(c,'b_'+k,SB.res,SB.res/2,SB.res/2,x,y,rot)}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#d8b080';c.fillRect(0,0,CW,CH);
  if(OY>0){c.fillStyle='#cfe4ee';c.fillRect(0,0,CW,OY+2);c.fillStyle='#c89a68';c.fillRect(0,OY+H0*S-2,CW,CH)}
  c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#cfe4ee';c.fillRect(0,0,W0,H0)}
  for(const l of G.leaves){c.save();c.translate(l.x,l.y);c.rotate(l.ph);c.fillStyle=l.c;c.beginPath();for(let k=0;k<5;k++){const a=k/5*Math.PI*2;c.lineTo(Math.cos(a)*9*l.s,Math.sin(a)*9*l.s);c.lineTo(Math.cos(a+.63)*4*l.s,Math.sin(a+.63)*4*l.s)}c.fill();c.restore()}
  // shadow
  c.fillStyle='rgba(74,44,29,.18)';c.beginPath();c.ellipse(CX,Y0+STEP*.55,R*1.15,R*.3,0,0,7);c.fill();
  // stack, with a wobble that grows with the lean
  const w=G.st==='ready'&&G.wob>.55?Math.sin(G.t*14)*(G.wob-.55)*4:0;
  const S_=G.stack;
  for(let i=0;i<S_.length;i++){const q=S_[i];blockSpr(c,q.c,CX+q.x+w*i,blockY(i)+q.dy)}
  if(G.head){const h=G.head,top=blockY(S_.length)+STEP/2,hop=Math.sin(h.hop*Math.PI)*16;sprAt(c,'head',SH.res,SH.base[0],SH.base[1],CX+h.x+w*S_.length,top+h.dy-hop+STEP*.12,w*.01)}
  for(const f of G.flying){if(f.c==='head')sprAt(c,'head',SH.res,SH.res/2,SH.res/2,f.x,f.y,f.rot);else blockSpr(c,f.c,f.x,f.y,f.rot)}
  // mallet + gauge
  if(G.phase!=='title'){const b=S_[0],z=zones(b);
    const p=G.st==='strike'?G.pull*(1-G.strikeT/.07):G.st==='ready'?(1-Math.cos(G.ph))/2:.5;
    const ty=S_.length?blockY(0):Y0,face=CX-R-6-p*PULL+(G.st==='strike'?0:0);
    sprAt(c,'mallet',SM.res,SM.face[0],SM.face[1],face,ty,0);
    if(G.st==='ready'||G.st==='strike'){const gx=70,gy=1200,gw=580,gh=30;
      c.fillStyle='rgba(255,250,242,.95)';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(gx-6,gy-6,gw+12,gh+12,14);c.fill();c.stroke();
      const seg=(a,b2,col)=>{c.fillStyle=col;c.fillRect(gx+gw*a,gy,gw*(Math.min(1,b2)-a),gh)};
      seg(0,z.weak,'#d8ccb8');seg(z.weak,z.good,'#9ac87a');seg(z.good,z.perf,'#ffd23a');seg(z.perf,z.strong,'#9ac87a');if(z.strong<1)seg(z.strong,1,'#f0a090');
      const nx=gx+gw*p;c.fillStyle='#4a2c1d';c.beginPath();c.moveTo(nx-12,gy-18);c.lineTo(nx+12,gy-18);c.lineTo(nx,gy+4);c.fill();c.fillRect(nx-2.5,gy,5,gh)}}
  for(const p of G.fx){c.globalAlpha=Math.max(0,1-p.t/p.life);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}c.globalAlpha=1;
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.1){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?30:40;c.font=`${sz}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(160,Math.min(W0-160,x.x)),x.y-x.t*40);c.globalAlpha=x.t>.8?(1.1-x.t)/.3:1;
    c.lineJoin='round';c.lineWidth=sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  if(G.phase==='play'&&G.st==='ready'&&G.lv===1&&G.perf===0&&G.t%1.4<1){c.save();c.font='30px "Dela Gothic One",sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=8;c.strokeStyle='#4a2c1d';c.strokeText('きいろで タップ！',360,1160);c.fillStyle='#fff';c.fillText('きいろで タップ！',360,1160);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();tap()},{passive:false});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;reset();G.phase='play';
  if(ac)Promise.resolve(decoding).then(()=>{duck(.34,.01);bgm(true);sfx('start',.6)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);G.phase='title';for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;reset();refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('daruma-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({daruma:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,tap,zones,lean};
</script>
<script>
function pingPlay(){
  var G="ねこだるま おとし", K="picoruno-played:"+G;
  try{ if(sessionStorage.getItem(K)) return; sessionStorage.setItem(K,"1"); }catch(e){}
  var KEY="sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
  fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play",{method:"POST",keepalive:true,
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({g:G})})
  .then(function(r){ if(!r.ok) throw 0; })
  .catch(function(){ try{ var d=JSON.parse(localStorage.getItem("picoruno-stats")||"{}"); d[G]=d[G]||{plays:0,likes:0}; d[G].plays++; localStorage.setItem("picoruno-stats",JSON.stringify(d)); }catch(e){} });
}
