      <div class="res-row"><div>ちょうど<b id="rJust">0</b></div><div>あわ つぶし<b id="rPop">0</b></div><div>ぴったり ながし<b id="rPour">0</b></div></div>

<script>
/*ART*/const ART={},LAYER={},SCENE={pan:[128,288,464,528],bowl:[608,104],cat:[128,1152]};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,[PX,PY,PW,PH]=SCENE.pan,LAYERS=4,ROUNDS=3,FLO=.85,FHI=1.0;
const ZONES=[[.35,'ゆるい','#f0d878'],[.55,'ゆるめ','#f4c430'],[.8,'ちょうど','#7ac060'],[1,'こんがり','#e09040'],[1.3,'こげ','#8a5030']];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('tamagoyaki-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('tamagoyaki-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],bubbles:[],holes:[],done:[]};
function fresh(){return {phase:'play',t:0,score:0,round:0,layer:0,state:'ready',stT:0,f:0,d:0,pouring:false,bubbles:[],holes:[],layers:[],done:[],rollY:PY+30,rollR:0,
  rollFrom:0,justN:0,popN:0,pourN:0,texts:[],say:'',sayT:0,endT:0,bubT:1,spill:0,lastPts:0,cut:null}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('roundP').textContent=Math.min(G.round+1,ROUNDS)+'こめ '+Math.min(G.layer+1,LAYERS)+'/'+LAYERS;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}
function zone(d){for(const z of ZONES)if(d<z[0])return z;return ZONES[4]}
function rate(){return .24*(1+.16*G.round)}
function eggCol(d){const st=[[0,[246,222,120]],[.45,[244,200,60]],[.75,[240,180,50]],[1,[214,140,60]],[1.3,[130,80,44]]];for(let i=1;i<st.length;i++)if(d<=st[i][0]){const a=st[i-1],b=st[i],k=(d-a[0])/(b[0]-a[0]);return a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*k))}return st[st.length-1][1]}
function rgb(c,a){return a==null?`rgb(${c})`:`rgba(${c},${a})`}
function sheetTop(){return G.layer===0?PY:PY+2*G.rollR+6}
function sheetBot(){return PY+Math.min(1,G.f)*PH}

/* ---------- flow ---------- */
function newLayer(){G.state='ready';G.stT=0;G.f=0;G.d=0;G.bubbles=[];G.holes=[];G.spill=0;G.pops=0;hud()}
function pourStart(){if(G.phase!=='play'||G.state!=='ready')return;G.state='pour';G.stT=0;G.pouring=true;sfx('pour',.5)}
function pourEnd(){if(G.state!=='pour')return;G.pouring=false;G.state='cook';G.stT=0;G.bubT=rnd(.5,1);
  const f=G.f;let p,msg;if(f>FHI){p=0;msg='あふれちゃった';G.spill=1;sfx('bad',.5)}else if(f>=FLO){p=20;msg='ぴったり！';G.pourN++;sfx('good',.4)}else if(f>=.7){p=10;msg='すこし すくなめ'}else{p=3;msg='うすすぎ…'}
  G.pourPts=p;text(msg,360,PY+PH+60,p>=20?'#ffe27a':'#fff',true)}
function popAt(x,y){if(G.state!=='cook')return false;for(let i=G.bubbles.length-1;i>=0;i--){const b=G.bubbles[i];if(Math.hypot(b.x-x,b.y-y)<b.r+30){G.bubbles.splice(i,1);G.pops++;G.popN++;sfx('pop',.5,1+Math.random()*.4);text('ぷちっ',b.x,b.y-30,'#fff',true);return true}}return false}
function roll(){if(G.state!=='cook')return;const d=G.d,z=zone(d);let p=0,msg;
  if(d<.35){p=0;msg='やぶれちゃった';sfx('bad',.5)}else if(d<.55){p=15;msg='ちょっと ゆるめ'}else if(d<.8){p=30;msg='ちょうど！';G.justN++;sfx('good',.5,1.12)}else if(d<1){p=15;msg='こんがり'}else{p=0;msg='こげちゃった';sfx('bad',.5)}
  const holes=G.holes.length,thin=G.f<.7?6:0,pts=Math.max(0,p+G.pourPts+G.pops*2-holes*5-thin);G.score+=pts;G.lastPts=pts;
  G.layers.push({d:Math.min(1.3,d),f:G.f,ok:d>=.35});text(`${msg} +${pts}`,360,PY+PH+60,p>=30?'#ffe27a':'#fff');if(p>=30)say(['いいね','ふわふわ','にゃ〜'][G.justN%3]);
  G.state='roll';G.stT=0;G.rollFrom=sheetTop();G.bubbles=[];sfx('roll',.6);hud()}
function step(dt){
  G.t+=dt;G.stT+=dt;G.sayT=Math.max(0,G.sayT-dt);
  if(G.phase==='play'){
    if(G.state==='pour'){G.f+=dt*.42;if(G.f>1.25){pourEnd()}}
    else if(G.state==='cook'){G.d+=dt*rate();G.bubT-=dt;
      if(G.bubT<=0&&G.d<.95){G.bubT=rnd(.55,1.1)/(1+.15*G.round);const y0=sheetTop()+30,y1=sheetBot()-24;if(y1>y0)G.bubbles.push({x:rnd(PX+40,PX+PW-40),y:rnd(y0,y1),t:0,life:rnd(1.3,1.7)})}
      for(let i=G.bubbles.length-1;i>=0;i--){const b=G.bubbles[i];b.t+=dt;b.r=8+Math.min(1,b.t/b.life)*22;if(b.t>b.life){G.bubbles.splice(i,1);G.holes.push({x:b.x,y:b.y});sfx('hole',.35);text('あなが あいた',b.x,b.y-30,'#ffd0c0',true)}}
      if(G.d>1.3)roll()}
    else if(G.state==='roll'){const T=.75,k=Math.min(1,G.stT/T);const R=14+7*(G.layers.length);G.rollR=G.rollR+(R-G.rollR)*Math.min(1,dt*6);
      G.rollY=G.rollFrom+(sheetBot()-G.rollR-G.rollFrom)*k;if(k>=1){G.state='push';G.stT=0}}
    else if(G.state==='push'){const k=Math.min(1,G.stT/.45);G.rollY=G.rollY+(PY+G.rollR+4-G.rollY)*Math.min(1,dt*10);if(k>=1){G.layer++;if(G.layer>=LAYERS)cutIt();else newLayer()}}
    else if(G.state==='cut'){if(G.stT>2.6){G.done.push(G.layers.slice());G.round++;G.layer=0;G.layers=[];G.rollR=0;G.rollY=PY+30;if(G.round>=ROUNDS)finish();else{newLayer();text((G.round+1)+'こめ',360,560,'#fff')}}}}
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.6&&$('resultOv').hidden)showResult()}}
function cutIt(){G.state='cut';G.stT=0;sfx('cut',.6);const good=G.layers.filter(l=>l.d>=.55&&l.d<.8).length;const bonus=good===4?50:good>=3?20:0;
  if(bonus){G.score+=bonus;sfx('levelup',.55);text(good===4?'きれいな うずまき！ +50':'いい うずまき +20',360,430,'#ffe27a')}else text('できあがり',360,430,'#fff');hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=720?'たまごやき めいじん':n>=580?'だしまき マイスター':n>=430?'ふわふわ じょうず':n>=260?'あさごはん とうばん':'はじめての たまごやき'}
function showResult(){const n=G.score,best=LS.get('tamagoyaki-best',0),nb=n>best;if(nb){LS.set('tamagoyaki-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rJust').textContent=G.justN+'/12';$('rPop').textContent=G.popN;$('rPour').textContent=G.pourN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.justN>=10?'どれも ふわふわの うずまき。おみごと！':'メーターが みどりの ときに まくと きれいな うずまきに なるよ。');
  const rc=$('resCv').getContext('2d');rc.clearRect(0,0,600,190);G.done.forEach((ls,i)=>section(rc,100+i*200,95,1,ls));
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの たまごやき🍳 ${n}てん（ちょうど ${G.justN}/12）「${rank(n)}」\n#ねこのたまごやき #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/tamagoyaki.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function section(c,x,y,k,ls){// cross-section of a finished omelette: nested rounded rects, last layer outside
  const n=Math.max(1,ls.length);c.save();c.translate(x,y);c.scale(k,k);for(let i=n-1;i>=0;i--){const l=ls[i]||{d:.6},s=(i+1)/n,w=160*s+12,h=120*s+10;c.fillStyle=rgb(eggCol(l.d));c.strokeStyle=l.ok?'rgba(200,140,40,.9)':'rgba(140,90,40,.9)';c.lineWidth=4;c.beginPath();c.roundRect(-w/2,-h/2,w,h,Math.min(40,h/2.4));c.fill();c.stroke()}
  c.strokeStyle='#4a2c1d';c.lineWidth=5;const w=172,h=130;c.beginPath();c.roundRect(-w/2,-h/2,w,h,46);c.stroke();c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#e8dcc4';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#9a948a';c.fillRect(PX,PY,PW,PH)}
  c.save();c.beginPath();c.rect(PX,PY,PW,PH);c.clip();
  // the sheet of egg (raw → set → browned)
  if(G.phase!=='title'&&(G.state==='pour'||G.state==='cook'||G.state==='roll')){const top=G.state==='roll'?G.rollY:sheetTop(),bot=sheetBot(),col=eggCol(G.state==='pour'?0:G.d);
    if(bot>top){c.fillStyle=rgb(col,G.state==='pour'?.85:1);c.beginPath();c.moveTo(PX,top);c.lineTo(PX+PW,top);c.lineTo(PX+PW,bot);for(let i=12;i>=0;i--){const x=PX+PW*i/12;c.lineTo(x,bot+Math.sin(i*1.7+G.round*3+G.layer)*8)}c.closePath();c.fill();
      if(G.d>.6&&G.state!=='pour'){c.fillStyle=rgb(eggCol(G.d+.18),.5);for(let i=0;i<14;i++){const x=PX+30+((i*97)%(PW-60)),y=top+20+((i*61+G.layer*37)%Math.max(1,(bot-top-40)));c.beginPath();c.ellipse(x,y,16,9,i,0,7);c.fill()}}
      for(const h of G.holes){if(h.y<top)continue;c.fillStyle='#9a948a';c.strokeStyle=rgb(eggCol(G.d+.25));c.lineWidth=4;c.beginPath();c.arc(h.x,h.y,13,0,7);c.fill();c.stroke()}}}
  if(G.spill&&G.state==='cook'){c.fillStyle=rgb(eggCol(G.d),.9);c.beginPath();c.ellipse(PX+PW*.7,PY+PH-6,90,24,0,0,7);c.fill()}
  // fill guides while pouring
  if(G.state==='pour'||(G.state==='ready'&&G.phase==='play')){for(const [f,lab] of [[FLO,''],[FHI,'']]){const y=PY+f*PH;c.strokeStyle='rgba(74,44,29,.7)';c.lineWidth=4;c.setLineDash([14,10]);c.beginPath();c.moveTo(PX+8,y);c.lineTo(PX+PW-8,y);c.stroke();c.setLineDash([])}
    c.fillStyle='rgba(122,192,96,.28)';c.fillRect(PX,PY+FLO*PH,PW,(FHI-FLO)*PH)}
  // the roll
  if(G.rollR>0&&G.phase!=='title'){const r=G.rollR,y=G.rollY,ls=G.layers,col=ls.length?eggCol(ls[ls.length-1].d):[244,200,60];const gr=c.createLinearGradient(0,y-r,0,y+r);gr.addColorStop(0,rgb(col.map(v=>Math.max(0,v-26))));gr.addColorStop(.45,rgb(col));gr.addColorStop(1,rgb(col.map(v=>Math.max(0,v-40))));
    c.fillStyle=gr;c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(PX+12,y-r,PW-24,2*r,Math.min(r,40));c.fill();c.stroke();
    c.strokeStyle='rgba(200,140,40,.6)';c.lineWidth=3;for(let i=1;i<ls.length;i++){const yy=y-r+2*r*i/ls.length;c.beginPath();c.moveTo(PX+24,yy);c.lineTo(PX+PW-24,yy);c.stroke()}}
  // bubbles
  for(const b of G.bubbles){const a=Math.min(1,b.t*4),warn=b.t>b.life*.7;c.globalAlpha=a;c.fillStyle='rgba(255,246,200,.85)';c.strokeStyle=warn?'#d8603a':'#c89a30';c.lineWidth=warn?5:3;c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.22,0,7);c.fill();c.globalAlpha=1}
  c.restore();
  // pouring stream from the bowl
  if(G.state==='pour'){const [bx,by]=SCENE.bowl,tx=PX+PW*.72,ty=PY+50;c.strokeStyle=rgb([246,212,90]);c.lineWidth=16+Math.sin(G.t*30)*2;c.lineCap='round';c.beginPath();c.moveTo(bx-20,by+30);c.quadraticCurveTo(bx-10,ty-60,tx,ty);c.stroke()}
  // doneness meter
  if(G.phase==='play'&&(G.state==='cook'||G.state==='pour'||G.state==='ready')){const x=660,y0=820,y1=330,H=y0-y1,k=d=>y0-Math.min(1.3,d)/1.3*H;c.save();c.lineWidth=4;c.strokeStyle='#4a2c1d';
    let lo=0;for(const z of ZONES){c.fillStyle=z[2];c.fillRect(x-20,k(z[0]),40,k(lo)-k(z[0]));lo=z[0]}c.strokeRect(x-20,y1,40,H);
    c.textAlign='center';c.font='18px "Dela Gothic One",sans-serif';c.fillStyle='#4a2c1d';c.fillText('やけ',x,y0+28);
    if(G.state==='cook'){const y=k(G.d);c.fillStyle='#fffaf2';c.beginPath();c.moveTo(x-34,y);c.lineTo(x-52,y-14);c.lineTo(x-52,y+14);c.closePath();c.fill();c.stroke();c.fillRect(x-22,y-3,44,6)}c.restore()}
  // cut: show the cross-section
  if(G.state==='cut'){const a=Math.min(1,G.stT*3);c.save();c.globalAlpha=a;c.fillStyle='rgba(255,250,242,.95)';c.strokeStyle='#4a2c1d';c.lineWidth=5;c.beginPath();c.roundRect(160,470,400,260,30);c.fill();c.stroke();section(c,360,610,1.05,G.layers);c.textAlign='center';outlineText(c,'きりくち',360,515,30,'#fff',8);c.restore()}
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(300,1110);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-80,-28,160,52,20);c.fill();c.stroke();c.beginPath();c.moveTo(-60,10);c.lineTo(-100,30);c.lineTo(-56,-6);c.closePath();c.fill();c.stroke();
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='24px "Dela Gothic One",sans-serif';c.fillText(G.say,0,-2);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.3){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?28:36;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(150,Math.min(W0-150,x.x)),x.y-x.t*24);c.globalAlpha=x.t>1?(1.3-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'){const hint=G.state==='ready'?'ながおしで たまごを ながす':G.state==='pour'?'みどりの ところで はなす':G.state==='cook'?(G.d>=.55&&G.d<.8?'いまだ！ したへ スワイプ':'あわは タップ・したへ スワイプで まく'):'';if(hint){c.save();c.textAlign='center';outlineText(c,hint,360,262,28,'#fff',8);c.restore()}}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input: hold = pour, tap = pop a bubble, swipe down = roll ---------- */
let pd=null;
function toGame(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left-OX)/S,(e.clientY-r.top-OY)/S]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const [x,y]=toGame(e);pd={x,y,t:performance.now()};
  if(G.state==='ready')pourStart();else if(G.state==='cook')popAt(x,y)},{passive:false});
cv.addEventListener('pointermove',e=>{if(!pd||G.state!=='cook')return;const [x,y]=toGame(e);if(y-pd.y>70&&Math.abs(x-pd.x)<(y-pd.y)){pd=null;roll()}});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,()=>{pd=null;pourEnd()});
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();unlock();if(G.state==='ready')pourStart()}else if(e.code==='ArrowDown'){e.preventDefault();roll()}});
window.addEventListener('keyup',e=>{if(e.code==='Space')pourEnd()});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;Object.assign(G,fresh());newLayer();hud();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';pd=null;pourEnd();$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);reset();for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('tamagoyaki-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};

setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,pourStart,pourEnd,popAt,roll};
