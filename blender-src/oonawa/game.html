      <div class="res-rank" id="resRank"></div>

<script>
/*ART*/const ART={},LAYER={},SCENE={hands:[[138,900],[582,900]],ground:1049,spr:{cat:{res:192,pxu:120,feet:162}}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,HL=SCENE.hands[0],HR=SCENE.hands[1],GY=SCENE.ground-4,AMP=235,LIVES=3,JD=.4,JH=112,REC=.12,CK=1.12;
const NUM=['いち','に','さん','し','ご','ろく','しち','はち','く','じゅう'];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('oonawa-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('oonawa-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,cats:[],texts:[]};
function mkCat(kind,x){return {kind,x,jt:-1,rec:0,h:0,land:0,auto:kind!=='me'}}
function fresh(){return {phase:'play',t:0,lives:LIVES,jumps:0,perfects:0,run:0,maxRun:0,pts:0,phi:Math.PI,mode:'wait',modeT:0,swing:0,swPass:0,period:1.05,pend:{a:1,T:1.6},
  cats:[mkCat('me',360)],texts:[],chant:'',chantT:0,big:'',bigT:0,say:'',sayT:0,endT:0,nextEvent:15,stopT:0,lastPass:-9,shake:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('lifeP').textContent='●'.repeat(G.lives)+'○'.repeat(LIVES-G.lives);$('scoreP').textContent=G.jumps+' かい'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function chant(s){G.chant=s;G.chantT=1.1}
function me(){return G.cats[0]}

/* ---------- rope: φ=π is the rope sweeping under the feet ---------- */
function startWave(){G.mode='wave';G.modeT=0;G.swPass=0;G.phi=Math.PI-1.05;G.swing=0;chant('おおなみ')}
function startTurn(){G.mode='turn';G.modeT=0;chant('ぐるりと まわして')}
function ropeY(u){const yb=HL[1]+(HR[1]-HL[1])*u;return Math.min(GY,yb-AMP*Math.cos(G.phi)*Math.sin(Math.PI*u))}
function pass(){G.lastPass=G.t;sfx('slap',.45,G.mode==='wave'?.75:1);let ok=true;
  for(const c of G.cats){if(c.auto)continue;if(c.h<20){ok=false}}
  if(!ok){caught();return}
  const c=me();if(c.jt<0)return;const apex=Math.abs((G.t-c.jt)-JD/2),perf=apex<.055;
  G.jumps++;G.run++;G.maxRun=Math.max(G.maxRun,G.run);let p=1;if(perf){G.perfects++;p=2;sfx('perfect',.4);text('ぴったり',c.x,GY-300,'#ffe27a',true)}
  G.pts+=p+(G.run>=20?1:0);text(NUM[(G.jumps-1)%10],c.x+110,GY-250,'#fff',true);
  if(G.jumps===10||G.jumps===25){const x=G.jumps===10?265:455;G.cats.push(mkCat(G.jumps===10?'gray':'cream',x));sfx('join',.5);sfx('levelup',.5);text('おともだちが はいった！',360,520,'#fff');}
  if(G.mode==='turn'&&G.jumps%5===0)G.period=Math.max(.46,G.period-.04);
  if(G.mode==='turn'&&G.jumps>=G.nextEvent){G.nextEvent+=rnd(12,18)|0;const r=Math.random();
    if(r<.4){G.slowT=2.2;chant('ゆっくり〜')}else if(r<.75){G.fastT=2.4;chant('はやく！')}else{G.pendNext=1}}
  hud()}
function caught(){G.lives--;G.run=0;G.mode='stop';G.stopT=0;G.shake=.3;sfx('caught',.6);text('ひっかかった！',360,520,'#ffd0c0');G.say='にゃっ';G.sayT=1.2;hud();
  if(G.lives<=0)finish()}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);G.chantT=Math.max(0,G.chantT-dt);G.shake=Math.max(0,G.shake-dt);G.modeT+=dt;
  if(G.phase==='play'){
    const prev=G.phi;
    if(G.mode==='wait'){if(G.modeT>.9)startWave()}
    else if(G.mode==='wave'){G.swing+=dt*2*Math.PI/1.7;G.phi=Math.PI-1.05*Math.cos(G.swing);
      if((prev-Math.PI)*(G.phi-Math.PI)<0){pass();if(G.mode==='wave'){G.swPass++;chant(['こなみ','おおなみ','こなみ','ぐるりと まわして'][Math.min(3,G.swPass-1)]);if(G.swPass>=4){G.phi=Math.PI+.001;startTurn()}}}}
    else if(G.mode==='turn'){let T=G.period;if(G.slowT>0){G.slowT-=dt;T*=1.45}if(G.fastT>0){G.fastT-=dt;T*=.82}
      G.phi+=dt*2*Math.PI/T;if(G.phi>=3*Math.PI){G.phi-=2*Math.PI;if(G.pendNext){G.pendNext=0;pass();if(G.mode==='turn'){G.phi=Math.PI;startWave();G.swing=Math.PI/2;G.phi=Math.PI+.001}}else pass()}}
    else if(G.mode==='stop'){G.stopT+=dt;G.phi+=(Math.PI-G.phi)*Math.min(1,dt*6);if(G.stopT>1.4&&G.lives>0){G.period=Math.min(1.05,G.period+.08);startWave()}}}
  // cats: jumps, landing recovery, auto friends
  for(const c of G.cats){if(c.auto&&G.phase==='play'&&c.jt<0&&c.rec<=0&&(G.mode==='turn'||G.mode==='wave')){const tp=timeToPass();if(tp>0&&Math.abs(tp-JD/2)<dt)jump(c)}
    if(c.jt>=0){const t=G.t-c.jt;if(t>=JD){c.jt=-1;c.h=0;c.rec=REC;c.land=.15;if(!c.auto)sfx('land',.3)}else c.h=4*JH*(t/JD)*(1-t/JD)}
    c.rec=Math.max(0,c.rec-dt);c.land=Math.max(0,c.land-dt)}
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.8&&$('resultOv').hidden)showResult()}}
function timeToPass(){if(G.mode==='turn'){let T=G.period;if(G.slowT>0)T*=1.45;if(G.fastT>0)T*=.82;let d=3*Math.PI-G.phi;if(d<0)d+=2*Math.PI;return d/(2*Math.PI)*T}
  if(G.mode==='wave'){const w=2*Math.PI/1.7;let s=G.swing%Math.PI;const tgt=Math.PI/2;let d=tgt-s;if(d<=0)d+=Math.PI;return d/w}return -1}
function jump(c){if(c.jt>=0||c.rec>0)return false;c.jt=G.t;c.h=0;return true}
function tap(){if(G.phase!=='play')return;const c=me();if(jump(c))sfx('jump',.35)}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7);text('おしまい',360,440,'#fff')}
function rank(n){return n>=120?'おおなわ めいじん':n>=80?'はらっぱの エース':n>=45?'ぴょんぴょん じょうず':n>=20?'なわとび なかま':'はじめての おおなわ'}
function showResult(){const n=G.jumps,best=LS.get('oonawa-best',0),nb=n>best;if(nb){LS.set('oonawa-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' かい';$('rPerf').textContent=G.perfects;$('rRun').textContent=G.maxRun;$('rPts').textContent=G.pts;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(n>=25?'おともだち みんなで とべたね！':n>=10?'グレーの ねこが いっしょに とんで くれたね。<br>25かいで もう いっぴき くるよ。':'なわが あしもとに くる ちょっと まえに タップ。<br>10かい とぶと おともだちが はいって くるよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの おおなわ🐾 ${n}かい とんだ（さいこう ${G.maxRun}れんぞく）「${rank(n)}」\n#ねこのおおなわ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/oonawa.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function rope(c){c.lineCap='round';c.lineJoin='round';const pts=[];for(let i=0;i<=28;i++){const u=i/28;pts.push([HL[0]+(HR[0]-HL[0])*u,ropeY(u)])}
  for(const [w,col] of [[11,'#4a2c1d'],[6,'#f06a8a']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke()}}
function drawCat(c,cat){const im=IMG[cat.kind+'_'+(cat.h>4?'jump':'stand')],k=CK*(cat.kind==='me'?1:.92),sq=cat.land>0?1-cat.land*.8:1,sx=cat.land>0?1+cat.land*.6:1;
  const y=GY-cat.h;c.fillStyle='rgba(60,80,40,.22)';c.beginPath();c.ellipse(cat.x,GY+2,52*k*(1-cat.h/300),12*k,0,0,7);c.fill();
  c.save();c.translate(cat.x,y);c.scale(sx,sq);if(im)c.drawImage(im,-96*k,-SCENE.spr.cat.feet*k,192*k,192*k);else{c.fillStyle='#fbf6ec';c.beginPath();c.arc(0,-60,50,0,7);c.fill()}c.restore()}

  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#7ab85a';c.fillRect(0,0,CW,CH);

  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  const front=Math.sin(G.phi)<0;
  if(!front)rope(c);
  for(const cat of [...G.cats].sort((a,b)=>Math.abs(b.x-360)-Math.abs(a.x-360)))drawCat(c,cat);
  if(front)rope(c);
  if(G.chantT>0&&G.phase==='play'){c.save();c.textAlign='center';c.globalAlpha=Math.min(1,G.chantT*3);outlineText(c,G.chant,360,600,44,'#fff6e2',11);c.restore()}
  if(G.phase==='play'&&G.jumps>0){c.save();c.textAlign='center';outlineText(c,G.jumps+'',360,250,96,'#fff',18);if(G.run>=10){outlineText(c,G.run+' れんぞく',360,320,30,'#ffe27a',8)}c.restore()}
  if(G.sayT>0){const m=me();c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(m.x+120,GY-260);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-70,-28,140,52,20);c.fill();c.stroke();
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='24px "Dela Gothic One",sans-serif';c.fillText(G.say,0,-2);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?30:38;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(150,Math.min(W0-150,x.x)),x.y-x.t*30);c.globalAlpha=x.t>.7?(1-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'&&G.jumps<3&&G.t<12&&G.t%1.4<1.05){c.save();c.textAlign='center';outlineText(c,'なわが あしもとに くる まえに タップ',360,1150,28,'#fff',8);c.restore()}
  c.restore()}
