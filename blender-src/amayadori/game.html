<script>
/*ART*/const ART={},LAYER={},SCENE={pxu:160,spr:{cat:{res:256,pxu:160,feet:[128,216],head:[192,115.2]},umb:{res:320,pxu:160,grip:[160,248],R:.75,top:[160,68.8],rim:[280,120]},ajisai:{res:256,pxu:160,base:[128,216]},toro:{res:256,pxu:160,base:[128,216]},snail:{res:128,pxu:160,base:[64,88]}}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,GROUND=1050,CATX=250,DC=1.1,DU=1.15,PXM=60;
const SC=SCENE.spr.cat,SU=SCENE.spr.umb;
const UR=SU.R*SU.pxu*DU,UH=(SU.rim[1]-SU.top[1])*DU,UGRIP=(SU.grip[1]-SU.rim[1])*DU;   // canopy radius / height, grip below the rim centre

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function outlined(im,px,thr){
  const c=document.createElement('canvas');c.width=im.width+px*2;c.height=im.height+px*2;const x=c.getContext('2d');
  const m=document.createElement('canvas');m.width=im.width;m.height=im.height;const mx=m.getContext('2d');mx.drawImage(im,0,0);
  const d=mx.getImageData(0,0,m.width,m.height),a=d.data;for(let i=0;i<a.length;i+=4){const on=a[i+3]>thr;a[i]=74;a[i+1]=44;a[i+2]=29;a[i+3]=on?255:0}mx.putImageData(d,0,0);
  for(let k=0;k<16;k++){const t=k/16*Math.PI*2;x.drawImage(m,px+Math.cos(t)*px,px+Math.sin(t)*px)}
  x.drawImage(im,px,px);c.pad=px;return c}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(!i)return;IMG[k]=outlined(i,k==='snail'?2:3,90)})))}
function sprAt(c,k,ax,ay,x,y,s,rot=0,a=1,fx=1){const im=IMG[k];if(!im)return;const p=im.pad||0;c.save();c.globalAlpha*=a;c.translate(x,y);if(rot)c.rotate(rot);c.scale(s*fx,s);c.drawImage(im,-ax-p,-ay-p);c.restore()}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null,rainGain=null,rainSrc=null;const BUF={};
let muted=LS.get('amayadori-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  // soft rain bed: filtered noise
  const len=ac.sampleRate*2,nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);let b0=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.97*b0+.03*w;d[i]=(w*.25+b0*2.2)*.5}
  rainSrc=ac.createBufferSource();rainSrc.buffer=nb;rainSrc.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=2600;rainGain=ac.createGain();rainGain.gain.value=0;rainSrc.connect(f);f.connect(rainGain);rainGain.connect(master);rainSrc.start();
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function rainVol(v){if(rainGain&&ac)rainGain.gain.setTargetAtTime(v,ac.currentTime,.4)}
function setMute(m){muted=m;LS.set('amayadori-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0,dist:0,bonus:0,speed:110,wet:0,wind:0,windT:0,windNext:4,drops:[],fx:[],texts:[],props:[],puddles:[],snails:[],drips:[],leaves:[],
  umb:{x:CATX+20,y:GROUND-330},blocked:0,rainbows:0,greet:0,cat:{jump:0,stop:0,shake:0,step:0},rain:1,rainbowT:0,nextBow:100,endT:0,patT:0};
function reset(){Object.assign(G,{t:0,dist:0,bonus:0,speed:110,wet:0,wind:0,windT:0,windNext:4,drops:[],fx:[],texts:[],props:[],puddles:[],snails:[],drips:[],leaves:[],blocked:0,rainbows:0,greet:0,rain:1,rainbowT:0,nextBow:100,endT:0,patT:0});
  G.umb={x:CATX+20,y:GROUND-330};G.cat={jump:0,stop:0,shake:0,step:0};
  for(let x=-100;x<W0+400;x+=300+Math.random()*160)G.props.push({k:Math.random()<.65?'ajisai':'toro',x,s:.9+Math.random()*.3});G.puddles.push({x:W0+300,w:110});G.snails.push({x:W0+900});hud()}
function meters(){return Math.floor(G.dist/PXM+G.bonus)}
function hud(){$('scoreP').textContent=meters()+' m';$('wetFill').style.width=Math.min(100,G.wet*100)+'%';$('wetFill').style.background=G.wet>.7?'#3a6ac8':'#5aa8e8'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function umbAngle(){const cx=CATX+20,cy=GROUND-90;return Math.max(-.75,Math.min(.75,Math.atan2(G.umb.x-cx,cy-G.umb.y)))}
// is a point under/inside the canopy (seen from above)?
function inCanopy(x,y){const a=umbAngle(),dx=x-G.umb.x,dy=y-G.umb.y,c=Math.cos(-a),s=Math.sin(-a);const lx=dx*c-dy*s,ly=dx*s+dy*c;
  return ly<=6&&ly>=-UH-6&&(lx*lx)/(UR*UR)+(ly*ly)/((UH+6)*(UH+6))<=1}
function catBox(){const j=Math.sin(Math.min(1,G.cat.jump)*Math.PI)*70;return {x:CATX+10,y:GROUND-82*DC-j,rx:100*DC,ry:58*DC}}
function onCat(x,y){const b=catBox();const dx=(x-b.x)/b.rx,dy=(y-b.y)/b.ry;return dx*dx+dy*dy<=1||Math.hypot(x-(CATX+70*DC),y-(b.y-40*DC))<48*DC}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.8&&$('resultOv').hidden)showResult()}
  const play=G.phase==='play';
  // walking (stops to greet snails)
  const C=G.cat;C.shake=Math.max(0,C.shake-dt*2);
  let v=G.speed;if(C.stop>0){C.stop-=dt;v=0}if(!play)v=G.phase==='end'?0:v*0;
  if(play){G.speed=110+Math.min(70,G.t*.9);G.dist+=v*dt;C.step+=v*dt}
  const scroll=v*dt;
  for(const p of G.props)p.x-=scroll;G.props=G.props.filter(p=>p.x>-200);const lastP=G.props[G.props.length-1];if(!lastP||lastP.x<W0+200)G.props.push({k:Math.random()<.65?'ajisai':'toro',x:(lastP?lastP.x:W0)+260+Math.random()*220,s:.9+Math.random()*.3});
  for(const p of G.puddles){p.x-=scroll;if(!p.done&&p.x-p.w/2<CATX+90&&p.x>CATX-40&&C.jump<=0){C.jump=.001;sfx('splash',.35,1.2)}}
  G.puddles=G.puddles.filter(p=>p.x>-200);if(play&&G.puddles.length<2)G.puddles.push({x:W0+300+Math.random()*500,w:90+Math.random()*60});
  if(C.jump>0){C.jump+=dt*1.9;if(C.jump>=1){C.jump=0;for(let i=0;i<6;i++)G.fx.push({x:CATX+60,y:GROUND,vx:(Math.random()-.5)*200,vy:-150-Math.random()*100,t:0,life:.5,c:'rgba(200,225,250,.9)',r:4})}}
  for(const s of G.snails){s.x-=scroll;if(!s.met&&s.x<CATX+150){s.met=1;C.stop=1.3;G.greet++;G.bonus+=5;sfx('meow',.5);sfx('bonus',.5);text('こんにちは +5m',CATX+120,GROUND-260,'#ffe27a',true);for(let i=0;i<5;i++)G.fx.push({heart:1,x:CATX+120,y:GROUND-180,vx:(Math.random()-.5)*60,vy:-60-Math.random()*40,t:0,life:1.1})}}
  G.snails=G.snails.filter(s=>s.x>-100);if(play&&!G.snails.length)G.snails.push({x:W0+1200+Math.random()*900});
  // wind
  G.windT+=dt;if(play&&G.windT>G.windNext){G.windT=0;G.windNext=5+Math.random()*5;const lv=Math.min(1,.35+G.t/90);G.windTarget=(Math.random()<.5?-1:1)*(.25+Math.random()*.75)*lv;sfx('gust',.45);text(G.windTarget<0?'← かぜ':'かぜ →',360,300,'#fff',true)}
  G.wind+=((G.windTarget||0)-G.wind)*Math.min(1,dt*1.5);
  if(Math.random()<dt*Math.abs(G.wind)*5)G.leaves.push({x:G.wind>0?-20:W0+20,y:150+Math.random()*700,ph:Math.random()*7,c:['#6aa84a','#9ac060','#b0a0e0'][Math.floor(Math.random()*3)]});
  for(let i=G.leaves.length-1;i>=0;i--){const l=G.leaves[i];l.x+=G.wind*380*dt+(G.wind>0?60:-60)*dt;l.ph+=dt*5;l.y+=Math.sin(l.ph)*50*dt+20*dt;if(l.x<-40||l.x>W0+40)G.leaves.splice(i,1)}
  // rainbow breaks
  if(play&&meters()>=G.nextBow&&G.rainbowT<=0){G.rainbowT=5;G.nextBow+=100;G.rainbows++;const b=Math.round((1-G.wet)*30);G.bonus+=b;sfx('rainbow',.7);text('にじ！ ほかほか +'+b+'m',360,420,'#ffe27a')}
  if(G.rainbowT>0){G.rainbowT-=dt;G.rain=Math.max(0,G.rain-dt*1.5);G.wet=Math.max(0,G.wet-dt*.08)}else G.rain=Math.min(1,G.rain+dt*.5);
  rainVol(G.phase==='play'?.06+.1*G.rain*(1+Math.abs(G.wind)*.5):0);
  // rain
  const rate=G.rain*(70+Math.min(110,G.t*1.6));
  if(play||G.phase==='end'){let n=rate*dt;while(n>0){if(Math.random()<n){const vy=1000+Math.random()*300;G.drops.push({x:-260+Math.random()*(W0+520),y:-30,vx:G.wind*420,vy,heavy:0})}n-=1}}
  // eave drips: a shadow warns, then a burst of heavy drops
  if(play&&G.rainbowT<=0&&Math.random()<dt*Math.min(.35,.08+G.t/400)&&!G.drips.length){G.drips.push({x:CATX+(Math.random()-.3)*260,t:1.1})}
  for(let i=G.drips.length-1;i>=0;i--){const d=G.drips[i];d.t-=dt;if(d.t<=0){for(let k=0;k<6;k++)G.drops.push({x:d.x+(Math.random()-.5)*60,y:120-k*40,vx:G.wind*300,vy:1100,heavy:1});sfx('drip',.6);G.drips.splice(i,1)}}
  const sub=3;
  for(let i=G.drops.length-1;i>=0;i--){const d=G.drops[i];let gone=false;
    for(let s=0;s<sub&&!gone;s++){d.x+=d.vx*dt/sub;d.y+=d.vy*dt/sub;
      if(G.phase==='play'&&inCanopy(d.x,d.y)){gone=true;G.blocked++;if(Math.random()<.5)G.fx.push({x:d.x,y:d.y,vx:(Math.random()-.5)*160+G.wind*80,vy:-80-Math.random()*80,t:0,life:.35,c:'rgba(220,240,255,.95)',r:3});G.patT-=1;if(G.patT<=0){G.patT=6;sfx('pat',.12,1+Math.random()*.1)}}
      else if(onCat(d.x,d.y)){gone=true;if(play){G.wet+=d.heavy?.07:.016;C.shake=Math.min(1,C.shake+.25);if(d.heavy||Math.random()<.2)sfx('drip',.3,1.1);for(let k=0;k<3;k++)G.fx.push({x:d.x,y:d.y,vx:(Math.random()-.5)*180,vy:-120,t:0,life:.35,c:'rgba(160,200,240,.95)',r:3.5})}}
      else if(d.y>GROUND+40+((d.x*13)%140)){gone=true;if(Math.random()<.2)G.fx.push({ring:1,x:d.x,y:d.y,t:0,life:.35})}}
    if(gone||d.x<-300||d.x>W0+300)G.drops.splice(i,1)}
  if(play){G.wet=Math.max(0,G.wet-dt*.022);if(G.wet>=1){G.wet=1;finish()}hud()}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;if(!p.ring){p.vy+=(p.heart?-20:700)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}if(p.t>p.life)G.fx.splice(i,1)}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);rainVol(.03);sfx('soaked',.7);setTimeout(()=>sfx('over',.7),900);text('びしょびしょ… おうちに かえろう',360,560,'#fff',true)}
function rank(m){return m>=400?'つゆの おさんぽ名人':m>=250?'かさの まもりがみ':m>=150?'あめふり じょうず':m>=60?'みずたまり 見習い':'はじめての あまやどり'}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function toFrame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function drawBack(c){
  const g=c.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,'#8494ac');g.addColorStop(.7,'#b4c0d0');g.addColorStop(1,'#c8d0da');c.fillStyle=g;c.fillRect(0,0,W0,H0);
  if(G.rainbowT>0||G.rain<1){const a=Math.min(1,(1-G.rain)*1.4);c.save();c.globalAlpha=a*.75;['#f07a7a','#f0b860','#f0e070','#8ad08a','#7ab0f0','#a88ae0'].forEach((col,i)=>{c.strokeStyle=col;c.lineWidth=16;c.beginPath();c.arc(360,760,520-i*16,Math.PI*1.08,Math.PI*1.92);c.stroke()});c.restore()}
  // far roofs (slow parallax)
  const off=(G.dist*.25)%240;c.fillStyle='#7a8698';
  for(let k=-1;k<5;k++){const x=k*240-off,h=hash(Math.floor((G.dist*.25)/240)+k);const top=640+h*60;c.beginPath();c.moveTo(x,820);c.lineTo(x,top+40);c.lineTo(x+110,top);c.lineTo(x+230,top+40);c.lineTo(x+230,820);c.fill()}
  c.fillStyle='#8a96a8';c.fillRect(0,800,W0,60);
  // stone wall
  const wo=G.dist%96;c.fillStyle='#a8a59c';c.fillRect(0,850,W0,GROUND-850);c.strokeStyle='#8a877e';c.lineWidth=3;
  for(let r=0;r<4;r++){const y=850+r*50;c.beginPath();c.moveTo(0,y);c.lineTo(W0,y);c.stroke();for(let x=-wo+(r%2)*48;x<W0;x+=96){c.beginPath();c.moveTo(x,y);c.lineTo(x,y+50);c.stroke()}}
  c.fillStyle='#6a7a58';c.fillRect(0,842,W0,14);
  // sidewalk
  const sg=c.createLinearGradient(0,GROUND,0,H0);sg.addColorStop(0,'#7c8088');sg.addColorStop(1,'#5c6068');c.fillStyle=sg;c.fillRect(0,GROUND-10,W0,H0-GROUND+10);
  c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=3;const so=G.dist%180;for(let x=-so;x<W0;x+=180){c.beginPath();c.moveTo(x,GROUND+10);c.lineTo(x-60,H0);c.stroke()}
  for(const p of G.puddles){c.fillStyle='rgba(180,200,225,.55)';c.beginPath();c.ellipse(p.x,GROUND+22,p.w/2,16,0,0,7);c.fill();c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.ellipse(p.x-10,GROUND+20,p.w/4,6,0,Math.PI,Math.PI*1.8);c.stroke()}}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#9aaec4';c.fillRect(0,0,CW,CH);
  if(OY>0){c.fillStyle='#8494ac';c.fillRect(0,0,CW,OY+2);c.fillStyle='#5c6068';c.fillRect(0,OY+H0*S-2,CW,CH)}
  c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  drawBack(c);
  for(const p of G.props)sprAt(c,p.k,128,216,p.x,GROUND+4,1.05*p.s);
  for(const s of G.snails)sprAt(c,'snail',64,88,s.x,GROUND+6,1.2,0,1,-1);
  // eave-drip warning shadows
  for(const d of G.drips){c.fillStyle=`rgba(40,60,90,${.25+.25*Math.sin(G.t*20)})`;c.beginPath();c.ellipse(d.x,GROUND+8,40,10,0,0,7);c.fill();c.save();c.font='30px "Dela Gothic One",sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=7;c.strokeStyle='#4a2c1d';c.strokeText('ぼたっ',d.x,200);c.fillStyle='#bfe0ff';c.fillText('ぼたっ',d.x,200);c.restore()}
  // cat
  const C=G.cat;const j=C.jump>0?Math.sin(C.jump*Math.PI)*70:0;const key=C.jump>0?'cat_jump':(G.wet>.65&&C.shake>.3)||G.phase==='end'?'cat_wet':(Math.floor(C.step/34)%2?'cat_w1':'cat_w0');
  c.fillStyle='rgba(40,50,70,.25)';c.beginPath();c.ellipse(CATX+10,GROUND+8,90-j*.4,12,0,0,7);c.fill();
  sprAt(c,key,SC.feet[0],SC.feet[1],CATX+(C.shake>0?Math.sin(G.t*50)*3*C.shake:0),GROUND-j+(key.startsWith('cat_w')&&key!=='cat_wet'?Math.abs(Math.sin(C.step/34*Math.PI))*-3:0),DC);
  // umbrella
  if(G.phase!=='title'){const a=umbAngle();c.save();c.translate(G.umb.x,G.umb.y);c.rotate(a);sprAt(c,'umb',SU.rim[0]-SU.R*SU.pxu,SU.rim[1],0,0,DU);c.restore()}
  // rain
  c.strokeStyle='rgba(225,238,255,.75)';c.lineWidth=2.4;c.lineCap='round';c.beginPath();
  for(const d of G.drops){const L=d.heavy?40:26,k=L/Math.hypot(d.vx,d.vy);c.moveTo(d.x,d.y);c.lineTo(d.x-d.vx*k,d.y-d.vy*k)}c.stroke();
  c.strokeStyle='rgba(200,225,255,.95)';c.lineWidth=5;c.beginPath();for(const d of G.drops)if(d.heavy){c.moveTo(d.x,d.y);c.lineTo(d.x-d.vx*.03,d.y-30)}c.stroke();
  for(const l of G.leaves){c.save();c.translate(l.x,l.y);c.rotate(l.ph);c.fillStyle=l.c;c.beginPath();c.ellipse(0,0,11,5,0,0,7);c.fill();c.restore()}
  for(const p of G.fx){const a=Math.max(0,1-p.t/p.life);if(p.ring){c.strokeStyle=`rgba(220,235,255,${a*.7})`;c.lineWidth=2;c.beginPath();c.ellipse(p.x,p.y,6+p.t*50,2+p.t*14,0,0,7);c.stroke();continue}
    if(p.heart){c.save();c.globalAlpha=a;c.font='26px sans-serif';c.textAlign='center';c.fillStyle='#f07a8a';c.fillText('♥',p.x,p.y);c.restore();continue}
    c.globalAlpha=a;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}c.globalAlpha=1;
  // wind gauge
  if(G.phase==='play'&&Math.abs(G.wind)>.12){c.save();c.translate(360,250);c.scale(Math.sign(G.wind),1);c.globalAlpha=Math.min(1,Math.abs(G.wind)*1.5);c.fillStyle='#fff';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.moveTo(-40,-10);c.lineTo(10,-10);c.lineTo(10,-24);c.lineTo(44,0);c.lineTo(10,24);c.lineTo(10,10);c.lineTo(-40,10);c.closePath();c.fill();c.stroke();c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.4){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?28:36;c.font=`${sz}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(170,Math.min(W0-170,x.x)),x.y-x.t*30);c.globalAlpha=x.t>1.1?(1.4-x.t)/.3:1;
    c.lineJoin='round';c.lineWidth=sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  if(G.phase==='play'&&G.t<5&&G.t%1.4<1){c.save();c.font='30px "Dela Gothic One",sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=8;c.strokeStyle='#4a2c1d';c.strokeText('なぞって かさを うごかそう',360,1180);c.fillStyle='#fff';c.fillText('なぞって かさを うごかそう',360,1180);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input: relative drag moves the umbrella ---------- */
let pid=null,lp=null;

cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;pid=e.pointerId;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);lp=toFrame(e)},{passive:false});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid||!lp)return;const p=toFrame(e);moveUmb(p.x-lp.x,p.y-lp.y);lp=p});
cv.addEventListener('pointerup',e=>{if(e.pointerId!==pid)return;pid=null;lp=null});cv.addEventListener('pointercancel',e=>{if(e.pointerId!==pid)return;pid=null;lp=null});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;reset();G.phase='play';
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
