<script>
/*ART*/const ART={},LAYER={},SCENE={ring:[[120,780],[600,780]],top:[360,780],boxL:[56,822],boxR:[664,822],spr:{wr:{res:256,pxu:160,foot:[128,208],nose:[233.6,128],back:[70.4,140.8]}},pxu:160};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,TOP=SCENE.top[1],RL=SCENE.ring[0][0],RRt=SCENE.ring[1][0],WS=1.1,WF=SCENE.spr.wr.foot,NOSE=(SCENE.spr.wr.nose[0]-WF[0])*WS*.8,BOUTS=8;
const FOES=[{cat:'shiro',n:'しろやま',rate:3.2,wt:1,kick:1},{cat:'saba',n:'さばのうみ',rate:3.9,wt:1.08,kick:1.05},{cat:'mike',n:'みけのはな',rate:4.4,wt:1.12,kick:1.1},{cat:'hachi',n:'はちわれ山',rate:5.0,wt:1.2,kick:1.1}];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('tonton-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('tonton-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0};
function rnd(a,b){return a+Math.random()*(b-a)}
function fresh(){return {tapsB:[],phase:'play',t:0,score:0,bout:0,w:0,l:0,outs:0,falls:0,stage:'',st:0,A:null,B:null,foe:null,texts:[],fx:[],shake:0,aiT:0,pawA:0,pawB:0,say:'',sayT:0,endT:0,res:null,taps:[]}}
function reset(){Object.assign(G,fresh());G.phase='title';G.A=wr('tora',260,1);G.B=wr('shiro',460,-1);hud()}
function hud(){$('recP').textContent=G.w+'しょう '+G.l+'はい';$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.6}
function wr(cat,x,dir){return {cat,x,dir,th:0,om:0,state:'stand',st:0,bob:0}}
function pickFoe(){const lv=Math.min(3,Math.floor(G.bout/2));const f=FOES[Math.min(3,lv+(Math.random()<.3?1:0))];return f}
function newBout(){G.foe=pickFoe();G.A=wr('tora',250,1);G.B=wr(G.foe.cat,470,-1);G.stage='ready';G.st=0;G.res=null;G.taps=[];G.tapsB=[];hud();text((G.bout+1)+'ばんめ  '+G.foe.n,360,330,'#fff')}
function tapSide(own){const me=own==='A',w=me?G.A:G.B,o=me?G.B:G.A,f=G.foe;if(G.stage!=='fight'||G.res)return;
  const kick=me?1:f.kick;G.shake=.08;if(me){G.pawA=.12;sfx('ton',.6,1+Math.random()*.06)}else{G.pawB=.12;sfx('ton2',.45,1+Math.random()*.06)}
  const sA=rnd(6,22)/(me?1:f.wt),sO=rnd(1,5);
  // nearby taps (fast tapping) make your own wrestler shakier
  (me?G.taps:G.tapsB).push(G.t);
  const fast=me?Math.max(0,G.taps.length-4)*.6:0;
  w.om+=(rnd(-.55,1.0)+fast*rnd(-1,1))*1.6*kick*w.dir;o.om+=rnd(-1,1)*.55*o.dir;
  const stab=1-Math.min(1,Math.abs(w.th)/.78)*.8;move(w,sA*stab*w.dir);move(o,sO*o.dir);
  for(let k=0;k<3;k++)G.fx.push({x:me?SCENE.boxL[0]+40:SCENE.boxR[0]-40,y:SCENE.boxL[1]+10,vx:rnd(-60,60),vy:rnd(-140,-60),t:0,life:.3})}
function contact(){return G.B.x-G.A.x<NOSE*2}
function move(w,dx){const o=w===G.A?G.B:G.A;
  if(contact()&&Math.sign(dx)===w.dir){if(Math.abs(dx)>9&&Math.random()<.4)sfx('clash',.25,1+Math.random()*.1)}
  else w.x+=dx;
  if(G.B.x-G.A.x<NOSE*2-6){const mid=(G.A.x+G.B.x)/2;G.A.x=mid-NOSE+3;G.B.x=mid+NOSE-3}}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;G.st+=dt;G.sayT=Math.max(0,G.sayT-dt);G.shake=Math.max(0,G.shake-dt);G.pawA=Math.max(0,G.pawA-dt);G.pawB=Math.max(0,G.pawB-dt);
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.6&&$('resultOv').hidden)showResult()}
  const play=G.phase==='play';
  if(play&&G.stage==='ready'){if(G.st>.2&&G.st-dt<=.2){text('はっけよい…',360,420,'#fff');sfx('hakkeyoi',.5)}if(G.st>1.5){G.stage='fight';G.st=0;text('のこった！',360,420,'#ffe27a');sfx('hakkeyoi',.7,1.5);G.aiT=rnd(.2,.5)}}
  if(play&&G.stage==='fight'&&!G.res){G.aiT-=dt;if(G.aiT<=0){const f=G.foe;G.aiT=1/f.rate*rnd(.6,1.4);
      // the cat calms down when its wrestler wobbles
      if(Math.abs(G.B.th)>.42&&Math.random()<.6)G.aiT+=.35;tapSide('B')}}
  for(const q of [G.taps,G.tapsB])while(q.length&&G.t-q[0]>1)q.shift();
  if(play&&G.stage==='fight'&&!G.res&&contact()){const sa=1-Math.min(1,Math.abs(G.A.th)/.78)*.7,sb=1-Math.min(1,Math.abs(G.B.th)/.78)*.7;G.drift=(G.drift||0)+(((G.taps.length*sa-G.tapsB.length*G.foe.wt*sb)*30+rnd(-40,40))-(G.drift||0))*Math.min(1,dt*3);G.A.x+=G.drift*dt;G.B.x+=G.drift*dt}else G.drift=0;
  for(const w of [G.A,G.B]){if(!w)continue;w.st+=dt;
    if(w.state==='stand'){const lean=G.stage==='fight'&&contact()?8:0;const K=30+lean;w.om+=(-K*w.th-4*w.om)*dt;w.th+=w.om*dt;
      if(Math.abs(w.th)>.78&&play&&G.stage==='fight'&&!G.res){w.state='fall';w.st=0;w.fdir=Math.sign(w.th);sfx('fall',.6);decide(w,'fall')}}
    else if(w.state==='fall'){w.th+=(w.fdir*1.5-w.th)*Math.min(1,dt*8)}
    if(play&&G.stage==='fight'&&!G.res&&w.state==='stand'&&(w.x<RL||w.x>RRt)){sfx('out',.6);decide(w,'out')}}
  if(play&&G.stage==='fight'&&!G.res&&G.st>20){G.res='draw';G.st=0;text('みずいり（ひきわけ）',360,420,'#fff');sfx('hakkeyoi',.5)}
  if(play&&G.res&&G.st>2.2){G.bout++;if(G.bout>=BOUTS)finish();else newBout()}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.t>p.life)G.fx.splice(i,1)}}
function decide(loser,how){const win=loser===G.B;G.res=win?'win':'lose';G.st=0;
  // pushing out vs. knocking over; falling backwards on your own is a self-defeat
  const self=how==='fall'&&((loser.dir>0&&loser.th<0)||(loser.dir<0&&loser.th>0))&&!contact();
  const km=how==='out'?'おしだし':self?'ひとりずもう':'つきたおし';
  if(win){G.w++;const pts=100+(G.st<6?30:0)+(km==='おしだし'?20:0);G.score+=pts;if(km==='おしだし')G.outs++;else G.falls++;sfx('win',.7);sfx('meow',.3);text(km+'！ +'+pts,360,420,'#ffe27a');say(['まけたにゃ','つよいね','くやしい'][Math.floor(Math.random()*3)])}
  else{G.l++;sfx('lose',.7);text(km+'…',360,420,'#ffd0c0');say('ごっつぁん')}
  hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(w,l){return w>=8?'ぜんしょう ゆうしょう':w>=7?'よこづな':w>=6?'おおぜき':w>l?'かちこし！':w===l?'ごぶ':w>=2?'まけこし…':'ふんどし かつぎ'}
function showResult(){const n=G.score,best=LS.get('tonton-best',0),nb=n>best;if(nb){LS.set('tonton-best',n);if(n>0)sfx('best',.6)}
  $('resRec').textContent=G.w+'しょう '+G.l+'はい';$('rScore').textContent=n;$('rOut').textContent=G.outs;$('rFall').textContent=G.falls;$('resRank').textContent=rank(G.w,G.l);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.w>G.l?'かちこし おめでとう！ はやく きめると ボーナス。':'れんだ しすぎると ぐらぐら。<br>「とん、とん」と リズムよく！');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの とんとんずもう🐾 ${G.w}しょう${G.l}はい ${n}てん「${rank(G.w,G.l)}」\n#とんとんずもう #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/tonton.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function drawW(c,w,dy){const im=IMG['wr_'+w.cat];c.save();c.translate(w.x,TOP+dy);c.scale(w.dir,1);c.rotate(w.th*w.dir);c.scale(WS,WS);if(im)c.drawImage(im,-WF[0],-WF[1],256,256);else{c.fillStyle='#f0b060';c.fillRect(-50,-140,100,140)}c.restore()}
function paw(c,x,y,t,flip){const k=t>0?Math.sin(t/.12*Math.PI)*-26:0;c.save();c.translate(x,y+k-40);c.scale(flip?-1:1,1);c.fillStyle='#fbf6ec';c.strokeStyle='#4a2c1d';c.lineWidth=5;c.beginPath();c.ellipse(0,0,46,34,0,0,7);c.fill();c.stroke();
  c.fillStyle='#f0a8a0';for(const [dx,dy,r] of [[-22,-14,8],[0,-20,8],[22,-14,8],[0,6,14]]){c.beginPath();c.arc(dx,dy,r,0,7);c.fill()}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#efe2c8';c.fillRect(0,0,CW,CH);
  if(OY>0){c.fillStyle='#d4cc96';c.fillRect(0,OY+H0*S-2,CW,CH)}
  c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  const sh=G.shake>0?Math.sin(G.t*90)*3:0;
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#c8a070';c.fillRect(56,780,608,200)}
  if(G.A&&G.B){if(G.A.state==='fall'||G.A.x<G.B.x){drawW(c,G.A,sh);drawW(c,G.B,sh)}else{drawW(c,G.B,sh);drawW(c,G.A,sh)}}
  // paws tapping the box edges
  if(G.phase==='play'||G.phase==='end'){paw(c,SCENE.boxL[0]+30,SCENE.boxL[1]+90,G.pawA,false);paw(c,SCENE.boxR[0]-30,SCENE.boxR[1]+90,G.pawB,true);
    c.save();c.textAlign='center';outlineText(c,'あなた',SCENE.boxL[0]+60,SCENE.boxL[1]+175,26,'#ffe27a',7);outlineText(c,G.foe?G.foe.n:'',SCENE.boxR[0]-80,SCENE.boxR[1]+175,26,'#fff',7);c.restore();
    // wobble meter for your wrestler
    if(G.A){const v=Math.min(1,Math.abs(G.A.th)/.78);c.save();c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(200,1080,320,26,12);c.fill();c.save();c.clip();c.fillStyle=v>.7?'#e05a4a':v>.45?'#f2c14e':'#7ac070';c.fillRect(200,1080,320*v,26);c.restore();c.stroke();c.textAlign='center';outlineText(c,'ぐらぐら',360,1066,24,'#fff',6);c.restore()}}
  for(const p of G.fx){const a=Math.max(0,1-p.t/p.life);c.fillStyle=`rgba(255,250,230,${a})`;c.beginPath();c.arc(p.x,p.y,4,0,7);c.fill()}
  if(G.sayT>0&&G.B){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(Math.min(560,G.B.x+40),TOP-230);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-90,-28,180,52,20);c.fill();c.stroke();c.beginPath();c.moveTo(-20,22);c.lineTo(-40,46);c.lineTo(10,24);c.fill();c.textAlign='center';c.textBaseline='middle';c.font='24px "Dela Gothic One",sans-serif';c.fillStyle='#4a2c1d';c.fillText(G.say,0,0);c.restore()}
  for(let i=(G.texts||[]).length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.4){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?28:40;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(170,Math.min(W0-170,x.x)),x.y-x.t*22);c.globalAlpha=x.t>1.1?(1.4-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'&&G.bout===0&&G.stage==='fight'&&G.st<4&&G.t%1.2<.9){c.save();c.textAlign='center';outlineText(c,'タップで とんとん',360,1170,32,'#fff',8);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase==='play')tapSide('A')},{passive:false});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();if(G.phase==='play')tapSide('A')}});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;Object.assign(G,fresh());newBout();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);reset();for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('tonton-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({tonton:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,tapSide};
</script>
<script>
function pingPlay(){
  var G="ねこの とんとんずもう", K="picoruno-played:"+G;
  try{ if(sessionStorage.getItem(K)) return; sessionStorage.setItem(K,"1"); }catch(e){}
  var KEY="sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
  fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play",{method:"POST",keepalive:true,
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({g:G})})
  .then(function(r){ if(!r.ok) throw 0; })
  .catch(function(){ try{ var d=JSON.parse(localStorage.getItem("picoruno-stats")||"{}"); d[G]=d[G]||{plays:0,likes:0}; d[G].plays++; localStorage.setItem("picoruno-stats",JSON.stringify(d)); }catch(e){} });
}
</script>
