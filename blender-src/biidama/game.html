<script>
/*ART*/const ART={},LAYER={},SCENE={},LEVELS=[];/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,MR=19,HR=26,ACC=1100,TMAX=110,BX0=60,BX1=660,BY0=210,BY1=1150;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('biidama-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('biidama-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0,texts:[],lv:0,m:{x:0,y:0,vx:0,vy:0}};
function fresh(){return {phase:'play',t:0,lv:0,lives:3,m:{x:0,y:0,vx:0,vy:0,a:0},tilt:[0,0],state:'roll',stT:0,lvT:0,total:0,cleared:0,score:0,texts:[],say:'',sayT:0,endT:0,fallAt:null,bumpT:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('lvP').textContent=Math.min(G.lv+1,LEVELS.length)+' / '+LEVELS.length;$('scoreP').textContent=(G.total+G.lvT).toFixed(1)+' びょう'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}
function L(){return LEVELS[G.lv]}
function place(){const [x,y]=L().start;Object.assign(G.m,{x,y,vx:0,vy:0});G.state='roll';G.stT=0}

/* ---------- physics ---------- */
function collide(){const m=G.m;let hit=0;
  const rects=L().walls;
  for(const [x,y,w,h] of rects){const cx=Math.max(x,Math.min(x+w,m.x)),cy=Math.max(y,Math.min(y+h,m.y)),dx=m.x-cx,dy=m.y-cy,d=Math.hypot(dx,dy);
    if(d<MR&&d>0){const nx=dx/d,ny=dy/d,vn=m.vx*nx+m.vy*ny;m.x=cx+nx*MR;m.y=cy+ny*MR;if(vn<0){m.vx-=1.4*vn*nx;m.vy-=1.4*vn*ny;hit=Math.max(hit,-vn)}}
    else if(d===0){m.y=y-MR}}
  if(m.x<BX0+MR){m.x=BX0+MR;if(m.vx<0){hit=Math.max(hit,-m.vx);m.vx*=-.4}}if(m.x>BX1-MR){m.x=BX1-MR;if(m.vx>0){hit=Math.max(hit,m.vx);m.vx*=-.4}}
  if(m.y<BY0+MR){m.y=BY0+MR;if(m.vy<0){hit=Math.max(hit,-m.vy);m.vy*=-.4}}if(m.y>BY1-MR){m.y=BY1-MR;if(m.vy>0){hit=Math.max(hit,m.vy);m.vy*=-.4}}
  if(hit>140&&G.bumpT<=0){sfx('bump',Math.min(.8,hit/700),1+Math.random()*.1);G.bumpT=.08}}
function step(dt){
  G.t+=dt;G.stT+=dt;G.sayT=Math.max(0,G.sayT-dt);G.bumpT-=dt;
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  const m=G.m;
  if(G.state==='roll'){G.lvT+=dt;
    const k=pd?1:0;if(!pd){G.tilt[0]*=Math.pow(.02,dt);G.tilt[1]*=Math.pow(.02,dt)}
    const sub=4;for(let i=0;i<sub;i++){const h=dt/sub;m.vx+=G.tilt[0]*ACC*h;m.vy+=G.tilt[1]*ACC*h;const f=Math.pow(.55,h);m.vx*=f;m.vy*=f;m.x+=m.vx*h;m.y+=m.vy*h;collide()}
    m.a+=Math.hypot(m.vx,m.vy)*dt/MR;
    for(const [hx,hy] of L().holes){if(Math.hypot(m.x-hx,m.y-hy)<HR-5){G.state='fall';G.stT=0;G.fallAt=[hx,hy];sfx('drop',.7);sfx('fall',.5);G.lives--;say(['あっ','おちた〜','ころん'][G.lives%3]);text('あなに おちた',hx,hy-60,'#ffd0c0',true);break}}
    const [gx,gy]=L().goal;if(G.state==='roll'&&Math.hypot(m.x-gx,m.y-gy)<22){G.state='goal';G.stT=0;G.fallAt=[gx,gy];sfx('goal',.7);sfx('levelup',.5);
      const pts=500+Math.max(0,Math.round((40-G.lvT)*15));G.score+=pts;G.cleared++;text(`ゴール！ +${pts}`,360,560,'#ffe27a');say(G.lvT<15?'はやい！':'ゴール')}}
  else if(G.state==='fall'){if(G.stT>1.1){if(G.lives<=0)finish();else place()}}
  else if(G.state==='goal'){if(G.stT>1.6){G.total+=G.lvT;G.lvT=0;G.lv++;if(G.lv>=LEVELS.length){G.score+=G.lives*300;finish()}else{place();text((G.lv+1)+'まいめ',360,620,'#fff');sfx('start',.4)}}}
  hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=5000?'めいろ めいじん':n>=4200?'ころころ マイスター':n>=3200?'かたむけ じょうず':n>=1800?'ビーだま みならい':'はじめての めいろ'}
function showResult(){const n=G.score,best=LS.get('biidama-best',0),nb=n>best;if(nb){LS.set('biidama-best',n);if(n>0)sfx('best',.6)}
  $('resHead').textContent=G.cleared>=LEVELS.length?'5まい ぜんぶ クリア！':'きょうの めいろ';
  $('resScore').textContent=n+' てん';$('rLv').textContent=G.cleared+'/'+LEVELS.length;$('rTime').textContent=(G.total+G.lvT).toFixed(1)+'びょう';$('rLife').textContent=Math.max(0,G.lives);$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.cleared>=LEVELS.length?'すいすい ころがせたね。':'ゆびを すこしだけ ずらすと、ゆっくり ころがるよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ころころ ビーだま めいろ🔵 ${n}てん（${G.cleared}まい クリア）「${rank(n)}」\n#ビーだまめいろ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/biidama.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#8a6040';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  const lv=G.phase==='title'?0:Math.min(G.lv,LEVELS.length-1),bg=IMG['bg'+lv],tx=G.tilt[0]*8,ty=G.tilt[1]*8;
  c.save();c.translate(-tx*.5,-ty*.5);if(bg)c.drawImage(bg,0,0,W0,H0);
  // light shading on the side tipped down
  if(G.phase==='play'&&(Math.abs(G.tilt[0])+Math.abs(G.tilt[1])>.05)){const g=c.createLinearGradient(360-G.tilt[0]*360,640-G.tilt[1]*640,360+G.tilt[0]*360,640+G.tilt[1]*640);g.addColorStop(0,'rgba(255,250,230,.12)');g.addColorStop(1,'rgba(60,30,10,.16)');c.fillStyle=g;c.fillRect(40,190,640,980)}
  if(G.phase!=='title'){const m=G.m;let x=m.x,y=m.y,k=1;
    if(G.state==='fall'||G.state==='goal'){const p=Math.min(1,G.stT/.35);x=m.x+(G.fallAt[0]-m.x)*p;y=m.y+(G.fallAt[1]-m.y)*p;k=G.state==='fall'?1-p*.6:1-p*.25}
    if(!(G.state==='fall'&&G.stT>.5)){c.fillStyle='rgba(40,20,5,.28)';c.beginPath();c.ellipse(x+5,y+7,MR*k,MR*k*.9,0,0,7);c.fill();
      const im=IMG.marble,s=MR*2*1.55*k;c.save();c.translate(x,y);c.rotate(m.a);if(im)c.drawImage(im,-s/2,-s/2,s,s);else{c.fillStyle='#7ac8e8';c.beginPath();c.arc(0,0,MR*k,0,7);c.fill()}c.restore()}}
  c.restore();
  // the touch "stick"
  if(pd&&G.phase==='play'){const [sx,sy]=pd.s,[cx,cy]=pd.c;c.save();c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=5;c.beginPath();c.arc(sx,sy,90,0,7);c.stroke();c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(sx+(cx-sx),sy+(cy-sy),30,0,7);c.fill();c.restore()}
  if(G.phase!=='title'){c.save();for(let i=0;i<3;i++){c.globalAlpha=i<G.lives?1:.22;c.fillStyle='#7ac8e8';c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.arc(70+i*46,1220,16,0,7);c.fill();c.stroke()}c.restore()}
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(520,1220);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-100,-26,200,50,20);c.fill();c.stroke();
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='24px "Dela Gothic One",sans-serif';c.fillText(G.say,0,-1);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.3){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?30:40;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(170,Math.min(W0-170,x.x)),x.y-x.t*24);c.globalAlpha=x.t>1?(1.3-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'&&G.lv===0&&G.lvT<4&&!pd){c.save();c.textAlign='center';outlineText(c,'ゆびを おいて ずらすと かたむくよ',360,150,28,'#fff',8);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

let pd=null;
function toGame(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left-OX)/S,(e.clientY-r.top-OY)/S]}
function setTilt(dx,dy){const d=Math.hypot(dx,dy),k=Math.min(1,d/TMAX)/(d||1);G.tilt=[dx*k,dy*k]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=toGame(e);pd={s:p,c:p}},{passive:false});
cv.addEventListener('pointermove',e=>{if(!pd)return;const p=toGame(e);const dx=p[0]-pd.s[0],dy=p[1]-pd.s[1],d=Math.hypot(dx,dy),k=d>90?90/d:1;pd.c=[pd.s[0]+dx*k,pd.s[1]+dy*k];setTilt(dx,dy)});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,()=>{pd=null});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;Object.assign(G,fresh());place();hud();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;pd=null;G.tilt=[0,0];G.phase='pause';$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);reset();for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('biidama-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({biidama:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,setTilt,LEVELS,hold:v=>{pd=v?{s:[0,0],c:[0,0]}:null}};
