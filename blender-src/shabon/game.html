<script>
/*ART*/const ART={},LAYER={},SCENE={tip:[459,849],horizon:560,cat:[360,852],spr:{hoop:{res:256,pxu:128,r:102.4}}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,TIP=SCENE.tip,TIME=60,GROW=58,R0=12,HR=SCENE.spr.hoop.r,FITK=.82;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})));if(ART.hoop_green)$('kG').src=ART.hoop_green;if(ART.hoop_gold)$('kY').src=ART.hoop_gold}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('shabon-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('shabon-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0,bubbles:[],hoops:[],fx:[],texts:[],clouds:[]};
function rnd(a,b){return a+Math.random()*(b-a)}
function fresh(){return {phase:'play',t:0,left:TIME,score:0,passes:0,fits:0,golds:0,pops:0,combo:0,maxCombo:0,biggest:0,blow:null,holding:false,cool:0,bubbles:[],hoops:[],fx:[],texts:[],spawnT:.3,goldN:0,say:'',sayT:0,endT:0,wind:0,clouds:G.clouds}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){const s=Math.ceil(G.left);$('timeP').textContent=s;$('timeP').classList.toggle('low',s<=10&&G.phase==='play');$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.3}
for(let i=0;i<5;i++)G.clouds.push({x:rnd(-100,800),y:rnd(90,520),s:rnd(.6,1.3),v:rnd(6,16)});

/* ---------- hoops ---------- */
function spd(){return 1+Math.min(.7,G.t/70)}
function spawnHoop(){const fromL=Math.random()<.5,gold=G.t>8&&Math.random()<.16,R=gold?rnd(56,76):rnd(64,112);
  let y;for(let k=0;k<12;k++){y=rnd(250,600);if(G.hoops.every(h=>Math.abs(h.y-y)>70))break}
  G.hoops.push({x:fromL?-R-20:W0+R+20,y,R,vx:(fromL?1:-1)*rnd(55,115)*(gold?1.5:1)*spd(),gold,flash:0,bob:rnd(0,6)})}
function hoopY(h){return h.y+Math.sin(G.t*1.6+h.bob)*8}

/* ---------- input ---------- */
function press(){if(G.phase!=='play'||G.holding)return;G.holding=true;if(G.cool>0||G.blow)return;
  G.blow={r:R0,max:rnd(62,124),t:0};sfx('blow',.35)}
function release(){if(!G.holding)return;G.holding=false;const b=G.blow;if(!b||G.phase!=='play')return;G.blow=null;
  const p=blowPos(b.r);G.bubbles.push({x:p[0],y:p[1],r:b.r,vy:-(232-b.r*1.15),ph:rnd(0,6),t:0,done:new Set()});sfx('puff',.45,b.r>70?.75:b.r<30?1.5:1);G.biggest=Math.max(G.biggest,b.r)}
function blowPos(r){return [TIP[0]+r*.55,TIP[1]-r*.85-4]}

/* ---------- step ---------- */
function popAt(x,y,r,why){G.pops++;G.combo=0;sfx('pop',.6,r>70?.75:1);text(why||'ぱちん',x,y-r-20,'#ffd8e4',true);
  for(let k=0;k<12;k++){const a=k/12*Math.PI*2;G.fx.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:Math.cos(a)*rnd(60,160),vy:Math.sin(a)*rnd(60,160),t:0,life:.45,c:'#bfe6ff',s:5})}}
function score(bu,h,dx){const Rin=h.R*.93,k=Math.min(1,bu.r/Rin),fit=k>=FITK;
  let pts=30+Math.round(k*70/10)*10;if(fit)pts*=2;if(h.gold)pts*=3;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);if(G.combo>=2)pts+=10*Math.min(G.combo-1,10);
  G.score+=pts;G.passes++;if(fit)G.fits++;if(h.gold)G.golds++;h.flash=.5;bu.through=(bu.through||0)+1;
  sfx(h.gold?'gold':'pass',.55,fit?1.12:1);if(fit)sfx('fit',.35);if(h.gold)sfx('levelup',.5);
  const hy=hoopY(h);text((fit?'ぴったり！ ':'')+'+'+pts,bu.x,hy-60,fit||h.gold?'#ffe27a':'#fff',!fit&&!h.gold);
  if(bu.through>=2)text('ダブル くぐり！',360,200,'#ffe27a');
  if(fit)say(['にゃ〜ん','ぴったり！','ふふん'][G.fits%3]);
  for(let k=0;k<(fit?16:8);k++)G.fx.push({x:h.x+rnd(-h.R,h.R),y:hy+rnd(-10,10),vx:rnd(-90,90),vy:rnd(-160,-30),t:0,life:.6,c:h.gold?'#f2c84a':'#fff6a0',s:fit?6:4});hud()}
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);G.cool=Math.max(0,G.cool-dt);G.wind=0;
  for(const c of G.clouds){c.x+=c.v*dt;if(c.x>W0+150){c.x=-150;c.y=rnd(90,520)}}
  const play=G.phase==='play';
  if(play){G.left-=dt;if(G.left<=0){G.left=0;finish()}hud();
    G.spawnT-=dt;if(G.spawnT<=0&&G.hoops.length<4){spawnHoop();G.spawnT=rnd(1.6,2.6)/spd()}
    if(G.holding&&!G.blow&&G.cool<=0)G.blow={r:R0,max:rnd(62,124),t:0};
    const b=G.blow;if(b){b.t+=dt;b.r+=GROW*dt*(1-.25*Math.min(1,b.r/120));if(b.r>=b.max){const p=blowPos(b.r);popAt(p[0],p[1],b.r,'ふくらませすぎ！');say('にゃっ!?');G.blow=null;G.cool=.6}}}
  for(const h of G.hoops){h.x+=h.vx*dt;h.flash=Math.max(0,h.flash-dt)}
  G.hoops=G.hoops.filter(h=>h.x>-h.R-60&&h.x<W0+h.R+60);
  for(let i=G.bubbles.length-1;i>=0;i--){const bu=G.bubbles[i],py=bu.y;bu.t+=dt;bu.y+=bu.vy*dt;bu.x+=(G.wind+Math.sin(bu.t*1.7+bu.ph)*10)*dt;let dead=false;
    for(const h of G.hoops){if(bu.done.has(h))continue;const hy=hoopY(h);if(py>=hy&&bu.y<hy){bu.done.add(h);const dx=Math.abs(bu.x-h.x),Rin=h.R*.93,Rout=h.R*1.08;
      if(dx+bu.r*.7<=Rin){score(bu,h,dx)}else if(dx-bu.r*.7<Rout){if(bu.r>Rin&&dx<Rin)popAt(bu.x,bu.y,bu.r,'おおきすぎ！');else popAt(bu.x,bu.y,bu.r,'ぱちん');sfx('pop',.3);dead=true;break}}}
    if(!dead&&(bu.y<-bu.r-20||bu.x<-bu.r-40||bu.x>W0+bu.r+40)){if(!bu.through&&G.phase==='play')G.combo=0;dead=true}
    if(dead)G.bubbles.splice(i,1)}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;if(p.t>p.life)G.fx.splice(i,1)}
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.8&&$('resultOv').hidden)showResult()}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;G.holding=false;if(G.blow){const p=blowPos(G.blow.r);G.bubbles.push({x:p[0],y:p[1],r:G.blow.r,vy:-(232-G.blow.r*1.15),ph:0,t:0,done:new Set(G.hoops)});G.blow=null}
  for(const bu of G.bubbles)for(const h of G.hoops)bu.done.add(h);duck(.08,.2);sfx('over',.7);text('おしまい',360,460,'#fff');hud()}
function rank(n){return n>=4000?'しゃぼんだま めいじん':n>=2600?'にじいろ マイスター':n>=1500?'えんがわの スター':n>=700?'ふわふわ じょうず':'はじめての しゃぼんだま'}
function showResult(){const n=G.score,best=LS.get('shabon-best',0),nb=n>best;if(nb){LS.set('shabon-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rPass').textContent=G.passes;$('rFit').textContent=G.fits;$('rCombo').textContent=G.maxCombo;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.fits>=5?'ぴったりが '+G.fits+'かい、おみごと！':'わっかに ぎりぎり はいる おおきさが ぴったり（とくてん 2ばい）。<br>きんの わっかは 3ばい。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの しゃぼんだま🫧 ${n}てん（${G.passes}こ くぐって ぴったり${G.fits}かい）「${rank(n)}」\n#ねこのしゃぼんだま #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/shabon.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function cloud(c,x,y,s){c.fillStyle='#ffffff';c.globalAlpha=.85;c.beginPath();c.ellipse(x,y,70*s,26*s,0,0,7);c.ellipse(x-34*s,y-10*s,34*s,26*s,0,0,7);c.ellipse(x+20*s,y-22*s,40*s,32*s,0,0,7);c.fill();c.globalAlpha=1}
function hoopHalf(c,h,front){const im=IMG[h.gold?'hoop_gold':'hoop_green'],k=h.R/HR,w=256*k,hy=hoopY(h);c.save();c.beginPath();if(front)c.rect(h.x-w,hy,w*2,w);else c.rect(h.x-w,hy-w,w*2,w);c.clip();
  if(h.flash>0){c.globalAlpha=1;c.shadowColor='#fff6a0';c.shadowBlur=30*h.flash/.5}
  if(im)c.drawImage(im,h.x-w/2,hy-128*k,w,w);else{c.strokeStyle=h.gold?'#e8b030':'#5a9a52';c.lineWidth=12*k;c.beginPath();c.ellipse(h.x,hy,h.R,h.R*.36,0,0,7);c.stroke()}c.restore()}
function bubble(c,x,y,r,t,warn){const w=Math.sin(t*(warn?22:5))*(warn?.07:.035);c.save();c.translate(x,y);
  c.fillStyle=warn?'rgba(255,220,235,.32)':'rgba(255,255,255,.2)';c.beginPath();c.ellipse(0,0,r*(1+w),r*(1-w),0,0,7);c.fill();
  const g=c.createLinearGradient(-r,-r,r,r),h=t*60;g.addColorStop(0,`hsla(${h%360},90%,72%,.85)`);g.addColorStop(.5,`hsla(${(h+120)%360},90%,75%,.85)`);g.addColorStop(1,`hsla(${(h+240)%360},90%,72%,.85)`);
  c.strokeStyle=g;c.lineWidth=Math.max(2.5,r*.07);c.beginPath();c.ellipse(0,0,r*(1+w)-c.lineWidth/2,r*(1-w)-c.lineWidth/2,0,0,7);c.stroke();
  c.strokeStyle='rgba(74,44,29,.45)';c.lineWidth=2;c.beginPath();c.ellipse(0,0,r*(1+w),r*(1-w),0,0,7);c.stroke();
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=Math.max(2,r*.08);c.lineCap='round';c.beginPath();c.arc(0,0,r*.68,Math.PI*1.12,Math.PI*1.38);c.stroke();c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#a8d878';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  const top=-OY/S,g=c.createLinearGradient(0,top,0,700);g.addColorStop(0,'#7cbcf0');g.addColorStop(1,'#d6eeff');c.fillStyle=g;c.fillRect(-OX/S,top,CW/S,700-top);
  c.fillStyle='#a8e082';c.fillRect(-OX/S,1180,CW/S,CH/S);
  for(const cl of G.clouds)cloud(c,cl.x,cl.y,cl.s);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
  for(const h of G.hoops)hoopHalf(c,h,false);
  for(const bu of G.bubbles)bubble(c,bu.x,bu.y,bu.r,bu.t+bu.ph,false);
  for(const h of G.hoops)hoopHalf(c,h,true);
  if(G.blow){const b=G.blow,p=blowPos(b.r);bubble(c,p[0],p[1],b.r,b.t,b.r>b.max-16)}
  for(const p of G.fx){const a=Math.max(0,1-p.t/p.life);c.fillStyle=p.c;c.globalAlpha=a;c.beginPath();c.arc(p.x,p.y,p.s,0,7);c.fill();c.globalAlpha=1}
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(SCENE.cat[0]-150,SCENE.cat[1]-30);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-90,-28,180,52,20);c.fill();c.stroke();c.beginPath();c.moveTo(50,22);c.lineTo(80,46);c.lineTo(70,20);c.closePath();c.fill();c.stroke();c.fillStyle='#fffaf2';c.fillRect(46,16,30,8);
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='24px "Dela Gothic One",sans-serif';c.fillText(G.say,0,-2);c.restore()}
  if(G.combo>=2&&G.phase==='play'){c.save();c.textAlign='center';outlineText(c,G.combo+' れんぞく',360,150,32,'#fff6e2',8);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.1){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?28:36;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(150,Math.min(W0-150,x.x)),x.y-x.t*30);c.globalAlpha=x.t>.8?(1.1-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'&&G.t<6&&G.t%1.4<1.05){c.save();c.textAlign='center';outlineText(c,G.blow?'はなすと うかぶよ':'ながおしで ふくらませる',360,720,30,'#fff',8);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();try{cv.setPointerCapture(e.pointerId)}catch(_){}press()},{passive:false});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,e=>{release()});
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();unlock();press()}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release()}});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;Object.assign(G,fresh());hud();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';G.holding=false;$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);reset();for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('shabon-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({shabon:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,press,release,blowPos,hoopY};
</script>
