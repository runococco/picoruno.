<body>
<div id="app">

  <div class="ov" id="titleOv">

      <div class="res-rank" id="resRank"></div>

    </div>
  </div>

<script>
/*ART*/const ART={},LAYER={},SCENE={plate:[360,640],spr:{plate:{res:640,pxu:160,w:576,h:528},pin:{res:224,pxu:160,tip:[112,209.6]}},pxu:160};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,PC=SCENE.plate,SPL=SCENE.spr.plate,PIN=SCENE.spr.pin,N=5,TIME=45,OFF=[-24,-78];
const ON=15,OFFG=22,CARVE=11,FAST=1300,MAXC=3;
const PLATES=['plate_pink','plate_mint','plate_lemon','plate_pink','plate_mint'],DARK=['#b8506a','#3a8a5a','#a8862a','#b8506a','#3a8a5a'];

/* ---------- shapes (closed outlines around the plate centre) ---------- */
function arc(pts,cx,cy,r,a0,a1,n){for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}}
const SHAPES=[
  {n:'まる',f(){const p=[];arc(p,0,0,150,0,Math.PI*2,90);return p}},
  {n:'ハート',f(){const p=[];for(let i=0;i<=120;i++){const t=i/120*Math.PI*2;p.push([16*Math.pow(Math.sin(t),3)*10.5,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*10.5-12])}return p}},
  {n:'ねこ',f(){const p=[],r=145,cy=40;arc(p,0,cy,r,-.35,Math.PI+.35,70);p.push([-128,-128],[-58,-80]);arc(p,0,cy+40,165,-Math.PI/2-.4,-Math.PI/2+.4,10);p.push([58,-80],[128,-128]);p.push(p[0].slice());return p}},
  {n:'ほし',f(){const p=[];for(let i=0;i<=10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?78:182;p.push([Math.cos(a)*r,Math.sin(a)*r+14])}return p}},
  {n:'かさ',f(){const p=[],oy=-50;arc(p,0,oy+30,175,Math.PI,Math.PI*2,60);p.push([9,oy+30],[9,oy+180]);arc(p,-31,oy+180,40,0,Math.PI,22);p.push([-55,oy+180]);arc(p,-31,oy+180,24,Math.PI,0,14);p.push([-9,oy+180],[-9,oy+30],[-175,oy+30]);return p}}];
function resample(pts,step){const out=[];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],L=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.round(L/step));for(let k=0;k<n;k++)out.push([PC[0]+x0+(x1-x0)*k/n,PC[1]+y0+(y1-y0)*k/n])}return out}

/* ---------- art ---------- */
const IMG={},RAW={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function outlined(im,px,thr){
  const c=document.createElement('canvas');c.width=im.width+px*2;c.height=im.height+px*2;const x=c.getContext('2d');
  const m=document.createElement('canvas');m.width=im.width;m.height=im.height;const mx=m.getContext('2d');mx.drawImage(im,0,0);
  const d=mx.getImageData(0,0,m.width,m.height),a=d.data;for(let i=0;i<a.length;i+=4){const on=a[i+3]>thr;a[i]=74;a[i+1]=44;a[i+2]=29;a[i+3]=on?255:0}mx.putImageData(d,0,0);
  for(let k=0;k<16;k++){const t=k/16*Math.PI*2;x.drawImage(m,px+Math.cos(t)*px,px+Math.sin(t)*px)}
  x.drawImage(im,px,px);c.pad=px;return c}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(!i)return;RAW[k]=i;IMG[k]=k==='bg'?i:outlined(i,k==='pin'?2:4,90)})))}
function sprAt(c,k,ax,ay,x,y,s,rot=0,a=1){const im=IMG[k];if(!im)return;const p=im.pad||0;c.save();c.globalAlpha*=a;c.translate(x,y);if(rot)c.rotate(rot);c.scale(s,s);c.drawImage(im,-ax-p,-ay-p);c.restore()}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('katanuki-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('katanuki-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0,pt:0,idx:0,score:0,pts:[],carved:[],outline:null,stress:0,cracks:[],left:TIME,needle:{x:PC[0],y:PC[1]+300},down:false,fx:[],texts:[],res:[],shake:0,scrSnd:0,warnT:0,result:null,lastPts:0};
function reset(){Object.assign(G,{t:0,idx:0,score:0,res:[],fx:[],texts:[]});newPlate()}
function newPlate(){const S=SHAPES[G.idx];G.outline=S.f();G.pts=resample(G.outline,5);G.carved=new Uint8Array(G.pts.length);G.stress=0;G.cracks=[];G.left=TIME;G.phase='play';G.pt=0;G.result=null;G.down=false;
  text(`${G.idx+1}まいめ「${S.n}」`,360,250,'#fff');hud()}
function hud(){$('plateP').textContent=`${Math.min(N,G.idx+1)} / ${N} まいめ`;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function progress(){let n=0;for(let i=0;i<G.carved.length;i++)n+=G.carved[i];return n/G.carved.length}
function nearest(x,y){let bi=0,bd=1e9;for(let i=0;i<G.pts.length;i++){const d=Math.hypot(G.pts[i][0]-x,G.pts[i][1]-y);if(d<bd){bd=d;bi=i}}return [bi,bd]}

/* ---------- carving ---------- */
let lastMove=0;
function press(x,y){if(G.phase!=='play')return;G.down=true;G.needle={x,y};lastMove=performance.now();carveAt(x,y,0,0)}
function moveTo(x,y,dtOverride){if(G.phase!=='play'){G.needle={x,y};return}const now=performance.now(),dt=dtOverride!=null?dtOverride:Math.max(.008,(now-lastMove)/1000);lastMove=now;
  const L=Math.hypot(x-G.needle.x,y-G.needle.y);G.needle={x,y};if(G.down)carveAt(x,y,L,L/dt)}
function release(){G.down=false}
function carveAt(x,y,L,speed){const [bi,bd]=nearest(x,y);
  if(bd<ON){let n=0;for(let k=-4;k<=4;k++){const i=(bi+k+G.pts.length)%G.pts.length;if(!G.carved[i]&&Math.hypot(G.pts[i][0]-x,G.pts[i][1]-y)<CARVE){G.carved[i]=1;n++}}
    if(n){G.scrSnd-=n;if(G.scrSnd<=0){G.scrSnd=6;sfx('scratch',.22,1+Math.random()*.1)}if(Math.random()<.5)G.fx.push({x,y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,t:0,life:.35,c:'rgba(255,250,240,.9)',r:2.5})}
    if(speed>FAST)stressUp((speed-FAST)*L/900)}
  else if(bd>OFFG&&L>0)stressUp(L*(Math.min(bd,70)-OFFG)/38*1.25);
  if(progress()>=.985)popOut()}
function stressUp(v){G.stress+=v;if(G.stress>60&&G.warnT<=0){G.warnT=.8;sfx('warn',.35)}if(G.stress>=100){G.stress=35;crack()}}
function crack(){const [bi]=nearest(G.needle.x,G.needle.y),p=G.pts[bi];let ang=Math.atan2(p[1]-PC[1],p[0]-PC[0])+(Math.random()-.5)*.9;const pts=[[p[0],p[1]]];let x=p[0],y=p[1];const len=70+Math.random()*80;
  for(let s=0;s<6;s++){ang+=(Math.random()-.5)*.8;x+=Math.cos(ang)*len/6;y+=Math.sin(ang)*len/6;pts.push([x,y])}G.cracks.push({pts,t:0});G.shake=.25;sfx('crack',.6,1+Math.random()*.08);text('ピシッ',p[0],p[1]-40,'#fff',true);
  if(G.cracks.length>=MAXC)breakPlate()}
function breakPlate(){G.phase='broke';G.pt=0;sfx('break',.75);text('われちゃった…',360,640,'#fff');G.res.push(0);G.lastPts=0;
  const col=DARK[G.idx];for(let k=0;k<26;k++)G.fx.push({tri:1,x:PC[0]+(Math.random()-.5)*480,y:PC[1]+(Math.random()-.5)*440,vx:(Math.random()-.5)*500,vy:-200-Math.random()*300,t:0,life:1.1,c:col,r:14+Math.random()*20,rot:Math.random()*6,g:1})}
function popOut(){if(G.phase!=='play')return;G.phase='pop';G.pt=0;G.down=false;const clean=G.cracks.length===0,pts=100+Math.round(G.left)*2+(clean?50:0);G.score+=pts;G.lastPts=pts;G.res.push(clean?2:1);
  sfx('pop',.7);setTimeout(()=>{sfx(clean?'clean':'clear',.7);sfx('coin',.4)},250);text(clean?'ひび なしで ぬけた！':'ぬけた！',360,250,'#ffe27a');hud();
  for(let k=0;k<30;k++){const a=Math.random()*6.28;G.fx.push({x:PC[0],y:PC[1],vx:Math.cos(a)*(200+Math.random()*300),vy:Math.sin(a)*(200+Math.random()*300)-150,t:0,life:1,c:['#ffe27a','#fff','#f0a0b4','#98d8b4'][k%4],r:4+Math.random()*4,g:1})}}
function finish(){G.phase='end';G.pt=0;duck(.08,.2);sfx('over',.7);text('きょうは おしまい！',360,640,'#fff')}
function rank(s){return s>=900?'かたぬきの たつじん':s>=700?'やたいの じょうれん':s>=480?'そーっと じょうず':s>=200?'おまつり みならい':'はじめての かたぬき'}
function showResult(){const s=G.score,best=LS.get('katanuki-best',0),nb=s>best;if(nb){LS.set('katanuki-best',s);if(s>0)sfx('best',.6)}
  $('resScore').textContent=s+' てん';$('rOk').textContent=G.res.filter(r=>r>0).length;$('rClean').textContent=G.res.filter(r=>r===2).length;$('rBroke').textContent=G.res.filter(r=>r===0).length;$('resRank').textContent=rank(s);
  $('resNote').innerHTML=(nb&&s>0?'ベスト更新！<br>':'')+(s>=700?'やたいの ねこも びっくりの うでまえ。':'かどは とくに ゆっくり。<br>みぞから はずれたら いったん ゆびを はなそう。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`おまつりの かたぬき🍬 ${s}てん（${G.res.filter(r=>r>0).length}まい ぬけた）「${rank(s)}」\n#かたぬき #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/katanuki.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;G.pt+=dt;G.shake=Math.max(0,G.shake-dt);G.warnT=Math.max(0,G.warnT-dt);
  if(G.phase==='play'){G.stress=Math.max(0,G.stress-dt*14);G.left-=dt;if(G.left<=0){G.left=0;text('じかんぎれ…',360,640,'#fff');G.res.push(0);G.lastPts=0;G.phase='broke';G.pt=0;sfx('break',.5,.9)}}
  for(const c of G.cracks)c.t=Math.min(1,c.t+dt*4);
  if((G.phase==='pop'&&G.pt>2.4)||(G.phase==='broke'&&G.pt>2)){G.idx++;if(G.idx>=N)finish();else newPlate()}
  if(G.phase==='end'&&G.pt>1.6&&$('resultOv').hidden)showResult();
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;if(p.g)p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!=null)p.rot+=dt*4;if(p.t>p.life)G.fx.splice(i,1)}}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function toFrame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function shapePath(c,dx=0,dy=0){c.beginPath();G.outline.forEach(([x,y],i)=>{i?c.lineTo(PC[0]+x+dx,PC[1]+y+dy):c.moveTo(PC[0]+x+dx,PC[1]+y+dy)});c.closePath()}
function drawPlate(c){const k=PLATES[G.idx]||PLATES[0],pop=G.phase==='pop',br=G.phase==='broke'&&G.res[G.res.length-1]===0&&G.cracks.length>=MAXC;
  if(br)return;
  const fade=pop?Math.max(0,1-G.pt*1.4):1;
  if(fade>0)sprAt(c,k,320,320,PC[0],PC[1],1,0,fade);
  if(!G.outline)return;
  // groove: soft emboss, then carved parts as a deep line
  c.save();c.globalAlpha=fade;c.lineJoin='round';c.lineCap='round';shapePath(c,1.5,1.5);c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=5;c.stroke();shapePath(c);c.strokeStyle='rgba(90,40,40,.28)';c.lineWidth=4;c.stroke();
  c.strokeStyle=DARK[G.idx];c.lineWidth=7;c.beginPath();const P=G.pts,n=P.length;for(let i=0;i<n;i++){const j=(i+1)%n;if(G.carved[i]&&G.carved[j]){c.moveTo(P[i][0],P[i][1]);c.lineTo(P[j][0],P[j][1])}}c.stroke();
  c.strokeStyle='rgba(60,20,20,.55)';c.lineWidth=2.5;c.stroke();
  for(const cr of G.cracks){c.strokeStyle='rgba(70,30,30,.85)';c.lineWidth=3;c.beginPath();const m=Math.max(1,Math.round(cr.t*(cr.pts.length-1)));for(let i=0;i<=m;i++){const [x,y]=cr.pts[i];i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
  c.restore();
  if(pop&&RAW[k]){const u=Math.min(1,G.pt/.5),lift=u*36,sc=1+u*.06;c.save();c.translate(PC[0],PC[1]-lift);c.scale(sc,sc);c.translate(-PC[0],-PC[1]);
    shapePath(c,10,16);c.fillStyle='rgba(60,20,10,.3)';c.fill();shapePath(c);c.save();c.clip();c.drawImage(RAW[k],PC[0]-320,PC[1]-320);c.restore();shapePath(c);c.strokeStyle='#4a2c1d';c.lineWidth=5;c.stroke();c.restore()}}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#c8322a';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  if(G.shake>0)c.translate((Math.random()-.5)*10*G.shake*4,(Math.random()-.5)*10*G.shake*4);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#c8322a';c.fillRect(0,0,W0,H0)}
  if(G.phase!=='title')drawPlate(c);else if(IMG.plate_pink){sprAt(c,'plate_pink',320,320,PC[0],PC[1],1)}
  for(const p of G.fx){const a=Math.max(0,1-p.t/p.life);c.globalAlpha=a;c.fillStyle=p.c;if(p.tri){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.moveTo(0,-p.r);c.lineTo(p.r*.9,p.r*.7);c.lineTo(-p.r*.8,p.r*.6);c.closePath();c.fill();c.strokeStyle='#4a2c1d';c.lineWidth=3;c.stroke();c.restore()}else{c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}}c.globalAlpha=1;
  // needle
  if(G.phase==='play'){const n=G.needle;c.save();c.fillStyle='rgba(60,20,10,.25)';c.beginPath();c.ellipse(n.x+5,n.y+4,5,3,0,0,7);c.fill();c.restore();sprAt(c,'pin',PIN.tip[0],PIN.tip[1],n.x,n.y,1.05,.55)}
  // gauges: time, crack meter, cracks left
  if(G.phase==='play'){const f=Math.max(0,G.left/TIME);c.save();c.fillStyle='rgba(255,250,242,.92)';c.beginPath();c.roundRect(160,148,400,20,10);c.fill();c.fillStyle=f>.3?'#6ab04a':'#e05a3a';c.beginPath();c.roundRect(160,148,Math.max(12,400*f),20,10);c.fill();c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.roundRect(160,148,400,20,10);c.stroke();
    const s=Math.min(1,G.stress/100);c.fillStyle='rgba(255,250,242,.92)';c.beginPath();c.roundRect(200,960,320,26,13);c.fill();c.fillStyle=s>.6?'#e05a3a':'#f0a030';c.beginPath();c.roundRect(200,960,Math.max(14,320*s),26,13);c.fill();c.beginPath();c.roundRect(200,960,320,26,13);c.stroke();
    c.textAlign='right';c.textBaseline='middle';outlineText(c,'ひび',190,973,26,'#fff',7);c.textAlign='left';
    for(let i=0;i<MAXC;i++){const x=540+i*36;c.beginPath();c.arc(x,973,13,0,7);c.fillStyle=i<MAXC-G.cracks.length?'#fffaf2':'#4a2c1d';c.fill();c.lineWidth=3;c.strokeStyle='#4a2c1d';c.stroke()}
    outlineText(c,Math.floor(progress()*100)+'%',300,1030,30,'#fff',8);c.restore()}
  if(G.phase==='pop'||G.phase==='broke'){c.save();c.textAlign='center';outlineText(c,'+'+G.lastPts+'てん',360,1020,40,G.lastPts?'#ffe27a':'#fff');c.restore()}
  if(G.phase==='play'&&G.idx===0&&progress()<.05&&G.t%1.4<1.05){c.save();c.textAlign='center';outlineText(c,'ゆびで なぞると はりで ほれるよ',360,1110,30,'#fff',8);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.5){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?30:42;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(170,Math.min(W0-170,x.x)),x.y-x.t*24);c.globalAlpha=x.t>1.2?(1.5-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input: the pin tip sits a little above-left of your finger ---------- */
let pid=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;pid=e.pointerId;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);const p=toFrame(e);press(p.x+OFF[0],p.y+OFF[1])},{passive:false});
cv.addEventListener('pointermove',e=>{const p=toFrame(e);if(e.pointerId!==pid){if(e.pointerType==='mouse'&&G.phase==='play'&&!G.down)G.needle={x:p.x+OFF[0],y:p.y+OFF[1]};return}moveTo(p.x+OFF[0],p.y+OFF[1])});
function up(e){if(e.pointerId!==pid)return;pid=null;release()}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;reset();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
let prev='play';
function pause(on){if(on){if(G.phase==='title'||G.phase==='end'||G.phase==='pause')return;prev=G.phase;G.phase='pause';pid=null;release();$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase=prev;last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);G.phase='title';for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('katanuki-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({katanuki:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase!=='title'&&G.phase!=='end'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();loadArt();requestAnimationFrame(frame);
window.__T={G,press,moveTo,release,progress,OFF};
</script>
<script>
function pingPlay(){
  var G="おまつりの かたぬき", K="picoruno-played:"+G;
  try{ if(sessionStorage.getItem(K)) return; sessionStorage.setItem(K,"1"); }catch(e){}
  var KEY="sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
  fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play",{method:"POST",keepalive:true,
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({g:G})})
  .then(function(r){ if(!r.ok) throw 0; })
  .catch(function(){ try{ var d=JSON.parse(localStorage.getItem("picoruno-stats")||"{}"); d[G]=d[G]||{plays:0,likes:0}; d[G].plays++; localStorage.setItem("picoruno-stats",JSON.stringify(d)); }catch(e){} });
}
</script>
