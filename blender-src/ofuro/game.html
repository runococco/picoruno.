/* Old-style bathroom with a wood-fired tub: dark-brown outlined flat UI. */
:root{

}
html,body{height:100%;margin:0;background:#f4e6c8}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}

.hud{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
.pill{font-family:var(--display);font-size:1rem;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:4px 10px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}

.ib svg{width:22px;height:22px}
.ov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(74,44,29,.28)}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 18px 14px;width:100%;max-width:360px;box-sizing:border-box;text-align:center;max-height:100%;overflow:auto}
.logo{font-family:var(--display);font-size:1.2rem;line-height:1.1;margin:4px 0 0;color:var(--sky)}
.logo2{font-family:var(--display);font-size:2.6rem;line-height:1.1;margin:0 0 6px;color:var(--red)}
.sub{font-size:.9rem;color:var(--ink2);margin:0 0 10px;font-weight:700}
.how{font-size:.86rem;font-weight:700;background:#fff;border:2px dashed #e0c8a0;border-radius:12px;padding:8px 10px;margin:0 0 12px;line-height:1.6;text-align:left}
.how ol{margin:0;padding-left:1.3em}
.how em{font-style:normal;color:var(--red)}
.how .kinds{display:flex;justify-content:space-around;margin:6px 0 0;font-size:.74rem;text-align:center;color:var(--ink2)}
.how .kinds img{display:block;width:62px;height:auto;margin:0 auto -4px}
.big{display:block;width:100%;font-family:var(--display);font-size:1.2rem;padding:13px 10px;border-radius:16px;border:3px solid var(--ink);
  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;letter-spacing:.04em;text-decoration:none;box-sizing:border-box}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}

.bag{display:flex;justify-content:center;gap:10px;margin:6px 0 8px}

.bag b{font-family:var(--display);font-weight:400;font-size:1.25rem}

.mis{display:flex;gap:6px;justify-content:center;align-items:center;margin:0 0 4px}

.xx{position:relative;width:110px;height:20px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden;box-shadow:0 3px 0 var(--ink)}

<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="pill n" id="rP">60びょう</div><div class="pill" id="scoreP">0 てん</div><button class="ib" id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" fill="#4a2c1d"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button></div>

  <div class="ov" id="titleOv">

      <button class="big" id="startBtn">ひを いれる</button>

      <div class="logo">きょうの ゆかげん</div>

      <div class="res-row"><div>ちょうどいい<b id="rS">0</b></div><div>ごくらく<b id="rC">0</b></div><div>さいちょう キープ<b id="rT">-</b></div></div>
      <div class="res-rank" id="resRank"></div>
      <p class="res-note" id="resNote"></p>
      <button class="big" id="againBtn">もういちど</button>
      <a class="big sec" id="shareBtn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener" style="font-size:1rem">X でじまん</a>
      <p class="back"><a href="https://picoruno.com/">← picoruno. のゲーム一覧へ</a></p>
    </div>
  </div>
</div>
<script>
/*ART*/const ART={},LAYER={},SCENE={};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,TIME=60,BAND=1.5,HEAT=.75,LOSS=.05,BURN=.25,R=[1800,1200,800,400];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('ofuro-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('ofuro-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

function clamp(v,a,b){return v<a?a:v>b?b:v}
/* ---------- state ---------- */
const TUB=SCENE.tub||{x0:112,x1:640,water_y:632},FB=SCENE.fire||{x:376,y:1032,w:144,h:80};
const PREFS=[{n:'ぬるめ',c:38.5},{n:'ちょうどいい',c:41},{n:'あつめ',c:43.5}];
const BTN={w:{x:170,y:1180,r:74},m:{x:550,y:1180,r:74}};
const G={phase:'title',t:0,texts:[],T:36,f:0,fe:0,c:41,pref:PREFS[1]};
function fresh(){return {phase:"play",t:0,score:0,T:37,f:1,fe:.4,c:41,pref:PREFS[1],nextPref:9,streak:0,maxStreak:0,inT:0,gokuT:0,texts:[],say:'',sayT:0,endT:0,splash:0,logs:[],press:{w:0,m:0},acc:0}}
function reset(){Object.assign(G,fresh());G.phase='title';G.T=41.2;hud()}
function hud(){$('rP').textContent=Math.max(0,Math.ceil(TIME-G.t))+'びょう';$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s,t=1.3){G.say=s;G.sayT=t}
function tY(T){return 900-(T-30)/20*600}
/* ---------- input ---------- */
function water(){if(G.phase!=='play')return;G.T-=1.1;G.splash=.6;G.press.w=.2;sfx(Math.random()<.5?'water':'water2',.5)}
function wood(){if(G.phase!=='play')return;if(G.f>=4.5){text('もう いっぱい',BTN.m.x,BTN.m.y-110,'#ffd0b0',true);return}G.f=Math.min(5,G.f+1);G.press.m=.2;G.logs.push({t:0});sfx('wood',.45)}
function down(x,y){if(Math.hypot(x-BTN.w.x,y-BTN.w.y)<BTN.w.r+20||(x<360&&y>1060))water();else if(Math.hypot(x-BTN.m.x,y-BTN.m.y)<BTN.m.r+20||(x>=360&&y>1060))wood()}
function move(){}
function up(){}
/* ---------- flow ---------- */
function step(dt){G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);if(G.phase==='pause')return;const play=G.phase==='play';G.splash=Math.max(0,G.splash-dt);for(const k in G.press)G.press[k]=Math.max(0,G.press[k]-dt);
  for(let i=G.logs.length-1;i>=0;i--){G.logs[i].t+=dt;if(G.logs[i].t>.5)G.logs.splice(i,1)}
  if(!play){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  G.f=Math.max(0,G.f-dt*BURN);G.fe+=(G.f-G.fe)*Math.min(1,dt*.9);G.T=clamp(G.T+(G.fe*HEAT-(G.T-18)*LOSS)*dt,15,60);
  G.nextPref-=dt;if(G.nextPref<=0){let p;do p=PREFS[Math.floor(Math.random()*3)];while(p===G.pref);G.pref=p;G.nextPref=8+Math.random()*4;sfx('change',.5);say(`こんどは「${p.n}」が いいな`,1.6)}
  G.c+=(G.pref.c-G.c)*Math.min(1,dt*1.5);
  const d=Math.abs(G.T-G.c),inb=d<=BAND;if(inb){G.streak+=dt;G.inT+=dt;const goku=d<=.5;if(goku)G.gokuT+=dt;G.acc+=dt*10*(1+Math.min(2,G.streak/5))*(goku?1.5:1);
    if(Math.floor(G.streak)%5===0&&Math.floor(G.streak-dt)%5===4&&G.streak>4){text(`${Math.floor(G.streak)}びょう キープ！`,360,560,'#ffe27a',true);sfx('good',.4)}}
  else{if(G.streak>0&&G.T>G.c)sfx('hot',.3);G.streak=0}
  G.maxStreak=Math.max(G.maxStreak,G.streak);if(G.acc>=1){const n=Math.floor(G.acc);G.acc-=n;G.score+=n}
  const before=Math.ceil(TIME-G.t+dt);if(Math.ceil(TIME-G.t)!==before)hud();if(G.t>=TIME)finish()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7);say('いい おゆでした！',1.6);hud()}
function rank(n){return n>=R[0]?'おふろやさん めいじん':n>=R[1]?'ゆかげん たつじん':n>=R[2]?'ちょうどいい ばんとう':n>=R[3]?'みならい ばんとう':'あちち ぬるぬる'}
function showResult(){const n=G.score,best=LS.get('ofuro-best',0),nb=n>best;if(nb){LS.set('ofuro-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rS').textContent=Math.round(G.inT)+'びょう';$('rC').textContent=Math.round(G.gokuT)+'びょう';$('rT').textContent=Math.round(G.maxStreak)+'びょう';$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(n>=R[1]?'いつでも ちょうどいい ゆかげん！':'まきは あとから きいてくる。あつく なりすぎる まえに みずで ととのえよう。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ちょうどいい おふろ♨ ${n}てん「${rank(n)}」\n#ちょうどいいおふろ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/ofuro.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}
/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function btn(c,b,label,col,pr,icon){c.save();c.translate(b.x,b.y+pr*30);c.fillStyle=col;c.strokeStyle='#4a2c1d';c.lineWidth=5;c.beginPath();c.arc(0,0,b.r,0,7);c.fill();c.stroke();icon(c);
  c.textAlign='center';c.textBaseline='middle';outlineText(c,label,0,b.r*.52,26,'#fff',7);c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#3a2a20';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#e2ecee';c.fillRect(0,0,W0,H0)}
  // water tint by temperature, ripples
  {const h=clamp((G.T-30)/20,0,1),y=TUB.water_y-8;c.save();c.fillStyle=`rgba(${Math.round(120+h*120)},${Math.round(190-h*60)},${Math.round(225-h*120)},.9)`;c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.roundRect(TUB.x0+10,y-10,TUB.x1-TUB.x0-20,22,10);c.fill();c.stroke();
    if(G.splash>0){c.globalAlpha=G.splash/.6;c.fillStyle='#e8f6ff';for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.35,r=40+(1-G.splash/.6)*60;c.beginPath();c.arc(260+Math.cos(a)*r,y-14+Math.sin(a)*r,9,0,7);c.fill()}}c.restore()}
  // steam
  {const s=clamp((G.T-34)/14,0,1);c.save();c.strokeStyle=`rgba(170,195,215,${.3+s*.5})`;c.lineWidth=10;c.lineCap='round';for(let i=0;i<5;i++){const x=TUB.x0+70+i*95,ph=G.t*1.4+i*1.3,hh=60+s*140;c.beginPath();
    for(let k=0;k<=10;k++){const u=k/10,yy=TUB.water_y-30-u*hh,xx=x+Math.sin(ph+u*5)*14;k?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.globalAlpha=.4+.6*Math.abs(Math.sin(ph*.5));c.stroke()}c.restore()}
  // firebox glow
  {const g=clamp(G.fe/4,0,1);c.save();c.fillStyle=`rgba(255,${Math.round(120+g*60)},40,${.15+g*.75})`;c.beginPath();c.roundRect(FB.x-FB.w/2+6,FB.y-FB.h/2+6,FB.w-12,FB.h-12,10);c.fill();
