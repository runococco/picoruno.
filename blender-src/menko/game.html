<script>
/*ART*/const ART={},LAYER={},SCENE={};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,RX=360,RY=640,RR=304,CR=80,THROWS=5,ROUNDS=3,HOME=[360,1150];
const KIND={tora:{n:'とら',hp:.45,p:100},tai:{n:'たい',hp:.56,p:150},roket:{n:'ロケット',hp:.64,p:200},fuji:{n:'ふじ',hp:.75,p:300}};

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('menko-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('menko-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],cards:[],waves:[],won:[]};
function fresh(){return {phase:'play',t:0,score:0,round:0,throws:THROWS,cards:[],waves:[],won:[],aim:null,charging:false,pw:0,pwT:0,shot:null,state:'aim',stT:0,texts:[],say:'',sayT:0,endT:0,got:0,multi:0,thrown:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('nP').textContent=`${G.round+1}かいせん`;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s,t=1.3){G.say=s;G.sayT=t}
function deal(){const n=4+G.round,pool=['tora','tai','roket','fuji'];G.cards=[];
  for(let i=0;i<n;i++){let x,y,ok=false,tries=0;while(!ok&&tries<300){tries++;const a=rnd(0,6.28),r=Math.sqrt(Math.random())*(RR-CR-20);x=RX+Math.cos(a)*r;y=RY+Math.sin(a)*r;ok=G.cards.every(c=>Math.hypot(c.x-x,c.y-y)>CR*(G.round===2?1.6:1.9))}
    const k=i===0?'tora':pool[Math.min(3,Math.floor(Math.random()*(2+G.round)))];G.cards.push({k,x,y,r:rnd(-.6,.6),st:'up',ft:0,vx:0,vy:0,hp:KIND[k].hp})}
  G.throws=THROWS;G.state='aim';say(`${G.round+1}かいせん`,1.2);hud()}
/* ---------- input ---------- */
function period(){return 1.05-.12*G.round}
function powerAt(t){const ph=(t/period())%2;return ph<1?ph:2-ph}
function press(x,y){if(G.phase!=='play'||G.state!=='aim')return;G.aim=[x,y];G.charging=true;G.pwT=0;G.pw=0}
function move(x,y){if(G.charging)G.aim=[x,y]}
function release(){if(!G.charging)return;G.charging=false;throwAt(G.aim[0],G.aim[1],G.pw)}
// a throw: harder throws reach further but scatter once they pass the sweet band
function throwAt(x,y,p){const sc=6+(p>.88?(p-.88)/.12*70:0),a=rnd(0,6.28),r=Math.random()*sc;
  G.shot={x0:HOME[0],y0:HOME[1],x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,p,t:0,rot:rnd(-1,1)};G.state='fly';G.throws--;G.thrown++;sfx('whoosh',.6)}
function impact(){const s=G.shot,R=25+55*s.p;let flips=[],pressed=false;G.waves.push({x:s.x,y:s.y,r:R,t:0});sfx(s.p>.6?'slap':'slap2',.8,s.p>.8?.9:1.1);
  for(const c of G.cards){if(c.st!=='up')continue;const d=Math.hypot(c.x-s.x,c.y-s.y);
    if(d<CR*.86){pressed=true;continue}
    const e=d-CR,f=s.p*Math.max(0,1-Math.max(0,e)/R)*(e<0?1.15:1);
    if(f>c.hp){c.st='flip';c.ft=0;flips.push(c)}
    else if(f>c.hp*.55){const nx=(c.x-s.x)/d,ny=(c.y-s.y)/d;c.vx=nx*140*f;c.vy=ny*140*f;text('ぐらっ',c.x,c.y-70,'#fff',true)}}
  if(pressed&&!flips.length)text('おさえちゃった',s.x,s.y-90,'#ffd0c0',true);
  if(!flips.length&&!pressed)sfx('miss',.4);
  if(flips.length){sfx('flip',.7);let sum=0;for(const c of flips)sum+=KIND[c.k].p;const m=flips.length,pts=sum*m;G.score+=pts;G.got+=m;if(m>1)G.multi=Math.max(G.multi,m);
    text(m>1?`いっきに ${m}まい！ +${pts}`:`${KIND[flips[0].k].n} +${pts}`,s.x,s.y-100,m>1?'#ffe27a':'#fff');setTimeout(()=>sfx('win',.5,m>1?1.5:1),300);hud()}
  G.state='after';G.stT=0}
/* ---------- flow ---------- */
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);
  for(let i=G.waves.length-1;i>=0;i--){G.waves[i].t+=dt;if(G.waves[i].t>.5)G.waves.splice(i,1)}
  for(const c of G.cards){if(c.vx||c.vy){c.x+=c.vx*dt;c.y+=c.vy*dt;const k=Math.pow(.02,dt);c.vx*=k;c.vy*=k;if(Math.hypot(c.vx,c.vy)<4)c.vx=c.vy=0}
    if(c.st==='flip'){c.ft+=dt;if(c.ft>1.1){c.st='gone';G.won.push(c.k)}}}
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  if(G.charging){G.pwT+=dt;const p=powerAt(G.pwT);if(Math.floor(G.pwT/period()*4)!==Math.floor((G.pwT-dt)/period()*4))sfx('charge',.3,1+p*.5);G.pw=p}
  if(G.state==='fly'){const s=G.shot;s.t+=dt;if(s.t>=.32)impact()}
  else if(G.state==='after'){G.stT+=dt;if(G.stT>1.2){G.shot=null;const left=G.cards.filter(c=>c.st==='up').length;
      if(!left){const b=G.throws*80;G.score+=b;say(b?`ぜんぶ とった！ のこり ${G.throws}かい +${b}`:'ぜんぶ とった！',1.6);sfx('levelup',.5);G.state='next';G.stT=0;hud()}
      else if(G.throws<=0){say('なげおわり',1.2);G.state='next';G.stT=0}else G.state='aim'}}
  else if(G.state==='next'){G.stT+=dt;if(G.stT>1.7){if(G.round>=ROUNDS-1)finish();else{G.round++;deal()}}}
  hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7);say('しょうぶ あり',1.4)}
function rank(n){return n>=4000?'めんこ よこづな':n>=3200?'ろじうらの おおぜき':n>=2400?'ぱちーん じょうず':n>=1400?'めんこ みならい':'はじめての めんこ'}
function showResult(){const n=G.score,best=LS.get('menko-best',0),nb=n>best;if(nb){LS.set('menko-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rN').textContent=G.got;$('rM').textContent=G.multi?G.multi+'まい':'-';$('rT').textContent=G.thrown;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(n>=3200?'ろじうらの ヒーローだ！':'めんこの まうえは さけて、ふちの すぐそとを ねらおう。ちからは みどりの ところで。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ぱちーん めんこ💥 ${n}てん「${rank(n)}」\n#ぱちーんめんこ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/menko.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}
/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function card(c,k,x,y,rot,s=1,sy=1,lift=0){const im=IMG[k],d=192*s;c.save();c.fillStyle='rgba(40,25,10,.25)';c.beginPath();c.ellipse(x+5+lift*.4,y+7+lift*.6,CR*s,CR*s*Math.max(.15,Math.abs(sy)),rot,0,7);c.fill();c.restore();
  c.save();c.translate(x,y-lift);c.rotate(rot);c.scale(1,sy);if(im)c.drawImage(im,-d/2,-d/2,d,d);else{c.fillStyle='#e8dcc0';c.beginPath();c.arc(0,0,CR*s,0,7);c.fill()}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#c8a878';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
