  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}

  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;letter-spacing:.04em;text-decoration:none;box-sizing:border-box}

<div id="app">

      <div class="res-row"><div>キャッチ<b id="rCatch">0</b></div><div>さいこう れんぞく<b id="rCombo">0</b></div><div>さいだい<b id="rBags">2こ</b></div></div>
      <div class="res-rank" id="resRank"></div>

<script>
/*ART*/const ART={},LAYER={},SCENE={shL:[244,731],shR:[476,731],head:[360,600],floor:977,eyes:[[318,604],[402,604]],spr:{paw:{res:96,pxu:160},bag:{res:96,pxu:160}},pxu:160};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,SH=[SCENE.shL,SCENE.shR],FLOOR=SCENE.floor+70,PERF=.075,LIVES=3,MAXB=6,PER_LV=12;
const PAW=[[186,790],[534,790]],COLORS=['aka','ai','kiku','wakaba'],COUNT=['ひと','ふた','み','よ','いつ','む','なな','や','ここの','とお'];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('otedama-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('otedama-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0,bags:[],fx:[],texts:[],paws:[{up:0,busy:0,press:0},{up:0,busy:0,press:0}]};
function rnd(a,b){return a+Math.random()*(b-a)}
function win(){return Math.max(.12,.2-G.level*.008)}
function fresh(){return {phase:'play',t:0,score:0,catches:0,perfects:0,combo:0,maxCombo:0,lives:LIVES,level:0,want:2,maxBags:2,beat:.6,bags:[],fx:[],texts:[],drops:[],paws:[{up:0,busy:0,press:0},{up:0,busy:0,press:0}],addT:0,say:'',sayT:0,endT:0,ci:0,nextId:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('lifeP').textContent='●'.repeat(G.lives)+'○'.repeat(LIVES-G.lives);$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}

/* ---------- scheduling ---------- */
function slotFree(t,gap){for(const b of G.bags)if(b.state!=='drop'&&Math.abs(b.tLand-t)<gap)return false;return true}
function pickLanding(from){const n=G.bags.length,beat=G.beat,gap=beat*.86;
  const fs=n<=2?[2,3,3]:n<=3?[2,3,3,4]:[3,3,4,4,5];
  for(let tries=0;tries<30;tries++){const f=fs[Math.floor(Math.random()*fs.length)]+(tries>12?Math.floor(tries/6):0);const t=from+f*beat;if(slotFree(t,gap))return t}
  let t=from+2*beat;while(!slotFree(t,gap))t+=beat*.5;return t}
function addBag(){const t=pickLanding(G.t+1.1-2*G.beat);const hand=Math.random()<.5?0:1;
  G.bags.push({id:G.nextId++,c:COLORS[G.ci++%4],state:'air',from:-1,to:hand,tThrow:t-1.1,tLand:t,rot:rnd(0,6),spin:rnd(-4,4)});if(G.t>.5)sfx('add',.35)}
function throwBag(b,hand,t0){b.from=hand;b.tThrow=t0;b.tLand=pickLanding(t0);b.to=Math.random()<.5?0:1;b.state='air';b.spin=rnd(-5,5)}
function bagPos(b,t){if(b.state==='held'){const p=PAW[b.to];return [p[0],p[1]-30-G.paws[b.to].up*30]}
  if(b.state==='drop')return [b.x,b.y];
  const u=Math.max(0,Math.min(1.2,(t-b.tThrow)/(b.tLand-b.tThrow))),P1=PAW[b.to];
  if(b.from<0)return [P1[0],-80+(P1[1]-30+80)*u*u];
  const P0=PAW[b.from],dur=b.tLand-b.tThrow,hh=Math.min(660,1450*dur*dur/8),x=P0[0]+(P1[0]-P0[0])*u+(b.from===b.to?Math.sin(u*Math.PI)*(b.from?-60:60):0),y=P0[1]-30+(P1[1]-P0[1])*u-hh*4*u*(1-u);return [x,y]}

/* ---------- input ---------- */
function tap(side){if(G.phase!=='play')return;const pw=G.paws[side];pw.press=.15;if(pw.busy>0)return;
  let best=null,bd=1e9;for(const b of G.bags){if(b.state!=='air'||b.to!==side)continue;const d=Math.abs(G.t-b.tLand);if(d<win()&&d<bd){bd=d;best=b}}
  if(!best){pw.busy=.3;G.combo=0;sfx('whiff',.4);text('すかっ',PAW[side][0],PAW[side][1]-120,'#fff',true);return}
  const perf=bd<PERF;G.catches++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);if(perf)G.perfects++;
  let pts=perf?2:1;if(G.combo%10===0){pts+=5;text(G.combo+'れんぞく！ +5',360,330,'#ffe27a');sfx('perfect',.5,1.5)}
  G.score+=pts;pw.up=1;sfx('catch',.55,perf?1.12:1);if(perf)sfx('perfect',.3);
  const [x,y]=bagPos(best,G.t);text((perf?'ぴったり ':'')+'+'+pts,x,y-70,perf?'#ffe27a':'#fff',!perf);
  for(let k=0;k<(perf?10:5);k++)G.fx.push({x,y,vx:rnd(-160,160),vy:rnd(-200,40),t:0,life:.45,c:best.c});
  text(COUNT[G.catches%10===0?9:G.catches%10-1],SCENE.head[0],SCENE.head[1]-170,'#fff6e2',true);
  // hold until the nominal beat, then throw
  best.state='held';best.hold=Math.max(G.t,best.tLand);
  if(G.catches%PER_LV===0){G.level++;if(G.want<MAXB){G.want++;G.beat=Math.max(.42,G.beat-.03);G.maxBags=Math.max(G.maxBags,G.want);sfx('levelup',.6);text('おてだまが ひとつ ふえた！',360,330,'#fff');say('にゃっ！');G.addT=.6}else{G.beat=Math.max(.3,G.beat-.012);text('はやく なって きた！',360,330,'#fff',true)}}
  hud()}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);
  for(const p of G.paws){p.up=Math.max(0,p.up-dt*6);p.busy=Math.max(0,p.busy-dt);p.press=Math.max(0,p.press-dt)}
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.8&&$('resultOv').hidden)showResult()}
  const play=G.phase==='play';
  if(play){const live=G.bags.filter(b=>b.state!=='drop').length;if(live<G.want){G.addT-=dt;if(G.addT<=0){addBag();G.addT=G.beat*2}}}
  for(let i=G.bags.length-1;i>=0;i--){const b=G.bags[i];b.rot+=b.spin*dt;
    if(b.state==='held'&&G.t>=b.hold){throwBag(b,b.to,G.t)}
    else if(b.state==='air'&&G.t>b.tLand+win()&&play){const [x,y]=bagPos(b,G.t);b.state='drop';b.x=x;b.y=y;b.vx=(b.to?1:-1)*rnd(40,120);b.vy=150;b.bounce=0;miss(b)}
    else if(b.state==='drop'){b.vy+=1800*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>FLOOR){b.y=FLOOR;if(b.bounce<2){b.vy*=-.35;b.vx*=.5;b.bounce++;if(b.bounce===1)sfx('drop',.5)}else{b.vy=0;b.vx=0}}
      b.restT=(b.restT||0)+dt;if(b.restT>2.2)G.bags.splice(i,1)}}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.t>p.life)G.fx.splice(i,1)}}
function miss(b){G.lives--;G.combo=0;text('ぽとっ',b.x,b.y-60,'#ffd0c0',true);sfx('meow',.35);say(G.lives>0?'あっ':'あ〜あ');hud();G.addT=Math.max(G.addT,G.beat*3);
  if(G.lives<=0)finish()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7);text('おしまい',360,460,'#fff');
  for(const b of G.bags)if(b.state!=='drop'){const [x,y]=bagPos(b,G.t);b.state='drop';b.x=x;b.y=y;b.vx=rnd(-80,80);b.vy=-100;b.bounce=0}}
function rank(n){return n>=260?'おてだま めいじん':n>=160?'ねこの てまり師':n>=90?'たたみの うえの スター':n>=40?'おてだま じょうず':'はじめての おてだま'}
function showResult(){const n=G.score,best=LS.get('otedama-best',0),nb=n>best;if(nb){LS.set('otedama-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rCatch').textContent=G.catches;$('rCombo').textContent=G.maxCombo;$('rBags').textContent=G.maxBags+'こ';$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.maxBags>=5?'5こ いじょうの おてだま、おみごと！':'わっかが てに かさなる しゅんかんが ぴったり。<br>10れんぞくで ボーナス +5。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの おてだま🎎 ${n}てん（さいだい${G.maxBags}こ・${G.maxCombo}れんぞく）「${rank(n)}」\n#ねこのおてだま #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/otedama.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
const BCOL={aka:'#d84a4a',ai:'#3a6ab8',kiku:'#e8b030',wakaba:'#5aa85a'};
function drawBag(c,x,y,b,sc){const im=IMG['bag_'+b.c];c.save();c.translate(x,y);c.rotate(b.rot);const s=(sc||1)*1.55;if(im)c.drawImage(im,-48*s,-48*s,96*s,96*s);else{c.fillStyle=BCOL[b.c];c.beginPath();c.ellipse(0,0,30,24,0,0,7);c.fill()}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#e8dcb0';c.fillRect(0,0,CW,CH);
  if(OY>0){c.fillStyle='#f0e4c8';c.fillRect(0,0,CW,OY+2);c.fillStyle='#d4cc96';c.fillRect(0,OY+H0*S-2,CW,CH)}
  c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#f6ead4';c.fillRect(0,0,W0,H0)}
  // dropped bags on the floor
  for(const b of G.bags)if(b.state==='drop')drawBag(c,b.x,b.y,b,.95);
  // landing rings (timing cue)
  if(G.phase==='play')for(const b of G.bags){if(b.state!=='air')continue;const dt2=b.tLand-G.t;if(dt2>.75||dt2<-win())continue;const p=PAW[b.to],k=Math.max(0,dt2)/.75;
    c.save();c.globalAlpha=Math.min(1,(1-k)*1.6);c.strokeStyle=BCOL[b.c];c.lineWidth=7;c.beginPath();c.arc(p[0],p[1]-20,52+k*90,0,7);c.stroke();c.strokeStyle='#4a2c1d';c.lineWidth=2;c.beginPath();c.arc(p[0],p[1]-20,52+k*90+5,0,7);c.stroke();c.restore()}
  // arms + paws
  for(let s=0;s<2;s++){const p=G.paws[s],P=PAW[s],sh=SH[s],y=P[1]-p.up*30+(p.busy>0?16:0);
    c.lineCap='round';c.strokeStyle='#4a2c1d';c.lineWidth=58;c.beginPath();c.moveTo(sh[0],sh[1]);c.quadraticCurveTo((sh[0]+P[0])/2,y+30,P[0],y);c.stroke();
    c.strokeStyle='#fbf6ec';c.lineWidth=50;c.beginPath();c.moveTo(sh[0],sh[1]);c.quadraticCurveTo((sh[0]+P[0])/2,y+30,P[0],y);c.stroke();
    if(IMG.paw){c.drawImage(IMG.paw,P[0]-58,y-58,116,116)}else{c.fillStyle='#fbf6ec';c.beginPath();c.arc(P[0],y,32,0,7);c.fill()}}
  // bags in the air / held
  for(const b of G.bags){if(b.state==='drop')continue;if(b.from<0&&G.t<b.tThrow)continue;const [x,y]=bagPos(b,G.t);drawBag(c,x,y,b)}
  for(const p of G.fx){const a=Math.max(0,1-p.t/p.life);c.fillStyle=BCOL[p.c];c.globalAlpha=a;c.beginPath();c.arc(p.x,p.y,5,0,7);c.fill();c.globalAlpha=1}
  // tap pads
  if(G.phase==='play'||G.phase==='end')for(let s=0;s<2;s++){const x=s?540:180,y=1150,pr=G.paws[s].press>0;c.save();c.globalAlpha=pr?.95:.6;c.fillStyle=pr?'#fff6e2':'rgba(255,250,242,.8)';c.strokeStyle='#4a2c1d';c.lineWidth=5;c.beginPath();c.roundRect(x-150,y-56,300,112,40);c.fill();c.stroke();c.textAlign='center';c.textBaseline='middle';outlineText(c,s?'みぎ':'ひだり',x,y+2,36,G.paws[s].busy>0?'#bbb':BCOL.aka,9);c.restore()}
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(SCENE.head[0]+150,SCENE.head[1]-130);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-80,-28,160,52,20);c.fill();c.stroke();c.beginPath();c.moveTo(-40,22);c.lineTo(-64,46);c.lineTo(-14,24);c.fill();c.textAlign='center';c.textBaseline='middle';c.font='24px "Dela Gothic One",sans-serif';c.fillStyle='#4a2c1d';c.fillText(G.say,0,0);c.restore()}
  if(G.combo>=3&&G.phase==='play'){c.save();c.textAlign='center';outlineText(c,G.combo+' れんぞく',360,200,32,'#fff6e2',8);c.restore()}
  if(G.phase==='play'){c.save();c.textAlign='center';outlineText(c,'おてだま '+G.want+'こ',360,1040,26,'#fff',7);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.1){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?28:36;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(150,Math.min(W0-150,x.x)),x.y-x.t*30);c.globalAlpha=x.t>.8?(1.1-x.t)/.3:1;outlineText(c,x.s,0,0,sz,x.c);c.restore()}
  if(G.phase==='play'&&G.t<5&&G.t%1.4<1.05){c.save();c.textAlign='center';outlineText(c,'おちて くる ほうを タップ',360,950,30,'#fff',8);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();const r=cv.getBoundingClientRect();tap(e.clientX-r.left<r.width/2?0:1)},{passive:false});
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='ArrowLeft'||e.code==='KeyF'){e.preventDefault();tap(0)}else if(e.code==='ArrowRight'||e.code==='KeyJ'){e.preventDefault();tap(1)}});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;Object.assign(G,fresh());G.addT=.4;hud();
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);reset();for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('otedama-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({otedama:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,tap,bagPos};
</script>
<script>
function pingPlay(){
  var G="ねこの おてだま", K="picoruno-played:"+G;
  try{ if(sessionStorage.getItem(K)) return; sessionStorage.setItem(K,"1"); }catch(e){}
  var KEY="sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
  fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play",{method:"POST",keepalive:true,
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({g:G})})
  .then(function(r){ if(!r.ok) throw 0; })
  .catch(function(){ try{ var d=JSON.parse(localStorage.getItem("picoruno-stats")||"{}"); d[G]=d[G]||{plays:0,likes:0}; d[G].plays++; localStorage.setItem("picoruno-stats",JSON.stringify(d)); }catch(e){} });
}
</script>
