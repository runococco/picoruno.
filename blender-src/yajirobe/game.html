  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;letter-spacing:.04em;text-decoration:none;box-sizing:border-box}

  <div class="ov" id="titleOv">

      <div class="res-row"><div>のせた かず<b id="rN">0</b></div><div>おもさ<b id="rM">0</b></div><div>おとした<b id="rMiss">0</b></div></div>
      <div class="res-rank" id="resRank"></div>
      <p class="res-note" id="resNote"></p>
      <button class="big" id="againBtn">もういちど</button>
      <a class="big sec" id="shareBtn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener" style="font-size:1rem">X でじまん</a>
      <p class="back"><a href="https://picoruno.com/">← picoruno. のゲーム一覧へ</a></p>
    </div>
  </div>
</div>
<script>
/*ART*/const ART={},LAYER={},SCENE={tip:[360,564],desk:1071};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,[PX,PY]=SCENE.tip,TK=1.15,U=128*TK,REACH=1.42*U,FALL=.62,SPY=210;
const KIND={feather:{m:.3,n:'はね'},button:{m:.6,n:'ボタン'},konpeito:{m:.5,n:'こんぺいとう'},acorn:{m:1,n:'どんぐり'},cherry:{m:1.4,n:'さくらんぼ'},pebble:{m:2,n:'いし'}};
const ARM=[[0,.30],[.45,.27],[.9,.18],[1.25,-.05],[1.62,-.55]];
function armY(x){const a=Math.abs(x)/U;for(let i=1;i<ARM.length;i++)if(a<=ARM[i][0]){const [x0,y0]=ARM[i-1],[x1,y1]=ARM[i],k=(a-x0)/(x1-x0);return -(y0+(y1-y0)*k-.04)*U}return -(-.55)*U}

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('yajirobe-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('yajirobe-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],items:[],loose:[],th:0};
function fresh(){return {phase:'play',t:0,score:0,th:0,om:0,items:[],loose:[],cur:null,curT:0,wind:null,windT:12,mass:0,missN:0,placedN:0,texts:[],say:'',sayT:0,endT:0,creakT:0,falling:false}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('nP').textContent=G.items.length+' こ';$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.3}
function pickKind(){const n=G.items.length,r=Math.random();const pool=n<3?['acorn','button','konpeito','feather']:n<8?['acorn','cherry','button','konpeito','feather','acorn']:['acorn','cherry','pebble','cherry','konpeito','button','pebble'];return pool[Math.floor(r*pool.length)]}
function spawn(){G.cur={k:pickKind(),x:rnd(220,500),y:SPY,vy:0,drop:false,held:false};G.curT=0;sfx('spawn',.4,1.5)}
// toy-local position -> screen
function toScreen(lx,ly){const c=Math.cos(G.th),s=Math.sin(G.th);return [PX+lx*c-ly*s,PY+lx*s+ly*c]}
function toLocal(x,y){const dx=x-PX,dy=y-PY,c=Math.cos(-G.th),s=Math.sin(-G.th);return [dx*c-dy*s,dx*s+dy*c]}

/* ---------- input ---------- */
function holdAt(x){if(G.phase!=='play'||!G.cur||G.cur.drop)return;G.cur.held=true;G.cur.x=Math.max(80,Math.min(640,x))}
function release(){if(!G.cur||G.cur.drop||!G.cur.held)return;G.cur.drop=true;G.cur.held=false}

/* ---------- flow ---------- */
function attach(c,lx){const K=KIND[c.k];G.placedN++;let ly=armY(lx);for(const it of G.items)if(Math.abs(it.lx-lx)<26)ly=Math.min(ly,it.ly-22);
  G.items.push({k:c.k,lx,ly,m:K.m});G.mass+=K.m;const far=Math.abs(lx)/REACH,pts=Math.round(10*K.m*(1+far*2))*10;G.score+=pts;sfx('land',.6,1+Math.random()*.1);
  const [sx,sy]=toScreen(lx,ly);text(`${K.n} +${pts}`,sx,sy-60,far>.75?'#ffe27a':'#fff',true);if(G.items.length%5===0){sfx('levelup',.45);say(['いい バランス','まだ いける','すごい'][G.items.length/5%3])}hud()}
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);
  for(let i=G.loose.length-1;i>=0;i--){const l=G.loose[i];l.t+=dt;l.vy+=1500*dt;l.x+=l.vx*dt;l.y=Math.min(SCENE.desk-10,l.y+l.vy*dt);l.r+=l.vr*dt;if(l.t>2)G.loose.splice(i,1)}
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.falling){G.om+=Math.sign(G.th)*6*dt;G.th+=G.om*dt}if(G.endT>1.6&&$('resultOv').hidden)showResult()}return}
  // torque from what sits on the arms, a low centre of mass pulls back, wind pushes now and then
  let tq=0;for(const it of G.items)tq+=it.m*(it.lx/REACH)*3.0;const K=10/(1+G.mass*.05);
  G.windT-=dt;if(!G.wind&&G.windT<=0){G.wind={t:0,dir:Math.random()<.5?-1:1,p:rnd(.9,1.6)+G.t*.01};say(G.wind.dir>0?'みぎへ かぜ':'ひだりへ かぜ');sfx('wind',.6)}
  let w=0;if(G.wind){G.wind.t+=dt;if(G.wind.t>.8&&G.wind.t<2.2)w=G.wind.dir*G.wind.p*Math.sin((G.wind.t-.8)/1.4*Math.PI);if(G.wind.t>2.4){G.wind=null;G.windT=rnd(8,12)}}
  const acc=tq*Math.cos(G.th)-K*Math.sin(G.th)+w-2.4*G.om;G.om+=acc*dt;G.th+=G.om*dt;
  G.creakT-=dt;if(Math.abs(G.th)>.35&&G.creakT<=0){sfx('creak',.4);G.creakT=1.2}
  if(Math.abs(G.th)>FALL){G.falling=true;sfx('fall',.8);say('あ〜っ');for(const it of G.items){const [x,y]=toScreen(it.lx,it.ly);G.loose.push({k:it.k,x,y,vx:rnd(-200,200),vy:-200,r:0,vr:rnd(-6,6),t:0})}G.items=[];finish();return}
  const c=G.cur;if(!c){if(G.t>.6)spawn()}else{G.curT+=dt;if(!c.held&&!c.drop&&G.curT>4.5)c.drop=true;
    if(c.drop){c.vy+=1300*dt;c.y+=c.vy*dt;const [lx,ly]=toLocal(c.x,c.y);
      if(Math.abs(lx)<=REACH&&ly>=armY(lx)-30&&ly<armY(lx)+40){let top=armY(lx);for(const it of G.items)if(Math.abs(it.lx-lx)<26)top=Math.min(top,it.ly-22);if(ly>=top-16){G.cur=null;attach(c,lx)}}
      else if(c.y>SCENE.desk-20||(Math.abs(lx)>REACH&&c.y>PY+120)){G.loose.push({k:c.k,x:c.x,y:c.y,vx:0,vy:c.vy,r:0,vr:rnd(-4,4),t:0});G.cur=null;G.missN++;sfx('miss',.5);text('おちちゃった',c.x,c.y-60,'#ffd0c0',true)}}}
  hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=6000?'やじろべえ めいじん':n>=4000?'つりあい マイスター':n>=2400?'ゆらゆら じょうず':n>=1000?'のせのせ みならい':'はじめての やじろべえ'}
function showResult(){const n=G.score,best=LS.get('yajirobe-best',0),nb=n>best;if(nb){LS.set('yajirobe-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rN').textContent=G.placedN;$('rM').textContent=G.mass.toFixed(1);$('rMiss').textContent=G.missN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(n>=4000?'ぴたっと つりあって おみごと！':'かたむいた がわの はんたいに のせると もどるよ。かぜの まえは まんなか よりに。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ゆらゆら やじろべえ🐦 ${n}てん「${rank(n)}」\n#ゆらゆらやじろべえ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/yajirobe.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function itemAt(c,k,x,y,r){const im=IMG[k],s=128*1.1;c.save();c.translate(x,y);if(r)c.rotate(r);if(im)c.drawImage(im,-s/2,-s/2,s,s);else{c.fillStyle='#8a5a32';c.beginPath();c.arc(0,0,16,0,7);c.fill()}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#f4ead8';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
