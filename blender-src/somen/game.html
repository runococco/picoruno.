<script>
/*ART*/const ART={},LAYER={},SCENE={lanes:[224,496],catch:904,bowl:[80,1176],tub:[360,1240],cat:[635,1192],flumeEnd:1120,waterW:70,spr:{item:{res:160,pxu:200},hashi:{res:320,pxu:200,tip:[160,300]}},pxu:160};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,LANE=SCENE.lanes,CY=SCENE.catch,END=SCENE.flumeEnd,BOWL=SCENE.bowl,CAT=SCENE.cat,WW=SCENE.waterW,TIME=60;
const IS=SCENE.pxu/SCENE.spr.item.pxu*1.25,HS=SCENE.pxu/SCENE.spr.hashi.pxu,HT=SCENE.spr.hashi.tip,GRAB=60,PERF=20;
const KINDS={somen:{pts:10,name:'そうめん'},iro:{pts:30,name:'いろそうめん'},tomato:{pts:15,name:'トマト',fast:1.3},cherry:{pts:10,name:'さくらんぼ'},leaf:{pts:0,name:'はっぱ'}};

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function outlined(im,px,thr){
  const c=document.createElement('canvas');c.width=im.width+px*2;c.height=im.height+px*2;const x=c.getContext('2d');
  const m=document.createElement('canvas');m.width=im.width;m.height=im.height;const mx=m.getContext('2d');mx.drawImage(im,0,0);
  const d=mx.getImageData(0,0,m.width,m.height),a=d.data;for(let i=0;i<a.length;i+=4){const on=a[i+3]>thr;a[i]=74;a[i+1]=44;a[i+2]=29;a[i+3]=on?255:0}mx.putImageData(d,0,0);
  for(let k=0;k<16;k++){const t=k/16*Math.PI*2;x.drawImage(m,px+Math.cos(t)*px,px+Math.sin(t)*px)}
  x.drawImage(im,px,px);c.pad=px;return c}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(!i)return;IMG[k]=k==='bg'?i:outlined(i,3,90)})));
  ['somen','iro','tomato','cherry','leaf'].forEach((k,i)=>{if(IMG[k])$('k'+i).src=IMG[k].toDataURL()})}
function sprAt(c,k,ax,ay,x,y,s,rot=0,a=1){const im=IMG[k];if(!im)return;const p=im.pad||0;c.save();c.globalAlpha*=a;c.translate(x,y);if(rot)c.rotate(rot);c.scale(s,s);c.drawImage(im,-ax-p,-ay-p);c.restore()}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null,waterGain=null;const BUF={};
let muted=LS.get('somen-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  // a soft trickle of water: band-passed noise
  const len=ac.sampleRate*2,nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);let b0=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.9*b0+.1*w;d[i]=b0*1.4}
  const src=ac.createBufferSource();src.buffer=nb;src.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.7;waterGain=ac.createGain();waterGain.gain.value=0;src.connect(f);f.connect(waterGain);waterGain.connect(master);src.start();
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function waterVol(v){if(waterGain&&ac)waterGain.gain.setTargetAtTime(v,ac.currentTime,.4)}
function setMute(m){muted=m;LS.set('somen-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
const G={phase:'title',t:0,left:TIME,score:0,items:[],flying:[],fx:[],texts:[],spawnT:0,eat:0,combo:0,maxCombo:0,catAte:0,leafHit:0,perfect:0,
  hashi:{lane:1,x:LANE[1],close:0,cd:0,lift:0},say:'',sayT:0,endT:0,flow:0};
function reset(){Object.assign(G,{t:0,left:TIME,score:0,items:[],flying:[],fx:[],texts:[],spawnT:.6,eat:0,combo:0,maxCombo:0,catAte:0,leafHit:0,perfect:0,say:'',sayT:0,endT:0});G.hashi={lane:1,x:LANE[1],close:0,cd:0,lift:0};hud()}
function hud(){$('timeP').textContent=Math.ceil(G.left);$('timeP').classList.toggle('low',G.left<=10);$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function speed(){return 230+Math.min(200,G.t*3.4)}
function pickKind(){const r=Math.random(),lf=.1+Math.min(.12,G.t*.003);
  if(r<lf)return 'leaf';if(r<lf+.1)return 'iro';if(r<lf+.22)return 'tomato';if(r<lf+.27&&G.left<TIME-5)return 'cherry';return 'somen'}
function spawn(lane,k){const last=G.items.filter(i=>i.lane===lane&&!i.got).reduce((m,i)=>Math.min(m,i.y),1e9);if(last<-60+140)return false;
  G.items.push({k,lane,y:-70,v:speed()*(KINDS[k].fast||1)*(.94+Math.random()*.12),rot:(Math.random()-.5)*.3,ph:Math.random()*6,got:0});return true}

/* ---------- tap: chopsticks dip into one flume ---------- */
function tap(lane){
  const H=G.hashi;if(G.phase!=='play'||H.cd>0)return;H.lane=lane;H.close=.22;H.cd=.16;sfx('hashi',.45,1+Math.random()*.06);
  let best=null,bd=1e9;for(const it of G.items){if(it.got||it.lane!==lane)continue;const d=Math.abs(it.y-CY);if(d<GRAB&&d<bd){bd=d;best=it}}
  const x=LANE[lane];
  if(!best){G.combo=0;text('スカッ',x,CY-90,'#fff',true);sfx('whiff',.4);return}
  best.got=1;
  if(best.k==='leaf'){G.combo=0;G.leafHit++;G.left=Math.max(0,G.left-3);text('はっぱ… −3秒',x,CY-90,'#ffd0c0',true);sfx('bad',.55);
    G.flying.push({k:'leaf',x,y:best.y,t:0,life:.6,tx:x+(lane?160:-160),ty:CY+40,leaf:1,rot:best.rot});return}
  const perf=bd<PERF;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);if(perf)G.perfect++;
  const pts=KINDS[best.k].pts+(perf?5:0)+Math.floor(G.combo/5)*5;G.score+=pts;G.eat++;
  if(best.k==='cherry'){G.left=Math.min(99,G.left+3);sfx('bonus',.6);text('+3びょう！',x,CY-140,'#ffe27a',true)}
  sfx('get',.6,perf?1.5:1);text((perf?'ぴったり ':'')+'+'+pts,x,CY-90,perf?'#ffe27a':'#fff',true);
  if(G.combo%10===0){sfx('combo',.6);text(G.combo+'れんぞく！',360,560,'#ffe27a')}
  for(let k=0;k<8;k++)G.fx.push({x,y:CY,vx:(Math.random()-.5)*260,vy:-60-Math.random()*200,t:0,life:.45,c:'rgba(220,240,255,.95)',r:4,g:1});
  H.lift=.45;G.flying.push({k:best.k,x,y:best.y,t:0,life:.5,tx:BOWL[0]+(Math.random()-.5)*40,ty:BOWL[1]-10,rot:best.rot});hud()}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;G.flow+=dt*speed();G.sayT=Math.max(0,G.sayT-dt);const H=G.hashi;H.close=Math.max(0,H.close-dt);H.cd=Math.max(0,H.cd-dt);H.lift=Math.max(0,H.lift-dt);
  H.x+=(LANE[H.lane]-H.x)*Math.min(1,dt*28);
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.6&&$('resultOv').hidden)showResult()}
  const play=G.phase==='play';
  if(play){G.left-=dt;if(G.left<=0){G.left=0;finish()}
    G.spawnT-=dt;if(G.spawnT<=0){const lane=Math.random()<.5?0:1;if(spawn(lane,pickKind())){if(G.t>15&&Math.random()<Math.min(.35,G.t/120))spawn(1-lane,pickKind())}G.spawnT=Math.max(.42,1.05-G.t*.011)*(.8+Math.random()*.4)}
    hud()}
  for(let i=G.items.length-1;i>=0;i--){const it=G.items[i];if(it.got){G.items.splice(i,1);continue}
    it.y+=it.v*dt;it.ph+=dt*4;
    if(it.y>END+10){G.items.splice(i,1);for(let k=0;k<6;k++)G.fx.push({x:LANE[it.lane]+(Math.random()-.5)*30,y:END+40,vx:(Math.random()-.5)*160,vy:-80-Math.random()*120,t:0,life:.4,c:'rgba(220,240,255,.9)',r:4,g:1});
      if(play&&it.k!=='leaf'){G.catAte++;if(it.k!=='cherry')G.combo=0;if(Math.random()<.6||G.sayT<=0){G.say=['ちゅるっ','もぐもぐ','にゃむ'][G.catAte%3];G.sayT=1.1;sfx('meow',.35,1+Math.random()*.1)}}}}
  for(let i=G.flying.length-1;i>=0;i--){const f=G.flying[i];f.t+=dt;if(f.t>=f.life){G.flying.splice(i,1);if(!f.leaf){sfx('plop',.4,1+Math.random()*.1);for(let k=0;k<5;k++)G.fx.push({x:f.tx,y:f.ty,vx:(Math.random()-.5)*120,vy:-60-Math.random()*80,t:0,life:.35,c:'rgba(150,90,40,.8)',r:3.5,g:1})}}}
  for(let i=G.fx.length-1;i>=0;i--){const p=G.fx[i];p.t+=dt;if(p.g)p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life)G.fx.splice(i,1)}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);waterVol(.02);sfx('over',.7);text('ごちそうさま！',360,560,'#fff');G.items.length=0}
function rank(s){return s>=900?'そうめんの 名人':s>=650?'おはし さばき 一級':s>=420?'つるつる じょうず':s>=200?'なつやすみの こども':'はじめての ながしそうめん'}
function showResult(){const s=G.score;const best=LS.get('somen-best',0),nb=s>best;if(nb){LS.set('somen-best',s);if(s>0)sfx('best',.6)}
  $('resScore').textContent=s+' てん';$('rEat').textContent=G.eat;$('rCombo').textContent=G.maxCombo;$('rCat').textContent=G.catAte;$('resRank').textContent=rank(s);
  $('resNote').innerHTML=(nb&&s>0?'ベスト更新！<br>':'')+(G.catAte>G.eat?'ねこは おなか いっぱい。<br>':'')+(s>=420?'ぴったり わっかの まんなかで つかむと +5てん。':'わっかに 入った しゅんかんに タップ。<br>はやい トマトは すこし 早めに。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ながしそうめん🎋 ${s}てん（${G.eat}こ キャッチ、さいこう${G.maxCombo}れんぞく）「${rank(s)}」\n#ながしそうめん #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/somen.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function toFrame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
function drawItem(c,k,x,y,rot,s=1,a=1){sprAt(c,k,80,80,x,y,IS*s,rot,a)}
function hashi(c){const H=G.hashi;
  // open 1 = tips apart, 0 = pinched (closes fast, reopens as close timer runs out)
  const o=H.close>0?(H.close>.11?1-(.22-H.close)/.11:1-H.close/.11):1;
  const gap=6+o*22,lift=H.lift>0?Math.sin(H.lift/.45*Math.PI)*14:0,ty=CY-6-lift-(H.close>0?0:10),base=2.55;
  for(const s of [-1,1]){const tx=H.x+s*gap*.6,tyy=ty+s*gap*.4;sprAt(c,'hashi',HT[0],HT[1],tx+6,tyy+10,HS*1.02,base+s*.03*o,.25)}
  for(const s of [-1,1]){const tx=H.x+s*gap*.6,tyy=ty+s*gap*.4;sprAt(c,'hashi',HT[0],HT[1],tx,tyy,HS,base+s*.03*o)}}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#7aaa5a';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);c.beginPath();c.rect(0,0,W0,H0);c.clip();
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);else{c.fillStyle='#8ab868';c.fillRect(0,0,W0,H0)}
  // running water: bright streaks travelling down each flume
  c.save();c.lineCap='round';
  for(let l=0;l<2;l++){const x=LANE[l];c.save();c.beginPath();c.rect(x-WW/2,0,WW,END);c.clip();
    for(let k=0;k<26;k++){const y=((k*97+G.flow*(1+(k%3)*.12))%(END+120))-60,xx=x+Math.sin(k*2.3)*WW*.32;c.strokeStyle=`rgba(255,255,255,${.25+.2*(k%2)})`;c.lineWidth=2+(k%3);c.beginPath();c.moveTo(xx,y);c.lineTo(xx+Math.sin(y*.03+k)*3,y+22+(k%4)*8);c.stroke()}c.restore()}
  c.restore();
  // catch rings
  for(let l=0;l<2;l++){const x=LANE[l],hot=G.items.some(i=>i.lane===l&&!i.got&&i.k!=='leaf'&&Math.abs(i.y-CY)<GRAB);
    c.save();c.strokeStyle=hot?'rgba(255,240,150,.95)':'rgba(255,255,255,.75)';c.lineWidth=hot?6:4;c.setLineDash([10,8]);c.beginPath();c.ellipse(x,CY,WW/2+16,GRAB*.75,0,0,7);c.stroke();c.restore()}
  // flowing items
  for(const it of G.items){const x=LANE[it.lane]+Math.sin(it.ph)*4;c.save();c.globalAlpha=.2;c.fillStyle='#1a3a5a';c.beginPath();c.ellipse(x+4,it.y+6,22,it.k==='somen'||it.k==='iro'?40:18,0,0,7);c.fill();c.restore();
    drawItem(c,it.k,x,it.y,it.rot+(it.k==='tomato'?it.y*.02:0))}
  hashi(c);
  // caught things fly to the bowl (leaves get flicked aside)
  for(const f of G.flying){const u=Math.min(1,f.t/f.life),e=u*(2-u);const x=f.x+(f.tx-f.x)*e,y=f.y+(f.ty-f.y)*e-Math.sin(u*Math.PI)*(f.leaf?60:180);drawItem(c,f.k,x,y,f.rot+u*(f.leaf?4:1),1-.35*u,f.leaf?1-u:1)}
  for(const p of G.fx){const a=Math.max(0,1-p.t/p.life);c.globalAlpha=a;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()}c.globalAlpha=1;
  // bowl tally
  c.save();c.font='26px "Dela Gothic One",sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=7;c.strokeStyle='#4a2c1d';c.strokeText(G.eat+'こ',BOWL[0]+30,BOWL[1]-74);c.fillStyle='#fff';c.fillText(G.eat+'こ',BOWL[0]+30,BOWL[1]-74);c.restore();
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(CAT[0]-40,CAT[1]-120);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-72,-28,144,52,20);c.fill();c.stroke();
    c.beginPath();c.moveTo(30,20);c.lineTo(52,46);c.lineTo(10,22);c.fill();c.font='24px "Dela Gothic One",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.fillText(G.say,0,-2);c.restore()}
  if(G.combo>=3&&G.phase==='play'){c.save();c.font='30px "Dela Gothic One",sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=8;c.strokeStyle='#4a2c1d';c.strokeText(G.combo+' れんぞく',360,150);c.fillStyle='#ffe27a';c.fillText(G.combo+' れんぞく',360,150);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.1){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?30:40;c.font=`${sz}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.translate(Math.max(130,Math.min(W0-130,x.x)),x.y-x.t*40);c.globalAlpha=x.t>.8?(1.1-x.t)/.3:1;
    c.lineJoin='round';c.lineWidth=sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  if(G.phase==='play'&&G.t<5&&G.t%1.4<1.05){c.save();c.font='30px "Dela Gothic One",sans-serif';c.textAlign='center';c.lineJoin='round';c.lineWidth=8;c.strokeStyle='#4a2c1d';c.strokeText('わっかに きたら その がわを タップ',360,1040);c.fillStyle='#fff';c.fillText('わっかに きたら その がわを タップ',360,1040);c.restore()}
  c.restore()}
let last=performance.now();
function frame(n){const dt=Math.min(.033,(n-last)/1000);last=n;if(G.phase!=='pause'&&G.phase!=='title')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();if(G.phase!=='play')return;const p=toFrame(e);tap(p.x<W0/2?0:1)},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='f')tap(0);if(e.key==='ArrowRight'||e.key==='j')tap(1)});
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv'])$(id).hidden=true;reset();G.phase='play';waterVol(.05);
  if(ac)Promise.resolve(decoding).then(()=>{duck(.3,.01);bgm(true);sfx('start',.5)});pingPlay()}
function pause(on){if(on){if(G.phase!=='play')return;G.phase='pause';$('pauseOv').hidden=false;if(ac)ac.suspend()}else{if(G.phase!=='pause')return;$('pauseOv').hidden=true;G.phase='play';last=performance.now();if(ac)ac.resume()}}
function toTitle(){bgm(false);waterVol(0);G.phase='title';for(const id of ['pauseOv','resultOv'])$(id).hidden=true;$('titleOv').hidden=false;reset();refreshTitle();if(ac&&ac.state==='suspended')ac.resume()}
function refreshTitle(){const b=LS.get('somen-best',0);$('bestLine').textContent=b?`ベスト ${b}てん`:''}
$('startBtn').onclick=start;$('againBtn').onclick=start;
$('pauseBtn').onclick=()=>pause(true);$('resumeBtn').onclick=()=>pause(false);$('quitBtn').onclick=toTitle;
$('muteBtn').onclick=()=>{unlock();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
let guarded=false;function guardHistory(){if(guarded)return;try{history.pushState({somen:1},'');guarded=true}catch(e){}}
window.addEventListener('popstate',()=>{if(!guarded)return;guarded=false;if(G.phase==='play'){pause(true);guardHistory()}});
document.addEventListener('touchstart',e=>{const x=e.touches[0].clientX;if(G.phase==='play'&&(x<24||x>innerWidth-24))e.preventDefault()},{passive:false});
window.addEventListener('resize',resize);
setMute(muted);refreshTitle();resize();reset();loadArt();requestAnimationFrame(frame);
window.__T={G,tap,CY,GRAB};
</script>
<script>
function pingPlay(){
  var G="ながしそうめん", K="picoruno-played:"+G;
  try{ if(sessionStorage.getItem(K)) return; sessionStorage.setItem(K,"1"); }catch(e){}
  var KEY="sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
  fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play",{method:"POST",keepalive:true,
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({g:G})})
  .then(function(r){ if(!r.ok) throw 0; })
  .catch(function(){ try{ var d=JSON.parse(localStorage.getItem("picoruno-stats")||"{}"); d[G]=d[G]||{plays:0,likes:0}; d[G].plays++; localStorage.setItem("picoruno-stats",JSON.stringify(d)); }catch(e){} });
}
</script>
