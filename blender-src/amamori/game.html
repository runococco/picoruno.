}
html,body{height:100%;margin:0;background:#f4e6c8}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}

.logo{font-family:var(--display);font-size:1.2rem;line-height:1.1;margin:4px 0 0;color:var(--sky)}

.big{display:block;width:100%;font-family:var(--display);font-size:1.2rem;padding:13px 10px;border-radius:16px;border:3px solid var(--ink);
  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;letter-spacing:.04em;text-decoration:none;box-sizing:border-box}

<div id="app">

      <div class="res-row"><div>うけた しずく<b id="rS">0</b></div><div>さいだい れんぞく<b id="rC">0</b></div><div>たえた じかん<b id="rT">-</b></div></div>
      <div class="res-rank" id="resRank"></div>

      <p class="back"><a href="https://picoruno.com/">← picoruno. のゲーム一覧へ</a></p>
    </div>
  </div>

<script>
/*ART*/const ART={},LAYER={},SCENE={};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,WETMAX=10,DRY=.11,LVTIME=15,GRAV=1500,R=[6500,4200,2500,1000];
const LEAK_X=(SCENE.leaks||[104,232,360,488,616]),DRIP=SCENE.drip_y||221,FLOOR=SCENE.floor_y||1056;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('amamori-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('amamori-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

function clamp(v,a,b){return v<a?a:v>b?b:v}
/* ---------- state ---------- */
const POTS=[{k:'oke',n:'おけ',cap:12,hw:58,mh:78},{k:'nabe',n:'なべ',cap:8,hw:48,mh:58},{k:'chawan',n:'ちゃわん',cap:5,hw:34,mh:40}];
const G={phase:'title',t:0,texts:[],pots:[],drops:[],leaks:[],puddles:[],ripples:[]};
function fresh(){return {phase:'play',t:0,score:0,lv:1,lvT:0,wet:0,caught:0,combo:0,maxCombo:0,drag:null,pots:POTS.map((p,i)=>({...p,x:[200,380,540][i],tx:[200,380,540][i],fill:0,out:0,wob:0,flash:0})),
  drops:[],leaks:LEAK_X.map((x,i)=>({x,on:false,t:0,form:0,iv:2.6})),puddles:[],ripples:[],texts:[],say:'',sayT:0,endT:0,flash:0,rush:0}}
function reset(){Object.assign(G,fresh());G.phase='title';G.leaks[1].on=G.leaks[3].on=true;hud()}
function hud(){$('rP').textContent='Lv '+G.lv;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s,t=1.3){G.say=s;G.sayT=t}
function interval(){return Math.max(.8,2.7-G.lv*.2)*(G.rush>0?.45:1)}
function turnOn(){const off=G.leaks.filter(l=>!l.on);if(!off.length)return false;const l=off[Math.floor(Math.random()*off.length)];l.on=true;l.t=-1.2;return true}
/* ---------- input ---------- */
function down(x,y){if(G.phase!=='play'||y<640)return;let b=null,bd=110;for(const p of G.pots){if(p.out>0)continue;const d=Math.abs(p.x-x);if(d<bd){bd=d;b=p}}
  if(!b)return;G.drag={p:b,ox:b.x-x,x0:x,t0:G.t,moved:false};b.wob=.6;sfx('grab',.35)}
function move(x,y){const d=G.drag;if(!d)return;if(Math.abs(x-d.x0)>12)d.moved=true;d.p.tx=clamp(x+d.ox,56,664)}
function up(){const d=G.drag;if(!d)return;G.drag=null;if(!d.moved&&G.t-d.t0<.4)empty(d.p)}
function empty(p){if(p.out>0||p.fill<=0){p.wob=.5;return}p.out=.9;p.spill=p.fill;p.fill=0;sfx('pour',.5);text('ざばっ',p.x,FLOOR-p.mh-60,'#bfe3ff',true)}
/* ---------- flow ---------- */
function catchDrop(p,d){const n=d.big?3:1;p.wob=.7;G.ripples.push({x:p.x,y:FLOOR-p.mh+6,t:0,w:p.hw});
  if(p.fill+n>p.cap){p.fill=p.cap;p.flash=1;splash(d.x,'あふれた！');return}
  p.fill+=n;G.caught+=n;G.combo+=1;G.maxCombo=Math.max(G.maxCombo,G.combo);const pts=(d.big?30:10)+Math.min(30,Math.floor(G.combo/5)*2);G.score+=pts;
  sfx('catch',.5,d.big?.75:1+Math.min(G.combo,20)*.0);if(p.fill>=p.cap){p.flash=1;sfx('full',.45);text('いっぱい！',p.x,FLOOR-p.mh-70,'#ffd36a',true)}
  if(G.combo>0&&G.combo%10===0){text(`${G.combo} れんぞく！`,360,560,'#fff');sfx('new',.4)}hud()}
function splash(x,msg){G.wet+=1;G.combo=0;G.puddles.push({x,r:20,a:1,t:0});sfx('splash',.6);if(msg)text(msg,x,FLOOR-130,'#9fd0ff',true);G.flash=.25;if(G.wet>=WETMAX)finish()}
function step(dt){G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);if(G.phase==='pause')return;const play=G.phase==='play';G.flash=Math.max(0,G.flash-dt);
  for(const p of G.pots){p.x+=(p.tx-p.x)*Math.min(1,dt*18);p.wob=Math.max(0,p.wob-dt*2);p.flash=Math.max(0,p.flash-dt*2);if(p.out>0)p.out=Math.max(0,p.out-dt)}
  for(let i=G.ripples.length-1;i>=0;i--){G.ripples[i].t+=dt;if(G.ripples[i].t>.6)G.ripples.splice(i,1)}
  for(const q of G.puddles){q.t+=dt;q.r=Math.min(46,q.r+dt*60)}
  if(!play){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.6&&$('resultOv').hidden)showResult()}return}
  G.wet=Math.max(0,G.wet-dt*DRY);while(G.puddles.length>Math.ceil(G.wet))G.puddles.shift();
  G.lvT+=dt;G.rush=Math.max(0,G.rush-dt);if(G.lvT>=LVTIME){G.lvT=0;G.lv++;sfx('levelup',.55);
    if(turnOn())say('あたらしい あまもり！');else if(G.lv%3===0){G.rush=6;say('どしゃぶり！',1.6);G.flash=.5}else say('あめが つよく なってきた');hud()}
  for(const l of G.leaks){if(!l.on)continue;l.t+=dt;const iv=interval();l.form=clamp((l.t-(l.iv-.6))/.6,0,1);
    if(l.t>=l.iv){l.t=0;l.iv=iv*(.7+Math.random()*.6);const big=G.lv>=3&&Math.random()<.1;G.drops.push({x:l.x,y:DRIP+8,vy:0,big});l.form=0;sfx('drip',.25,big?.75:1)}}
  for(let i=G.drops.length-1;i>=0;i--){const d=G.drops[i],py=d.y;d.vy+=GRAV*dt;d.y+=d.vy*dt;let gone=false;
    for(const p of G.pots){if(p.out>0)continue;const my=FLOOR-p.mh;if(py<my&&d.y>=my&&Math.abs(d.x-p.x)<p.hw){catchDrop(p,d);gone=true;break}}
    if(!gone&&d.y>=FLOOR-4){splash(d.x,'ぴちゃっ');gone=true}
    if(gone){G.drops.splice(i,1);if(G.phase!=='play')return}}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;G.drag=null;duck(.08,.2);sfx('over',.7);say('たたみが びしょびしょ…',1.8)}
function rank(n){return n>=R[0]?'あまもり めいじん':n>=R[1]?'うけとめ たつじん':n>=R[2]?'しっかり おるすばん':n>=R[3]?'あわてんぼう':'びしょぬれ さん'}
function showResult(){const n=G.score,best=LS.get('amamori-best',0),nb=n>best;if(nb){LS.set('amamori-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rS').textContent=G.caught;$('rC').textContent=G.maxCombo;$('rT').textContent=Math.floor(G.t)+'びょう';$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(n>=R[1]?'しずく ひとつ のがさない！':'いっぱいに なる まえに タップで すてておくと あふれないよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ぽたぽた あまもり☔ ${n}てん「${rank(n)}」\n#ぽたぽたあまもり #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/amamori.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}
/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function tear(c,x,y,r){c.beginPath();c.moveTo(x,y-r*2.1);c.bezierCurveTo(x+r*.35,y-r*1.2,x+r,y-r*.5,x+r,y);c.arc(x,y,r,0,Math.PI);c.bezierCurveTo(x-r,y-r*.5,x-r*.35,y-r*1.2,x,y-r*2.1);c.closePath();
  c.fillStyle='#7cb8e6';c.fill();c.lineWidth=3;c.strokeStyle='#2c5578';c.stroke()}
const PS=.62;
function drawPot(c,p){const im=IMG[p.k];c.save();c.translate(p.x,FLOOR);let a=Math.sin(G.t*30)*p.wob*.04;
  if(p.out>0){const u=1-p.out/.9,k=Math.sin(Math.min(1,u*1.6)*Math.PI);a=-k*.9*(p.x<360?-1:1);c.translate(0,-k*40);
    if(k>.3){c.save();c.globalAlpha=Math.min(1,k);c.fillStyle='rgba(124,184,230,.85)';const sx=(p.x<360?1:-1)*p.hw;c.beginPath();c.ellipse(sx*1.6,-p.mh*.4+20*u,10+18*k,30*k,0,0,7);c.fill();c.restore()}}
  c.rotate(a);if(im)c.drawImage(im,-128*PS,-224*PS,256*PS,256*PS);else{c.fillStyle='#c89a60';c.fillRect(-p.hw,-p.mh,p.hw*2,p.mh)}
  if(p.fill>0&&p.out<=0){const f=p.fill/p.cap;c.fillStyle='rgba(110,170,220,.9)';c.strokeStyle='#2c5578';c.lineWidth=2.5;c.beginPath();c.ellipse(0,-p.mh+4,p.hw*.86,6+4*f,0,0,7);c.fill();c.stroke()}
  c.restore();
  const w=p.hw*1.7,f=p.fill/p.cap,y=FLOOR+22;c.save();c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=3;c.beginPath();c.roundRect(p.x-w/2,y,w,16,8);c.fill();c.stroke();
  if(f>0){c.fillStyle=f>=1?(Math.sin(G.t*14)>0?'#e85a3a':'#f2c14e'):f>.7?'#f2a03a':'#5aa0dc';c.beginPath();c.roundRect(p.x-w/2+3,y+3,(w-6)*f,10,5);c.fill()}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#3a2a20';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);

  // rain streaks in the window
  c.save();c.beginPath();c.rect(126,330,468,340);c.clip();c.strokeStyle='rgba(220,235,250,.45)';c.lineWidth=2;const sp=G.rush>0?2:1;
  for(let i=0;i<28*sp;i++){const x=126+((i*97.3)%468),y=330+((G.t*(520+i%5*60)+i*131)%380)-20;c.beginPath();c.moveTo(x,y);c.lineTo(x-6,y+26);c.stroke()}c.restore();

  for(const l of G.leaks){if(!l.on)continue;if(l.t<0){c.save();c.globalAlpha=.6+.4*Math.sin(G.t*12);c.fillStyle='#ffd36a';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.arc(l.x,DRIP+52,20,0,7);c.fill();c.stroke();c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='26px "Dela Gothic One",sans-serif';c.fillText('!',l.x,DRIP+53);c.restore()}
    if(l.form>0)tear(c,l.x,DRIP+4+l.form*10,3+l.form*6)}
  for(const d of G.drops)tear(c,d.x,d.y,d.big?13:9);
  for(const r of G.ripples){c.save();c.globalAlpha=1-r.t/.6;c.strokeStyle='#e8f4ff';c.lineWidth=3;c.beginPath();c.ellipse(r.x,r.y,r.w*(.4+r.t),5+r.t*8,0,0,7);c.stroke();c.restore()}
  for(const p of G.pots)drawPot(c,p);
  // tatami wetness gauge
  {const x=150,y=1196,w=420,f=G.wet/WETMAX;c.save();c.textAlign='left';c.textBaseline='middle';outlineText(c,'たたみ',x-104,y+12,24,'#fff',6);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(x,y,w,24,12);c.fill();c.stroke();
    if(f>0){c.fillStyle=f>.7?'#3a6a9a':'#6aa0d0';c.beginPath();c.roundRect(x+4,y+4,(w-8)*Math.min(1,f),16,8);c.fill()}c.restore()}
  if(G.flash>0){c.fillStyle=`rgba(255,255,255,${G.flash*.5})`;c.fillRect(0,0,W0,H0)}
  if(G.sayT>0){c.save();c.globalAlpha=Math.min(1,G.sayT*4);c.translate(360,300);c.fillStyle='#fffaf2';c.strokeStyle='#4a2c1d';c.lineWidth=4;c.beginPath();c.roundRect(-210,-30,420,58,22);c.fill();c.stroke();
    c.textAlign='center';c.textBaseline='middle';c.fillStyle='#4a2c1d';c.font='26px "Dela Gothic One",sans-serif';c.fillText(G.say,0,-2);c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1.4){G.texts.splice(i,1);continue}
    c.save();c.textAlign='center';c.textBaseline='middle';c.translate(x.x,x.y-x.t*24);c.globalAlpha=x.t>1.1?(1.4-x.t)/.3:1;outlineText(c,x.s,0,0,x.small?26:34,x.c);c.restore()}
  if(G.phase==='play'&&G.t<5){c.save();c.textAlign='center';outlineText(c,'うつわを ひっぱって しずくの したへ',360,820,26,'#fff',7);outlineText(c,'タップで みずを すてる',360,862,24,'#fff',7);c.restore()}
  c.restore()}
