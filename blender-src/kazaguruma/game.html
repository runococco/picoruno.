<script>
/*ART*/const ART={},LAYER={},SCENE={ground:1100};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,DUR=60,R=84,LO=.45,HI=1.1,STOP=.12,FLY=1.4,SLOTS=[[150,560],[360,470],[570,560],[250,800],[470,800]],COLS=['pw_red','pw_blue','pw_yellow','pw_green','pw_purple'],ADD=[0,0,0,14,28];

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('kazaguruma-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('kazaguruma-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,texts:[],wheels:[],flying:[],leaves:[]};
function fresh(){return {phase:'play',t:0,left:DUR,score:0,lives:3,wheels:SLOTS.map((p,i)=>({i,x:p[0],y:p[1],s:.7,a:rnd(0,6),on:ADD[i]===0,decay:rnd(.85,1.2),down:0,swT:0})),
  flying:[],leaves:[],gust:null,gustT:9,allT:0,stopN:0,flyN:0,texts:[],say:'',sayT:0,endT:0,allOn:false}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){const s=Math.ceil(Math.max(0,G.left));$('timeP').textContent=s;$('timeP').classList.toggle('low',G.phase==='play'&&s<=10);$('scoreP').textContent=Math.floor(G.score)+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.3}

/* ---------- input: a swipe across a pinwheel spins it ---------- */
function segDist(px,py,x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,l=dx*dx+dy*dy;let k=l?((px-x0)*dx+(py-y0)*dy)/l:0;k=Math.max(0,Math.min(1,k));return Math.hypot(px-x0-k*dx,py-y0-k*dy)}
function swipe(x0,y0,x1,y1){if(G.phase!=='play')return;const len=Math.hypot(x1-x0,y1-y0);if(len<2)return;
  for(const w of G.wheels){if(!w.on||w.down>0)continue;if(segDist(w.x,w.y,x0,y0,x1,y1)<R){w.s+=Math.min(.22,len*.0022);if(w.swT<=0){sfx('swish',.45,1+w.i*.06);w.swT=.12}}}}

/* ---------- flow ---------- */
function lose(w,fly){G.lives--;w.down=1.4;w.flew=fly;if(fly){G.flyN++;G.flying.push({c:COLS[w.i],x:w.x,y:w.y,vx:rnd(-200,200),vy:-700,a:w.a,t:0});w.s=0;sfx('fly',.6);text('とんでった！',w.x,w.y-110,'#ffd0c0',true);say('まわしすぎ〜')}
  else{G.stopN++;w.s=0;sfx('stop',.5);text('とまった',w.x,w.y-110,'#ffd0c0',true);say('あ、とまった')}hud();if(G.lives<=0)finish()}
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);
  for(let i=G.flying.length-1;i>=0;i--){const f=G.flying[i];f.t+=dt;f.x+=f.vx*dt;f.vy+=900*dt;f.y+=f.vy*dt;f.a+=dt*20;if(f.t>2)G.flying.splice(i,1)}
  for(let i=G.leaves.length-1;i>=0;i--){const l=G.leaves[i];l.t+=dt;l.x+=l.vx*dt;l.y+=Math.sin(l.t*5+l.p)*40*dt;l.r+=dt*4;if(l.x>W0+60)G.leaves.splice(i,1)}
  for(const w of G.wheels)w.a+=w.s*14*dt*(w.i%2?-1:1);
  if(G.phase!=='play'){if(G.phase==='end'){G.endT+=dt;if(G.endT>1.4&&$('resultOv').hidden)showResult()}return}
  G.left-=dt;if(G.left<=0){G.left=0;finish();hud();return}
  for(const w of G.wheels){if(!w.on&&G.t>=ADD[w.i]){w.on=true;w.s=.75;sfx('new',.5);text('ふえた！',w.x,w.y-110,'#fff',true)}}
  // gusts: leaves blow in first, then every pinwheel gets a push
  G.gustT-=dt;if(!G.gust&&G.gustT<=0){G.gust={t:0};say('かぜが くるよ');for(let k=0;k<14;k++)G.leaves.push({x:-40-rnd(0,300),y:rnd(380,980),vx:rnd(420,620),t:0,p:rnd(0,6),r:rnd(0,6)})}
  if(G.gust){G.gust.t+=dt;if(G.gust.t>1.4&&!G.gust.hit){G.gust.hit=1;sfx('gust',.7);for(const w of G.wheels)if(w.on&&w.down<=0)w.s+=.32+G.t*.002}if(G.gust.t>2.2){G.gust=null;G.gustT=rnd(7,10)}}
  let inZone=0,act=0;
  for(const w of G.wheels){if(!w.on)continue;w.swT-=dt;if(w.down>0){w.down-=dt;if(w.down<=0){w.s=.7;w.flew=false}continue}act++;
    w.s-=dt*(.1+G.t*.0028)*w.decay*(.6+w.s*.6);if(w.s>=LO&&w.s<=HI){inZone++;G.score+=dt*10}
    if(w.s<STOP)lose(w,false);else if(w.s>FLY)lose(w,true);if(G.phase!=='play')return}
  const all=act>0&&inZone===act&&act===G.wheels.filter(w=>w.on).length;if(all){G.allT+=dt;G.score+=dt*5*act}if(all&&!G.allOn&&act>=3){sfx('levelup',.35);text('ぜんぶ くるくる！',360,300,'#ffe27a')}G.allOn=all;hud()}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7)}
function rank(n){return n>=3500?'かざぐるま めいじん':n>=2800?'くるくる マイスター':n>=2000?'のはらの かぜまかせ':n>=1200?'そよかぜ みならい':'はじめての かざぐるま'}
function showResult(){const n=Math.floor(G.score),best=LS.get('kazaguruma-best',0),nb=n>best;if(nb){LS.set('kazaguruma-best',n);if(n>0)sfx('best',.6)}
  $('resHead').textContent=G.lives>0?'さいごまで まわせた！':'きょうの かざぐるま';
  $('resScore').textContent=n+' てん';$('rAll').textContent=Math.round(G.allT)+'びょう';$('rStop').textContent=G.stopN;$('rFly').textContent=G.flyN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.lives>=3?'ひとつも とめずに まわしきった。おみごと！':'かぜが くる まえは すこし ゆっくりめに しておくと とばないよ。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`くるくる かざぐるま🎐 ${n}てん（ぜんぶ くるくる ${Math.round(G.allT)}びょう）「${rank(n)}」\n#くるくるかざぐるま #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/kazaguruma.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function wheelAt(c,k,x,y,a,al){const im=IMG[k],s=192;c.save();c.translate(x,y);c.rotate(a);if(al!=null)c.globalAlpha=al;if(im)c.drawImage(im,-s/2,-s/2,s,s);else{c.fillStyle='#e8584a';for(let q=0;q<4;q++){c.rotate(Math.PI/2);c.beginPath();c.moveTo(0,0);c.lineTo(0,-80);c.lineTo(50,-40);c.fill()}}c.restore()}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#cfe8f8';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  const sky=c.createLinearGradient(0,0,0,700);sky.addColorStop(0,'#8ecaf0');sky.addColorStop(1,'#e2f2fb');c.fillStyle=sky;c.fillRect(-200,-200,W0+400,1000);
  c.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<4;i++){const x=((i*260+G.t*(G.gust?60:14))%(W0+300))-150,y=150+(i*70)%200;for(const [dx,dy,rx,ry] of [[0,0,70,24],[40,-14,46,24],[-40,-6,40,18]]){c.beginPath();c.ellipse(x+dx,y+dy,rx,ry,0,0,7);c.fill()}}
  if(IMG.bg)c.drawImage(IMG.bg,0,0,W0,H0);
