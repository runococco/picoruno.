/* Pond in the afternoon: sky blue, water teal, dark-brown outlined flat UI. */
:root{
  --ink:#4a2c1d;

}
html,body{height:100%;margin:0;background:#bfe0ff}

  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}

  background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);margin:0 0 12px;letter-spacing:.04em;text-decoration:none;box-sizing:border-box}

.bag{display:flex;justify-content:center;gap:10px;margin:6px 0 8px}

.logo2{font-size:1.9rem}

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="pill n" id="stoneP">1/10</div><div class="pill" id="scoreP">0 てん</div><button class="ib" id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" fill="#4a2c1d"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button></div>

  <div class="ov" id="titleOv">
    <div class="card">
      <div class="logo">いけの ほとりで</div>

      <div class="how"><ol>

        <li>いしが <em>たいらな しゅんかん</em> に、うえへ しゅっと <em>スワイプ</em></li>
        <li>はやすぎると たかく とんで しずみやすい。<em>はっぱ</em> で はねると ボーナス</li></ol></div>
      <button class="big" id="startBtn">いしを なげる</button>

    </div>
  </div>
  <div class="ov" id="resultOv" hidden>
    <div class="card">
      <div class="logo">きょうの みずきり</div>
      <div class="res-big" id="resScore">0 てん</div>
      <div class="res-row"><div>さいこう<b id="rBest">0かい</b></div><div>とおい<b id="rFar">0m</b></div><div>はっぱ<b id="rPad">0</b></div></div>
      <div class="res-rank" id="resRank"></div>
      <p class="res-note" id="resNote"></p>
      <button class="big" id="againBtn">もういちど</button>
      <a class="big sec" id="shareBtn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener" style="font-size:1rem">X でじまん</a>
      <p class="back"><a href="https://picoruno.com/">← picoruno. のゲーム一覧へ</a></p>
    </div>
  </div>
</div>
<script>
/*ART*/const ART={},LAYER={},SCENE={cam:{hc:1.6,pitch:8,f:1066.7},paw:[410,860],pawW:[.11,2.27,.79],shore:2.9,far:64,horizon:490,edge:1047,spr:{stone:{res:96,pxu:80},pad:{res:192,r:83.5}}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,CAM=SCENE.cam,PW=SCENE.pawW,FAR=SCENE.far,STONES=10,GRAV=9.8,TILT=32;
const cp=Math.cos(CAM.pitch*Math.PI/180),sp=Math.sin(CAM.pitch*Math.PI/180);
function proj(x,y,z){const d=y*cp-(z-CAM.hc)*sp,u=y*sp+(z-CAM.hc)*cp;return [W0/2+CAM.f*x/d,H0/2-CAM.f*u/d,d]}

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(i)IMG[k]=i})))}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('mizukiri-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.3;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('mizukiri-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- state ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
const G={phase:'title',t:0,ripples:[],texts:[],pads:[],glints:[]};
for(let i=0;i<26;i++)G.glints.push({x:rnd(-1,1),y:rnd(4,60),p:rnd(0,6)});
function fresh(){return {phase:'play',t:0,score:0,n:0,state:'aim',stT:0,stone:null,ripples:[],texts:[],pads:[],glints:G.glints,best:0,far:0,padN:0,shores:0,
  hold:false,tilt:0,tw:rnd(0,6),tsp:3.2,sx:0,sy:0,st0:0,throws:[],say:'',sayT:0,endT:0}}
function reset(){Object.assign(G,fresh());G.phase='title';hud()}
function hud(){$('stoneP').textContent=Math.min(G.n+1,STONES)+'/'+STONES;$('scoreP').textContent=G.score+' てん'}
function text(s,x,y,c,small){G.texts.push({s,x,y,c,small,t:0})}
function say(s){G.say=s;G.sayT=1.4}
function layPads(){G.pads=[];const n=3+Math.floor(Math.random()*2);for(let i=0;i<n;i++){let p;for(let k=0;k<20;k++){const y=rnd(8,44),x=rnd(-.26,.26)*y;p={x,y,r:rnd(.9,1.3),bob:rnd(0,6)};if(G.pads.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>4))break}G.pads.push(p)}}

/* ---------- throw ---------- */
function quality(){return Math.max(0,1-Math.abs(G.tilt)/TILT)}
function throwStone(v0,yaw,q){if(G.state!=='aim'||G.phase!=='play')return;const el=(6+Math.max(0,v0-16)*2.5)*Math.PI/180;
  G.stone={x:PW[0],y:PW[1],z:PW[2],vx:v0*Math.cos(el)*Math.sin(yaw),vy:v0*Math.cos(el)*Math.cos(yaw),vz:v0*Math.sin(el),q,skips:0,pads:0,rot:0,kind:G.n%2?'stone2':'stone',shore:false};
  G.state='fly';G.stT=0;G.hold=false;sfx('throw',.5);say(q>.8?'それっ':'えいっ')}
function contact(s){const vh=Math.hypot(s.vx,s.vy),steep=Math.abs(s.vz)/Math.max(.1,vh);let pad=null;for(const p of G.pads)if(Math.hypot(s.x-p.x,s.y-p.y)<p.r)pad=p;
  G.ripples.push({x:s.x,y:s.y,t:0,big:pad?0:1});
  if(pad){s.vz=Math.abs(s.vz)*.7+2.6;s.vx*=.95;s.vy*=.95;s.pads++;s.skips++;G.padN++;sfx('pad',.55);const [px,py]=proj(s.x,s.y,0);text('はっぱで ぴょん！',px,py-60,'#ffe27a',true);pad.hit=.6;return true}
  if(vh<3.4||s.q<.12||steep>.4||(s.q<.35&&Math.random()<.5)){if(!s.skips){const [px,py]=proj(s.x,s.y,0);text(steep>.4&&vh>=3.4?'たかすぎた…':vh<3.4?'よわかった…':'ななめだった…',px,py-70,'#ffd0c0',true)}sink(s);return false}
  const k=.72+.15*s.q;s.vx*=k;s.vy*=k;s.vz=Math.abs(s.vz)*.5+vh*k*.05;s.skips++;sfx('skip',.5,[1,1.335,1.498,2][Math.min(3,Math.floor(s.skips/3))]);
  const [px,py]=proj(s.x,s.y,0);text(s.skips+'',px,py-40,'#fff',true);return true}
function sink(s){sfx('sink',.6);G.ripples.push({x:s.x,y:s.y,t:0,big:2});endThrow(s)}
function endThrow(s){const dist=Math.max(0,s.y-SCENE.shore),pts=s.skips*10+Math.floor(dist)+s.pads*20+(s.shore?50:0);G.score+=pts;G.best=Math.max(G.best,s.skips);G.far=Math.max(G.far,Math.floor(dist));
  G.throws.push(s.skips);G.state='done';G.stT=0;G.stone=null;
  text(s.skips?`${s.skips}かい はねた！ +${pts}`:`ぽちゃん… +${pts}`,360,380,s.skips>=8?'#ffe27a':'#fff');
  if(s.skips>=10)say('すごい！');else if(!s.skips)say('あれ〜');hud()}

/* ---------- step ---------- */
function step(dt){
  G.t+=dt;G.sayT=Math.max(0,G.sayT-dt);G.stT+=dt;
  if(G.hold){G.tw+=dt*G.tsp;G.tilt=Math.sin(G.tw)*TILT;if(Math.random()<dt*.8)G.tsp=rnd(2.6,4.4)}
  const s=G.stone;if(s&&G.state==='fly'){const n=6,h=dt/n;for(let i=0;i<n&&G.stone;i++){s.vz-=GRAV*h;s.x+=s.vx*h;s.y+=s.vy*h;s.z+=s.vz*h;s.rot+=h*18;
      if(s.y>=FAR){s.shore=true;G.shores++;sfx('shore',.6);sfx('levelup',.5);text('むこうぎし まで！ +50',360,330,'#ffe27a');say('とどいた！');endThrow(s);break}
      if(s.z<=0&&s.vz<0){s.z=0;if(!contact(s))break}}}
  if(G.phase==='play'&&G.state==='done'&&G.stT>1.6){G.n++;if(G.n>=STONES)finish();else{G.state='aim';G.stT=0;if(G.n%3===0)layPads();hud()}}
  for(let i=G.ripples.length-1;i>=0;i--){G.ripples[i].t+=dt;if(G.ripples[i].t>1.8)G.ripples.splice(i,1)}
  for(const p of G.pads)p.hit=Math.max(0,(p.hit||0)-dt);
  if(G.phase==='end'){G.endT+=dt;if(G.endT>1.6&&$('resultOv').hidden)showResult()}}
function finish(){if(G.phase!=='play')return;G.phase='end';G.endT=0;duck(.08,.2);sfx('over',.7);hud()}
function rank(n){return n>=900?'みずきり めいじん':n>=650?'いけの ぬし':n>=420?'ぴょんぴょん マスター':n>=220?'みずきり じょうず':'はじめての みずきり'}
function showResult(){const n=G.score,best=LS.get('mizukiri-best',0),nb=n>best;if(nb){LS.set('mizukiri-best',n);if(n>0)sfx('best',.6)}
  $('resScore').textContent=n+' てん';$('rBest').textContent=G.best+'かい';$('rFar').textContent=G.far+'m';$('rPad').textContent=G.padN;$('resRank').textContent=rank(n);
  $('resNote').innerHTML=(nb&&n>0?'ベスト更新！<br>':'')+(G.shores?'むこうぎしまで '+G.shores+'かい とどいた！':'いしが たいらな ときに なげると よく はねるよ。<br>はやすぎると たかく とんで しずみやすい。');
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`ねこの みずきり🪨 ${n}てん（さいこう ${G.best}かい はねた）「${rank(n)}」\n#ねこのみずきり #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/mizukiri.html');
  $('resultOv').hidden=false;bgm(false);refreshTitle()}

/* ---------- draw ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.min(CW/W0,Math.max(CH/H0,CW/W0*.92));OX=(CW-W0*S)/2;OY=(CH-H0*S)*.5}
function outlineText(c,s,x,y,sz,fill,lw){c.font=`${sz}px "Dela Gothic One",sans-serif`;c.lineJoin='round';c.lineWidth=lw||sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function ell(x,y,r){const a=proj(x,y,0),b=proj(x+r,y,0),f=proj(x,y+r,0),n=proj(x,y-r,0);return [a[0],a[1],b[0]-a[0],(n[1]-f[1])/2]}
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#6aa84a';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
