<div id="app">

<script>
/*ART*/const ART={},LAYER={},SCENE={pxu:160,elev:58,field:[-2.15,2.15,-4.4,2.35],pond:[512,800,124.8,88],props:{},rocks:[],spr:{}};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280,ROUND=60;
const PXU=SCENE.pxu,EL=SCENE.elev*Math.PI/180,SE=Math.sin(EL),CE=Math.cos(EL);
// world (ground plane, px = units*PXU, origin at frame centre) <-> frame
const sxOf=wx=>W0/2+wx,syOf=wy=>H0/2-wy*SE,wyOf=sy=>(H0/2-sy)/SE;
const F=SCENE.field.map(v=>v*PXU);           // x0,x1,y0,y1 in world px
const POND={x:SCENE.pond[0]-W0/2,y:wyOf(SCENE.pond[1]),rx:SCENE.pond[2],ry:SCENE.pond[3]};
const OBST=[];for(const k in SCENE.props){const p=SCENE.props[k];OBST.push({x:p[0]-W0/2,y:wyOf(p[1]),r:p[2],layer:k})}
for(const p of SCENE.rocks)OBST.push({x:p[0]-W0/2,y:wyOf(p[1]),r:p[2]*.95,rock:1});
const SB=SCENE.spr.ball||{res:256,scale:2.3},BR=SB.res/SB.scale;   // sprite px per unit radius
const K=.42,R0=20,RMAX=138,MINBODY=52;

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function outlined(im,px,thr){
  const c=document.createElement('canvas');c.width=im.width+px*2;c.height=im.height+px*2;const x=c.getContext('2d');
  const m=document.createElement('canvas');m.width=im.width;m.height=im.height;const mx=m.getContext('2d');mx.drawImage(im,0,0);
  const d=mx.getImageData(0,0,m.width,m.height),a=d.data;for(let i=0;i<a.length;i+=4){const on=a[i+3]>thr;a[i]=74;a[i+1]=44;a[i+2]=29;a[i+3]=on?255:0}mx.putImageData(d,0,0);
  for(let k=0;k<16;k++){const t=k/16*Math.PI*2;x.drawImage(m,px+Math.cos(t)*px,px+Math.sin(t)*px)}
  x.drawImage(im,px,px);c.pad=px;return c}
const snowCv=document.createElement('canvas');snowCv.width=W0;snowCv.height=H0;const sctx=snowCv.getContext('2d');
async function loadArt(){
  await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>{if(!i)return;IMG[k]=['bucket','mikan','momiji','twig','ball'].includes(k)?outlined(i,k==='ball'?5:4,110):i})));
  resetSnow()}
function layer(c,k){const im=IMG[k],L=LAYER[k];if(!im||!L)return;c.drawImage(im,L[0],L[1],L[2],L[3])}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,decoding=null;const BUF={};
let muted=LS.get('yuki-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.4;bgmGain.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function duck(v,t=.25){if(bgmGain&&ac)bgmGain.gain.setTargetAtTime(v,ac.currentTime,t)}
function setMute(m){muted=m;LS.set('yuki-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- snow ---------- */
const CS=10,GX0=F[0],GY0=F[2],GW=Math.ceil((F[1]-F[0])/CS),GH=Math.ceil((F[3]-F[2])/CS);const SNOW=new Float32Array(GW*GH);
function inPond(x,y,m=0){const dx=(x-POND.x)/(POND.rx+m),dy=(y-POND.y)/(POND.ry+m);return dx*dx+dy*dy<1}
function resetSnow(){
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const x=GX0+(i+.5)*CS,y=GY0+(j+.5)*CS;SNOW[j*GW+i]=inPond(x,y,4)?0:1}
  sctx.globalCompositeOperation='source-over';sctx.clearRect(0,0,W0,H0);if(IMG.snow)layer(sctx,'snow')}
function snowLeft(){let s=0;for(let i=0;i<SNOW.length;i++)s+=SNOW[i];return s}
const SNOWTOTAL=(()=>{let s=0;for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const x=GX0+(i+.5)*CS,y=GY0+(j+.5)*CS;if(!inPond(x,y,4))s++}return s})();
// take the snow under a footprint circle; returns the area picked up (world px^2)
function scoop(x,y,rf){let got=0;const i0=Math.max(0,Math.floor((x-rf-GX0)/CS)),i1=Math.min(GW-1,Math.floor((x+rf-GX0)/CS)),j0=Math.max(0,Math.floor((y-rf-GY0)/CS)),j1=Math.min(GH-1,Math.floor((y+rf-GY0)/CS));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const cx=GX0+(i+.5)*CS-x,cy=GY0+(j+.5)*CS-y;if(cx*cx+cy*cy>rf*rf)continue;const k=j*GW+i;if(SNOW[k]>0){got+=SNOW[k]*CS*CS;SNOW[k]=0}}
  if(got>0){const sx=sxOf(x),sy=syOf(y);sctx.save();sctx.globalCompositeOperation='destination-out';sctx.translate(sx,sy);sctx.scale(1,SE);
    const g=sctx.createRadialGradient(0,0,rf*.6,0,0,rf*1.04);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');sctx.fillStyle=g;sctx.beginPath();sctx.arc(0,0,rf*1.05,0,7);sctx.fill();sctx.restore()}
  return got}
function snowAt(x,y){const i=Math.floor((x-GX0)/CS),j=Math.floor((y-GY0)/CS);if(i<0||j<0||i>=GW||j>=GH)return 0;return SNOW[j*GW+i]}

/* ---------- 3D-ish ball orientation for the rolling specks ---------- */
function rotM(ax,ay,az,a){const c=Math.cos(a),s=Math.sin(a),t=1-c;return [t*ax*ax+c,t*ax*ay-s*az,t*ax*az+s*ay,t*ax*ay+s*az,t*ay*ay+c,t*ay*az-s*ax,t*ax*az-s*ay,t*ay*az+s*ax,t*az*az+c]}
function mul(A,B){const R=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)R[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return R}
function app(M,v){return [M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]]}
function appT(M,v){return [M[0]*v[0]+M[3]*v[1]+M[6]*v[2],M[1]*v[0]+M[4]*v[1]+M[7]*v[2],M[2]*v[0]+M[5]*v[1]+M[8]*v[2]]}
const SPECK=['#5a4632','#6e5a3e','#8a8a4a','#a89a5a','#c8642a'];

/* ---------- game state ---------- */
const G={phase:'title',t:0,left:ROUND,score:0,balls:[],men:[],fx:[],texts:[],grab:null,tx:0,ty:0,flakes:[],snowfall:0,crunchT:0,hint:null,best:0,perfect:0,lastHat:-1};
function newBall(x,y,r=R0){return {x,y,r,M:[1,0,0,0,1,0,0,0,1],sp:[],bump:0,id:Math.random()}}
function reset(){G.t=0;G.left=ROUND;G.score=0;G.balls=[];G.men=[];G.fx=[];G.texts=[];G.grab=null;G.snowfall=0;G.best=0;G.perfect=0;G.lastHat=-1;resetSnow();
  G.flakes=[];for(let k=0;k<60;k++)G.flakes.push({x:Math.random()*W0,y:Math.random()*H0,v:30+Math.random()*50,s:1.5+Math.random()*2.5,p:Math.random()*6});hud()}
function hud(){$('timeP').textContent=Math.ceil(Math.max(0,G.left));$('timeP').classList.toggle('low',G.left<=10&&G.phase==='play');$('scoreP').textContent=G.score+' てん'}

const clampX=(x,r)=>Math.max(F[0]+r*.35,Math.min(F[1]-r*.35,x)),clampY=(y,r)=>Math.max(F[2]+r*.2,Math.min(F[3]-r*.6,y));
function solids(except){const out=[];for(const o of OBST)out.push(o);for(const m of G.men)out.push({x:m.x,y:m.y,r:m.rb*.92,man:m});for(const b of G.balls)if(b!==except)out.push({x:b.x,y:b.y,r:b.r,ball:b});return out}
function tryStack(a,b){
  const big=a.r>=b.r?a:b,small=big===a?b:a;if(big.r<MINBODY||small.r>big.r*.92)return false;
  const q=small.r/big.r,d=Math.abs(q-.6);const grade=d<.06?2:d<.14?1:0;
  const hats=['bucket','mikan','momiji'];G.lastHat=(G.lastHat+1)%hats.length;
  const m={x:big.x,y:big.y,rb:big.r,rh:small.r,hx:sxOf(small.x),hy:syOf(small.y)-small.r*CE,t:0,hat:hats[G.lastHat],grade,Mb:big.M,spb:big.sp,Mh:small.M,sph:small.sp,blink:Math.random()*3};
  G.men.push(m);G.balls=G.balls.filter(z=>z!==a&&z!==b);if(G.grab===a||G.grab===b)G.grab=null;
  const base=Math.round(big.r+small.r),mul=[1,1.5,2.2][grade],pt=Math.round(base*mul/10)*10;G.score+=pt;if(grade===2)G.perfect++;G.best=Math.max(G.best,Math.round(big.r));
  const sx=sxOf(m.x),sy=syOf(m.y)-m.rb*CE*2-m.rh*1.2;
  setTimeout(()=>{G.texts.push({s:['ゆきだるま！','いいかんじ！','ばっちり！'][grade],x:sx,y:sy-40,t:0,c:grade===2?'#ffe27a':'#fff'});G.texts.push({s:'+'+pt,x:sx,y:sy,t:-.1,c:'#fff',small:1});
    for(let k=0;k<18;k++){const an=Math.random()*Math.PI*2,v=120+Math.random()*240;G.fx.push({x:sx,y:sy+40,vx:Math.cos(an)*v,vy:Math.sin(an)*v-60,t:0,life:.7+Math.random()*.4,c:k%3?'#fff':'#bfe0ff'})}
    sfx(grade===2?'perfect':'done',.8)},420);
  sfx('stack',.9);if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}hud();return true}
