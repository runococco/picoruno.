<div id="app">

  <div class="ov" id="titleOv">

        <span class="bar"></span><small><span>はじめ（うすい）</span><span>さいご（こい）</span></small>

<script>
/*ART*/const ART={},LAYER={},SCENE={pxu:160,elev:48,tz:.9,trayZ:.06,cup:{rb:.27,rt:.35,h:.6,thk:.03},origin:[360,736],kyusu:[360,458],tip:[488,433],cups:['shiro']};/*/ART*/
/*AUDIO*/const AUD={};/*/AUDIO*/
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const W0=720,H0=1280;
const SC=SCENE,PXU=SC.pxu,EL=SC.elev*Math.PI/180,CUPD=SC.cup;
const pyOf=z=>H0/2-((z-SC.tz)*Math.cos(EL))*PXU;    // frame row of a point on the cup axis (y=0) at height z

/* ---------- art ---------- */
const IMG={};
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function loadArt(){await Promise.all(Object.keys(ART).map(k=>loadImg(ART[k]).then(i=>IMG[k]=i)))}
function layer(c,k,dx=0,dy=0){const im=IMG[k],L=LAYER[k];if(!im||!L)return;c.drawImage(im,L[0]+dx,L[1]+dy,L[2],L[3])}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,master=null,bgmGain=null,bgmSrc=null,pourG=null,pourSrc=null,decoding=null;const BUF={};
let muted=LS.get('cha-mute',false);
function b64buf(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function audioInit(){if(ac||!AC)return;ac=new AC();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);bgmGain=ac.createGain();bgmGain.gain.value=.45;bgmGain.connect(master);
  pourG=ac.createGain();pourG.gain.value=0;pourG.connect(master);
  decoding=Promise.all(Object.keys(AUD).map(k=>new Promise((r,j)=>{const p=ac.decodeAudioData(b64buf(AUD[k]),r,j);if(p&&p.then)p.then(r,j)}).then(b=>{BUF[k]=b}).catch(()=>{})))}
function unlock(){audioInit();if(ac&&ac.state==='suspended')ac.resume()}
function snapRate(r){const st=12*Math.log2(r);let b=0;for(const a of [-12,-7,-5,0,5,7,12])if(Math.abs(a-st)<Math.abs(b-st))b=a;return Math.pow(2,b/12)}
function sfx(k,vol=1,rate=1){if(!ac||!BUF[k]||muted)return;const s=ac.createBufferSource();s.buffer=BUF[k];s.playbackRate.value=snapRate(rate);const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
function bgm(on){if(!ac)return;if(on){if(bgmSrc||!BUF.bgm)return;bgmSrc=ac.createBufferSource();bgmSrc.buffer=BUF.bgm;bgmSrc.loop=true;bgmSrc.connect(bgmGain);bgmSrc.start()}else if(bgmSrc){try{bgmSrc.stop()}catch(e){}bgmSrc=null}}
function pourSound(f){if(!ac)return;if(!pourSrc&&BUF.pour){pourSrc=ac.createBufferSource();pourSrc.buffer=BUF.pour;pourSrc.loop=true;pourSrc.connect(pourG);pourSrc.start()}
  if(pourSrc){pourSrc.playbackRate.value=.85+f*.3;pourG.gain.setTargetAtTime(f>0?.25+f*.45:0,ac.currentTime,.05)}}
function setMute(m){muted=m;LS.set('cha-mute',m);if(master)master.gain.value=m?0:1;$('muteBtn').textContent=m?'♪ 音なし':'♪ 音あり'}

/* ---------- tea ---------- */
const TARGET=.8,FMAX=.62;
const ROUNDS=[2,3,4];
// colour of tea by strength c (0 = very weak, 1 = very strong)
const TC=[[232,226,160],[200,206,110],[150,176,70],[95,130,40],[66,98,26]];
function teaRGB(c){c=Math.max(0,Math.min(1,c))*(TC.length-1);const i=Math.min(TC.length-2,Math.floor(c)),u=c-i;return TC[i].map((v,k)=>Math.round(v+(TC[i+1][k]-v)*u))}
const teaCol=(c,a=1)=>{const [r,g,b]=teaRGB(c);return `rgba(${r},${g},${b},${a})`};
const G={phase:'title',round:0,cups:[],pot:1,total:1,poured:0,spilled:0,kx:360,tx:360,tilt:0,flow:0,down:false,scores:[],fx:[],ripples:[],texts:[],t:0,endT:0,bob:0};
function strength(){return .1+.9*Math.pow(Math.min(1,G.poured/G.total),1.1)}
function setupRound(i){
  const n=ROUNDS[i];const kinds=SC.cups.slice();for(let k=kinds.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[kinds[k],kinds[j]]=[kinds[j],kinds[k]]}
  const sp=n<=2?190:n===3?165:146;
  G.cups=[];for(let k=0;k<n;k++)G.cups.push({k:'cup_'+kinds[k%kinds.length],dx:(k-(n-1)/2)*sp,v:0,m:0,just:0,over:0,wob:0});
  G.total=n*TARGET;G.pot=G.total;G.poured=0;G.spilled=0;G.flow=0;G.tilt=0;G.endT=0;G.ripples=[];G.fx=[];
  G.kx=G.tx=W0/2;$('roundP').textContent=`${i+1} / ${ROUNDS.length}`;updPot();
}
function updPot(){$('potBar').style.width=Math.max(0,G.pot/G.total*100)+'%'}

/* ---------- geometry ---------- */
const R_IN=z=>{const k=(z-SC.trayZ)/CUPD.h;return (CUPD.rb+(CUPD.rt-CUPD.rb)*k)*(1+.06*Math.sin(k*Math.PI))-CUPD.thk};
const Z0=SC.trayZ+CUPD.thk,ZT=SC.trayZ+CUPD.h;
function surf(cup,h){const z=Z0+(ZT-Z0)*Math.min(1,h);const r=R_IN(z)*PXU;return {x:W0/2+cup.dx,y:pyOf(z),rx:r,ry:r*Math.sin(EL)}}
function rim(cup){return surf(cup,1)}
// spout tip for the current kyusu position and tilt
const PIV={x:SC.kyusu[0],y:SC.kyusu[1]},TIP0={x:SC.tip[0]-SC.kyusu[0],y:SC.tip[1]-SC.kyusu[1]};
function tipPos(){const a=G.tilt,ca=Math.cos(a),sa=Math.sin(a);return {x:G.kx+TIP0.x*ca-TIP0.y*sa,y:PIV.y+G.bob+TIP0.x*sa+TIP0.y*ca}}

/* ---------- loop ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');let CW=0,CH=0,DPR=1,S=1,OX=0,OY=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2.5);const r=cv.getBoundingClientRect();CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  S=Math.max(CW/W0,CH/H0);OX=(CW-W0*S)/2;OY=(CH-H0*S)*.55}
function toFrame(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
function start(){unlock();guardHistory();for(const id of ['titleOv','resultOv','pauseOv','roundOv'])$(id).hidden=true;G.round=0;G.scores=[];setupRound(0);G.phase='play';
  if(ac)Promise.resolve(decoding).then(()=>{bgm(true);sfx('start',.6)});pingPlay()}
function step(dt){
  G.t+=dt;G.bob=Math.sin(G.t*1.6)*3*(1-G.tilt);
  // the kyusu follows the finger so that the stream lands under it
  G.kx+=(G.tx-G.kx)*Math.min(1,dt*9);
  const maxT=.95;const want=G.phase==='play'&&G.down&&G.pot>0?maxT:0;
  G.tilt+=(want-G.tilt)*Math.min(1,dt*(want>G.tilt?4.2:7));
  const fl=G.pot>0?Math.pow(Math.max(0,(G.tilt-.38)/(maxT-.38)),1.4):0;
  G.flow+=(fl-G.flow)*Math.min(1,dt*10);
  if(G.flow<.01&&fl===0)G.flow=0;
  pourSound(G.flow);
  if(G.flow>0&&G.phase==='play'){
    let dv=Math.min(G.pot,G.flow*FMAX*dt);const c=strength();G.pot-=dv;G.poured+=dv;
    const tp=tipPos();const lx=tp.x+G.flow*14;
    const cup=G.cups.find(q=>{const r=rim(q);return Math.abs(lx-r.x)<r.rx*.86});
    if(cup){cup.v+=dv;cup.m+=dv*c;cup.wob=Math.min(1,cup.wob+dt*3);
      if(cup.v>1){const ex=cup.v-1;cup.m-=ex*(cup.m/cup.v);cup.v=1;G.spilled+=ex;if(!cup.over){cup.over=1;G.texts.push({s:'あふれた！',x:rim(cup).x,y:rim(cup).y-90,t:0,c:'#fffaf2'})}if(Math.random()<dt*6)sfx('spill',.4);spill(rim(cup).x+(Math.random()-.5)*rim(cup).rx*2,rim(cup).y+40,c)}
      if(!cup.just&&cup.v>=TARGET-.03){cup.just=1;sfx('just',.5);G.texts.push({s:'ここまで',x:rim(cup).x,y:rim(cup).y-90,t:0,c:'#f2c14e',small:1})}
      if(Math.random()<dt*20){const s=surf(cup,cup.v);G.ripples.push({x:lx,y:s.y,t:0,cup})}}
    else{G.spilled+=dv;if(Math.random()<dt*8)sfx('spill',.35);spill(lx,landY(lx),c)}
    updPot();
  }
  for(const q of G.cups)q.wob=Math.max(0,q.wob-dt*.8);
  if(G.phase==='play'&&G.pot<=1e-4&&G.flow<.02){G.endT+=dt;if(G.endT>.8)endRound()}
}
function landY(x){return pyOf(SC.trayZ)+30}
function spill(x,y,c){G.fx.push({x,y,vx:(Math.random()-.5)*120,vy:-Math.random()*120,g:900,t:0,life:.5,r:3+Math.random()*3,c:teaCol(c,.9)});if(Math.random()<.15)G.fx.push({x,y,vx:0,vy:0,t:0,life:4,r:12+Math.random()*10,c:teaCol(c,.35),flat:1})}
function judgeCup(q){const c=q.v>0?q.m/q.v:0;let w,ok=false;
  if(q.over)w='あふれた';else if(q.v<TARGET-.1)w='すくない';else if(q.v>TARGET+.1)w='おおい';else{w='ちょうど';ok=true}
  return {c,w,ok}}
function endRound(){
  G.phase='round';pourSound(0);
  const n=G.cups.length;const J=G.cups.map(judgeCup);
  const ev=G.cups.reduce((a,q)=>a+Math.abs(q.v-TARGET),0)/n/TARGET;
  const cs=J.map(j=>j.c);const ec=Math.max(...cs)-Math.min(...cs);const sp=G.spilled/G.total;
  const score=Math.max(0,Math.round(100*(1-1.5*ev-1.6*ec-1.2*sp)));G.scores[G.round]=score;
  const avg=cs.reduce((a,b)=>a+b,0)/n;
  $('rTitle').textContent=['ひとりめ','ふたりめ','さんにんめ'][G.round]+'の おもてなし';
  $('rCups').innerHTML=J.map((j,i)=>{const cw=Math.abs(j.c-avg)<.06?'<em class="ok">おなじ濃さ</em>':j.c>avg?'<em>こいめ</em>':'<em>うすめ</em>';
    return `<div><i style="background:${teaCol(j.c)}"></i>${j.ok?'<em class="ok">ちょうど</em>':'<em>'+j.w+'</em>'}<br>${cw}</div>`}).join('');
  $('rScore').textContent=score+'点';
  $('rNote').textContent=score>=90?'おみごと！ まわしつぎの名人。':score>=75?'よくできました。おいしそう。':score>=55?'まあまあ。濃さが ちょっと ばらばら。':'もういっぺん。少しずつ じゅんばんに。';
  $('nextBtn').textContent=G.round+1<ROUNDS.length?'つぎの お客さま':'けっかを見る';
  sfx('clear',.7);setTimeout(()=>{if(G.phase==='round')$('roundOv').hidden=false},700);
}
function nextRound(){$('roundOv').hidden=true;if(G.round+1>=ROUNDS.length){finish();return}G.round++;setupRound(G.round);G.phase='play';sfx('set',.6)}
function finish(){
  G.phase='result';bgm(false);sfx('finish',.8);
  const tot=G.scores.reduce((a,b)=>a+b,0);const best=LS.get('cha-best',0);const nb=tot>best;if(nb)LS.set('cha-best',tot);
  $('resScore').textContent=tot+'点';$('resRank').textContent=rank(tot);

  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`まわしつぎ おちゃくみ🍵 ${tot}点「${rank(tot)}」\n#おちゃくみ #picoruno`)+'&url='+encodeURIComponent('https://picoruno.com/ochakumi.html');

}
function rank(t){if(t>=275)return'おもてなし名人';if(t>=235)return'お茶くみ上手';if(t>=180)return'お茶くみ見習い';return'ゆのみ係'}

/* ---------- draw ---------- */
function draw(dt){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#cdbd7c';c.fillRect(0,0,CW,CH);
  c.save();c.translate(OX,OY);c.scale(S,S);
  layer(c,'bg');
  // puddles on the tray
  for(const f of G.fx)if(f.flat){c.globalAlpha=Math.max(0,1-f.t/f.life);c.fillStyle=f.c;c.beginPath();c.ellipse(f.x,f.y,f.r,f.r*.6,0,0,7);c.fill()}
  c.globalAlpha=1;
  const tp=tipPos();
  // cups: sprite, then tea inside the rim
  for(const q of G.cups){
    layer(c,q.k,q.dx,0);
    const r=rim(q);
    c.save();c.beginPath();c.ellipse(r.x,r.y,r.rx,r.ry,0,0,7);c.clip();
    // target line (dashed) on the inside wall
    const tg=surf(q,TARGET);c.setLineDash([8,7]);c.lineWidth=2.5;c.strokeStyle='rgba(74,44,29,.45)';c.beginPath();c.ellipse(tg.x,tg.y,tg.rx,tg.ry,0,Math.PI,0);c.stroke();c.setLineDash([]);
    if(q.v>0.004){const s=surf(q,q.v),cc=q.m/q.v;const wob=Math.sin(G.t*18)*q.wob*2;
      const g=c.createLinearGradient(0,s.y-s.ry,0,s.y+s.ry);g.addColorStop(0,teaCol(cc*1.08));g.addColorStop(1,teaCol(cc*.92));
      c.fillStyle=g;c.beginPath();c.ellipse(s.x,s.y+wob,s.rx,s.ry,0,0,7);c.fill();
      c.strokeStyle='rgba(255,255,240,.35)';c.lineWidth=2;c.beginPath();c.ellipse(s.x,s.y+wob,s.rx*.82,s.ry*.7,0,Math.PI*1.1,Math.PI*1.6);c.stroke();
      for(let i=G.ripples.length-1;i>=0;i--){const p=G.ripples[i];if(p.cup!==q)continue;p.t+=dt/ G.cups.length;const u=p.t/.6;if(u>1){G.ripples.splice(i,1);continue}
        c.strokeStyle=`rgba(255,255,240,${.5*(1-u)})`;c.lineWidth=2;c.beginPath();c.ellipse(p.x,s.y,6+u*s.rx*.7,(6+u*s.rx*.7)*Math.sin(EL)*.9,0,0,7);c.stroke()}}
    c.restore();
    // steam from filled cups
    if(q.v>.3&&Math.random()<dt*2.5)G.fx.push({x:r.x+(Math.random()-.5)*r.rx,y:r.y-6,vx:(Math.random()-.5)*8,vy:-26,t:0,life:2,r:8,c:'rgba(255,255,255,.5)',steam:1,grow:2})
  }
  // stream of tea from the spout to wherever it lands
  if(G.flow>0.01){const lx=tp.x+G.flow*14;const cup=G.cups.find(q=>{const r=rim(q);return Math.abs(lx-r.x)<r.rx*.86});
    const ly=cup?surf(cup,cup.v).y:landY(lx);const cc=strength();
    c.strokeStyle=teaCol(cc,.92);c.lineCap='round';c.lineWidth=3+G.flow*6;
    c.beginPath();c.moveTo(tp.x,tp.y);c.quadraticCurveTo(tp.x+G.flow*18,tp.y+10,lx,ly);c.stroke();
    c.strokeStyle='rgba(255,255,240,.35)';c.lineWidth=1.5;c.beginPath();c.moveTo(tp.x+1,tp.y+2);c.quadraticCurveTo(tp.x+G.flow*18+1,tp.y+12,lx+1,ly);c.stroke();
    if(Math.random()<dt*30)G.fx.push({x:lx,y:ly-2,vx:(Math.random()-.5)*90,vy:-60-Math.random()*80,g:900,t:0,life:.25,r:2+Math.random()*2,c:teaCol(cc,.9)})}
  // kyusu
  const im=IMG.kyusu,L=LAYER.kyusu;
  if(im&&L){c.save();c.translate(G.kx,PIV.y+G.bob);c.rotate(G.tilt);
    c.fillStyle='rgba(60,40,20,.12)';c.restore();
    c.save();c.globalAlpha=.18;c.fillStyle='#4a2c1d';c.beginPath();c.ellipse(G.kx,pyOf(SC.trayZ)-6,90-G.tilt*10,22,0,0,7);c.fill();c.restore();
    c.save();c.translate(G.kx,PIV.y+G.bob);c.rotate(G.tilt);c.drawImage(im,L[0]-PIV.x,L[1]-PIV.y,L[2],L[3]);c.restore()}
  // particles
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t+=dt;if(f.t>f.life){G.fx.splice(i,1);continue}if(f.flat)continue;
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.g||0)*dt;const u=f.t/f.life;c.globalAlpha=f.steam?.5*Math.sin(u*Math.PI):(1-u);c.fillStyle=f.c;
    c.beginPath();c.arc(f.x,f.y,f.r*(f.grow?1+u*f.grow:1),0,7);c.fill()}
  c.globalAlpha=1;
  // per-cup cards below the tray: amount bar + strength chip
  if(G.phase!=='title'){const y0=pyOf(SC.trayZ)+118;const avgC=G.cups.reduce((a,q)=>a+(q.v>0?q.m/q.v:0),0)/G.cups.length;
    for(const q of G.cups){const x=W0/2+q.dx;c.save();c.fillStyle='rgba(255,250,242,.92)';c.strokeStyle='#4a2c1d';c.lineWidth=3;const cw=Math.min(132,Math.abs(G.cups.length>1?G.cups[1].dx-G.cups[0].dx:200)-12);rr(c,x-cw/2,y0,cw,118,18);c.fill();c.stroke();
      // amount: vertical bar with the target line
      const bx=x-cw/2+14,by=y0+12,bh=94;c.fillStyle='#efe6d4';rr(c,bx,by,22,bh,7);c.fill();
      const fh=bh*Math.min(1,q.v);c.fillStyle=q.v>0?teaCol(q.m/q.v):'#efe6d4';rr(c,bx,by+bh-fh,22,fh,7);c.fill();
      c.strokeStyle='#4a2c1d';c.lineWidth=2.5;rr(c,bx,by,22,bh,7);c.stroke();
      c.strokeStyle='#c4532e';c.lineWidth=2.5;c.beginPath();c.moveTo(bx-5,by+bh*(1-TARGET));c.lineTo(bx+27,by+bh*(1-TARGET));c.stroke();
      // strength chip
      const cc=q.v>0?q.m/q.v:0;c.fillStyle=q.v>0?teaCol(cc):'#efe6d4';const chx=bx+22+(x+cw/2-bx-22)/2;c.beginPath();c.arc(chx,y0+46,28,0,7);c.fill();c.lineWidth=3;c.stroke();
      c.fillStyle='#4a2c1d';c.font='900 19px "Zen Maru Gothic",sans-serif';c.textAlign='center';
      c.fillText(q.v<.02?'—':Math.abs(cc-avgC)<.06?'そろい':cc>avgC?'こいめ':'うすめ',chx,y0+102);c.restore()}
    // strength the pot is pouring now
    const sy=y0-36;c.save();c.font='900 21px "Zen Maru Gothic",sans-serif';c.textAlign='right';c.fillStyle='#4a2c1d';c.fillText('いま出る お茶',W0/2-6,sy+7);
    c.fillStyle=teaCol(strength());c.strokeStyle='#4a2c1d';c.lineWidth=2.5;rr(c,W0/2+6,sy-12,100,26,13);c.fill();c.stroke();c.restore()}
  for(let i=G.texts.length-1;i>=0;i--){const x=G.texts[i];x.t+=dt;if(x.t>1){G.texts.splice(i,1);continue}
    c.save();const sz=x.small?24:32;c.font=`${sz}px "Dela Gothic One",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.translate(x.x,x.y-x.t*30);c.globalAlpha=x.t>.75?(1-x.t)/.25:1;
    c.lineJoin='round';c.lineWidth=sz*.28;c.strokeStyle='#4a2c1d';c.strokeText(x.s,0,0);c.fillStyle=x.c;c.fillText(x.s,0,0);c.restore()}
  c.restore();
}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(G.phase!=='pause')step(dt);draw(G.phase==='pause'?0:dt);requestAnimationFrame(frame)}
