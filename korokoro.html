<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2e8">
<title>ころころおやつ</title>
<meta name="description" content="となりのおやつと入れかえて、3ついじょう並べて消すパズル。時間内にお客さんの注文をそろえて、ステージをどんどん進もう。注文をそろえきったおやつは「おかえし」をしてくれる。めんぼうでころころ、ポップコーンでぽんっ、消し続けるとやきたてタイム！">
<meta property="og:type" content="website">
<meta property="og:title" content="ころころおやつ">
<meta property="og:description" content="おやつを3つそろえて消すパズル。注文をこなして、あなたは何ステージまで行ける？">
<meta property="og:url" content="https://picoruno.com/korokoro.html">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://picoruno.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://picoruno.com/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7f2e8'/%3E%3Cpath d='M16 4q3 0 10 15q2 7-10 7q-12 0-10-7q7-15 10-15z' fill='%23fbf8f2' stroke='%235b4d45' stroke-width='1.6'/%3E%3Crect x='11' y='19' width='10' height='7' rx='1' fill='%234d4a48'/%3E%3Ccircle cx='13' cy='14' r='1.3' fill='%235b4d45'/%3E%3Ccircle cx='19' cy='14' r='1.3' fill='%235b4d45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone column. Title → play (status rows above an 8×8 board drawn on canvas) → result card made for screenshots. Muted picoruno palette, sweets with tiny faces. */
:root{
  --bg:#f7f2e8;
  --card:#fffdf8;
  --ink:#5b4d45;
  --sub:#8e8077;
  --line:#e6ddcf;
  --accent:#e8877f;    /* メイン：くすみコーラル */
  --egg:#fbe9b7;       /* サブ：たまご色 */
  --sky:#cfe3ef;       /* 共有：みずいろ */
  --leaf:#9cc58a;
  --gold:#e3c26b;
  --fever:#f3b65f;
  --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --box:clamp(256px,min(calc(100vw - 32px),calc(100svh - 290px)),440px);
  color-scheme:light;
}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
.wrap{max-width:472px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;min-height:100svh;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;align-items:center;flex:1;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:3px solid var(--ink);border-radius:20px;cursor:pointer;
  font-family:var(--pop);font-size:1.05rem;padding:12px 20px;min-height:56px;box-sizing:border-box;width:100%;
  background:var(--accent);color:#fff;text-shadow:0 2px 0 rgba(91,77,69,.35);box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.light{background:var(--egg);color:var(--ink);text-shadow:none}
.btn.sky{background:var(--sky);color:var(--ink);text-shadow:none}
.btn.plain{background:var(--card);color:var(--ink);text-shadow:none;font-size:.95rem;min-height:48px}
.btn.dark{background:var(--ink);color:var(--card);text-shadow:none}
.btn:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;font-weight:700;color:var(--ink)}
.row{display:flex;gap:10px;width:100%}
.row .btn{flex:1;min-width:0;font-size:.95rem;padding:12px 10px}

/* ---- タイトル ---- */
#title{gap:8px}
.logo{font-family:var(--pop);font-size:clamp(1.9rem,10.5vw,2.9rem);letter-spacing:.04em;margin:4px 0 0;line-height:1.1;text-align:center}
.logo span{display:inline-block;animation:hop 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
.logo .c0{color:#e39aa6}.logo .c1{color:#c9935f}.logo .c2{color:#e3a165}.logo .c3{color:#8fb07c}.logo .c4{color:#7f9fc0}.logo .c5{color:#a8735a}.logo .c6{color:#ec7a74}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.catch{margin:0;color:var(--sub);font-weight:700;text-align:center;font-size:.88rem}
.parade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%;max-width:300px;margin:0}
.parade i{display:block;aspect-ratio:1;max-width:100%;animation:hop 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
.parade svg{width:100%;height:100%;display:block}
.howto{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:9px 14px;margin:0;font-size:.82rem;line-height:1.65;width:100%;box-sizing:border-box}
.howto b{font-family:var(--pop);font-weight:400;color:var(--accent)}
.specials{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%}
.sp{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 4px;text-align:center;font-size:.66rem;line-height:1.35}
.sp svg{width:32px;height:32px;display:block;margin:0 auto 1px}
.sp b{display:block;font-family:var(--pop);font-weight:400;font-size:.74rem}
.best{font-family:var(--pop);font-size:.95rem;margin:0;color:var(--sub)}
.best:empty{display:none}
.dailyline{margin:-4px 0 0;font-size:.78rem;color:var(--sub);font-weight:700;text-align:center}
.foot{font-size:.75rem;color:var(--sub);margin:4px 0 0;display:flex;gap:12px;align-items:center}
.foot a{color:var(--sub)}

/* ---- プレイ ---- */
#play{gap:8px;margin-inline:-4px;--box:clamp(256px,min(calc(100vw - 40px),calc(100svh - 270px)),520px)}
.hud{display:flex;align-items:center;gap:8px;width:var(--box);max-width:100%}
.stage{font-family:var(--pop);font-size:1rem;background:var(--ink);color:var(--card);border-radius:999px;padding:4px 12px;white-space:nowrap}
.score{font-family:var(--pop);font-size:1.7rem;margin-left:auto;font-variant-numeric:tabular-nums}
.timebar{position:relative;width:var(--box);max-width:100%;height:20px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;box-sizing:border-box}
.timebar i{position:absolute;inset:0;transform-origin:left;background:var(--leaf);border-radius:999px}
.timebar.warn i{background:var(--accent);animation:blink .5s steps(2) infinite}
.timebar.frozen i{background:var(--fever)}
.timebar.chill i{background:#9cc2e4}
.timebar b{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.8rem;font-family:var(--pop);font-weight:400;font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.55}}
.order{display:flex;align-items:center;gap:8px;width:var(--box);max-width:100%;background:var(--card);border:2px dashed #d6c9b6;border-radius:14px;padding:4px 8px;box-sizing:border-box}
.order>span{font-family:var(--pop);font-size:.72rem;color:var(--sub);writing-mode:vertical-rl;letter-spacing:.1em}
.quota{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;flex:1;min-width:0}
.q{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;border-radius:10px;padding:3px 2px;transition:background .2s}
.q svg{width:min(46px,10.5vw);aspect-ratio:1;display:block;flex:none}
.q b{font-family:var(--pop);font-weight:400;font-size:1rem;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.q b small{font-size:.65em;color:var(--sub)}
.q.done{background:#e6f1dc}
.q.done b{color:#5f8c50}
.q.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.12)}}
.meters{display:flex;align-items:center;gap:8px;width:var(--box);max-width:100%;min-height:26px}
.combo{font-family:var(--pop);font-size:1.2rem;min-width:7.5em;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.25;transition:opacity .15s}
.combo.on{opacity:1}
.combo small{font-size:.65em;margin-left:2px}
.fever{position:relative;flex:1;height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.fever i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#f6d48a,var(--fever),#ec9b86)}
.fever.on i{animation:shine .6s linear infinite}
@keyframes shine{50%{filter:brightness(1.15)}}
.fevlabel{font-family:var(--pop);font-size:.8rem;color:var(--sub)}
.board{position:relative;width:var(--box);height:var(--box);max-width:100%;border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);background:var(--card);overflow:hidden;box-sizing:border-box}
.board.fev{box-shadow:4px 4px 0 var(--ink),0 0 0 4px var(--fever)}
.board.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 12px}
.banner p{margin:0;font-family:var(--pop);font-size:clamp(1.6rem,8.5vw,2.5rem);color:var(--card);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.banner small{display:block;margin-top:6px;font-family:var(--pop);font-size:.95rem;color:var(--ink);background:var(--egg);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;animation:pop .35s .1s both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.banner .bicon{display:block;width:76px;height:76px;margin-bottom:4px;animation:okhop .6s cubic-bezier(.3,1.6,.6,1) both}
.banner .bicon svg{width:100%;height:100%;display:block}
@keyframes okhop{0%{transform:translateY(30px) scale(.4);opacity:0}60%{transform:translateY(-10px) scale(1.08);opacity:1}100%{transform:none}}
.okbox{position:relative;width:170px;height:118px;margin-bottom:6px;animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
.okbox>svg{position:absolute;left:0;width:100%;display:block}
.okbox .back{bottom:0}.okbox .front{bottom:0}
.okbox i{position:absolute;bottom:50px;width:46px;height:46px;left:var(--x);animation:dropin .5s calc(.15s + var(--j)*.13s) cubic-bezier(.3,1.5,.6,1) both}
.okbox i svg{width:100%;height:100%;display:block}
@keyframes dropin{0%{transform:translateY(-110px) rotate(-20deg);opacity:0}30%{opacity:1}100%{transform:none}}
.board.purun{animation:purun .55s}
@keyframes purun{20%{transform:scale(1.04,.95)}45%{transform:scale(.97,1.04)}70%{transform:scale(1.015,.99)}}
.ctrl{display:flex;gap:8px;width:var(--box);max-width:100%;justify-content:space-between}

/* ---- 結果 ---- */
.rcard{width:100%;background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);padding:18px 16px 14px;box-sizing:border-box;text-align:center}
.rhead{font-family:var(--pop);color:var(--sub);font-size:.9rem;margin:0}
.rlabel{margin:10px 0 0;color:var(--sub);font-weight:700;font-size:.9rem}
.rank{font-family:var(--pop);font-size:clamp(1.5rem,7.5vw,2.1rem);margin:2px 0 6px;text-wrap:balance}
.rbig{font-family:var(--pop);font-size:2.4rem;margin:0;font-variant-numeric:tabular-nums;line-height:1.1}
.rbig small{font-size:.45em;color:var(--sub);margin-left:4px}
.newbest{display:inline-block;background:var(--accent);color:#fff;font-family:var(--pop);font-size:.75rem;border-radius:999px;padding:2px 10px;margin-top:4px}
.rstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:12px 0 8px}
.rstats div{background:var(--bg);border-radius:12px;padding:6px 4px}
.rstats span{display:block;font-size:.7rem;color:var(--sub);font-weight:700}
.rstats b{font-family:var(--pop);font-weight:400;font-size:1.05rem;font-variant-numeric:tabular-nums}
.catches{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.catches div{font-family:var(--pop);font-size:.75rem;font-variant-numeric:tabular-nums}
.catches svg{width:100%;aspect-ratio:1;display:block}
.fav{margin:10px 0 0;font-size:.85rem;font-weight:700;white-space:pre-line}
.site{margin:8px 0 0;font-size:.72rem;color:var(--sub)}

.modal{position:fixed;inset:0;background:rgba(62,51,45,.55);display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:10;overflow-y:auto}
.sheet{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:18px;width:100%;max-width:400px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;text-align:center}
.sheet h2{font-family:var(--pop);font-weight:400;font-size:1.2rem;margin:0}
.sheet img{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;width:100%;border-radius:14px;border:2px solid var(--line);aspect-ratio:1;background:var(--bg)}
.sheet p{margin:0;font-size:.8rem;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:999px;padding:10px 18px;font-size:.85rem;z-index:20;pointer-events:none;white-space:nowrap}
.rankbtn{min-height:48px;font-size:.95rem}
/* ---- ランキング ---- */
.rankbox{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;text-align:center}
.rankbox .rmsg{margin:0;font-weight:700;font-size:.88rem}
.rankbox .rmsg b{font-family:var(--pop);font-weight:400;font-size:1.25rem;color:var(--accent)}
.rankbox .rsub{margin:0;font-size:.75rem;color:var(--sub)}
.nameform{display:flex;gap:8px;width:100%}
.nameform input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--bg);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.nameform input:focus{outline:3px solid var(--gold);outline-offset:1px}
.nameform .btn{width:auto;flex:none;min-height:48px;font-size:.92rem;padding:8px 14px}
.nameerr{margin:0;font-size:.78rem;color:#c8443c;font-weight:700;min-height:1em}
.nameerr:empty{display:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:.78rem;color:var(--sub);text-decoration:underline;cursor:pointer}
.rsheet{max-height:calc(100svh - 32px);gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{border:2.5px solid var(--ink);border-radius:999px;background:var(--card);font-family:var(--pop);font-size:.85rem;padding:7px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.rlist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:120px;max-height:56svh;border:2px solid var(--line);border-radius:14px;text-align:left;-webkit-overflow-scrolling:touch}
.rlist li{display:grid;grid-template-columns:2.6em 1fr auto;align-items:center;gap:6px;padding:7px 10px;border-bottom:1.5px solid var(--line);font-size:.88rem}
.rlist li:last-child{border-bottom:0}
.rlist .no{font-family:var(--pop);text-align:center;font-variant-numeric:tabular-nums}
.rlist .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .pt{font-family:var(--pop);font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.rlist .pt small{display:block;font-family:var(--body);font-size:.68rem;color:var(--sub);font-weight:700}
.rlist .top1 .no{color:#c9a13b}.rlist .top2 .no{color:#9a9aa6}.rlist .top3 .no{color:#b9825a}
.rlist .me{background:var(--egg)}
.rlist .gap{display:block;text-align:center;color:var(--sub);padding:2px;border-bottom:1.5px solid var(--line)}
.rlist .empty{display:block;text-align:center;color:var(--sub);padding:28px 10px;line-height:1.7}
@media (prefers-reduced-motion:reduce){.logo span,.parade i,.banner .bicon,.okbox,.okbox i{animation:none}.board.shake,.board.purun{animation:none}}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== タイトル ===== -->
<section class="screen" id="title">
  <h1 class="logo" id="logo">ころころおやつ</h1>
  <p class="catch">となりと入れかえて、3つそろえて消そう！</p>
  <div class="parade" id="parade" aria-hidden="true"></div>
  <p class="howto">
    <b>①</b> スワイプで、となりと入れかえ<br>
    <b>②</b> たて・よこに3つ並ぶと消える<br>
    <b>③</b> 時間内に<b>注文</b>をそろえてステージクリア<br>
    <b>④</b> そろえきったおやつは<b>おかえし</b>をしてくれる<br>
    <b>⑤</b> 消し続けて<b>コンボ</b>、たまると<b>やきたてタイム</b>！
  </p>
  <div class="specials" id="specials"></div>
  <button class="btn" id="startBtn" type="button">あそぶ</button>
  <p class="best" id="bestLine"></p>
  <button class="btn light" id="dailyBtn" type="button">今日のチャレンジ</button>
  <p class="dailyline" id="dailyLine"></p>
  <button class="btn plain rankbtn" id="rankBtn" type="button">ランキング</button>
  <p class="foot"><a href="https://picoruno.com/">別のゲーム</a><button class="iconbtn" id="muteBtn" type="button" aria-pressed="false">おと：オン</button></p>
</section>

<!-- ===== プレイ ===== -->
<section class="screen" id="play" hidden>
  <div class="hud">
    <span class="stage" id="stageLbl">ステージ 1</span>
    <span class="score" id="scoreLbl">0</span>
  </div>
  <div class="timebar" id="timebar" role="progressbar" aria-label="のこり時間"><i id="timeFill"></i><b id="timeTxt">40</b></div>
  <div class="order"><span>ちゅうもん</span><div class="quota" id="quota"></div></div>
  <div class="meters">
    <span class="combo" id="comboLbl">0<small>コンボ</small></span>
    <span class="fevlabel">やきたて</span>
    <div class="fever" id="feverBar" role="progressbar" aria-label="やきたてタイムのゲージ"><i id="feverFill"></i></div>
  </div>
  <div class="board" id="board">
    <canvas id="cv" aria-label="パズルの盤面"></canvas>
    <div class="banner" id="banner" hidden></div>
  </div>
  <div class="ctrl">
    <button class="iconbtn" id="pauseBtn" type="button">いちじ停止</button>
    <button class="iconbtn" id="muteBtn2" type="button" aria-pressed="false">おと：オン</button>
  </div>
</section>

<!-- ===== 結果 ===== -->
<section class="screen" id="result" hidden>
  <div class="rcard">
    <p class="rhead" id="rHead">ころころおやつ ・ けっか</p>
    <p class="rlabel">あなたの称号は…</p>
    <p class="rank" id="rRank"></p>
    <p class="rbig" id="rScore"></p>
    <span class="newbest" id="rNew" hidden>じこベスト更新！</span>
    <div class="rstats">
      <div><span>とうたつ</span><b id="rStage"></b></div>
      <div><span>さいだいコンボ</span><b id="rCombo"></b></div>
      <div><span>とくしゅコマ</span><b id="rSp"></b></div>
    </div>
    <div class="catches" id="rCatches"></div>
    <p class="fav" id="rFav"></p>
    <p class="site">#ころころおやつ ・ picoruno.</p>
  </div>
  <div class="rankbox" id="rankBox" hidden>

/* ===== 音 ===== */
let actx=null, muted=LS.get(KEY_MUTE,false);
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function tone(f,d=.12,type='triangle',v=.16,when=0){
  if(muted||!actx) return;
  const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d=.25,v=.18){
  if(muted||!actx) return;
  const n=actx.sampleRate*d|0, buf=actx.createBuffer(1,n,actx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=actx.createBufferSource(), g=actx.createGain(), f=actx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=900; s.buffer=buf; g.gain.value=v; s.connect(f).connect(g).connect(actx.destination); s.start();
}

  okaeshi(i){const b=[523,587,659,698,784,880,988][i]||660;[1,1.25,1.5,2].forEach((m,k)=>tone(b*m,.16,'sine',.1,k*.07));tone(b*2,.3,'triangle',.06,.3)},
  popcorn(){for(let i=0;i<5;i++)tone(700+Math.random()*900,.035,'square',.035,i*.04+Math.random()*.02);noise(.12,.12)},

/* ===== BGM（Web Audio で鳴らす小さなループ曲。ふだんの曲とフィーバーの曲） ===== */
const SONGS={
  normal:{bpm:112,lead:'triangle',lv:.055,
    mel:[76,79,84,79,76,79,81,79, 76,0,72,76,81,79,76,0, 77,81,84,81,79,77,76,77, 74,79,83,79,81,79,77,74],

    hat:[0,1,0,1,0,1,0,1],kick:[1,0,0,0,1,0,0,0]},

    mel:[84,79,84,86,88,86,84,79, 81,76,81,84,88,84,81,76, 77,81,84,89,88,84,81,77, 79,83,86,91,89,86,83,79],

};
const BGM={on:false,mode:'normal',step:0,next:0,iv:0,bus:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function bgmNote(f,t,d,type,v){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(BGM.bus);o.start(t);o.stop(t+d+.02);
}
function bgmHat(t,v){
  const n=actx.sampleRate*.04|0,b=actx.createBuffer(1,n,actx.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);

  f.type='highpass';f.frequency.value=6000;g.gain.value=v;s.buffer=b;s.connect(f).connect(g).connect(BGM.bus);s.start(t);
}
function bgmKick(t,v){
  const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g).connect(BGM.bus);o.start(t);o.stop(t+.17);
}
function bgmTick(){
  if(!BGM.on||!actx) return;
  const S=SONGS[BGM.mode], dur=60/S.bpm/2;
  if(BGM.next<actx.currentTime) BGM.next=actx.currentTime+.05;
  while(BGM.next<actx.currentTime+.15){
    const i=BGM.step%32, t=BGM.next;
    if(S.mel[i]) bgmNote(mtof(S.mel[i]),t,dur*.9,S.lead,S.lv);
    if(i%2===0||BGM.mode==='fever') bgmNote(mtof(S.bass[i]),t,dur*(BGM.mode==='fever'?.8:1.8),'sine',.09);
    if(S.hat[i%8]) bgmHat(t,BGM.mode==='fever'?.05:.03);
    if(S.kick[i%8]) bgmKick(t,BGM.mode==='fever'?.16:.11);
    BGM.step++; BGM.next+=dur;
  }
}

  if(mode) {if(mode!==BGM.mode){BGM.mode=mode;BGM.step=0}}

}

  const q=Array(NT).fill(0); ids.forEach(i=>q[i]=n); return q;
}

  const w=G.quota.map(q=>q>0?1.15:.85), sum=w.reduce((a,b)=>a+b,0);
  let x=rnd()*sum; for(let i=0;i<NT;i++){x-=w[i];if(x<0)return i} return NT-1;
}
function at(r,c){return r>=0&&r<N&&c>=0&&c<N?G.grid[r][c]:null}
function typeAt(r,c){const t=at(r,c);return t?t.t:-1}
function fillBoard(){
  G.grid=[];
  for(let r=0;r<N;r++){G.grid.push([]);for(let c=0;c<N;c++){
    let t; do{t=Math.floor(rnd()*NT)}while((c>=2&&typeAt(r,c-1)===t&&typeAt(r,c-2)===t)||(r>=2&&typeAt(r-1,c)===t&&typeAt(r-2,c)===t));
    G.grid[r].push(newTile(t,r,c,r-N-1-(N-r)*.15));
  }}
  if(!findMove()) fillBoard();
}
function findMatches(){
  const groups=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const t=typeAt(r,c);let e=c+1;while(e<N&&typeAt(r,e)===t)e++;
    if(t>=0&&e-c>=3){const g=[];for(let k=c;k<e;k++)g.push([r,k]);groups.push({t,cells:g})} c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const t=typeAt(r,c);let e=r+1;while(e<N&&typeAt(e,c)===t)e++;
    if(t>=0&&e-r>=3){const g=[];for(let k=r;k<e;k++)g.push([k,c]);groups.push({t,cells:g})} r=e}}
  return groups;
}
function lineAt(r,c){ // (r,c) を含む3連以上があるか
  const t=typeAt(r,c); if(t<0) return false;
  let h=1;for(let k=c-1;typeAt(r,k)===t;k--)h++;for(let k=c+1;typeAt(r,k)===t;k++)h++;
  let v=1;for(let k=r-1;typeAt(k,c)===t;k--)v++;for(let k=r+1;typeAt(k,c)===t;k++)v++;
  return h>=3||v>=3;
}
function rawSwap(a,b){const A=G.grid[a[0]][a[1]],B=G.grid[b[0]][b[1]];G.grid[a[0]][a[1]]=B;G.grid[b[0]][b[1]]=A;
  if(A){A.r=b[0];A.c=b[1]} if(B){B.r=a[0];B.c=a[1]}}
function findMove(){
  const opts=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc; if(r2>=N||c2>=N) continue;
    const A=at(r,c),B=at(r2,c2); if(!A||!B||A.ice||B.ice) continue;
    if(A.sp===2||B.sp===2||(A.sp&&B.sp)){opts.push([[r,c],[r2,c2]]);continue}
    if(A.t===B.t) continue;
    rawSwap([r,c],[r2,c2]); const ok=lineAt(r,c)||lineAt(r2,c2); rawSwap([r,c],[r2,c2]);
    if(ok) opts.push([[r,c],[r2,c2]]);
  }
  return opts.length?opts[Math.floor(Math.random()*opts.length)]:null;
}

/* ===== 時間（ゲーム内時計。いちじ停止で止まる） ===== */
function wait(sec){return new Promise(res=>G.timers.push({t:G.clock+sec,res}))}
function settled(){for(const row of G.grid)for(const t of row){if(t&&(t.y!==t.r||t.x!==t.c||t.tw))return false}return true}
function waitSettle(){const g=G;return new Promise(res=>{const chk=()=>{if(G!==g||settled())res();else g.timers.push({t:g.clock+.016,res:chk})};chk()})}
function tween(t,dur,ease){t.tw={fx:t.x+(t.dx||0),fy:t.y+(t.dy||0),t:0,d:dur,e:ease||'io'};t.dx=t.dy=0;t.x=t.tw.fx;t.y=t.tw.fy}
// なめらかに動かすためのイージング
const EASE={
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,           // ゆっくり→はやく→ゆっくり
  back:p=>{const k=1.35;return 1+(k+1)*Math.pow(p-1,3)+k*Math.pow(p-1,2)}, // ちょっと行きすぎて戻る
};

/* ===== 特殊コマの範囲 ===== */
// sp: 1=ポップコーン(3×3) 2=ほしクッキー 3=よこめんぼう 4=たてめんぼう
const area=(r,c,d)=>{const o=[];for(let i=r-d;i<=r+d;i++)for(let j=c-d;j<=c+d;j++)if(i>=0&&i<N&&j>=0&&j<N)o.push([i,j]);return o};
const rowCells=r=>[...Array(N).keys()].map(c=>[r,c]);
const colCells=c=>[...Array(N).keys()].map(r=>[r,c]);
const SP_RANK={0:0,3:1,4:1,1:2,2:3};

/* ===== 1手 ===== */
async function trySwap(a,b){
  if(G.busy||G.over||G.paused) return;
  const A=at(...a),B=at(...b); if(!A||!B) return;
  if(A.ice||B.ice){sfx.bad(); G.sel=null; return}
  const g=G;
  G.busy=true; G.sel=null; G.hint=null; G.idle=0; sfx.swap();
  rawSwap(a,b); tween(A,.17,'back'); tween(B,.17,'back'); await waitSettle();
  if(G!==g) return;
  if(A.sp===2||B.sp===2){
    // ほしクッキー：相手と同じおやつを全部。ほしクッキー同士なら盤面ぜんぶ。
    // 相手がボム・ラインなら、同じおやつが全部その特殊コマに変わって一気に発動
    const other=A.sp===2?B:A, cells=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=G.grid[r][c];
      if(t===A||t===B||(other.sp===2?true:(t.t===other.t&&t.sp!==2))) cells.push([r,c])}
    if(other.sp&&other.sp!==2){
      for(const [r,c] of cells){const t=G.grid[r][c]; if(t!==A&&t!==B&&t.t===other.t){t.sp=other.sp===1?1:(rnd()<.5?3:4);t.grow=1}}
      showBanner('がったい！','',.8); sfx.make(); await wait(.35); if(G!==g) return;
    }
    sfx.egg(); shake();
    await resolve([a,b],cells);
  }else if(A.sp&&B.sp){
    // 特殊コマどうしの合体技
    const [r,c]=b, s1=A.sp, s2=B.sp; let cells;
    if(s1===1&&s2===1) cells=area(r,c,2);
    else if(s1===1||s2===1){cells=[];for(let i=-1;i<=1;i++){cells.push(...rowCells(Math.min(N-1,Math.max(0,r+i))),...colCells(Math.min(N-1,Math.max(0,c+i))))}}
    else cells=[...rowCells(r),...colCells(c)];
    A.sp=0; B.sp=0;
    showBanner('がったい！','',.8); sfx.boom(); shake();
    if(s1!==1||s2!==1) beam(true,r,c), beam(false,c,r);
    await resolve([a,b],cells,b);
  }else if(!(lineAt(...a)||lineAt(...b))){
    sfx.bad(); await wait(.05); if(G!==g) return; rawSwap(a,b); tween(A,.2,'back'); tween(B,.2,'back'); await waitSettle();
    if(G!==g) return;
    G.busy=false; return;
  }else await resolve([a,b],null);
  if(G!==g) return;
  G.busy=false; G.idle=0;
  if(G.stageClearPending) await stageClear();
  if(G===g&&G.time<=0) endGame();
}
async function resolve(moved,preset,origin){
  const g=G, movedKeys=new Set(moved.map(([r,c])=>r*N+c));
  let first=true;
  while(G===g){
    const groups=preset?[]:findMatches();
    if(!preset&&!groups.length){
      // れんさが止まったら、注文をそろえきったおやつの「おかえし」
      if(!G.thanks.length) break;
      const cells=await okaeshi(G.thanks.shift());
      if(G!==g) return;
      if(cells.length) preset=cells;
      continue;
    }
    const gone=new Map(), make=new Map(), keep=new Set(), flying=new Map();
    if(preset){
      preset.forEach(([r,c])=>{gone.set(r*N+c,[r,c]); if(origin) flying.set(r*N+c,[r,c,origin[0],origin[1]])});
      origin=null;
      G.combo++; G.comboT=COMBO_WIN; G.maxCombo=Math.max(G.maxCombo,G.combo);
      let er=0,ec=0; preset.forEach(([r,c])=>{er+=r;ec+=c}); er/=preset.length; ec/=preset.length;
      addScore(150*preset.length,ec,er);
      preset=null;
    }
    // 2本のラインが重なったマス（L字・T字）
    const cnt=new Map();
    groups.forEach(gr=>gr.cells.forEach(([r,c])=>cnt.set(r*N+c,(cnt.get(r*N+c)||0)+1)));
    for(const gr of groups){
      G.combo++; G.comboT=COMBO_WIN; G.maxCombo=Math.max(G.maxCombo,G.combo);
      const len=gr.cells.length;
      let cr=0,cc=0; gr.cells.forEach(([r,c])=>{cr+=r;cc+=c}); cr/=len; cc/=len;
      addScore(100+(len-3)*120,cc,cr);
      if(len>=4){
        // 4つでライン（そろえた向きの1列）、5つでほしクッキー。動かしたマスがあればそこに、なければ真ん中に
        const pick=(first&&gr.cells.find(([r,c])=>movedKeys.has(r*N+c)))||gr.cells.find(([r,c])=>cnt.get(r*N+c)>1)||gr.cells[len>>1];
        const k=pick[0]*N+pick[1], sp=len>=5?2:(gr.cells[0][0]===gr.cells[1][0]?3:4);
        if(SP_RANK[sp]>SP_RANK[make.get(k)||0]) make.set(k,sp);
      }
      if(G.feverT<=0){G.fever=Math.min(100,G.fever+3+Math.min(G.combo,20)*.2+(len-3)*4); if(G.fever>=100) startFever()}
      for(const [r,c] of gr.cells) gone.set(r*N+c,[r,c]);
    }
    // L字・T字はボム
    for(const [k,n] of cnt) if(n>1&&SP_RANK[1]>SP_RANK[make.get(k)||0]) make.set(k,1);
    // ボム（3×3）・ライン（1列）の発動。巻きこんだ特殊コマも連鎖
    const queue=[...gone.values()], blasted=new Set();
    let booms=0, zips=0;
    while(queue.length){
      const [r,c]=queue.pop(), t=G.grid[r][c];
      if(!t||!(t.sp===1||t.sp===3||t.sp===4)||blasted.has(t.id)) continue;
      blasted.add(t.id); if(!flying.has(r*N+c)) flying.set(r*N+c,[r,c]);
      const cells=t.sp===1?area(r,c,1):t.sp===3?rowCells(r):colCells(c);
      if(t.sp===1){booms++; ring(c,r)} else {zips++; beam(t.sp===3,t.sp===3?r:c,t.sp===3?c:r)}
      for(const [rr,cc] of cells){
        const n=at(rr,cc),k=rr*N+cc;
        if(!n||n.sp===2||gone.has(k)) continue;
        gone.set(k,[rr,cc]); queue.push([rr,cc]); addScore(40,cc,rr,true); if(!flying.has(k)) flying.set(k,[rr,cc,r,c]);
      }
    }
    if(booms){sfx.boom(); shake(); if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}}
    if(zips){sfx.line(); if(!booms) shake()}
    // 発動した特殊コマの場所には、新しい特殊コマを作らない
    for(const k of make.keys()){const r=Math.floor(k/N),c=k%N,t=G.grid[r][c]; if(t&&blasted.has(t.id)) make.delete(k)}
    sfx.pop(G.combo);
    for(const [k,[r,c]] of gone){
      const t=G.grid[r][c]; if(!t) continue;
      if(t.ice){t.ice=0; keep.add(k); crack(c,r); continue}  // こおりは割れるだけ
      if(t.t>=0){G.caught[t.t]++; if(G.quota[t.t]>0){G.quota[t.t]--; bumpQuota(t.t); if(!G.quota[t.t]) G.thanks.push(t.t)}}
      if(t.gold){t.gold=false; goldBonus(c,r)}
      if(make.has(k)) continue;
      if(flying.has(k)){const f=flying.get(k); fling(t,f[2]==null?r:f[2],f[3]==null?c:f[3]); t.pop=1}
      else{t.pop=0; burst(c,r,t.t>=0?SWEETS[t.t].col:'#f3d27a')}
    }
    // となりのおやつが消えたら、こおりもとける
    for(const k of gone.keys()){
      if(keep.has(k)) continue;
      const r=Math.floor(k/N),c=k%N;
      for(const [rr,cc] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){
        const n=at(rr,cc); if(!n||!n.ice||gone.has(rr*N+cc)) continue;
        n.ice=0; crack(cc,rr);
      }
    }
    if(G.quota.every(q=>q<=0)) G.stageClearPending=true;
    renderHud();
    await wait(.2);
    if(G!==g) return;
    for(const [k,[r,c]] of gone){
      if(make.has(k)){const t=G.grid[r][c], sp=make.get(k); t.sp=sp; t.ice=0; if(sp===2){t.t=-1; G.eggs++} else if(sp===1) G.bombs++; else G.lines++; t.grow=1; continue}
      if(keep.has(k)) continue;
      G.grid[r][c]=null;
    }
    if(make.size) sfx.make();
    gravity();
    await waitSettle();
    first=false;
  }
  if(G===g&&!findMove()) await shuffle();
}
async function okaeshi(i){
  const g=G, O=OKAESHI[i];
  G.oks++;
  showBanner('おかえし！',`${SWEETS[i].name}の「${O.name}」`,1.1,svgOf(i));
  sfx.okaeshi(i);
  await wait(.6); if(G!==g) return [];
  const all=G.grid.flat().filter(Boolean), free=all.filter(t=>!t.sp&&!t.ice&&!t.gold);
  const pickN=(arr,n)=>{const a=arr.slice(),o=[];while(o.length<n&&a.length)o.push(a.splice(Math.floor(rnd()*a.length),1)[0]);return o};
  const cellsOf=f=>all.filter(t=>t.sp!==2&&f(t.r,t.c)).map(t=>[t.r,t.c]);
  let cells=[];
  if(i===0){pickN(free,4).forEach(t=>{t.gold=true;t.grow=1;burst(t.c,t.r,'#ec7a74')}); sfx.gold()}
  else if(i===1){G.time=Math.min(TIME_MAX,G.time+4); addText('+4秒',3.5,3.5,'#b98a2f'); purun()}
  else if(i===2) cells=cellsOf((r,c)=>Math.max(Math.abs(r-3.5),Math.abs(c-3.5))===1.5);
  else if(i===3){all.forEach(t=>{if(t.ice){t.ice=0;crack(t.c,t.r)}}); G.chill=4; addText('4秒ストップ',3.5,3.5,'#5d8fb8')}
  else if(i===4){pickN(free,3).forEach((t,k)=>{t.sp=k===0?1:(rnd()<.5?3:4);t.grow=1}); sfx.make()}
  else if(i===5) cells=pickN(all.filter(t=>t.sp!==2),8).map(t=>[t.r,t.c]);
  else if(i===6) cells=cellsOf((r,c)=>r===c||r+c===N-1);
  if(i===5) cells.forEach(([r,c])=>burst(c,r,'#8b5e4a'));
  if(cells.length){shake(); sfx.boom()}
  else{await wait(.35); if(G!==g) return []}
  return cells;
}
function purun(){if(reduceMotion)return;const b=$('board');b.classList.remove('purun');void b.offsetWidth;b.classList.add('purun')}
function addScore(base,c,r,quiet){
  const pts=Math.round(base*(1+Math.min(G.combo,60)*.1)*(G.feverT>0?2:1)/10)*10;
  G.score+=pts; if(!quiet) addText(`+${pts}`,c,r,INK);
}
function goldBonus(c,r){
  G.score+=500; sfx.gold();
  if(G.feverT<=0){G.time=Math.min(TIME_MAX,G.time+2); addText('+2秒',c,r+.5,'#b98a2f')}
  else addText('+500',c,r+.5,'#b98a2f');
}
function gravity(){
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){const t=G.grid[r][c]; if(t){if(w!==r){G.grid[w][c]=t;G.grid[r][c]=null;t.r=w} w--}}
    const k=w+1;
    for(let r=w;r>=0;r--) G.grid[r][c]=newTile(randType(),r,c,r-k-.3,rnd()<GOLD_RATE);
  }
}
async function shuffle(){
  const g=G;
  showBanner('シャッフル！','',.9);
  await wait(.5);
  if(G!==g) return;
  const tiles=G.grid.flat();
  let tries=0;
  do{
    for(let i=tiles.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[tiles[i],tiles[j]]=[tiles[j],tiles[i]]}
    tiles.forEach((t,i)=>{const r=Math.floor(i/N),c=i%N;G.grid[r][c]=t;t.r=r;t.c=c});
    tries++;
  }while((findMatches().length||!findMove())&&tries<200);
  if(tries>=200){const old=G.grid; fillBoard(); G.grid.flat().forEach(t=>{t.y=old[t.r][t.c].y;t.x=old[t.r][t.c].x})}
  G.grid.flat().forEach(t=>tween(t,.35));
  await waitSettle();
}
// こおり：ステージ3から。動かせないけれど、そろえたりボムに巻きこんだりすると割れる
function freeze(stage){
  if(stage<3) return 0;
  const want=Math.min(2+(stage-3)*2,12), now=G.grid.flat().filter(t=>t.ice).length;
  const cand=G.grid.flat().filter(t=>!t.ice&&!t.sp&&!t.gold);
  let n=0;
  while(n<want-now&&cand.length){const i=Math.floor(rndOrder()*cand.length);cand.splice(i,1)[0].ice=1;n++}
  if(n) sfx.ice();
  return n;
}
function startFever(){
  G.feverT=FEVER_TIME; G.fevers++; G.fever=100; sfx.fever(); bgmPlay('fever');
  showBanner('やきたてタイム！','スコア2倍・時間ストップ',1.1);
  $('board').classList.add('fev'); $('feverBar').classList.add('on');
}
async function stageClear(){
  const g=G;
  G.stageClearPending=false; G.busy=true;
  const bonus=1000*G.stage;
  G.score+=bonus; sfx.clear();
  const add=Math.min(CLEAR_BONUS,TIME_MAX-G.time);
  G.time=Math.min(TIME_MAX,G.time+CLEAR_BONUS);
  showBanner('おまちどおさま！',`ステージ${G.stage} クリア ・ +${bonus.toLocaleString()}点${add>=1?` ・ +${Math.round(add)}秒`:''}`,1.7,boxHtml(G.kinds));
  G.banner=1.7;
  await wait(1.7);
  if(G!==g) return;
  G.stage++; G.quota=makeOrder(G.stage);
  buildQuota(); renderHud();
  const iced=freeze(G.stage);
  showBanner(`ステージ${G.stage}`,iced?'こおりが出たよ！となりを消すととける':'新しい注文がきたよ',iced?1.4:1); G.banner=iced?1.4:1;
  await wait(G.banner>0?G.banner:1);
  if(G!==g) return;
  if(!findMove()) await shuffle();
  G.busy=false; G.idle=0;
}

/* ===== 演出 ===== */
function addText(s,c,r,col){G.texts.push({s,x:c+.5,y:r+.5,t:0,col})}
function burst(c,r,col){
  if(reduceMotion) return;
  for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*2.5;
    G.fx.push({x:c+.5,y:r+.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,t:0,life:.5+Math.random()*.3,col,sz:.07+Math.random()*.06})}
}
// ボムで弾け飛ぶおやつ：盤面の外まで飛んでいけるよう、画面いっぱいの別キャンバスに描く
const fxcv=document.createElement('canvas'), fxc=fxcv.getContext('2d');
fxcv.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5';
fxcv.setAttribute('aria-hidden','true'); document.body.appendChild(fxcv);
let flies=[];
function fling(t,br,bc){
  const rect=cv.getBoundingClientRect();
  const x=rect.left+(t.x+.5)*cell, y=rect.top+(t.y+.5)*cell;
  let dx=t.c-bc, dy=t.r-br; if(!dx&&!dy){dx=(Math.random()-.5)*.6;dy=-1}
  const len=Math.hypot(dx,dy)||1, sp=(6+Math.random()*5)*cell;
  flies.push({typ:t.t,x,y,vx:dx/len*sp+(Math.random()-.5)*cell*2,vy:dy/len*sp-(4+Math.random()*4)*cell,rot:0,vr:(Math.random()<.5?-1:1)*(6+Math.random()*10),t:0,life:1.1,s:1});
  if(!reduceMotion){
    const col=t.t>=0?SWEETS[t.t].col:'#f3d27a';
    for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,v=(2+Math.random()*4)*cell;
      flies.push({drop:true,col,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2*cell,t:0,life:.6+Math.random()*.3,r:cell*(.06+Math.random()*.07)})}
  }
}
function drawFlies(dt){
  const W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,3);
  if(fxcv.width!==Math.round(W*d)||fxcv.height!==Math.round(H*d)){fxcv.width=Math.round(W*d);fxcv.height=Math.round(H*d)}
  if(!flies.length&&!fxcv._dirty) return;
  fxc.setTransform(d,0,0,d,0,0); fxc.clearRect(0,0,W,H); fxcv._dirty=flies.length>0;
  for(const f of flies){
    f.t+=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=22*cell*dt;
    fxc.globalAlpha=Math.max(0,Math.min(1,(f.life-f.t)/(f.life*.35)));
    if(f.drop){fxc.fillStyle=f.col;fxc.beginPath();fxc.arc(f.x,f.y,f.r,0,7);fxc.fill();continue}
    f.rot+=f.vr*dt; f.s=1+.25*Math.min(1,f.t*4);
    const sp=f.typ<0?eggSprite:sprites[f.typ], w=cell*1.04*f.s;
    fxc.save();fxc.translate(f.x,f.y);fxc.rotate(f.rot);
    if(sp&&sp.width) fxc.drawImage(sp,-w/2,-w/2,w,w);
    fxc.restore();
  }
  fxc.globalAlpha=1;
  flies=flies.filter(f=>f.t<f.life&&f.y<H+cell*2);
}
function ring(c,r){G.fx.push({ring:true,x:c+.5,y:r+.5,t:0,life:.35})}
function beam(horiz,i,from){G.fx.push({beam:true,horiz,i,from:from==null?3.5:from,t:0,life:.55})}
function crack(c,r){sfx.ice(); if(reduceMotion) return;

/* ===== 描画 ===== */
const cv=$('cv'), ctx=cv.getContext('2d');
let size=320, cell=40, dpr=1, sprites=[], eggSprite=null, badgeSprite=null;
const toImg=svg=>{const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);return im};
const svgImgs=SWEETS.map((a,i)=>toImg(svgOf(i,'width="200" height="200"')));
const eggImg=toImg(svgOf(-1,'width="200" height="200"')), badgeImg=toImg(BOMB_BADGE.replace('<svg ','<svg width="200" height="200" '));
function bake(im,px){const c=document.createElement('canvas');c.width=c.height=px;
  try{if(im.complete&&im.naturalWidth)c.getContext('2d').drawImage(im,0,0,px,px)}catch(e){} return c}
function bakeSprites(){
  const px=Math.max(8,Math.round(cell*1.04*dpr*1.4));
  sprites=svgImgs.map(im=>bake(im,px)); eggSprite=bake(eggImg,px); badgeSprite=bake(badgeImg,Math.round(cell*dpr));
}
[...svgImgs,eggImg,badgeImg].forEach(im=>im.addEventListener('load',bakeSprites));
function resize(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  size=r.width; cell=size/N; dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr); bakeSprites();
}
window.addEventListener('resize',resize);
// めんぼう（横向き）。x,y が真ん中、len が全体の長さ、roll で木目が転がる
function drawPin(c,x,y,len,roll){
  const bw=len*.6, bh=len*.2, hw=len*.2, hh=len*.09, lw=Math.max(1.5,len*.035);
  c.lineJoin='round'; c.strokeStyle=INK; c.lineWidth=lw;
  c.fillStyle='#b98a5f';
  for(const sg of [-1,1]){rrect(c,x+sg*(bw/2+hw/2)-hw/2,y-hh/2,hw,hh,hh/2);c.fill();c.stroke()}
  c.fillStyle='#ebc996'; rrect(c,x-bw/2,y-bh/2,bw,bh,bh/2); c.fill(); c.stroke();
  c.save(); rrect(c,x-bw/2,y-bh/2,bw,bh,bh/2); c.clip();
  c.strokeStyle='#d0a571'; c.lineWidth=lw*.8; const st=bw/3, ph=((roll%1)+1)%1*st;
  for(let i=-1;i<4;i++){const sx=x-bw/2+i*st+ph;c.beginPath();c.moveTo(sx,y-bh/2);c.lineTo(sx,y+bh/2);c.stroke()}
  c.restore();
}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingQuality='high';
  const fev=G&&G.feverT>0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    ctx.fillStyle=(r+c)%2?(fev?'#f8e4bd':'#f1e9dc'):(fev?'#fcecd0':'#fbf6ee');
    ctx.fillRect(c*cell,r*cell,cell,cell);
  }
  if(!G||!G.grid) return;
  if(G.sel){ctx.fillStyle='rgba(227,194,107,.55)';rrect(ctx,G.sel[1]*cell+2,G.sel[0]*cell+2,cell-4,cell-4,cell*.22);ctx.fill()}
  const hintOn=G.hint&&!G.busy, wob=Math.sin(G.clock*10);
  for(const row of G.grid)for(const t of row){
    if(!t||t.y<-1.2) continue;
    let s=t.s, a=1;
    if(t.pop>=0){const p=Math.min(1,t.pop/.2);if(p<.35){const q=p/.35;s=1+.22*(1-(1-q)*(1-q))}else{const q=(p-.35)/.65;s=1.22*(1-q*q*.85);a=1-q*q}}
    if(t.grow>0) s+=Math.sin(t.grow*Math.PI)*.3;
    if(t.sp===2&&t.pop<0) s+=.07+.05*Math.sin(G.clock*5);
    let oy=0;
    if(hintOn&&G.hint.some(([r,c])=>r===t.r&&c===t.c)){s+=wob*.06;oy=wob*cell*.04}
    const sq=reduceMotion?0:t.sq;
    const w=cell*1.04*s*(1+sq*.13), h=cell*1.04*s*(1-sq*.13);
    const cx=(t.x+(t.dx||0)+.5)*cell, cy=(t.y+(t.dy||0)+.5)*cell+oy+(cell*1.04*s-h)/2;
    ctx.globalAlpha=a;
    if(t.sp===2&&t.pop<0){ // ほしクッキー：まわる光と、ふわっと大きくなる動きで目立たせる
      ctx.save();ctx.translate(cx,cy);ctx.rotate(G.clock*1.2);
      const gl=ctx.createRadialGradient(0,0,cell*.1,0,0,cell*.66);
      gl.addColorStop(0,'rgba(245,184,72,1)');gl.addColorStop(.55,'rgba(248,204,110,.75)');gl.addColorStop(1,'rgba(250,214,130,0)');
      ctx.fillStyle=gl;
      for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-cell*.16,-cell*.66);ctx.lineTo(cell*.16,-cell*.66);ctx.closePath();ctx.fill()}
      ctx.beginPath();ctx.arc(0,0,cell*.42,0,7);ctx.fill();
      ctx.restore();
    }
    if((t.sp===3||t.sp===4)&&t.pop<0){ // めんぼうの帯（向きがひと目でわかるように）
      ctx.fillStyle='rgba(214,170,112,.3)';
      if(t.sp===3) rrect(ctx,cx-cell*.5,cy-cell*.2,cell,cell*.4,cell*.2); else rrect(ctx,cx-cell*.2,cy-cell*.5,cell*.4,cell,cell*.2);
      ctx.fill();
    }
    if(t.gold&&t.pop<0){ // キラキラおやつ
      const gr=ctx.createRadialGradient(cx,cy,cell*.1,cx,cy,cell*.55);
      gr.addColorStop(0,'rgba(250,210,95,1)');gr.addColorStop(.6,'rgba(252,222,130,.7)');gr.addColorStop(1,'rgba(252,222,130,0)');
      ctx.fillStyle=gr;ctx.fillRect(cx-cell*.55,cy-cell*.55,cell*1.1,cell*1.1);
    }
    if(t.sp===1&&t.pop<0&&badgeSprite){
      ctx.save();ctx.translate(cx,cy);ctx.rotate(G.clock*1.5);ctx.drawImage(badgeSprite,-cell/2,-cell/2,cell,cell);ctx.restore();
    }
    const sp=t.t<0?eggSprite:sprites[t.t];
    if(sp&&sp.width) ctx.drawImage(sp,cx-w/2,cy-h/2,w,h);
    else{ctx.fillStyle=t.t<0?'#fff3c9':SWEETS[t.t].col;ctx.beginPath();ctx.arc(cx,cy,w*.42,0,7);ctx.fill()}
    if(t.sp===1&&t.pop<0){ // ポップコーンのしるし（ぽこぽこ跳ねる）
      const k=Math.abs(Math.sin(G.clock*7)), bx=cx+cell*.3, by=cy-cell*.28-k*cell*.05, R=cell*.1;
      const P=[[0,0,1],[R*1.1,-R*.8,.8],[R*1.3,R*.6,.8]];
      ctx.fillStyle=INK;for(const [x,y,m] of P){ctx.beginPath();ctx.arc(bx+x,by+y,R*m+cell*.035,0,7);ctx.fill()}
      ctx.fillStyle='#fff3d6';for(const [x,y,m] of P){ctx.beginPath();ctx.arc(bx+x,by+y,R*m,0,7);ctx.fill()}
      ctx.fillStyle='#f3d27a';ctx.beginPath();ctx.arc(bx+R*.8,by,R*.28,0,7);ctx.fill();
    }
    if((t.sp===3||t.sp===4)&&t.pop<0){ // めんぼうのしるし：転がる向きに置いた小さなめんぼう
      ctx.save();ctx.translate(cx,cy);if(t.sp===4)ctx.rotate(Math.PI/2);
      drawPin(ctx,0,cell*.32,cell*1.12,G.clock*6+t.id);
      ctx.restore();
    }
    if(t.ice&&t.pop<0){ // こおり
      ctx.fillStyle='rgba(196,228,246,.62)';rrect(ctx,cx-cell*.46,cy-cell*.46,cell*.92,cell*.92,cell*.16);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=Math.max(1.5,cell*.04);ctx.stroke();
      ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-cell*.3,cy-cell*.12);ctx.lineTo(cx-cell*.12,cy-cell*.3);ctx.moveTo(cx-cell*.3,cy+.02*cell);ctx.lineTo(cx+.02*cell,cy-cell*.3);ctx.stroke();
    }
    if(t.gold&&t.pop<0){ // きらり
      const k=(Math.sin(G.clock*6+t.id)+1)/2, sx=cx-cell*.3, sy=cy-cell*.3, L=cell*(.15+.05*k), q=L*.32;
      ctx.beginPath();ctx.moveTo(sx,sy-L);ctx.lineTo(sx+q,sy-q);ctx.lineTo(sx+L,sy);ctx.lineTo(sx+q,sy+q);ctx.lineTo(sx,sy+L);ctx.lineTo(sx-q,sy+q);ctx.lineTo(sx-L,sy);ctx.lineTo(sx-q,sy-q);ctx.closePath();
      ctx.fillStyle='#ffe27a';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1.5,cell*.035);ctx.lineJoin='round';ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  for(const p of G.fx){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    if(p.ring){ctx.strokeStyle='#f3b65f';ctx.lineWidth=cell*.12;ctx.beginPath();ctx.arc(p.x*cell,p.y*cell,cell*(.4+p.t/p.life*1.2),0,7);ctx.stroke();continue}
    if(p.beam){ // めんぼうが左右（上下）にころころ転がって、粉のあとが残る
      const k=Math.min(1,p.t/(p.life*.85)), e=1-Math.pow(1-k,2), w=cell*.8, o=(p.from+.5)*cell, reach=e*size;
      ctx.save(); if(!p.horiz) ctx.transform(0,1,1,0,0,0); // たてのときは x と y を入れかえて、同じ描き方で
      const y=(p.i+.5)*cell, a=Math.max(0,o-reach), b=Math.min(size,o+reach);
      ctx.fillStyle='rgba(251,240,214,.95)';ctx.fillRect(a,y-w/2,b-a,w);
      ctx.fillStyle='rgba(225,196,150,.45)';ctx.fillRect(a,y-w/6,b-a,w/3);
      ctx.globalAlpha=1;
      for(const sg of [-1,1]) drawPin(ctx,o+sg*reach,y,cell*1.5,sg*reach/cell*2.2);
      ctx.restore();
      continue}
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x*cell,p.y*cell,p.sz*cell,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  ctx.font=`${Math.round(cell*.36)}px "Mochiy Pop One","Zen Maru Gothic",sans-serif`;
  for(const tx of G.texts){
    ctx.globalAlpha=Math.max(0,1-Math.max(0,tx.t-.5)/.4);
    const y=(tx.y-tx.t*.9)*cell;
    ctx.lineWidth=4; ctx.strokeStyle='#fffdf8'; ctx.strokeText(tx.s,tx.x*cell,y); ctx.fillStyle=tx.col; ctx.fillText(tx.s,tx.x*cell,y);
  }
  ctx.globalAlpha=1;
}

/* ===== ループ ===== */
let last=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||0); last=now;
  if(G&&!G.paused&&!$('play').hidden) step(dt);
  if(!$('play').hidden) draw();
  drawFlies(G&&G.paused?0:dt);
}
function step(dt){
  G.clock+=dt;
  const due=G.timers.filter(x=>x.t<=G.clock); G.timers=G.timers.filter(x=>x.t>G.clock); due.forEach(x=>x.res());
  for(const row of G.grid)for(const t of row){
    if(!t) continue;
    if(t.tw){t.tw.t+=dt;const p=Math.min(1,t.tw.t/t.tw.d),e=EASE[t.tw.e](p);
      t.x=t.tw.fx+(t.c-t.tw.fx)*e;t.y=t.tw.fy+(t.r-t.tw.fy)*e;if(p>=1){t.x=t.c;t.y=t.r;delete t.tw}}
    else if(t.y<t.r){
      // 落下：少しずつ速くなって、着地でぽよんと弾む
      t.vy=Math.min(22,t.vy+62*dt);t.y+=t.vy*dt;
      if(t.y>=t.r){t.y=t.r;t.sqA=Math.min(1,.35+t.vy/18);t.sqT=0;t.vy=0}}
    else if(t.y>t.r){t.y=t.r}
    if(t.x!==t.c&&!t.tw) t.x=t.c;
    if(t.sqA>0){t.sqT+=dt;t.sq=t.sqA*Math.exp(-7*t.sqT)*Math.cos(19*t.sqT);if(t.sqT>.7){t.sq=0;t.sqA=0}}
    if((t.dx||t.dy)&&!(drag&&drag.tile===t)){const k=Math.exp(-dt*22);t.dx*=k;t.dy*=k;if(Math.abs(t.dx)+Math.abs(t.dy)<.002)t.dx=t.dy=0}
    if(t.grow>0) t.grow=Math.max(0,t.grow-dt*4);
    if(t.pop>=0) t.pop+=dt;
  }
  G.fx.forEach(p=>{p.t+=dt;if(!p.ring&&!p.beam){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=9*dt}}); G.fx=G.fx.filter(p=>p.t<p.life);
  G.texts.forEach(x=>x.t+=dt); G.texts=G.texts.filter(x=>x.t<.9);
  if(G.over) return;
  if(G.feverT>0){G.feverT-=dt;G.fever=Math.max(0,100*G.feverT/FEVER_TIME);
    if(G.feverT<=0){G.feverT=0;G.fever=0;$('board').classList.remove('fev');$('feverBar').classList.remove('on');bgmPlay('normal')}}
  // 時間：ステージの切りかわり・やきたてタイム・ひんやり中は止まる
  if(G.chill>0) G.chill=Math.max(0,G.chill-dt);
  if(G.feverT<=0&&G.chill<=0&&G.banner<=0&&!G.stageClearPending){
    G.time=Math.max(0,G.time-dt*drainFor(G.stage));
    if(G.time<10&&Math.ceil(G.time)!==G.tick){G.tick=Math.ceil(G.time);sfx.tick()}
  }
  if(G.banner>0) G.banner-=dt;
  // コンボは消しつづけている間はつながる
  if(!G.busy&&G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.comboT=0;G.combo=0}}
  if(!G.busy){G.idle+=dt;if(G.idle>3&&!G.hint)G.hint=findMove()}
  if(G.time<=0&&!G.busy) endGame();
  renderHud();
}
requestAnimationFrame(frame);

/* ===== HUD ===== */
function buildQuota(){
  G.kinds=G.quota.map((q,i)=>q>0?i:-1).filter(i=>i>=0);
  $('quota').innerHTML=G.quota.map((q,i)=>q>0?`<div class="q" id="q${i}" role="img" aria-label="${SWEETS[i].name}">${svgOf(i,'aria-hidden="true"')}<b></b></div>`:'').join('');
}
function bumpQuota(i){const el=$('q'+i);if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
let hudCache='';
function renderHud(){
  if(!G) return;
  const key=[G.stage,G.score,Math.ceil(G.time*4),G.quota.join(),G.combo,Math.round(G.fever),G.feverT>0,G.chill>0].join('|');

/* ===== 入力 ===== */
let drag=null;
function cellAt(e){const r=cv.getBoundingClientRect();const c=Math.floor((e.clientX-r.left)/r.width*N),w=Math.floor((e.clientY-r.top)/r.height*N);
  return c>=0&&c<N&&w>=0&&w<N?[w,c]:null}
cv.addEventListener('pointerdown',e=>{
  ac(); if(!G||G.over||G.paused) return;
  const p=cellAt(e); if(!p) return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  drag={p,x:e.clientX,y:e.clientY,moved:false,tile:G.busy?null:at(...p)};
  if(drag.tile&&drag.tile.ice) drag.tile=null;
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.moved) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y, cw=cv.getBoundingClientRect().width/N, th=cw*.35;
  if(Math.max(Math.abs(dx),Math.abs(dy))<th){
    // しきい値までは、おやつが指についてくる
    const t=drag.tile; if(t&&!G.busy){const h=Math.abs(dx)>Math.abs(dy), v=(h?dx:dy)/cw*.7; t.dx=h?v:0; t.dy=h?0:v}
    return;
  }
  drag.moved=true;
  const [r,c]=drag.p, d=Math.abs(dx)>Math.abs(dy)?[0,Math.sign(dx)]:[Math.sign(dy),0];
  const q=[r+d[0],c+d[1]];
  if(q[0]>=0&&q[0]<N&&q[1]>=0&&q[1]<N) trySwap(drag.p,q);
});
cv.addEventListener('pointerup',()=>{
  if(!drag) return; const d=drag; drag=null;
  if(d.moved||!G||G.busy) return;
  // タップで選んで、となりをタップでも入れかえ
  const s=G.sel, p=d.p;
  if(s&&Math.abs(s[0]-p[0])+Math.abs(s[1]-p[1])===1){trySwap(s,p);return}
  G.sel=s&&s[0]===p[0]&&s[1]===p[1]?null:p;
});
cv.addEventListener('pointercancel',()=>{drag=null});

/* ===== 画面 ===== */
function show(id){['title','play','result'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function startGame(mode='normal'){
  ac(); clearTimeout(bannerTimer); $('banner').hidden=true;
  if(mode==='daily'){const sd=dateSeed(jstDate()); rnd=seeded(sd); rndOrder=seeded(sd^0x9e3779b9)} else {rnd=Math.random; rndOrder=Math.random}
  G=freshState(mode); show('play'); resize(); buildQuota(); fillBoard(); hudCache=''; renderHud();
  $('board').classList.remove('fev'); $('feverBar').classList.remove('on');
  const g=G; G.busy=true; showBanner(mode==='daily'?'今日のチャレンジ':'スタート！',mode==='daily'?'みんな同じ盤面・同じ注文':'注文のおやつを集めよう',1.2); G.banner=1.2;
  wait(1.2).then(()=>{if(G===g)G.busy=false});
  BGM.mode='normal'; BGM.step=0; bgmPlay('normal');
  pingPlay(); guardHistory();
}
function pause(on){
  if(!G||G.over) return;
  G.paused=on; $('pauseModal').hidden=!on; drag=null;
  if(on) bgmStop(); else bgmPlay();
}
function endGame(){
  if(!G||G.over) return;
  G.over=true; G.busy=true; bgmStop(); sfx.end();
  showBanner('タイムアップ！','',1.6);
  const g=G; setTimeout(()=>{if(G===g)showResult()},1600);
}
let lastShare=null;
function showResult(){
  const S=G; if(!S) return;
  const reached=S.stage, rank=rankOf(reached);
  const daily=S.mode==='daily', today=jstDate();

/* ===== ランキング =====
   サーバーは Supabase（supabase/korokoro-ranking.sql を SQL Editor で実行しておく）。
   NGワード・ありえないスコア・連投はサーバー側で弾くので、ここは見せ方だけ。
   アプリ版（Game Center）に移すときは RANK_API の4つを差しかえれば、画面はそのまま使えます。 */
const RANK_LIMIT=50;           // ブラウザ版は上位50位まで表示（サーバーは100まで返せる）
const KEY_PLAYER='korokoro-player', KEY_NAME='korokoro-name';
const RANK_API=(()=>{
  const URL_='https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/', KEY='sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z';
  async function rpc(name,body,keep){
    const ac2=new AbortController(), to=setTimeout(()=>ac2.abort(),8000);
    let r;
    try{r=await fetch(URL_+name,{method:'POST',signal:ac2.signal,keepalive:!!keep,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}
    catch(e){throw new Error('offline')} finally{clearTimeout(to)}
    if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
      throw new Error(/^korokoro_/.test(m)?m.slice(9):(r.status===404?'notready':'offline'))}
    return r.json();
  }
  return {
    check:name=>rpc('korokoro_name_check',{p_name:name}),                        // null ならOK
    submit:(o,keep)=>rpc('korokoro_submit',{p_player:o.player,p_name:o.name,p_daily:o.daily,p_score:o.score,p_stage:o.stage,p_secs:o.secs,p_combo:o.combo},keep).then(a=>a[0]),
    top:(daily,player)=>rpc('korokoro_top',{p_daily:daily,p_player:player,p_limit:RANK_LIMIT}),
    rename:(player,name)=>rpc('korokoro_rename',{p_player:player,p_name:name}),
  };
})();
function playerId(){
  let id=LS.get(KEY_PLAYER,'');
  if(!/^[0-9a-f-]{36}$/.test(id)){
    id=(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
    LS.set(KEY_PLAYER,id);
  }
  return id;
}
const cleanName=v=>String(v||'').replace(/[\u0000-\u001f\u007f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,'').replace(/\s+/g,' ').trim();

  length:'1〜10文字で入れてね',rate:'少し時間をおいてから、もう一度送ってね',bad:'このスコアは送れませんでした',notready:'ランキングは準備中です',offline:'ランキングにつながりませんでした'};

async function sendRun(name){
  const run=pendingRun; if(!run) return;
  $('nameForm').hidden=true; $('nameErr').textContent=''; $('rankMsg').textContent='ランキングに送っています…';
  try{
    const r=await RANK_API.submit({...run,player:playerId(),name});
    if(pendingRun!==run) return;
    pendingRun=null; LS.set(KEY_NAME,name);
    const label=run.daily?'今日のチャレンジ':'ランキング';
    $('rankMsg').innerHTML=r.rank<=RANK_LIMIT?`${label} <b>${r.rank}位</b>（${r.total.toLocaleString()}人中）`:`${label} ${r.rank.toLocaleString()}位（${r.total.toLocaleString()}人中）`;

  }catch(e){

    const k=e.message;
    if(k==='ng'||k==='length'){LS.set(KEY_NAME,'');$('rankMsg').innerHTML='ニックネームを入れて<b>ランキング</b>にのせよう';$('nameForm').hidden=false;$('nameInput').value=name;$('nameErr').textContent=RANK_ERR[k]}
    else{$('rankMsg').textContent=RANK_ERR[k]||RANK_ERR.offline;if(k==='bad'||k==='notready')pendingRun=null}
  }
}
