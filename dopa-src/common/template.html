<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="{{BG}}">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{OGDESC}}">
<meta property="og:url" content="https://runococco.github.io/picoruno./{{SLUG}}.html">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="https://runococco.github.io/picoruno./og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://runococco.github.io/picoruno./og-image.png">
<link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--bg:{{BG}};--panel:{{PANEL}};--accent:{{ACCENT}}}
{{CSS}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <section class="scr" id="titleScr">
    <canvas id="iconCv" width="360" height="360"></canvas>
    <h1 class="ttl" style="--tl:{{TLEN}}">{{TITLE}}</h1>
    <p class="catch">{{CATCH}}</p>
    <ul class="howto">{{HOWTO}}</ul>
    <p class="best" id="bestTxt"></p>
    <button class="btn big" id="startBtn">スタート</button>
    <a class="back" href="https://runococco.github.io/picoruno./">← picoruno. のゲーム一覧へ</a>
  </section>
  <section class="scr" id="resultScr" hidden>
    <p class="r-ttl">{{TITLE}}</p>
    <img class="r-photo" id="rPhoto" alt="" hidden>
    <div class="r-score"><span id="rScore">0</span><small id="rUnit"></small></div>
    <p class="r-new" id="rNew" hidden>NEW RECORD!</p>
    <p class="r-rank" id="rRank"></p>
    <p class="r-best" id="rBest"></p>
    <button class="btn big" id="againBtn">もういちど</button>
    <div class="row">
      <a class="btn dark" id="xBtn" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">𝕏 に投稿</a>
      <button class="btn sub" id="saveBtn">画像を保存</button>
    </div>
    <a class="back" href="https://runococco.github.io/picoruno./">← picoruno. のゲーム一覧へ</a>
  </section>
  <button class="mute" id="muteBtn" aria-label="音のオンオフ"></button>
  <button class="quit" id="quitBtn" aria-label="やめる" hidden>✕</button>
</div>
<script>
{{ENGINE}}
</script>
<script>
{{GAME}}
</script>
<script>P.boot(GAME);</script>
</body>
</html>
