<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>ないはずの部屋</title>
<meta name="description" content="1998年に行方不明になった調査員のUSBメモリ。名簿、間取り図、録音、写真を読み解いて、団地にある「ないはずの部屋」の正体にたどりつく、ホラー謎解き。驚かせる演出はありません。">
<meta property="og:type" content="website">
<meta property="og:title" content="ないはずの部屋">
<meta property="og:description" content="行方不明になった調査員の記録を読み解くホラー謎解き。気づいたとき、いちばん怖い。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141614'/%3E%3Crect x='10' y='6' width='12' height='22' fill='%23545a52' stroke='%23c9c4b2' stroke-width='1.4'/%3E%3Ccircle cx='19' cy='18' r='1.2' fill='%23c9c4b2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone column. Title → an old USB drive "desktop" (folders) → file viewer sheet. Documents use mincho on paper; the drive UI uses a dot font on a dark CRT. */
:root{
  --bg:#141614;
  --panel:#1d201d;
  --line:#343a34;
  --ink:#d9d6c8;
  --sub:#8d9187;
  --dim:#5d625a;
  --paper:#ebe6d6;
  --paper-ink:#2c2a25;
  --red:#b5483f;
  --amber:#e0a14a;
  --ui:"DotGothic16","Hiragino Sans",monospace;
  --doc:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
button,input{font-family:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;min-height:100svh;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;flex:1;gap:14px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;box-sizing:border-box;
  border:2px solid var(--ink);background:transparent;font-size:1rem;letter-spacing:.08em;cursor:pointer;padding:10px 16px}
.btn:hover{background:rgba(217,214,200,.08)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.small{min-height:40px;font-size:.85rem;width:auto}
.btn:focus-visible,.icon:focus-visible,.file:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.iconbtn{border:1px solid var(--line);background:transparent;padding:6px 10px;font-size:.78rem;cursor:pointer;color:var(--sub)}

/* ---- タイトル ---- */
#title{justify-content:center;text-align:center}
.logo{font-family:var(--doc);font-weight:700;font-size:clamp(2.2rem,11vw,3.2rem);letter-spacing:.12em;margin:0;line-height:1.2}
.logo .x{display:inline-block;animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1;transform:none}93%{opacity:.2;transform:translateX(2px)}95%{opacity:1}96%{opacity:.4;transform:translateX(-1px)}}
.subt{color:var(--sub);font-size:.85rem;letter-spacing:.2em;margin:4px 0 18px}
.note{border:1px solid var(--line);padding:12px 14px;font-size:.8rem;line-height:1.8;color:var(--sub);text-align:left}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:.85rem;color:var(--sub)}
.field input{background:var(--panel);border:1px solid var(--line);font-size:1.05rem;padding:12px;color:var(--ink);min-height:48px;box-sizing:border-box}
.ends{font-size:.78rem;color:var(--dim);letter-spacing:.1em}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--dim);margin-top:auto;padding-top:12px}
.foot a{color:var(--sub)}

/* ---- ドライブ ---- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;font-size:.85rem}
.bar b{font-weight:400;letter-spacing:.06em}
.crumb{color:var(--sub);font-size:.8rem;min-height:1.2em}
.icons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.icon{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:.9rem;position:relative}
.icon svg{width:56px;height:44px}
.icon .lk{position:absolute;top:8px;right:10px;font-size:.75rem;color:var(--amber)}
.icon.locked{color:var(--sub)}
.icon.new::before{content:"NEW";position:absolute;top:8px;left:10px;font-size:.65rem;color:var(--red)}
.files{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.file{display:flex;align-items:center;gap:12px;padding:14px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;font-size:.95rem;width:100%}
.file small{margin-left:auto;color:var(--dim);font-size:.72rem;white-space:nowrap}
.file .ext{width:34px;flex:none;font-size:.68rem;color:var(--bg);background:var(--sub);text-align:center;padding:2px 0}
.file.upd small{color:var(--red)}
.back{align-self:flex-start}
.status{font-size:.8rem;color:var(--sub);line-height:1.7;border-left:2px solid var(--line);padding-left:10px}

/* ---- ビューア ---- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,9,8,.92);display:flex;flex-direction:column;align-items:center;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet .in{width:100%;max-width:520px;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.85rem;position:sticky;top:0;background:rgba(8,9,8,.92);padding:6px 0;z-index:2}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--doc);padding:20px 18px;line-height:1.95;font-size:.98rem;box-shadow:0 0 0 1px #000,6px 6px 0 rgba(0,0,0,.35);
  -webkit-user-select:text;user-select:text}
.paper h3{margin:0 0 6px;font-size:1.05rem}
.paper .meta{font-size:.75rem;color:#6d685c;margin-bottom:12px;font-family:var(--ui)}
.paper p{margin:0 0 1em}
.paper .hand{color:#8c2f28;font-style:normal}
.paper table{border-collapse:collapse;width:100%;font-size:.92rem}
.paper th,.paper td{border:1px solid #9c9584;padding:6px 6px;text-align:left;vertical-align:middle}
.paper th{background:#ddd6c2;font-weight:700;font-size:.8rem}
.paper td.no{width:3.2em;text-align:center}
.paper tr.flick td{animation:rowflick 1.3s steps(2) 2}
@keyframes rowflick{0%{opacity:1}25%{opacity:.15;transform:translateX(3px)}50%{opacity:1}75%{opacity:.4}}
.del{font-family:var(--ui);font-size:.75rem;border:1px solid var(--red);color:var(--red);background:transparent;padding:4px 8px;cursor:pointer;white-space:nowrap}
.tape .ln{display:grid;grid-template-columns:2.6em 1fr;gap:6px;padding:3px 0;transition:background .2s}
.tape .sp{font-family:var(--ui);font-size:.78rem;color:#6d685c;padding-top:.25em}
.tape .ln.unk .sp{color:var(--red)}
.tape .ln.unk .tx{color:#5a2a25;letter-spacing:.18em}
.tape .ln.on{background:rgba(224,161,74,.25)}
.tape .ln.unk.on .tx{animation:jit .12s infinite}
.tape .tx.kn{letter-spacing:0;white-space:nowrap;font-size:.74rem}
@keyframes jit{50%{transform:translate(1px,-1px)}}
.figure{background:#0e0f0e;padding:8px;box-shadow:0 0 0 1px #000}
.figure svg{display:block;width:100%;height:auto}
.cap{font-size:.78rem;color:var(--sub);margin:8px 0 14px;line-height:1.6}
.found{font-size:.85rem;color:var(--amber);margin:8px 0;text-align:center;min-height:1.4em}
.tap{cursor:crosshair;touch-action:manipulation}
.hint{margin-top:14px;font-size:.82rem;color:var(--sub);line-height:1.7}
.hint p{margin:6px 0;border-left:2px solid var(--amber);padding-left:8px}

/* ---- パスワード ---- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.box h4{margin:0;font-weight:400;font-size:1rem;letter-spacing:.06em}
.box p{margin:0;font-size:.85rem;color:var(--sub);line-height:1.7}
.box input{background:var(--bg);border:1px solid var(--line);font-size:1.1rem;padding:12px;color:var(--ink);min-height:48px;box-sizing:border-box;width:100%}
.err{color:var(--red);font-size:.82rem;min-height:1.2em}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--red);
  color:var(--ink);font-size:.82rem;padding:10px 14px;max-width:calc(100vw - 48px);box-sizing:border-box;line-height:1.6;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* ---- エンディング ---- */
#ending{justify-content:center}
.endtag{font-size:.8rem;color:var(--sub);letter-spacing:.3em;text-align:center}
.endttl{font-family:var(--doc);font-size:2rem;text-align:center;margin:4px 0 10px;letter-spacing:.1em}
.endtx{font-family:var(--doc);line-height:2.1;font-size:1rem}
.endtx p{margin:0 0 .4em;opacity:0;animation:fade 1.2s forwards}
@keyframes fade{to{opacity:1}}
.glitch{animation:gl .5s steps(3) 1}
@keyframes gl{0%{filter:none}33%{filter:invert(1) hue-rotate(90deg);transform:translateX(4px)}66%{filter:contrast(3);transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">

<!-- タイトル -->
<section class="screen" id="title">
  <h1 class="logo">ないはずの<span class="x">部</span>屋</h1>
  <p class="subt">ひばりヶ丘第二団地 調査記録</p>
  <div class="note">1998年、ひとりの調査員が団地の調査中に行方不明になりました。のこされたUSBメモリには、名簿、間取り図、録音、写真が入っています。<br>読み解いて、「ないはずの部屋」の正体をたしかめてください。（クリアまで30分ほど）<br><br>※ 大きな音や、急に驚かせる演出はありません。音が出ます（イヤホン推奨）。</div>
  <label class="field">記録を引き継ぐ人の名前
    <input id="nameIn" maxlength="8" placeholder="例：しろ" autocomplete="off" enterkeyhint="go">
  </label>
  <button class="btn solid" id="startBtn" type="button">USBメモリを開く</button>
  <button class="btn" id="contBtn" type="button" hidden>つづきから</button>
  <p class="ends" id="endsLine"></p>
  <p class="foot"><a href="https://runococco.github.io/picoruno./">別のゲーム</a><button class="iconbtn" id="muteBtn" type="button" aria-pressed="false">おと：オン</button></p>
</section>

<!-- ドライブ -->
<section class="screen" id="desk" hidden>
  <div class="bar"><b id="drive">USB_DRIVE (E:)</b><button class="iconbtn" id="muteBtn2" type="button">おと：オン</button></div>
  <p class="crumb" id="crumb"></p>
  <div class="icons" id="icons"></div>
  <button class="btn small back" id="backBtn" type="button" hidden>← もどる</button>
  <div class="files" id="files" hidden></div>
  <p class="status" id="status"></p>
  <p class="foot"><button class="iconbtn" id="toTitle" type="button">タイトルへ</button><span>ないはずの部屋</span></p>
</section>

<!-- エンディング -->
<section class="screen" id="ending" hidden>
  <p class="endtag" id="endTag"></p>
  <h2 class="endttl" id="endTtl"></h2>
  <div class="endtx" id="endTx"></div>
  <div id="endBtns" hidden style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
    <button class="btn solid" id="epiBtn" type="button" hidden>USBの中を、もう一度見る</button>
    <button class="btn" id="retryBtn" type="button">名簿を開いたところからやり直す</button>
    <div class="row"><button class="btn" id="shareBtn" type="button">シェアする</button><button class="btn" id="endTitle" type="button">タイトルへ</button></div>
    <p class="ends" id="endsLine2" style="text-align:center"></p>
  </div>
</section>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTtl">
  <div class="in">
    <div class="top"><span id="sheetTtl"></span><button class="iconbtn" id="closeSheet" type="button">とじる ×</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="modal" id="pw" hidden role="dialog" aria-modal="true" aria-labelledby="pwTtl">
  <form class="box" id="pwForm">
    <h4 id="pwTtl">パスワード</h4>
    <p id="pwMsg"></p>
    <input id="pwIn" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <p class="err" id="pwErr" aria-live="polite"></p>
    <div class="row"><button class="btn" type="button" id="pwCancel">とじる</button><button class="btn solid" type="submit">ひらく</button></div>
    <button class="iconbtn" type="button" id="pwHint">ヒントを見る</button>
    <div class="hint" id="pwHints"></div>
  </form>
</div>

<div class="modal" id="ask" hidden role="alertdialog" aria-modal="true" aria-labelledby="askTtl">
  <div class="box">
    <h4 id="askTtl"></h4>
    <p>もとには戻せません。</p>
    <div class="row"><button class="btn" type="button" id="askNo">やめる</button><button class="btn solid" type="button" id="askYes">消す</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const GAME_URL='https://runococco.github.io/picoruno./naihazu.html';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 進みぐあい =====
   stage 0: 01だけ開いている / 1: 02録音 / 2: 03管理人室 / 3: 04夜間録音（鍵箱が開いた） / 4: 05写真 / 5: 06最後（写真のちがいを3つ見つけた）
   final: 04のメモを読んだ（名簿に自分の名前が出て、消せるようになる） / epi: END A のあと */
const SAVE_KEY='picoruno-naihazu2';
let S={name:'',stage:0,final:false,epi:false,found:[],seen:{},hints:{},ends:[]};
function load(){ try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(d) S=Object.assign(S,d); }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
const who=()=>S.name||'あなた';

/* ===== おと（Web Audio）：低いうなりと、ノイズ ===== */
let AC=null, master=null, muted=false, drone=null;
try{ muted=localStorage.getItem(SAVE_KEY+'-mute')==='1'; }catch(e){}
function audio(){
  if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
  return AC;
}
function startDrone(){
  if(!audio()||drone) return;
  const g=AC.createGain(); g.gain.value=0; g.connect(master);
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.connect(g);
  [55,55.6,82.4].forEach((f,i)=>{ const o=AC.createOscillator(); o.type=i===2?'triangle':'sine'; o.frequency.value=f; const og=AC.createGain(); og.gain.value=i===2?.25:.5; o.connect(og); og.connect(lp); o.start(); });
  const lfo=AC.createOscillator(), lg=AC.createGain(); lfo.frequency.value=.07; lg.gain.value=.012; lfo.connect(lg); lg.connect(g.gain); lfo.start();
  g.gain.linearRampToValueAtTime(.035,AC.currentTime+4);
  drone=g;
}
function noise(dur=.5,vol=.07,freq=1800){
  if(!audio()) return;
  const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=.8;
  const g=AC.createGain(); g.gain.value=vol; s.connect(bp); bp.connect(g); g.connect(master); s.start();
}
function blip(f=660,dur=.08,vol=.05,type='square'){
  if(!audio()) return;
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(vol,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+.02);
}
function setMute(m){
  muted=m; try{ localStorage.setItem(SAVE_KEY+'-mute',m?'1':'0'); }catch(e){}
  if(master) master.gain.value=m?0:1;
  ['muteBtn','muteBtn2'].forEach(id=>{ $(id).textContent=m?'おと：オフ':'おと：オン'; $(id).setAttribute('aria-pressed',m?'true':'false'); });
}
$('muteBtn').onclick=()=>{ audio(); setMute(!muted); };
$('muteBtn2').onclick=()=>{ audio(); setMute(!muted); };

/* ===== 名簿：進みぐあいで中身が書きかわる ===== */
function roster(){
  const R=[
    {no:'301',nm:'田村 和子',since:'1971'},
    {no:'302',nm:'三浦 孝',since:'1984'},
    {no:'303',nm:'空室',since:'（1997年3月〜）',empty:true},
    {no:'305',nm:'木下 恵美',since:'1990'},
  ];
  if(S.epi) return {rows:R,upd:'1998/10/02 14:10',changed:[]};
  const changed=[];
  if(S.stage>=1){ R[2]={no:'303',nm:'大野 正一',since:'1968',key:'oono'}; changed.push('303'); }
  if(S.stage>=5){ R.splice(3,0,{no:'304',nm:'三枝 浩一',since:'1998',key:'saegusa'}); changed.push('304'); }
  if(S.final){ R.splice(4,0,{no:'304',nm:who(),since:'（同居）',key:'me'}); changed.push('304b'); }
  return {rows:R,upd:S.stage>=1?'1998/10/17 03:04':'1998/10/02 14:10',changed};
}
function rosterVer(){ return S.epi?'e':[S.stage>=1,S.stage>=5,S.final].map(Number).join(''); }

/* ===== 写真（SVG） ===== */
function photoSVG(v,opts={}){
  const bays=[301,302,303,304,305];
  let g='';
  bays.forEach((n,i)=>{
    const x=i*120;
    g+=`<rect x="${x+46}" y="22" width="28" height="8" fill="${v.dark?'#d9d0a0':'#f4ecc0'}" opacity=".85"/>`;
    if(n===304){
      g+=`<path d="M${x+30} 70 l8 22 l-5 18 M${x+80} 200 l10 14" stroke="#4c504a" stroke-width="1" fill="none"/>`;
      if(v.door304>0){
        const o=v.door304;
        g+=`<g opacity="${o}"><rect x="${x+20}" y="96" width="50" height="160" fill="${o<1?'#3d413b':'#545a52'}" stroke="#262825" stroke-width="2"/>`+
          `<circle cx="${x+62}" cy="182" r="3" fill="#c9c4b2"/>`+
          `<rect x="${x+26}" y="80" width="38" height="12" fill="#cfcab8"/><text x="${x+45}" y="90" font-size="10" text-anchor="middle" fill="#222" font-family="sans-serif">304</text>`;
        if(v.plate304) g+=`<rect x="${x+28}" y="120" width="34" height="13" fill="#e8e2cc"/><text x="${x+45}" y="130.5" font-size="10" text-anchor="middle" fill="#111" font-family="serif">${v.plate304}</text>`;

function knock(t){
  if(!AC) return;
  const n=Math.floor(AC.sampleRate*.12), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
  const s=AC.createBufferSource(); s.buffer=b;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  const g=AC.createGain(); g.gain.value=.55; s.connect(lp); lp.connect(g); g.connect(master); s.start(t);
}
function playNight(){
  audio(); startDrone(); tapeStop=false;
  const lines=[...document.querySelectorAll('.tape .ln')]; let i=0;
  $('playTape').disabled=true; $('playTape').textContent='再生中…';
  (function step(){
    lines.forEach(l=>l.classList.remove('on'));
    if(tapeStop||i>=lines.length||!$('playTape')){ if($('playTape')){ $('playTape').disabled=false; $('playTape').textContent='▶ もう一度再生'; } return; }
    const l=lines[i], k=NIGHT[i][3]; l.classList.add('on'); l.scrollIntoView({block:'center',behavior:'smooth'});
    let dur=1500;
    if(k&&AC){ const t0=AC.currentTime+.15; let t=t0;
      for(let a=0;a<k[0];a++){ knock(t); t+=.26; } t+=.55; for(let a=0;a<k[1];a++){ knock(t); t+=.26; }
      dur=(t-t0)*1000+900; }
    else if(k) dur=2600;
    else if(NIGHT[i][1][0]==='（') noise(.5,.02,400);
    i++; setTimeout(step,dur);
  })();
}

/* 録音の再生：1行ずつ光らせる。「？」の行ではノイズ */
let tapeStop=false;
function playTape(){
  audio(); startDrone(); tapeStop=false;
  const lines=[...document.querySelectorAll('.tape .ln')]; let i=0;
  $('playTape').disabled=true; $('playTape').textContent='再生中…';
  (function step(){
    lines.forEach(l=>l.classList.remove('on'));
    if(tapeStop||i>=lines.length||!$('playTape')){ if($('playTape')){ $('playTape').disabled=false; $('playTape').textContent='▶ もう一度再生'; } return; }
    const l=lines[i]; l.classList.add('on'); l.scrollIntoView({block:'center',behavior:'smooth'});
    const unk=l.classList.contains('unk');
    if(unk) noise(1.1,.09,500+Math.random()*600); else blip(240+Math.random()*60,.05,.012,'sine');
    i++; setTimeout(step,unk?1500:1300);
  })();
}

/* 写真のちがい探し */
function setupDiff(){
  const svg=$('cmpTap').querySelector('svg'), marks=svg.querySelector('.marks');
  const draw=()=>{
    marks.innerHTML=DIFFS.filter(d=>S.found.includes(d.id)).map(d=>`<circle cx="${d.x}" cy="${d.y}" r="${d.r}" fill="none" stroke="#e0483c" stroke-width="4"/>`).join('');
    $('foundMsg').textContent=S.stage>=5?'3つとも見つけた。「06_最後」が開いた。':`見つけたちがい：${S.found.length} / 3`;
  };
  draw();
  svg.addEventListener('click',e=>{
    if(S.stage>=5) return;
    const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse());
    const hit=DIFFS.find(d=>!S.found.includes(d.id)&&Math.hypot(q.x-d.x,q.y-d.y)<d.r+6);
    if(hit){
      S.found.push(hit.id); save(); blip(880,.1,.04,'sine'); draw();
      $('foundMsg').textContent+=`（${hit.label}）`;
      if(S.found.length>=3){
        S.stage=5; save();
        setTimeout(()=>{ noise(1,.07,800); $('cmpTap').classList.add('glitch'); $('cmpTap').innerHTML=photoSVG(PHOTOS.p3(),{label:'写真3'}); setupDiff(); toast('「06_最後」の鍵が外れました。304号室の表札に、名前が出ている。'); },700);
      }
    }else{
      blip(150,.08,.03);
      marks.insertAdjacentHTML('beforeend',`<text x="${q.x}" y="${q.y+6}" font-size="20" text-anchor="middle" fill="#ffd8a0" class="miss">×</text>`);
      setTimeout(()=>{ const m=marks.querySelector('.miss'); if(m) m.remove(); },500);
    }
  });
}

    '304号室のドアが、内側から開く音がした。']},
  C:{ttl:'行方不明',lines:n=>[
    '「三枝 浩一」の行が、消えた。',
    '「はじめに」のファイルから、三枝さんの名前がなくなっている。',
    '最初から、そんな調査員はいなかったことになった。',
    'それでも、304号室の行は残っている。',
    `住人の欄には、「${who()}」とだけ書いてある。`,
    '入居：1998。']},
  D:{ttl:'ひとり減った',lines:n=>[
    `「${n}」の行が、消えた。`,
    'その人は、ちゃんとそこに住んでいた。',
    '名簿の行は、ひとつ減った。かわりに、304号室の行は、少し濃くなった。',
    'まぎれこんだ名前は、まだ、名簿のどこかにある。']},
};
let lastEnd='A';
function showEnd(k,nm){
  lastEnd=k;
  if(!S.ends.includes(k)){ S.ends.push(k); S.ends.sort(); }
  save();
  ['title','desk'].forEach(id=>$(id).hidden=true); $('ending').hidden=false; window.scrollTo(0,0);
  $('endTag').textContent='END '+k; $('endTtl').textContent=ENDS[k].ttl;
  const L=ENDS[k].lines(nm);
  $('endTx').innerHTML=L.map((t,i)=>`<p style="animation-delay:${.6+i*1.4}s">${esc(t)}</p>`).join('');
  $('endBtns').hidden=true; $('epiBtn').hidden=k!=='A';
  $('ending').classList.add('glitch'); setTimeout(()=>$('ending').classList.remove('glitch'),600);
  noise(1.6,.08,600); if(drone&&AC) drone.gain.linearRampToValueAtTime(k==='A'?.012:.05,AC.currentTime+3);
  setTimeout(()=>{ $('endBtns').hidden=false; $('endsLine2').textContent=endsText(); },600+L.length*1400);
}
const endsText=()=>`見つけたエンド ${S.ends.length} / 4`+(S.ends.length?`（${S.ends.join('・')}）`:'');
$('retryBtn').onclick=()=>{ S.epi=false; S.final=true; S.stage=5; save(); goDesk('a'); };
$('epiBtn').onclick=()=>{ S.epi=true; save(); if(drone&&AC) drone.gain.linearRampToValueAtTime(.02,AC.currentTime+2); goDesk('a'); setTimeout(()=>toast('「01_調査」に、ファイルがひとつ増えています。'),800); };
$('endTitle').onclick=()=>showTitle();
$('shareBtn').onclick=async()=>{
  const t=`「ないはずの部屋」END ${lastEnd}「${ENDS[lastEnd].ttl}」にたどりついた。（${S.ends.length}/4）\n#ないはずの部屋 #picoruno\n${GAME_URL}`;
  try{ if(navigator.share){ await navigator.share({text:t}); return; } }catch(e){ return; }
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t),'_blank','noopener');
};

/* ===== 画面の切りかえ ===== */
function goDesk(folder){
  ['title','ending'].forEach(id=>$(id).hidden=true); $('desk').hidden=false;
  cur=folder||null; renderDesk(); window.scrollTo(0,0);
}
function showTitle(){
  ['desk','ending'].forEach(id=>$(id).hidden=true); $('sheet').hidden=true; $('title').hidden=false;
  $('nameIn').value=S.name||'';
  const has=S.stage>0||S.final||S.ends.length>0;
  $('contBtn').hidden=!has; $('startBtn').textContent=has?'はじめから':'USBメモリを開く';
  $('endsLine').textContent=S.ends.length?endsText():'';
}
$('startBtn').onclick=()=>{
  const nm=$('nameIn').value.trim().slice(0,8);
  const ends=S.ends;
  S={name:nm,stage:0,final:false,epi:false,found:[],seen:{},hints:{},ends};
  save(); audio(); startDrone(); pingPlay(); goDesk(null);
  setTimeout(()=>toast('「01_調査」の「はじめに」から読んでみよう。'),600);
};
$('contBtn').onclick=()=>{
  const nm=$('nameIn').value.trim().slice(0,8); if(nm) S.name=nm; save();
  audio(); startDrone(); pingPlay(); goDesk(null);
};
$('nameIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('startBtn').click(); });
$('toTitle').onclick=showTitle;

load(); setMute(muted); showTitle();
window.__naihazu={get S(){return S},roster,openFile,showEnd};
</script>
<script>
/* 遊んだ回数を数える（トップページの ▶ 回数）。同じタブでの再読みこみは1回だけ数えます。 */
function pingPlay(){
  var G="ないはずの部屋", K="picoruno-played:"+G;
  try{ if(sessionStorage.getItem(K)) return; sessionStorage.setItem(K,"1"); }catch(e){}
  var KEY="sb_publishable_5hbtIPW-1y5MqsoiLC6X_A_oZMG0Z5Z";
  fetch("https://fymwlpbspigpeaoenhhp.supabase.co/rest/v1/rpc/add_play",{method:"POST",keepalive:true,
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({g:G})})
  .then(function(r){ if(!r.ok) throw 0; })
  .catch(function(){ try{ var d=JSON.parse(localStorage.getItem("picoruno-stats")||"{}"); d[G]=d[G]||{plays:0,likes:0}; d[G].plays++; localStorage.setItem("picoruno-stats",JSON.stringify(d)); }catch(e){} });
}
</script>
